# Eclipse JDT Cleanup Configuration - Aggressive Profile
# This profile applies comprehensive code modernization and refactoring
# Use this for projects that want maximum automated improvements

# Source Code Formatting
cleanup.format_source_code=true
cleanup.format_source_code_changes_only=false

# Import Organization
cleanup.organize_imports=true
cleanup.remove_unused_imports=true

# Code Style - Use blocks in control statements
cleanup.use_blocks=true
cleanup.use_blocks_only_for_return_and_throw=false
cleanup.always_use_blocks=true

# Member Accesses - Qualify with declaring class
cleanup.qualify_static_member_accesses_with_declaring_class=true
cleanup.qualify_static_field_accesses_with_declaring_class=true
cleanup.qualify_static_method_accesses_with_declaring_class=true
cleanup.qualify_static_member_accesses_through_subtypes_with_declaring_class=true
cleanup.qualify_static_member_accesses_through_instances_with_declaring_class=true

# Unnecessary Code Removal
cleanup.remove_unnecessary_casts=true
cleanup.remove_unused_private_members=true
cleanup.remove_unused_local_variables=true
cleanup.remove_redundant_type_arguments=true
cleanup.remove_redundant_semicolons=true
cleanup.remove_trailing_whitespaces=true
cleanup.remove_trailing_whitespaces_all=true
cleanup.remove_trailing_whitespaces_ignore_empty=false

# Missing Code - Add annotations
cleanup.add_missing_override_annotations=true
cleanup.add_missing_override_annotations_interface_methods=true
cleanup.add_missing_deprecated_annotations=true

# String Operations
cleanup.use_string_is_blank=true
cleanup.simplify_boolean_if_else=true

# Variable Declarations
cleanup.use_var=false
cleanup.convert_functional_interfaces=true

# Java Feature Modernization
cleanup.use_lambda=true
cleanup.use_anonymous_class_creation=false
cleanup.convert_to_enhanced_for_loop=true

# Code Organization
cleanup.sort_members=false

# Former Sandbox cleanups now provided by Eclipse JDT
cleanup.remove_unnecessary_array_creation=true
cleanup.stringbuffer_to_stringbuilder=true

# Sandbox loop conversion: one output direction, preserving stream inputs
cleanup.loop_conversion.enabled=true
cleanup.loop_conversion.target_format=stream
cleanup.loop_conversion.from.enhanced_for=true
cleanup.loop_conversion.from.iterator_while=true
cleanup.loop_conversion.from.stream=false
cleanup.loop_conversion.from.classic_for=false

# Type-safe charset APIs while preserving the original encoding behavior
cleanup.explicit_encoding=true
cleanup.explicit_encoding_keep_behavior=true
cleanup.explicit_encoding_insert_utf8=false
cleanup.explicit_encoding_aggregate_to_utf8=false

# Eclipse Platform status factory methods
cleanup.simplify_status_creation=true

# Strict JUnit 3/4 to Jupiter migration; enable the migration operations explicitly
cleanup.junitcleanup=true
cleanup.junit3cleanup=true
cleanup.junitcleanup_3_test=true
cleanup.junitcleanup_best_effort=false
cleanup.junitcleanup_6_compatibility=false
cleanup.junitcleanup_4_after=true
cleanup.junitcleanup_4_before=true
cleanup.junitcleanup_4_afterclass=true
cleanup.junitcleanup_4_beforeclass=true
cleanup.junitcleanup_4_assume=true
cleanup.junitcleanup_4_assert=true
cleanup.junitcleanup_4_assert_optimization=true
cleanup.junitcleanup_4_assume_optimization=true
cleanup.junitcleanup_4_ignore=true
cleanup.junitcleanup_4_test=true
cleanup.junitcleanup_4_ruletestname=true
cleanup.junitcleanup_4_ruletemporaryfolder=true
cleanup.junitcleanup_4_ruleexternalresource=true
cleanup.junitcleanup_4_externalresource=true
cleanup.junitcleanup_4_runwith=true
cleanup.junitcleanup_4_suite=true
cleanup.junitcleanup_4_parameterized=true
cleanup.junitcleanup_4_test_timeout=true
cleanup.junitcleanup_4_test_expected=true
cleanup.junitcleanup_4_category=true
cleanup.junitcleanup_4_fix_method_order=true
cleanup.junitcleanup_4_ruletimeout=true
cleanup.junitcleanup_4_ruleexpectedexception=true
cleanup.junitcleanup_4_ruleerrorcollector=true
cleanup.junitcleanup_4_lost_tests=true
cleanup.junitcleanup_4_throwingrunnable=true
