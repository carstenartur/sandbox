name: Export JUnit branch merge base

on:
  push:
    branches:
      - automation/junit4-repair-staging
    paths:
      - .github/workflows/export-junit4-staging.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the common JUnit branch ancestor
        uses: actions/checkout@v6
        with:
          ref: b373f543c0de4bdc7ad7a63e90f97311c5068daf

      - name: Package merge-base source tree
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/junit-merge-base-source.tar.gz" .

      - name: Upload merge-base source tree
        uses: actions/upload-artifact@v7
        with:
          name: junit-merge-base-source
          path: ${{ runner.temp }}/junit-merge-base-source.tar.gz
          retention-days: 1
          if-no-files-found: error
