name: Refresh JUnit 6 Help screenshot baselines

on:
  push:
    branches:
      - agent/junit6-inherited-test-filter
    paths:
      - '.github/workflows/update-junit-help-baselines.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: update-junit-help-baselines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the exact branch head
        uses: actions/checkout@v7
        with:
          ref: agent/junit6-inherited-test-filter
          fetch-depth: 0

      - name: Verify artifact provenance and intervening changes
        shell: bash
        run: |
          set -euo pipefail

          artifact_head=bd9d9ab6b07558d5012bd5d081d3682f7dc91890
          git merge-base --is-ancestor "$artifact_head" HEAD

          unexpected=()
          while IFS= read -r path; do
            case "$path" in
              .github/actions/verify-eclipse-desktop-runtime/action.yml|\
              .github/workflows/maven.yml|\
              .github/workflows/distribution-smoke.yml|\
              .github/workflows/eclipse-help-screenshots.yml|\
              .github/workflows/update-junit-help-baselines.yml)
                ;;
              *)
                unexpected+=("$path")
                ;;
            esac
          done < <(git diff --name-only "$artifact_head"..HEAD)

          if ((${#unexpected[@]})); then
            echo 'The screenshot artifact is stale because rendering-relevant files changed:' >&2
            printf '  - %s\n' "${unexpected[@]}" >&2
            exit 1
          fi

      - name: Download the exact verifier artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/eclipse-help-screenshots-550.zip"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/9383718569/zip" \
            > "$archive"
          echo '1d4d8c7149762c569f5479ae6ae9d99e65709514ec0788f7abf164506659a3a2  '"$archive" \
            | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/screens"
          unzip -q "$archive" -d "$RUNNER_TEMP/screens"

      - name: Install only the nine proven baseline changes
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/screens"

          declare -A expected=(
            ['sandbox_encoding_quickfix_help/images/explicit-encoding-cleanup.png']='8fb3c0b474b7f109a523cbf110e0f713c0ab01ba'
            ['sandbox_functional_converter_help/images/functional-converter-cleanup.png']='219aebd09c6216146f4c4cb605fa23574063fd0a'
            ['sandbox_int_to_enum_help/images/int-to-enum-cleanup.png']='bd9275a82d34d065a0f17486780a2ab7df2e89c2'
            ['sandbox_jface_cleanup_help/images/jface-cleanup.png']='942dd923697bc709d181762982a81969a2564919'
            ['sandbox_junit_cleanup_help/images/junit-migration-cleanup.png']='52342e448d67f0be3e19b41f7673c2e272f40c01'
            ['sandbox_method_reuse_help/images/method-reuse-cleanup.png']='6f2c0431e14a1589167a9a5e9210f049880a3582'
            ['sandbox_platform_helper_help/images/platform-status-cleanup.png']='70ed384893f7fd4af5b20c7f573df0fc96e4ae7e'
            ['sandbox_use_general_type_help/images/use-general-type-cleanup.png']='32f55859cd750c1716c05a95deb3ab4f68fa3732'
            ['sandbox_xml_cleanup_help/images/xml-cleanup.png']='8f5d77481e00e4dfafb9de0d907e95649442650c'
          )

          for path in "${!expected[@]}"; do
            source="$source_root/$path"
            if [[ ! -f "$source" ]]; then
              echo "Missing expected artifact file: $path" >&2
              exit 1
            fi
            actual="$(git hash-object "$source")"
            if [[ "$actual" != "${expected[$path]}" ]]; then
              echo "Unexpected Git blob hash for $path: $actual" >&2
              exit 1
            fi
            install -m 0644 "$source" "$path"
          done

          rm -- '.github/workflows/update-junit-help-baselines.yml'

          expected_paths="$RUNNER_TEMP/expected-paths.txt"
          actual_paths="$RUNNER_TEMP/actual-paths.txt"
          {
            printf '%s\n' "${!expected[@]}"
            printf '%s\n' '.github/workflows/update-junit-help-baselines.yml'
          } | sort > "$expected_paths"
          git status --porcelain=v1 \
            | sed -E 's/^.. //' \
            | sort > "$actual_paths"
          diff -u "$expected_paths" "$actual_paths"

      - name: Commit the verified baselines and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sandbox_encoding_quickfix_help/images/explicit-encoding-cleanup.png \
            sandbox_functional_converter_help/images/functional-converter-cleanup.png \
            sandbox_int_to_enum_help/images/int-to-enum-cleanup.png \
            sandbox_jface_cleanup_help/images/jface-cleanup.png \
            sandbox_junit_cleanup_help/images/junit-migration-cleanup.png \
            sandbox_method_reuse_help/images/method-reuse-cleanup.png \
            sandbox_platform_helper_help/images/platform-status-cleanup.png \
            sandbox_use_general_type_help/images/use-general-type-cleanup.png \
            sandbox_xml_cleanup_help/images/xml-cleanup.png \
            .github/workflows/update-junit-help-baselines.yml
          git commit -m 'Refresh JUnit 6 Help screenshot baselines'
          git push origin HEAD:agent/junit6-inherited-test-filter
