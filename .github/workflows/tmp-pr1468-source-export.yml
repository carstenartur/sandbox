name: Apply exact PR 1468 repair patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/junit4-real-corpus-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply, validate and commit the exact repair
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          patch=.github/patches/pr1468-exact-fixes.patch
          git apply --check "$patch"
          git apply "$patch"
          rm "$patch" .github/workflows/tmp-pr1468-source-export.yml
          python3 -m py_compile qa/upstream-jdt/verify_contract.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix no-op JUnit migration changes and cleanup lifecycle"
          git push origin "HEAD:${HEAD_BRANCH}"
