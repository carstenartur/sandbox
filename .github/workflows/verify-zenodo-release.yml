name: Verify Zenodo Release

on:
  pull_request:
    paths:
      - '.github/scripts/verify_zenodo_release.py'
      - '.github/scripts/test_verify_zenodo_release.py'
      - '.github/workflows/verify-zenodo-release.yml'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to verify, for example v1.3.2
        required: true
        type: string

concurrency:
  group: zenodo-release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test Zenodo verifier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verifier source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Compile and run tests
        working-directory: .github/scripts
        run: |
          python3 -m py_compile verify_zenodo_release.py test_verify_zenodo_release.py
          python3 test_verify_zenodo_release.py

  verify:
    name: Verify stable Zenodo archive
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Resolve stable tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Zenodo verification requires a stable vX.Y.Z tag, found '$tag'."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout current verifier
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Verify immutable release tag exists
        run: |
          git ls-remote --exit-code --tags origin \
            "refs/tags/${{ steps.release.outputs.tag }}" >/dev/null

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify published Zenodo record
        env:
          EXPECTED_CONCEPT_DOI: ${{ vars.ZENODO_CONCEPT_DOI }}
        run: |
          set -euo pipefail
          arguments=(
            --repository-url "https://github.com/${GITHUB_REPOSITORY}"
            --expected-version "${{ steps.release.outputs.version }}"
            --expected-tag "${{ steps.release.outputs.tag }}"
            --max-attempts 30
            --interval-seconds 60
            --timeout-seconds 30
            --output target/zenodo-release-verification.json
          )
          if [[ -n "$EXPECTED_CONCEPT_DOI" ]]; then
            arguments+=(--expected-concept-doi "$EXPECTED_CONCEPT_DOI")
          fi
          python3 .github/scripts/verify_zenodo_release.py "${arguments[@]}"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zenodo-verification-${{ steps.release.outputs.tag }}-${{ github.run_id }}
          path: target/zenodo-release-verification.json
          retention-days: 90
          if-no-files-found: warn

      - name: Attach DOI evidence to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            target/zenodo-release-verification.json \
            --clobber
