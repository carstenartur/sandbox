name: PR 1291 Full Build Diagnostics

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/pr1291-full-build-diagnostics.yml'
      - 'sandbox_common/src/org/sandbox/jdt/cleanup/multifile/GeneratedTypeNamePolicy.java'
      - 'sandbox_common_test/src/org/sandbox/jdt/cleanup/multifile/GeneratedTypeNamePolicyTest.java'
      - 'sandbox_int_to_enum/src/org/sandbox/jdt/internal/corext/fix/multifile/IntEnumMultiFileRewriteOperation.java'
      - 'sandbox_int_to_enum_test/src/org/eclipse/jdt/ui/tests/quickfix/Java22/MultiFileIntToEnumCleanUpTest.java'

permissions:
  contents: read

concurrency:
  group: pr1291-full-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DISPLAY: :0
      MAVEN_OPTS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm install -g prettier stylelint stylelint-config-standard
      - name: Install Linux desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth \
            libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 libxrandr2 libxfixes3 \
            libasound2t64 libnss3 libgbm1
      - uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1
        with:
          maven-version: 3.9.14
      - name: Run authoritative Maven build and retain complete log
        id: build
        shell: bash
        run: |
          set -o pipefail
          status=0
          xvfb-run --auto-servernum mvn -e -V -T 1C --batch-mode \
            -Dtycho.localArtifacts=ignore clean verify \
            2>&1 | tee full-maven-build.log || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 400 full-maven-build.log
          exit "$status"
      - name: Upload complete Maven build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr1291-full-maven-build-${{ github.sha }}
          path: full-maven-build.log
          retention-days: 2
          if-no-files-found: error
