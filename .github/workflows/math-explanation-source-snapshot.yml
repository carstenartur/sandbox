name: General mathematics Java integration qualification
on:
  push:
    branches: [diagnostic/math-explanation-source-20261009]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 49ec9ff5cadc6f89c4132a9da9d31d420a9894a7
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
          cache: maven
      - uses: ./.github/actions/verify-eclipse-desktop-runtime
      - name: Run the actual Java extraction/search/emission regression tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 49ec9ff5cadc6f89c4132a9da9d31d420a9894a7
          if ! xvfb-run --auto-servernum ./mvnw --batch-mode --no-transfer-progress \
            -pl sandbox_target,sandbox_math_cleanup,sandbox_math_cleanup_test -am \
            -Dtest=GeneralMathematicsRoundTripTest -DfailIfNoTests=true verify > math-general-integration.log 2>&1; then
            tail -150 math-general-integration.log
            exit 1
          fi
          test -n "$(find sandbox_math_cleanup_test/target/surefire-reports -name '*GeneralMathematicsRoundTripTest*.xml' -print -quit)"
          grep -E 'Tests run:|BUILD SUCCESS' math-general-integration.log | tail -25
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: general-java-integration-${{ github.run_id }}
          retention-days: 7
          path: |
            math-general-integration.log
            sandbox_math_cleanup_test/target/surefire-reports/**
