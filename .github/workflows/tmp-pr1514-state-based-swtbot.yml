name: Prepare state-based PR 1514 SWTBot source

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-pr1514-state-based-swtbot.yml'
      - 'sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/CoordinatedJUnitPreviewSWTBotScenario.java'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Replace fixed waits with semantic conditions
        shell: bash
        run: |
          set -euo pipefail
          target='sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/CoordinatedJUnitPreviewSWTBotScenario.java'
          expected_before='6d3c6d1773c20a048909b5cc98f9a51bb8e233a1'
          actual_before="$(git hash-object "$target")"
          if [[ "$actual_before" != "$expected_before" ]]; then
            echo "::error::Unexpected source blob $actual_before"
            exit 1
          fi

          python3 - "$target" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          replacements = [
