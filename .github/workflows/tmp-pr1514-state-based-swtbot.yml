name: Apply state-based PR 1514 SWTBot synchronization

on:
  push:
    branches:
      - qa/junit-coordinated-preview-contract
    paths:
      - '.github/workflows/tmp-pr1514-state-based-swtbot.yml'

permissions:
  contents: write

concurrency:
  group: pr1514-state-based-swtbot
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v7
        with:
          ref: qa/junit-coordinated-preview-contract
          fetch-depth: 0

      - name: Replace fixed waits and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          target='sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/CoordinatedJUnitPreviewSWTBotScenario.java'
          workflow='.github/workflows/tmp-pr1514-state-based-swtbot.yml'
          expected_before='6d3c6d1773c20a048909b5cc98f9a51bb8e233a1'
          actual_before="$(git hash-object "$target")"
          if [[ "$actual_before" != "$expected_before" ]]; then
            echo "::error::Unexpected source blob $actual_before"
            exit 1
          fi

          python3 - "$target" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''                shell.widget.layout(true, true);
            }
        });
        shell.activate();
        bot.sleep(500);
    }

    private static void openPreferences() {''',
                  '''                shell.widget.layout(true, true);
                shell.widget.update();
            }
        });
        shell.activate();
        waitForActiveShell(shell);
    }

    private static void waitForActiveShell(SWTBotShell shell) {
        bot.waitUntil(new DefaultCondition() {
            @Override
            public boolean test() {
                try {
                    return shell.isOpen() && bot.activeShell().widget == shell.widget;
                } catch (WidgetNotFoundException exception) {
                    return false;
                }
            }

            @Override
            public String getFailureMessage() {
                return "The screenshot shell did not become active: " + shell.getText();
            }
        });
    }

