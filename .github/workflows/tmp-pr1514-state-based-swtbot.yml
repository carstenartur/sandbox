name: Finalize reviewed PR 1514 JUnit preview baseline

on:
  push:
    branches:
      - qa/junit-coordinated-preview-contract
    paths:
      - '.github/workflows/tmp-pr1514-state-based-swtbot.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: pr1514-finalize-reviewed-junit-preview
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v7
        with:
          ref: qa/junit-coordinated-preview-contract
          fetch-depth: 0

      - name: Commit the reviewed generated baseline and remove this workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          workflow='.github/workflows/tmp-pr1514-state-based-swtbot.yml'
          target='sandbox_junit_cleanup_help/images/junit-coordinated-preview.png'
          run_id='32537901836'
          artifact='patched-jdt-ui-atomic-preview-65'
          expected_head='e42446c01b8f54f018e0511f21861e7ca55222bb'
          expected_sha256='3da344928b837a65c713a58cd72675887c626b95da541352e7278c102c318054'
          download_dir="$RUNNER_TEMP/pr1514-reviewed-preview"

          actual_head="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          if [[ "$actual_head" != "$expected_head" ]]; then
            echo "::error::Artifact run head $actual_head does not match $expected_head"
            exit 1
          fi

          rm -rf "$download_dir"
          mkdir -p "$download_dir"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact" \
            --dir "$download_dir"

          mapfile -t candidates < <(find "$download_dir" -type f \
            -path '*/sandbox_junit_cleanup_help/images/junit-coordinated-preview.png' \
            -print)
          if [[ ${#candidates[@]} -ne 1 ]]; then
            printf 'Expected one generated JUnit preview, found %d:\n' "${#candidates[@]}" >&2
            printf '%s\n' "${candidates[@]}" >&2
            exit 1
          fi

          source_image="${candidates[0]}"
          actual_sha256="$(sha256sum "$source_image" | cut -d' ' -f1)"
          if [[ "$actual_sha256" != "$expected_sha256" ]]; then
            echo "::error::Unexpected JUnit preview digest $actual_sha256"
            exit 1
          fi
          file "$source_image" | grep -Fq 'PNG image data, 1280 x 900'

          if [[ -e "$target" ]]; then
            echo "::error::The reviewed baseline already exists unexpectedly: $target"
            exit 1
          fi
          mkdir -p "$(dirname "$target")"
          install -m 0644 "$source_image" "$target"
          git rm -- "$workflow"
          git add -- "$target"
          git diff --check

          expected_paths="$(printf '%s\n' "$workflow" "$target" | sort)"
          actual_paths="$(git diff --cached --name-only | sort)"
          if [[ "$actual_paths" != "$expected_paths" ]]; then
            echo '::error::Unexpected staged paths'
            git diff --cached --name-status
            exit 1
          fi
          git diff --cached --name-status | grep -Fqx $'D\t'"$workflow"
          git diff --cached --name-status | grep -Fqx $'A\t'"$target"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Commit reviewed JUnit atomic preview baseline'
          git push origin HEAD:qa/junit-coordinated-preview-contract
