name: Report p2 mirror fix status

on:
  push:
    branches:
      - fix/release-p2-mirror-rate-limit
    paths:
      - .github/workflows/report-p2-mirror-fix-status.yml

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Record branch workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: fix/release-p2-mirror-rate-limit
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/runs?branch=${BRANCH}&per_page=30" \
            --jq '{runs: [.workflow_runs[] | {id,name,event,status,conclusion,head_sha,created_at,updated_at,html_url}]}' \
            > /tmp/status.json
          content=$(base64 -w0 /tmp/status.json)
          gh api --method PUT "repos/${REPOSITORY}/contents/.github/p2-mirror-fix-status.json" \
            -f message='Record p2 mirror fix status' \
            -f content="$content" \
            -f branch="$BRANCH" >/dev/null
