name: Apply headless cleanup review fixes

on:
  push:
    branches:
      - issue-1437-headless-exit-contract
    paths:
      - '.github/workflows/apply-headless-cleanup-review-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply review fixes and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          scope = Path("sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/ScopeFilteringCodeCleanupApplicationWrapper.java")
          replace_once(
              scope,
              "\tstatic String[] filterArgumentsForScope(String[] arguments) throws IOException {\n"
              "\t\tRequestedScope scope= requestedScope(arguments);\n"
              "\t\tif (scope == RequestedScope.BOTH || scope == RequestedScope.INVALID) {\n"
              "\t\t\treturn arguments.clone();\n"
              "\t\t}\n",
              "\tstatic String[] filterArgumentsForScope(String[] arguments) throws IOException {\n"
              "\t\tif (arguments == null) {\n"
              "\t\t\tthrow new IllegalArgumentException(\"Application arguments are unavailable.\"); //$NON-NLS-1$\n"
              "\t\t}\n"
              "\t\tRequestedScope scope= requestedScope(arguments);\n"
              "\t\tif (scope == RequestedScope.BOTH || scope == RequestedScope.INVALID) {\n"
              "\t\t\treturn arguments.clone();\n"
              "\t\t}\n",
          )

          wrapper = Path("sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/CodeCleanupApplicationWrapper.java")
          replace_once(
              wrapper,
              "\tprivate static Integer fail(String message) {\n"
              "\t\tSystem.err.println(message);\n"
              "\t\tSystem.out.println(Messages.bind(Messages.CommandLineUsage));\n"
              "\t\treturn Integer.valueOf(CodeCleanupApplication.EXIT_ERROR);\n"
              "\t}\n",
              "\tprivate static Integer fail(String message) {\n"
              "\t\tSystem.err.println(failureMessage(message));\n"
              "\t\tSystem.out.println(Messages.bind(Messages.CommandLineUsage));\n"
              "\t\treturn Integer.valueOf(CodeCleanupApplication.EXIT_ERROR);\n"
              "\t}\n\n"
              "\tstatic String failureMessage(String message) {\n"
              "\t\treturn message == null || message.isBlank()\n"
              "\t\t\t\t? \"Cleanup application failed without a diagnostic message.\" //$NON-NLS-1$\n"
              "\t\t\t\t: message;\n"
              "\t}\n",
          )

          test = Path("sandbox_cleanup_application_test/src/org/sandbox/jdt/core/cleanupapp/ScopeFilteringCodeCleanupApplicationWrapperTest.java")
          replace_once(
              test,
              "import static org.junit.jupiter.api.Assertions.assertArrayEquals;\n"
              "import static org.junit.jupiter.api.Assertions.assertFalse;\n"
              "import static org.junit.jupiter.api.Assertions.assertTrue;\n",
              "import static org.junit.jupiter.api.Assertions.assertArrayEquals;\n"
              "import static org.junit.jupiter.api.Assertions.assertEquals;\n"
              "import static org.junit.jupiter.api.Assertions.assertFalse;\n"
              "import static org.junit.jupiter.api.Assertions.assertThrows;\n"
              "import static org.junit.jupiter.api.Assertions.assertTrue;\n",
          )
          replace_once(
              test,
              "\t@Test\n"
              "\tvoid bothScopeLeavesCallerArgumentsUntouched() throws Exception {\n",
              "\t@Test\n"
              "\tvoid missingArgumentsFailWithActionableDiagnostic() {\n"
              "\t\tIllegalArgumentException exception= assertThrows(IllegalArgumentException.class,\n"
              "\t\t\t\t() -> ScopeFilteringCodeCleanupApplicationWrapper.filterArgumentsForScope(null));\n\n"
              "\t\tassertEquals(\"Application arguments are unavailable.\", exception.getMessage()); //$NON-NLS-1$\n"
              "\t}\n\n"
              "\t@Test\n"
              "\tvoid missingFailureMessageUsesActionableDiagnostic() {\n"
              "\t\tString expected= \"Cleanup application failed without a diagnostic message.\"; //$NON-NLS-1$\n\n"
              "\t\tassertEquals(expected, CodeCleanupApplicationWrapper.failureMessage(null));\n"
              "\t\tassertEquals(expected, CodeCleanupApplicationWrapper.failureMessage(\" \")); //$NON-NLS-1$\n"
              "\t\tassertEquals(\"details\", CodeCleanupApplicationWrapper.failureMessage(\"details\")); //$NON-NLS-1$ //$NON-NLS-2$\n"
              "\t}\n\n"
              "\t@Test\n"
              "\tvoid bothScopeLeavesCallerArgumentsUntouched() throws Exception {\n",
          )
          PY

          git diff --check

      - name: Commit fixes and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-headless-cleanup-review-fixes.yml
          git add \
            sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/ScopeFilteringCodeCleanupApplicationWrapper.java \
            sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/CodeCleanupApplicationWrapper.java \
            sandbox_cleanup_application_test/src/org/sandbox/jdt/core/cleanupapp/ScopeFilteringCodeCleanupApplicationWrapperTest.java
          git diff --cached --check
          git commit -m "Handle missing headless cleanup diagnostics safely"
          git push origin "HEAD:${GITHUB_REF_NAME}"
