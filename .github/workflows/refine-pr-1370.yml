name: Refine PR 1370

on:
  push:
    branches:
      - feature/strict-guard-evaluation

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Apply focused safety refinements
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=fb10657f8fbe4d8532d360d13b020a0a666a6643
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          git fetch --no-tags origin main

          python3 <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          parser_path = Path("sandbox_common_core/src/main/java/org/sandbox/jdt/triggerpattern/internal/HintFileParser.java")
          parser = subprocess.check_output(
              ["git", "show", f"origin/main:{parser_path.as_posix()}"], text=True)
          parser = replace_once(
              parser,
              "import org.sandbox.jdt.triggerpattern.api.GuardExpression;\nimport org.sandbox.jdt.triggerpattern.api.HintFile;",
              "import org.sandbox.jdt.triggerpattern.api.GuardExpression;\nimport org.sandbox.jdt.triggerpattern.api.HintBindingPolicy;\nimport org.sandbox.jdt.triggerpattern.api.HintFile;",
              "parser import")
          parser = replace_once(
              parser,
              'throw new HintParseException("I/O error reading hint file: " + e.getMessage(), 0); //$NON-NLS-1$',
              'throw new HintParseException("I/O error reading hint file: " + e.getMessage(), 0, e); //$NON-NLS-1$',
              "parser I/O cause")
          parser = replace_once(
              parser,
              '''\t\t\tcase "minJavaVersion": //$NON-NLS-1$
\t\t\t\ttry {
\t\t\t\t\thintFile.setMinJavaVersion(Integer.parseInt(value));
\t\t\t\t} catch (NumberFormatException e) {
\t\t\t\t\tthrow new HintParseException("Invalid minJavaVersion: " + value, lineNumber); //$NON-NLS-1$
\t\t\t\t}
\t\t\t\tbreak;
\t\t\tcase "tags": //$NON-NLS-1$''',
              '''\t\t\tcase "minJavaVersion": //$NON-NLS-1$
\t\t\t\ttry {
\t\t\t\t\thintFile.setMinJavaVersion(Integer.parseInt(value));
\t\t\t\t} catch (NumberFormatException e) {
\t\t\t\t\tthrow new HintParseException("Invalid minJavaVersion: " + value, lineNumber, e); //$NON-NLS-1$
\t\t\t\t}
\t\t\t\tbreak;
\t\t\tcase "binding-policy": //$NON-NLS-1$
\t\t\t\tHintBindingPolicy bindingPolicy;
\t\t\t\ttry {
\t\t\t\t\tbindingPolicy= HintBindingPolicy.valueOf(value.trim().toUpperCase(java.util.Locale.ROOT));
\t\t\t\t} catch (IllegalArgumentException exception) {
\t\t\t\t\tthrow new HintParseException(
\t\t\t\t\t\t\t"Invalid binding-policy: " + value + "; expected optional or required", //$NON-NLS-1$ //$NON-NLS-2$
\t\t\t\t\t\t\tlineNumber, exception);
\t\t\t\t}
\t\t\t\tif (hintFile.getBindingPolicy() != null && hintFile.getBindingPolicy() != bindingPolicy) {
\t\t\t\t\tthrow new HintParseException("Conflicting binding-policy declarations", lineNumber); //$NON-NLS-1$
\t\t\t\t}
\t\t\t\thintFile.setBindingPolicy(bindingPolicy);
\t\t\t\tbreak;
\t\t\tcase "tags": //$NON-NLS-1$''',
              "parser binding policy")
          parser = replace_once(
              parser,
              'throw new HintParseException("Invalid per-rule severity: " + severityStr, startIndex + ruleLineIdx + 1); //$NON-NLS-1$',
              'throw new HintParseException(\n\t\t\t\t\t\t\t"Invalid per-rule severity: " + severityStr, startIndex + ruleLineIdx + 1, e); //$NON-NLS-1$',
              "parser severity cause")
          parser = replace_once(
              parser,
              '''\t\tpublic HintParseException(String message, int lineNumber) {
\t\t\tsuper(message + " (line " + lineNumber + ")"); //$NON-NLS-1$ //$NON-NLS-2$
\t\t\tthis.lineNumber = lineNumber;
\t\t}''',
              '''\t\tpublic HintParseException(String message, int lineNumber) {
\t\t\tthis(message, lineNumber, null);
\t\t}

\t\t/**
\t\t * Creates a new parse exception and preserves the originating failure.
\t\t *
\t\t * @param message the error message
\t\t * @param lineNumber the line number where the error occurred
\t\t * @param cause the originating failure, or {@code null}
\t\t */
\t\tpublic HintParseException(String message, int lineNumber, Throwable cause) {
\t\t\tsuper(message + " (line " + lineNumber + ")", cause); //$NON-NLS-1$ //$NON-NLS-2$
\t\t\tthis.lineNumber = lineNumber;
\t\t}''',
              "parser cause constructor")
          parser_path.write_text(parser, encoding="utf-8")

          guards_path = Path("sandbox_common_core/src/main/java/org/sandbox/jdt/triggerpattern/internal/BuiltInGuardRegistration.java")
          guards = guards_path.read_text(encoding="utf-8")
          guards = replace_once(
              guards,
              '''public final class BuiltInGuardRegistration {

\tprivate BuiltInGuardRegistration() {''',
              '''public final class BuiltInGuardRegistration {

\tenum HierarchyMatch {
\t\tMATCH,
\t\tNO_MATCH,
\t\tUNKNOWN
\t}

\tprivate BuiltInGuardRegistration() {''',
              "hierarchy result")
          guards = replace_once(
              guards,
              '''\tprivate static boolean evaluateSubtypeOf(GuardContext context, Object... args) {
\t\tif (args.length < 2) {
\t\t\treturn false;
\t\t}
\t\tASTNode node= context.getBinding(argument(args, 0));
\t\tif (node == null) {
\t\t\treturn false;
\t\t}
\t\tITypeBinding binding= resolveTypeBinding(node);
\t\tif (binding == null) {
\t\t\tcontext.markUnknown("subtypeOf", //$NON-NLS-1$
\t\t\t\t\t"Cannot resolve the type hierarchy of " + argument(args, 0)); //$NON-NLS-1$
\t\t\treturn true;
\t\t}
\t\treturn isSubtypeOf(binding, stripQuotes(argument(args, 1)), new HashSet<>());
\t}

\tprivate static boolean isSubtypeOf(ITypeBinding binding, String expectedType, Set<String> visited) {
\t\tif (binding == null || binding.isRecovered()) {
\t\t\treturn false;
\t\t}
\t\tITypeBinding declaration= binding.getTypeDeclaration();
\t\tString key= declaration.getKey();
\t\tif (key != null && !visited.add(key)) {
\t\t\treturn false;
\t\t}
\t\tif (matchesTypeName(declaration, expectedType)) {
\t\t\treturn true;
\t\t}
\t\tif (isSubtypeOf(declaration.getSuperclass(), expectedType, visited)) {
\t\t\treturn true;
\t\t}
\t\tfor (ITypeBinding iface : declaration.getInterfaces()) {
\t\t\tif (isSubtypeOf(iface, expectedType, visited)) {
\t\t\t\treturn true;
\t\t\t}
\t\t}
\t\treturn false;
\t}''',
              '''\tprivate static boolean evaluateSubtypeOf(GuardContext context, Object... args) {
\t\tif (args.length < 2) {
\t\t\treturn false;
\t\t}
\t\tASTNode node= context.getBinding(argument(args, 0));
\t\tif (node == null) {
\t\t\treturn false;
\t\t}
\t\tITypeBinding binding= resolveTypeBinding(node);
\t\tif (binding == null) {
\t\t\tcontext.markUnknown("subtypeOf", //$NON-NLS-1$
\t\t\t\t\t"Cannot resolve the type hierarchy of " + argument(args, 0)); //$NON-NLS-1$
\t\t\treturn true;
\t\t}
\t\tHierarchyMatch match= subtypeMatch(binding, stripQuotes(argument(args, 1)), new HashSet<>());
\t\tif (match == HierarchyMatch.UNKNOWN) {
\t\t\tcontext.markUnknown("subtypeOf", //$NON-NLS-1$
\t\t\t\t\t"Cannot resolve the complete type hierarchy of " + argument(args, 0)); //$NON-NLS-1$
\t\t\treturn true;
\t\t}
\t\treturn match == HierarchyMatch.MATCH;
\t}

\tstatic HierarchyMatch subtypeMatch(ITypeBinding binding, String expectedType, Set<String> visited) {
\t\tif (binding == null) {
\t\t\treturn HierarchyMatch.NO_MATCH;
\t\t}
\t\tif (binding.isRecovered()) {
\t\t\treturn HierarchyMatch.UNKNOWN;
\t\t}
\t\tITypeBinding declaration= binding.getTypeDeclaration();
\t\tif (declaration == null || declaration.isRecovered()) {
\t\t\treturn HierarchyMatch.UNKNOWN;
\t\t}
\t\tString key= declaration.getKey();
\t\tString identity= key == null || key.isBlank() ? declaration.getQualifiedName() : key;
\t\tif (identity != null && !identity.isBlank() && !visited.add(identity)) {
\t\t\treturn HierarchyMatch.NO_MATCH;
\t\t}
\t\tif (matchesTypeName(declaration, expectedType)) {
\t\t\treturn HierarchyMatch.MATCH;
\t\t}
\t\tboolean unknown= false;
\t\tHierarchyMatch superclassMatch= subtypeMatch(declaration.getSuperclass(), expectedType, visited);
\t\tif (superclassMatch == HierarchyMatch.MATCH) {
\t\t\treturn HierarchyMatch.MATCH;
\t\t}
\t\tunknown= superclassMatch == HierarchyMatch.UNKNOWN;
\t\tfor (ITypeBinding iface : declaration.getInterfaces()) {
\t\t\tHierarchyMatch interfaceMatch= subtypeMatch(iface, expectedType, visited);
\t\t\tif (interfaceMatch == HierarchyMatch.MATCH) {
\t\t\t\treturn HierarchyMatch.MATCH;
\t\t\t}
\t\t\tunknown|= interfaceMatch == HierarchyMatch.UNKNOWN;
\t\t}
\t\treturn unknown ? HierarchyMatch.UNKNOWN : HierarchyMatch.NO_MATCH;
\t}''',
              "subtype tri-state")
          guards = replace_once(
              guards,
              '''\t\tITypeBinding[] arguments= binding.getTypeArguments();
\t\treturn index >= 0 && index < arguments.length
\t\t\t\t&& matchesTypeName(arguments[index], stripQuotes(argument(args, 2)));''',
              '''\t\tif (index < 0) {
\t\t\treturn false;
\t\t}
\t\tif (binding.isRawType()) {
\t\t\tcontext.markUnknown("genericTypeIs", //$NON-NLS-1$
\t\t\t\t\t"Generic type arguments are erased for " + argument(args, 0)); //$NON-NLS-1$
\t\t\treturn true;
\t\t}
\t\tITypeBinding[] arguments= binding.getTypeArguments();
\t\tif (index >= arguments.length) {
\t\t\treturn false;
\t\t}
\t\tif (arguments[index] == null || arguments[index].isRecovered()) {
\t\t\tcontext.markUnknown("genericTypeIs", //$NON-NLS-1$
\t\t\t\t\t"Cannot resolve generic type argument " + index + " for " + argument(args, 0)); //$NON-NLS-1$ //$NON-NLS-2$
\t\t\treturn true;
\t\t}
\t\treturn matchesTypeName(arguments[index], stripQuotes(argument(args, 2)));''',
              "generic strictness")
          guards_path.write_text(guards, encoding="utf-8")

          wizard_path = Path("sandbox_triggerpattern/src/org/sandbox/jdt/internal/ui/wizard/NewSandboxHintFileWizard.java")
          wizard = wizard_path.read_text(encoding="utf-8")
          wizard = replace_once(
              wizard,
              '''\t\tif (template != SandboxHintTemplates.PLAN_AWARE) {
\t\t\thintFile.setBindingPolicy("required".equals(filePage.getBindingPolicyValue()) //$NON-NLS-1$
\t\t\t\t\t? HintBindingPolicy.REQUIRED : HintBindingPolicy.OPTIONAL);
\t\t}''',
              '''\t\tif (template != SandboxHintTemplates.PLAN_AWARE
\t\t\t\t&& "required".equals(filePage.getBindingPolicyValue())) { //$NON-NLS-1$
\t\t\thintFile.setBindingPolicy(HintBindingPolicy.REQUIRED);
\t\t}''',
              "wizard default policy")
          wizard_path.write_text(wizard, encoding="utf-8")

          hint_path = Path("sandbox_common_core/src/main/java/org/sandbox/jdt/triggerpattern/api/HintFile.java")
          hint = hint_path.read_text(encoding="utf-8")
          hint = replace_once(
              hint,
              '''\t * <p>A {@code null} value means that the compatibility default applies.
\t * Plan-aware programs are validated separately and require
\t * {@link HintBindingPolicy#REQUIRED}.</p>''',
              '''\t * <p>A {@code null} value means that the compatibility default applies.
\t * Plan-aware programs derive strictness from their semantic plan contract and
\t * normally leave this property unset.</p>''',
              "hint policy documentation")
          hint_path.write_text(hint, encoding="utf-8")

          test_path = Path("sandbox_common_core/src/test/java/org/sandbox/jdt/triggerpattern/internal/BuiltInGuardRegistrationHierarchyTest.java")
          test_path.write_text('''/*******************************************************************************
           * Copyright (c) 2026 Carsten Hammer and others.
           *
           * This program and the accompanying materials
           * are made available under the terms of the Eclipse Public License 2.0
           * which accompanies this distribution, and is available at
           * https://www.eclipse.org/legal/epl-2.0/
           *
           * SPDX-License-Identifier: EPL-2.0
           *******************************************************************************/
          package org.sandbox.jdt.triggerpattern.internal;

          import static org.junit.jupiter.api.Assertions.assertEquals;

          import java.lang.reflect.Array;
          import java.lang.reflect.Proxy;
          import java.util.HashSet;

          import org.junit.jupiter.api.Test;

          import org.eclipse.jdt.core.dom.ITypeBinding;

          import org.sandbox.jdt.triggerpattern.internal.BuiltInGuardRegistration.HierarchyMatch;

          class BuiltInGuardRegistrationHierarchyTest {

          \t@Test
          \tvoid recoveredSupertypeMakesANegativeResultUnknown() {
          \t\tITypeBinding recovered= binding("missing.Base", true, null); //$NON-NLS-1$
          \t\tITypeBinding child= binding("sample.Child", false, recovered); //$NON-NLS-1$

          \t\tassertEquals(HierarchyMatch.UNKNOWN, BuiltInGuardRegistration.subtypeMatch(
          \t\t\t\tchild, "java.lang.Number", new HashSet<>())); //$NON-NLS-1$
          \t}

          \t@Test
          \tvoid resolvedMatchWinsOverAnUnresolvedSiblingBranch() {
          \t\tITypeBinding recovered= binding("missing.Contract", true, null); //$NON-NLS-1$
          \t\tITypeBinding number= binding("java.lang.Number", false, null); //$NON-NLS-1$
          \t\tITypeBinding child= binding("sample.Child", false, null, recovered, number); //$NON-NLS-1$

          \t\tassertEquals(HierarchyMatch.MATCH, BuiltInGuardRegistration.subtypeMatch(
          \t\t\t\tchild, "java.lang.Number", new HashSet<>())); //$NON-NLS-1$
          \t}

          \t@Test
          \tvoid completeHierarchyCanProveNoMatch() {
          \t\tITypeBinding object= binding("java.lang.Object", false, null); //$NON-NLS-1$
          \t\tITypeBinding child= binding("sample.Child", false, object); //$NON-NLS-1$

          \t\tassertEquals(HierarchyMatch.NO_MATCH, BuiltInGuardRegistration.subtypeMatch(
          \t\t\t\tchild, "java.lang.Number", new HashSet<>())); //$NON-NLS-1$
          \t}

          \tprivate static ITypeBinding binding(String qualifiedName, boolean recovered,
          \t\t\tITypeBinding superclass, ITypeBinding... interfaces) {
          \t\treturn (ITypeBinding) Proxy.newProxyInstance(
          \t\t\t\tBuiltInGuardRegistrationHierarchyTest.class.getClassLoader(),
          \t\t\t\tnew Class<?>[] { ITypeBinding.class },
          \t\t\t\t(proxy, method, arguments) -> switch (method.getName()) {
          \t\t\t\tcase "getTypeDeclaration" -> proxy; //$NON-NLS-1$
          \t\t\t\tcase "getKey" -> "L" + qualifiedName.replace('.', '/') + ";"; //$NON-NLS-1$ //$NON-NLS-2$
          \t\t\t\tcase "getQualifiedName", "toString" -> qualifiedName; //$NON-NLS-1$ //$NON-NLS-2$
          \t\t\t\tcase "getName" -> qualifiedName.substring(qualifiedName.lastIndexOf('.') + 1); //$NON-NLS-1$
          \t\t\t\tcase "isRecovered" -> recovered; //$NON-NLS-1$
          \t\t\t\tcase "getSuperclass" -> superclass; //$NON-NLS-1$
          \t\t\t\tcase "getInterfaces" -> interfaces; //$NON-NLS-1$
          \t\t\t\tcase "hashCode" -> System.identityHashCode(proxy); //$NON-NLS-1$
          \t\t\t\tcase "equals" -> proxy == arguments[0]; //$NON-NLS-1$
          \t\t\t\tdefault -> defaultValue(method.getReturnType());
          \t\t\t\t});
          \t}

          \tprivate static Object defaultValue(Class<?> type) {
          \t\tif (!type.isPrimitive()) {
          \t\t\treturn type.isArray() ? Array.newInstance(type.componentType(), 0) : null;
          \t\t}
          \t\tif (type == boolean.class) {
          \t\t\treturn false;
          \t\t}
          \t\tif (type == char.class) {
          \t\t\treturn '\\0';
          \t\t}
          \t\treturn 0;
          \t}
          }
          '''.replace("          ", ""), encoding="utf-8")

          Path(".github/workflows/refine-pr-1370.yml").unlink()
          PY

          mvn --no-transfer-progress --batch-mode -pl sandbox_common_core -am test

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tighten unresolved binding safety and reduce parser diff noise"
          git push origin HEAD:refs/heads/feature/strict-guard-evaluation
