name: Apply headless scope fix

on:
  push:
    branches:
      - issue-1437-headless-exit-contract
    paths:
      - '.github/scripts/apply-headless-scope-fix.py'
      - '.github/workflows/apply-headless-scope-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-headless-scope-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply validated replacements
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/apply-headless-scope-fix.py
          if [[ ! -f "$script" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 "$script"
          rm -f "$script" .github/workflows/apply-headless-scope-fix.yml
          git diff --check

      - name: Commit product, tests, and documentation
        if: steps.patch.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Validated patch produced no changes." >&2
            exit 1
          fi
          git commit -m "Harden headless cleanup source-set classification"
          git push origin "HEAD:${GITHUB_REF_NAME}"
