name: Apply PR 1464 real coordinated preview test

on:
  push:
    branches:
      - feature/coordinated-cleanup-preview
    paths:
      - '.github/workflows/apply-pr1464-real-coordinated-preview-test.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add the real coordinated Int-to-Enum Workbench test
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_pr1464_real_preview_test.py
          rm -f \
            .github/scripts/apply_pr1464_real_preview_test.py \
            .github/workflows/apply-pr1464-real-coordinated-preview-test.yml \
            .github/workflows/fix-pr1464-preview-bootstrap.yml
          git diff --check

      - name: Commit the focused SWTBot coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Carsten Hammer'
          git config user.email 'carsten.hammer@t-online.de'
          git add -A
          git commit -m 'Verify atomic coordinated Cleanup selection in the Workbench'
          git push origin "HEAD:${GITHUB_REF_NAME}"
