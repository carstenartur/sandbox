name: PDE XML upstream corpus

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'sandbox_common_test/src/org/sandbox/jdt/triggerpattern/test/policy/PinnedGitRepository.java'
      - 'sandbox_xml_cleanup/**'
      - 'sandbox_xml_cleanup_test/**'
      - '.github/actions/verify-eclipse-desktop-runtime/**'
      - '.github/workflows/pde-xml-upstream-corpus.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus:
    name: Verify every eligible R4_41 XML file (${{ matrix.family }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        family: [core, ui, swt]
    env:
      MAVEN_OPTS: -Djava.awt.headless=true
    steps:
      - name: Checkout Sandbox
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Verify preinstalled Eclipse desktop runtime
        uses: ./.github/actions/verify-eclipse-desktop-runtime

      # Tycho's target resolution must see every in-reactor OSGi bundle used by
      # the focused test. Maven -am follows POM dependencies, but the XML bundle's
      # Require-Bundle dependency on sandbox_common is intentionally PDE-owned.
      # Naming sandbox_common and sandbox_test_commons keeps this much smaller
      # than a second full product build while preserving the real bundle graph.
      # JUnit owns full upstream clones, exact ref/SHA verification, inventory,
      # every cleanup option combination, consumer checks and evidence receipts.
      - name: Run the complete pinned XML corpus through the production service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1600x1200x24" \
            ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -T 1C \
            -Dspotbugs.skip=true \
            -Dtycho.localArtifacts=ignore \
            -Dsandbox.xml.corpus.family=${{ matrix.family }} \
            -Ppde-xml-upstream-corpus \
            -pl sandbox_target,sandbox_common,sandbox_test_commons,sandbox_xml_cleanup_test \
            -am \
            clean verify \
            2>&1 | tee evidence/pde-xml-upstream-corpus-maven.log

      - name: Upload focused Maven and JUnit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pde-xml-upstream-corpus-${{ matrix.family }}-${{ github.run_number }}
          path: |
            evidence/pde-xml-upstream-corpus-maven.log
            sandbox_xml_cleanup_test/target/surefire-reports/**
            sandbox_xml_cleanup_test/target/xml-upstream-corpus/**
            sandbox_xml_cleanup_test/target/work/data/.metadata/.log
          retention-days: 14
          if-no-files-found: error
