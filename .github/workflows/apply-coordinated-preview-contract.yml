name: Apply coordinated preview contract

on:
  push:
    branches:
      - feature/coordinated-cleanup-preview
    paths:
      - '.github/workflows/apply-coordinated-preview-contract.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/coordinated-cleanup-preview
          fetch-depth: 0

      - name: Add candidate-level preview metadata contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sandbox_common/src/org/sandbox/jdt/cleanup/multifile/AbstractPlannedMultiFileCleanUp.java')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'import java.util.Collection;\n',
              'import java.util.ArrayList;\nimport java.util.Collection;\n')
          replace_once(
              'import java.util.HashMap;\nimport java.util.LinkedHashSet;\n',
              'import java.util.HashMap;\nimport java.util.LinkedHashMap;\nimport java.util.LinkedHashSet;\n')
          replace_once(
              'import org.eclipse.core.runtime.IProgressMonitor;\n',
              'import org.eclipse.core.runtime.IProgressMonitor;\nimport org.eclipse.core.runtime.Status;\n')
          replace_once(
              '\tprivate static final String UNKNOWN_CLEANUP_ID= "unknown"; //$NON-NLS-1$\n',
              '''\tprivate static final String UNKNOWN_CLEANUP_ID= "unknown"; //$NON-NLS-1$
\tprivate static final String PREVIEW_ID= "id"; //$NON-NLS-1$
\tprivate static final String PREVIEW_NAME= "name"; //$NON-NLS-1$
\tprivate static final String PREVIEW_DESCRIPTION= "description"; //$NON-NLS-1$
\tprivate static final String PREVIEW_COMPILATION_UNITS= "compilationUnits"; //$NON-NLS-1$
\tprivate static final String PREVIEW_DETAILS= "details"; //$NON-NLS-1$
\tprivate static final String ATOMIC_SELECTION_DETAIL=
\t\t\t"Selection is atomic: all required source changes are applied together or not at all."; //$NON-NLS-1$
''')
          replace_once(
              '\tprivate final Map<IJavaProject, ScopeAccumulator> scopesByProject= new HashMap<>();\n',
              '''\tprivate final Map<IJavaProject, ScopeAccumulator> scopesByProject= new HashMap<>();
\tprivate final Map<IJavaProject, Map<String, ICompilationUnit>> compilationUnitsByProject= new HashMap<>();
''')
          replace_once(
              '''\t\t\tif (!result.status().hasFatalError() && result.plan() != null) {
\t\t\t\tplansByProject.put(project, result.plan());
\t\t\t}
''',
              '''\t\t\tif (!result.status().hasFatalError() && result.plan() != null) {
\t\t\t\tplansByProject.put(project, result.plan());
\t\t\t\tcompilationUnitsByProject.put(project, indexCompilationUnits(compilationUnits));
\t\t\t}
''')
          replace_once(
              '''\t\t\t\tdiagnosticsByProject.clear();
\t\t\t\tscopesByProject.clear();
''',
              '''\t\t\t\tdiagnosticsByProject.clear();
\t\t\t\tscopesByProject.clear();
\t\t\t\tcompilationUnitsByProject.clear();
''')

          preview_method = '''
\t/**
\t * Returns the optional dependency-free metadata consumed by the patched JDT
\t * Cleanup preview. Every transformed diagnostic becomes one candidate-level
\t * atomic selection unit. Rejected candidates are deliberately omitted.
\t *
\t * <p>The method is public and uses only JDT model objects plus JDK collection
\t * types so an unpatched Eclipse product can continue loading this cleanup; it
\t * simply never invokes the optional contract.</p>
\t *
\t * @param project current Java project
\t * @return immutable collection of candidate metadata maps
\t * @throws CoreException if a transformed candidate refers to a unit outside the
\t *                       proven execution scope
\t */
\tpublic final Collection<Map<String, Object>> getCoordinatedCleanUpPreview(IJavaProject project)
\t\t\tthrows CoreException {
\t\tsynchronized (lifecycleLock) {
\t\t\tif (!plansByProject.containsKey(project)) {
\t\t\t\treturn List.of();
\t\t\t}
\t\t\tMultiFileCleanUpDiagnostics diagnostics= diagnosticsByProject.get(project);
\t\t\tMap<String, ICompilationUnit> unitsByHandle= compilationUnitsByProject.get(project);
\t\t\tif (diagnostics == null || unitsByHandle == null) {
\t\t\t\treturn List.of();
\t\t\t}
\t\t\tString cleanupId= diagnostics.cleanupId();
\t\t\tif (cleanupId.isBlank() || UNKNOWN_CLEANUP_ID.equals(cleanupId)) {
\t\t\t\tcleanupId= getClass().getName();
\t\t\t}
\t\t\tList<Map<String, Object>> result= new ArrayList<>();
\t\t\tfor (MultiFileCandidateDiagnostic candidate : diagnostics.candidates()) {
\t\t\t\tif (candidate.outcome() != MultiFileCandidateOutcome.TRANSFORMED) {
\t\t\t\t\tcontinue;
\t\t\t\t}
\t\t\t\tif (candidate.candidateId().isBlank()) {
\t\t\t\t\tthrow invalidPreviewCandidate(cleanupId, "has a blank candidate id"); //$NON-NLS-1$
\t\t\t\t}
\t\t\t\tSet<ICompilationUnit> units= new LinkedHashSet<>();
\t\t\t\taddPreviewCompilationUnit(units, unitsByHandle, candidate.ownerCompilationUnitHandle(),
\t\t\t\t\t\tcleanupId, candidate.candidateId());
\t\t\t\tfor (String relatedHandle : candidate.relatedCompilationUnitHandles()) {
\t\t\t\t\taddPreviewCompilationUnit(units, unitsByHandle, relatedHandle, cleanupId,
\t\t\t\t\t\t\tcandidate.candidateId());
\t\t\t\t}
\t\t\t\tString candidateName= candidate.message().isBlank()
\t\t\t\t\t\t? "Coordinated cleanup candidate" //$NON-NLS-1$
\t\t\t\t\t\t: candidate.message();
\t\t\t\tList<String> details= new ArrayList<>();
\t\t\t\tdetails.add(ATOMIC_SELECTION_DETAIL);
\t\t\t\tif (!diagnostics.scope().explanation().isBlank()) {
\t\t\t\t\tdetails.add(diagnostics.scope().explanation());
\t\t\t\t}
\t\t\t\tdetails.add("Affected source files: " + units.size()); //$NON-NLS-1$
\t\t\t\tdetails.add(diagnostics.impact().compatibilityStatement());

\t\t\t\tMap<String, Object> preview= new LinkedHashMap<>();
\t\t\t\tpreview.put(PREVIEW_ID, cleanupId + ':' + candidate.candidateId());
\t\t\t\tpreview.put(PREVIEW_NAME, candidateName);
\t\t\t\tpreview.put(PREVIEW_DESCRIPTION, diagnostics.impact().compatibilityStatement());
\t\t\t\tpreview.put(PREVIEW_COMPILATION_UNITS, List.copyOf(units));
\t\t\t\tpreview.put(PREVIEW_DETAILS, List.copyOf(new LinkedHashSet<>(details)));
\t\t\t\tresult.add(Collections.unmodifiableMap(preview));
\t\t\t}
\t\t\treturn List.copyOf(result);
\t\t}
\t}

'''
          replace_once(
              '\t/**\n\t * Optional target-scope discovery used by a patched cleanup orchestrator.\n',
              preview_method + '\t/**\n\t * Optional target-scope discovery used by a patched cleanup orchestrator.\n')

          helpers = '''
\tprivate static Map<String, ICompilationUnit> indexCompilationUnits(ICompilationUnit[] compilationUnits) {
\t\tMap<String, ICompilationUnit> result= new LinkedHashMap<>();
\t\tfor (ICompilationUnit unit : compilationUnits) {
\t\t\tif (unit == null) {
\t\t\t\tcontinue;
\t\t\t}
\t\t\tICompilationUnit primary= unit.getPrimary();
\t\t\tICompilationUnit normalized= primary == null ? unit : primary;
\t\t\tString handle= normalized.getHandleIdentifier();
\t\t\tif (handle != null && !handle.isBlank()) {
\t\t\t\tresult.put(handle, normalized);
\t\t\t}
\t\t}
\t\treturn Collections.unmodifiableMap(result);
\t}

\tprivate static void addPreviewCompilationUnit(Set<ICompilationUnit> result,
\t\t\tMap<String, ICompilationUnit> unitsByHandle, String handle, String cleanupId,
\t\t\tString candidateId) throws CoreException {
\t\tif (handle == null || handle.isBlank()) {
\t\t\tthrow invalidPreviewCandidate(cleanupId,
\t\t\t\t\t"candidate " + candidateId + " contains a blank compilation-unit handle"); //$NON-NLS-1$ //$NON-NLS-2$
\t\t}
\t\tICompilationUnit unit= unitsByHandle.get(handle);
\t\tif (unit == null) {
\t\t\tthrow invalidPreviewCandidate(cleanupId,
\t\t\t\t\t"candidate " + candidateId + " refers to a compilation unit outside the proven execution scope"); //$NON-NLS-1$ //$NON-NLS-2$
\t\t}
\t\tresult.add(unit);
\t}

\tprivate static CoreException invalidPreviewCandidate(String cleanupId, String detail) {
\t\treturn new CoreException(Status.error("Invalid coordinated cleanup preview for " //$NON-NLS-1$
\t\t\t\t+ cleanupId + ": " + detail)); //$NON-NLS-1$
\t}

'''
          replace_once(
              '\tprivate void clearPlanningState(IJavaProject project) {\n',
              helpers + '\tprivate void clearPlanningState(IJavaProject project) {\n')
          replace_once(
              '''\t\tplansByProject.remove(project);
\t\tmetricsByProject.remove(project);
\t\tdiagnosticsByProject.remove(project);
''',
              '''\t\tplansByProject.remove(project);
\t\tmetricsByProject.remove(project);
\t\tdiagnosticsByProject.remove(project);
\t\tcompilationUnitsByProject.remove(project);
''')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sandbox_common/src/org/sandbox/jdt/cleanup/multifile/AbstractPlannedMultiFileCleanUp.java
          git commit -m 'Expose atomic coordinated Cleanup preview candidates'
          git push origin HEAD:feature/coordinated-cleanup-preview
