name: Align JUnit 3 order tie-breaking

on:
  push:
    branches:
      - feature/oomph-upstream-jdt-migration-qa-final
    paths:
      - '.github/workflows/apply-junit3-order-tiebreak-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove the unnecessary hash-collision rejection and update expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          def remove_section(text: str, start: str, end: str, label: str) -> str:
              begin = text.find(start)
              if begin < 0:
                  raise SystemExit(f'{label}: start marker not found')
              finish = text.find(end, begin)
              if finish < 0:
                  raise SystemExit(f'{label}: end marker not found')
              return text[:begin] + text[finish:]

          plugin_path = Path('sandbox_junit_cleanup/src/org/sandbox/jdt/internal/corext/fix/helper/TestJUnit3Plugin.java')
          plugin = plugin_path.read_text(encoding='utf-8')
          plugin = plugin.replace('import java.util.HashSet;\n', '')
          plugin = replace_once(plugin,
              '''\tprivate static final Comparator<MethodDeclaration> JUNIT3_METHOD_ORDER=
          \t\t\tComparator.comparingInt(method -> method.getName().getIdentifier().hashCode());
          ''',
              '''\tprivate static final Comparator<MethodDeclaration> JUNIT3_METHOD_ORDER=
          \t\t\tComparator.comparingInt((MethodDeclaration method) -> method.getName().getIdentifier().hashCode())
          \t\t\t\t\t.thenComparing(method -> method.getName().getIdentifier());
          ''',
              'complete MethodSorter comparator')
          plugin = replace_once(plugin,
              '\t\treturn testFound && hasDistinctTestNameHashes(node);\n',
              '\t\treturn testFound;\n',
              'local candidate result')
          plugin = remove_section(plugin,
              '\tprivate boolean hasDistinctTestNameHashes(TypeDeclaration node) {',
              '\tprivate List<MethodDeclaration> orderedTestMethods(TypeDeclaration node) {',
              'local collision helper')
          plugin_path.write_text(plugin, encoding='utf-8')

          planner_path = Path('sandbox_junit_cleanup/src/org/sandbox/jdt/internal/corext/fix/multifile/JUnit3HierarchyPlanner.java')
          planner = planner_path.read_text(encoding='utf-8')
          planner = replace_once(planner,
              '''\t\t\tif (hasCollidingTestNameHashes(type)) {
          \t\t\t\treturn Classification.rejected("COLLIDING_JUNIT3_TEST_NAME_HASH", //$NON-NLS-1$
          \t\t\t\t\t\t"Two JUnit 3 test method names have the same String hash; exact MethodSorter.DEFAULT tie-breaking cannot be represented safely."); //$NON-NLS-1$
          \t\t\t}
          ''', '', 'hierarchy collision rejection')
          planner = remove_section(planner,
              '\tprivate static boolean hasCollidingTestNameHashes(SourceType type) {',
              '\tprivate static Map<String, Integer> plannedExecutionOrders',
              'hierarchy collision helper')
          planner_path.write_text(planner, encoding='utf-8')

          local_test_path = Path('sandbox_junit_cleanup_test/src/org/eclipse/jdt/ui/tests/quickfix/Java8/MigrationJUnit3RealWorldShapesTest.java')
          local_test = local_test_path.read_text(encoding='utf-8')
          local_test = remove_section(local_test,
              '\t@Test\n\tpublic void rejectsCollidingJUnit3MethodNameHashesInsteadOfGuessingTieOrder()',
              '\t@Test\n\tpublic void rejectsMultipleSuiteInitializersInsteadOfReorderingThem()',
              'local collision regression')
          local_test_path.write_text(local_test, encoding='utf-8')

          planner_test_path = Path('sandbox_junit_cleanup_test/src/org/sandbox/jdt/internal/corext/fix/multifile/JUnit3HierarchyPlannerTest.java')
          planner_test = planner_test_path.read_text(encoding='utf-8')
          planner_test = remove_section(planner_test,
              '\t@Test\n\tpublic void rejectsHierarchyWithCollidingJUnit3MethodNameHashes()',
              '\t@Test\n\tpublic void leavesStandaloneLeafToLocalFailClosedCleanup()',
              'hierarchy collision regression')
          planner_test_path.write_text(planner_test, encoding='utf-8')

          def java_hash(value: str) -> int:
              result = 0
              for character in value:
                  result = (31 * result + ord(character)) & 0xFFFFFFFF
              return result - 0x100000000 if result >= 0x80000000 else result

          text_block = re.compile(r'"""(.*?)"""', re.DOTALL)
          method_pattern = re.compile(r'@Test\s+public\s+void\s+(test\w+)\s*\(')

          def add_explicit_order(block: str) -> str:
              methods = method_pattern.findall(block)
              if len(methods) <= 1 or '@TestMethodOrder' in block:
                  return block
              ordered = sorted(methods, key=lambda name: (java_hash(name), name))
              order_by_name = {name: index + 1 for index, name in enumerate(ordered)}

              lines = block.splitlines()
              import_indexes = [index for index, line in enumerate(lines) if line.strip().startswith('import ')]
              if not import_indexes:
                  raise SystemExit('Expected Jupiter text block has no imports')
              imports = [lines[index].strip() for index in import_indexes]
              imports.extend([
                  'import org.junit.jupiter.api.MethodOrderer.OrderAnnotation;',
                  'import org.junit.jupiter.api.Order;',
                  'import org.junit.jupiter.api.TestMethodOrder;',
              ])
              unique_imports = sorted(dict.fromkeys(imports))
              first = import_indexes[0]
              last = import_indexes[-1]
              indentation = lines[first][:len(lines[first]) - len(lines[first].lstrip())]
              lines[first:last + 1] = [indentation + value for value in unique_imports]
              block = '\n'.join(lines)
              block = re.sub(
                  r'(?m)^(\s*)public class MyTest\s*\{',
                  r'\1@TestMethodOrder(OrderAnnotation.class)\n\1public class MyTest {',
                  block,
                  count=1,
              )
              for name, order in order_by_name.items():
                  pattern = re.compile(rf'(?m)^(\s*)@Test\s*\n(\s*public\s+void\s+{re.escape(name)}\s*\()')
                  block, count = pattern.subn(
                      rf'\1@Order({order})\n\1@Test\n\2',
                      block,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit(f'Could not add @Order to expected method {name}')
              return block

          for path_string in (
              'sandbox_junit_cleanup_test/src/org/eclipse/jdt/ui/tests/quickfix/Java8/MigrationJUnit3Test.java',
              'sandbox_junit_cleanup_test/src/org/eclipse/jdt/ui/tests/quickfix/Java8/JUnit3CleanupCases.java',
          ):
              path = Path(path_string)
              source = path.read_text(encoding='utf-8')
              updated = text_block.sub(
                  lambda match: '"""' + add_explicit_order(match.group(1)) + '"""'
                  if 'import org.junit.jupiter.api.Test;' in match.group(1)
                  else match.group(0),
                  source,
              )
              path.write_text(updated, encoding='utf-8')
          PY

          git diff --check

      - name: Commit the complete tie-breaking contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sandbox_junit_cleanup sandbox_junit_cleanup_test
          git commit -m "Match the complete JUnit 3 method-order comparator"
          git push origin "HEAD:${GITHUB_REF_NAME}"
