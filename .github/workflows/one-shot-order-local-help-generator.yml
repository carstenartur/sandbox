name: One-shot order local Help generator

on:
  push:
    branches:
      - feature/method-reuse-multifile-delegation
    paths:
      - '.github/workflows/one-shot-order-local-help-generator.yml'

permissions:
  contents: write

jobs:
  order-local-generator:
    if: github.event.head_commit.message == 'Bootstrap local Help generator ordering'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: feature/method-reuse-multifile-delegation
          fetch-depth: 0

      - name: Add explicit local screenshot scenario order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsSWTBotTest.java')
          content = path.read_text(encoding='utf-8')

          if len(re.findall(r'(?m)^    @Test$', content)) != 8:
              raise SystemExit('Expected exactly eight local screenshot test methods')

          import_anchor = '''import org.junit.jupiter.api.BeforeAll;\nimport org.junit.jupiter.api.Test;\n'''
          import_replacement = '''import org.junit.jupiter.api.BeforeAll;\nimport org.junit.jupiter.api.MethodOrderer;\nimport org.junit.jupiter.api.Order;\nimport org.junit.jupiter.api.Test;\nimport org.junit.jupiter.api.TestMethodOrder;\n'''
          if content.count(import_anchor) != 1:
              raise SystemExit('Unexpected JUnit import anchor')
          content = content.replace(import_anchor, import_replacement)

          class_anchor = 'public class SandboxHelpScreenshotsSWTBotTest {\n'
          class_replacement = '''/*
           * Cleanup execution scenarios persist profiles in the shared workbench.
           * Keep the documented local generator in the same deterministic order as
           * the read-only CI merge gate and run profile-mutating scenarios last.
           */
          @TestMethodOrder(MethodOrderer.OrderAnnotation.class)
          public class SandboxHelpScreenshotsSWTBotTest {
          '''
          if content.count(class_anchor) != 1:
              raise SystemExit('Unexpected screenshot test class anchor')
          content = content.replace(class_anchor, class_replacement)

          ordered_methods = {
              'captureRuleInferencePreferences': 1,
              'captureRefactoringMiningWorkflow': 2,
              'captureNewHintRuleWizard': 3,
              'captureRealCleanupPreviewAndVerifyIndependentSelection': 4,
              'captureCleanupConfigurationTabs': 5,
              'captureCssCleanupPreferences': 6,
              'coordinatedIntToEnumPreviewIsAtomic': 7,
              'verifyRealMethodReuseCleanupPreviewApplyAndUndo': 8,
          }
          for method, order in ordered_methods.items():
              anchor = f'    @Test\n    public void {method}('
              replacement = f'    @Test\n    @Order({order})\n    public void {method}('
              if content.count(anchor) != 1:
                  raise SystemExit(f'Unexpected test-method anchor: {method}')
              content = content.replace(anchor, replacement)

          if content.count('import org.junit.jupiter.api.MethodOrderer;') != 1:
              raise SystemExit('MethodOrderer import is not unique')
          if content.count('import org.junit.jupiter.api.Order;') != 1:
              raise SystemExit('Order import is not unique')
          if content.count('import org.junit.jupiter.api.TestMethodOrder;') != 1:
              raise SystemExit('TestMethodOrder import is not unique')
          if content.count('@TestMethodOrder(MethodOrderer.OrderAnnotation.class)') != 1:
              raise SystemExit('Test method ordering annotation is not unique')
          if len(re.findall(r'(?m)^    @Order\([1-8]\)$', content)) != 8:
              raise SystemExit('Expected exactly eight explicit order annotations')

          path.write_text(content, encoding='utf-8')
          PY

      - name: Commit bounded ordering fix and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          bootstrap='.github/workflows/one-shot-order-local-help-generator.yml'
          test_class='sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsSWTBotTest.java'

          git rm -- "$bootstrap"
          git add -- "$test_class"

          actual="$(git diff --cached --name-status | sort)"
          expected="$(printf 'D\t%s\nM\t%s\n' "$bootstrap" "$test_class" | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          changed_text_lines="$(git diff --numstat origin/main -- ':!**/*.png' | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { total += $1 + $2 } END { print total + 0 }')"
          printf 'Changed text lines against main: %s\n' "$changed_text_lines"
          test "$changed_text_lines" -lt 2000

          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Order local Help screenshot generation deterministically'
          git push origin HEAD:feature/method-reuse-multifile-delegation
