name: PR 1291 Diagnostics

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'sandbox_common/src/org/sandbox/jdt/cleanup/multifile/GeneratedTypeNamePolicy.java'
      - 'sandbox_common_test/src/org/sandbox/jdt/cleanup/multifile/GeneratedTypeNamePolicyTest.java'
      - 'sandbox_int_to_enum/**'
      - 'sandbox_int_to_enum_test/**'
      - '.github/workflows/pr1291-diagnostics.yml'

permissions:
  contents: read

jobs:
  default-build-log:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DISPLAY: :0
      MAVEN_OPTS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth \
            libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 libxrandr2 libxfixes3 \
            libasound2t64 libnss3 libgbm1
      - uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1
        with:
          maven-version: 3.9.14
      - name: Run authoritative default build
        shell: bash
        run: |
          set -o pipefail
          status=0
          xvfb-run --auto-servernum mvn -e -V -T 1C --batch-mode \
            -Dtycho.localArtifacts=ignore clean verify 2>&1 \
            | tee pr1291-maven.log || status=$?
          echo "$status" > pr1291-exit-code.txt
          exit "$status"
      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr1291-maven-diagnostics-${{ github.sha }}
          path: |
            pr1291-maven.log
            pr1291-exit-code.txt
          retention-days: 2
          if-no-files-found: error
