name: Orchestrate release 1.3.3

on:
  push:
    branches:
      - orchestrate-release/1.3.3
    paths:
      - .github/workflows/orchestrate-release-1.3.3.yml

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: orchestrate-release-1.3.3
  cancel-in-progress: false

jobs:
  orchestrate:
    if: github.event.head_commit.message == 'Orchestrate release 1.3.3'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Wait for the verified fix to merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: '1306'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            pr_json=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state,mergedAt,url)
            state=$(jq -r .state <<< "$pr_json")
            merged_at=$(jq -r '.mergedAt // ""' <<< "$pr_json")
            if [[ -n "$merged_at" ]]; then
              echo "Fix PR merged at ${merged_at}."
              exit 0
            fi
            if [[ "$state" == CLOSED ]]; then
              echo '::error::Fix PR was closed without merging.'
              exit 1
            fi
            sleep 30
          done
          echo '::error::Fix PR did not merge within the orchestration window.'
          exit 1

      - name: Dispatch or reuse the canonical release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: deploy-release.yml
          RELEASE_VERSION: 1.3.3
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "v${RELEASE_VERSION}" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${RELEASE_VERSION} already exists."
            exit 0
          fi

          main_sha=$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          existing=$(gh api "repos/${REPOSITORY}/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=100" \
            --jq --arg sha "$main_sha" '[.workflow_runs[]
              | select(.head_sha == $sha)
              | select(.status == "queued" or .status == "in_progress" or (.status == "completed" and .conclusion == "success"))]
              | sort_by(.created_at) | reverse | .[0].id // empty')

          if [[ -n "$existing" ]]; then
            run_id="$existing"
            echo "Using canonical release run ${run_id} for main ${main_sha}."
          else
            before=$(mktemp)
            gh api "repos/${REPOSITORY}/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=100" \
              --jq '.workflow_runs[].id' > "$before"

            gh workflow run "$WORKFLOW" \
              --repo "$REPOSITORY" \
              --ref main \
              -f release_version="$RELEASE_VERSION" \
              -f skip_tests=false \
              -f dry_run=false

            run_id=''
            for attempt in $(seq 1 60); do
              while IFS= read -r candidate; do
                if ! grep -qx "$candidate" "$before"; then
                  candidate_sha=$(gh api "repos/${REPOSITORY}/actions/runs/${candidate}" --jq .head_sha)
                  if [[ "$candidate_sha" == "$main_sha" ]]; then
                    run_id="$candidate"
                    break
                  fi
                fi
              done < <(
                gh api "repos/${REPOSITORY}/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=100" \
                  --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id'
              )
              [[ -n "$run_id" ]] && break
              sleep 2
            done
            rm -f "$before"
            [[ -n "$run_id" ]] || { echo '::error::Could not identify the dispatched release run.'; exit 1; }
            echo "Dispatched canonical release workflow run ${run_id}."
          fi

          status=$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}" --jq .status)
          if [[ "$status" != completed ]]; then
            gh run watch "$run_id" --repo "$REPOSITORY" --exit-status
          else
            conclusion=$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')
            [[ "$conclusion" == success ]] || { echo "::error::Release run ${run_id} concluded ${conclusion}."; exit 1; }
          fi

      - name: Verify published release identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: 1.3.3
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(gh release view "v${RELEASE_VERSION}" --repo "$REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url)
          jq -e --arg tag "v${RELEASE_VERSION}" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false' \
            <<< "$release_json" >/dev/null
          echo "$release_json"

      - name: Remove temporary release branches
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          for branch in \
            release-request/1.3.3 \
            run-release/1.3.3 \
            diagnose-release-1.3.3 \
            fix/release-p2-mirror-rate-limit \
            orchestrate-release/1.3.3; do
            encoded=${branch//\//%2F}
            gh api -X DELETE "repos/${REPOSITORY}/git/refs/heads/${encoded}" >/dev/null 2>&1 || true
          done
