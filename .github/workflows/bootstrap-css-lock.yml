name: Bootstrap CSS npm lock

on:
  pull_request:
    paths:
      - 'sandbox_css_cleanup_test/package.json'
      - '.github/workflows/bootstrap-css-lock.yml'

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Generate lockfile
        working-directory: sandbox_css_cleanup_test
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload lockfile
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-css-package-lock
          path: sandbox_css_cleanup_test/package-lock.json
          if-no-files-found: error
          retention-days: 1
