name: Bootstrap CSS npm lock

on:
  pull_request:
    paths:
      - 'sandbox_css_cleanup_test/package.json'
      - '.github/workflows/bootstrap-css-lock.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Generate lockfile
        working-directory: sandbox_css_cleanup_test
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile to the working branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sandbox_css_cleanup_test/package-lock.json
          if git diff --cached --quiet; then
            echo 'The lockfile is already current.'
          else
            git commit -m 'Lock CSS test Node dependencies'
            git push origin "HEAD:${HEAD_REF}"
          fi
