name: Repair and verify quality metrics

on:
  push:
    branches: [ ci/verified-quality-metric-badges ]
    paths:
      - '.github/workflows/repair-quality-metrics.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Use runner Maven
        uses: ./.github/actions/use-runner-maven

      - name: Normalize the reviewable implementation
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fq '<module>sandbox_quality_metrics</module>' pom.xml; then
            awk '!done && /<\/modules>/ { print "\t\t<module>sandbox_quality_metrics</module>"; done=1 } { print } END { if (!done) exit 2 }' \
              pom.xml > pom.xml.new
            mv pom.xml.new pom.xml
          fi
          if ! grep -A2 -F '<artifactId>junit-jupiter</artifactId>' sandbox_quality_metrics/pom.xml | grep -Fq '<version>'; then
            sed -i '/<artifactId>junit-jupiter<\/artifactId>/a\			<version>5.13.4</version>' \
              sandbox_quality_metrics/pom.xml
          fi
          sed -i '/^import java\.util\.Comparator;$/d' \
            sandbox_quality_metrics/src/main/java/org/sandbox/build/quality/QualityMetrics.java

          coverage='[![Coverage](https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Fcarstenartur%2Fsandbox%2Fgh-pages%2Fbadges%2Fcoverage.json)](https://carstenartur.github.io/sandbox/coverage/)'
          tests='[![Tests](https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Fcarstenartur%2Fsandbox%2Fgh-pages%2Fbadges%2Ftests.json)](https://carstenartur.github.io/sandbox/tests/)'
          skipped='[![Skipped tests](https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Fcarstenartur%2Fsandbox%2Fgh-pages%2Fbadges%2Fskipped.json)](https://carstenartur.github.io/sandbox/tests/)'
          sed -i "s|^\[!\[Coverage\](https://github.com/carstenartur/sandbox/actions/workflows/coverage.yml/badge.svg?branch=main)\](https://github.com/carstenartur/sandbox/actions/workflows/coverage.yml)$|$coverage|" README.md
          sed -i "s|^\[!\[Tests\](https://github.com/carstenartur/sandbox/actions/workflows/test-report.yml/badge.svg?branch=main)\](https://github.com/carstenartur/sandbox/actions/workflows/test-report.yml)$|$tests|" README.md
          if ! grep -Fq 'badges%2Fskipped.json' README.md; then
            awk -v skipped="$skipped" '{ print } /^\[!\[Tests\]/ { print skipped }' README.md > README.md.new
            mv README.md.new README.md
          fi

      - name: Verify Maven module and generator tests
        run: >-
          mvn --no-transfer-progress --batch-mode
          -pl sandbox_quality_metrics -am clean verify

      - name: Commit verified source and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/finalize-quality-metrics-branch.yml \
            .github/workflows/repair-issue-state.yml \
            .github/workflows/verify-quality-metrics-branch.yml \
            .github/workflows/finalize-quality-metrics-java21.yml \
            .github/workflows/materialize-quality-metrics.yml \
            .github/workflows/repair-quality-metrics.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml README.md .github/workflows/coverage.yml \
            sandbox_quality_metrics docs/quality-metrics.md
          if ! git diff --cached --quiet; then
            git commit -m 'Verify Maven-owned quality metric badges'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
