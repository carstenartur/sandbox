name: Rebuild PR 1370 after PR 1369

on:
  push:
    branches:
      - rebuild/pr-1370-after-1369

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild strict guard evaluation on current main
        shell: bash
        run: |
          set -euo pipefail

          merged_main=f7b7e527311e5ee87c60ef2387d901108475e79e
          declaration_diff_head=e52dbe5bc0e3bf62e57102d7968dce1da5e06222
          old_strict_guard_head=8b596864ece82e4be77e496f3094d655f1706b0d
          target_branch=feature/strict-guard-evaluation

          git fetch --no-tags origin main "$target_branch"

          test "$(git rev-parse origin/main)" = "$merged_main"
          git diff --quiet "$declaration_diff_head" "$merged_main"
          test "$(git rev-parse origin/$target_branch)" = "$old_strict_guard_head"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --detach "$merged_main"
          git switch -c rebuilt-pr-1370
          git diff --binary "$declaration_diff_head" "$old_strict_guard_head" | git apply --index --whitespace=nowarn

          rebuilt_tree="$(git write-tree)"
          expected_tree="$(git rev-parse "$old_strict_guard_head^{tree}")"
          test "$rebuilt_tree" = "$expected_tree"

          git commit -m "Fail closed on unresolved binding-required guards"
          git push \
            --force-with-lease="refs/heads/$target_branch:$old_strict_guard_head" \
            origin "HEAD:refs/heads/$target_branch"
