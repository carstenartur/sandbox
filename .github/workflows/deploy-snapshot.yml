name: Deploy Snapshot to GitHub Pages

on:
  workflow_run:
    workflows: [ 'Java CI with Maven' ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: write
  pages: write

concurrency:
  group: release-workflow
  cancel-in-progress: false

jobs:
  select-snapshot-source:
    name: Select snapshot source
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      is_snapshot: ${{ steps.project_version.outputs.is_snapshot }}
      project_version: ${{ steps.project_version.outputs.project_version }}

    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Read and classify the project version
        id: project_version
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(
            python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          root = ElementTree.parse(Path('pom.xml')).getroot()
          namespace = {'m': 'http://maven.apache.org/POM/4.0.0'}
          version = root.find('m:version', namespace)
          if version is None or not version.text or not version.text.strip():
              raise SystemExit('root pom.xml has no direct project version')
          print(version.text.strip())
          PY
          )"

          is_snapshot=false
          if [[ "$project_version" == *-SNAPSHOT ]]; then
            is_snapshot=true
          fi

          echo "project_version=$project_version" >> "$GITHUB_OUTPUT"
          echo "is_snapshot=$is_snapshot" >> "$GITHUB_OUTPUT"
          {
            echo '### Snapshot source selection'
            echo
            printf -- '- Validated project version: `%s`\n' "$project_version"
            if [[ "$is_snapshot" == 'true' ]]; then
              echo '- Snapshot publication selected.'
            else
              echo '- Stable project version; snapshot publication skipped.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-deploy:
    name: Build and deploy selected snapshot
    needs: select-snapshot-source
    if: needs.select-snapshot-source.outputs.is_snapshot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
      VALIDATED_REF: refs/heads/main
      VALIDATED_VERSION: ${{ needs.select-snapshot-source.outputs.project_version }}
      SOURCE_JAVA_CI_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_JAVA_CI_RUN_URL: ${{ github.event.workflow_run.html_url }}

    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VALIDATED_SHA }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Use runner Maven
        uses: ./.github/actions/use-runner-maven

      - name: Install Linux desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1

      - name: Maven distribution build and verification
        run: >-
          xvfb-run --auto-servernum mvn
          -Pdistribution
          --batch-mode
          -Dtycho.localArtifacts=ignore
          clean verify

      - name: Generate snapshot build manifest
        id: generate_manifest
        run: |
          python3 .github/scripts/generate_test_report.py > /tmp/test-report-generation.log
          python3 .github/scripts/generate_build_manifest.py \
            --commit-sha "$VALIDATED_SHA" \
            --source-ref "$VALIDATED_REF" \
            --output build-manifest.json
          python3 -m json.tool build-manifest.json > /dev/null

      - name: Prepare snapshot and dashboard
        run: |
          snapshot_dir="gh-pages-content/snapshots/latest"
          mkdir -p "$snapshot_dir"
          cp -a sandbox_updatesite/target/repository/. "$snapshot_dir/"
          cp build-manifest.json "$snapshot_dir/build-manifest.json"
          cp target/distribution-verification/verification.json "$snapshot_dir/distribution-verification.json"
          cp target/distribution-verification/verification.md "$snapshot_dir/distribution-verification.md"
          cp .github/pages/index.html gh-pages-content/index.html

          mkdir -p gh-pages-content/snapshots
          timestamp="$(date +%s)000"
          cat > gh-pages-content/snapshots/compositeContent.xml << EOF
          <?xml version='1.0' encoding='UTF-8'?>
          <?compositeMetadataRepository version='1.0.0'?>
          <repository name='Sandbox Snapshots'
                      type='org.eclipse.equinox.internal.p2.metadata.repository.CompositeMetadataRepository'
                      version='1.0.0'>
            <properties size='1'>
              <property name='p2.timestamp' value='$timestamp'/>
            </properties>
            <children size='1'>
              <child location='latest'/>
            </children>
          </repository>
          EOF
          cat > gh-pages-content/snapshots/compositeArtifacts.xml << EOF
          <?xml version='1.0' encoding='UTF-8'?>
          <?compositeArtifactRepository version='1.0.0'?>
          <repository name='Sandbox Snapshots'
                      type='org.eclipse.equinox.internal.p2.artifact.repository.CompositeArtifactRepository'
                      version='1.0.0'>
            <properties size='1'>
              <property name='p2.timestamp' value='$timestamp'/>
            </properties>
            <children size='1'>
              <child location='latest'/>
            </children>
          </repository>
          EOF

      - name: Checkout current gh-pages revision
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-before
          fetch-depth: 1

      - name: Capture current gh-pages revision
        id: gh_pages_before
        run: echo "sha=$(git -C gh-pages-before rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy snapshot and dashboard
        id: deploy_snapshot
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-content
          publish_branch: gh-pages
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Deploy verified snapshot for ${{ env.VALIDATED_SHA }}

      - name: Capture deployed gh-pages revision
        id: gh_pages_after
        run: |
          git -C gh-pages-before fetch origin gh-pages
          echo "sha=$(git -C gh-pages-before rev-parse origin/gh-pages)" >> "$GITHUB_OUTPUT"

      - name: Await exact GitHub Pages publication
        id: await_pages_build
        uses: ./.github/actions/wait-for-pages-build
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          expected-commit: ${{ steps.gh_pages_after.outputs.sha }}
          output: target/distribution-verification/pages-build.json

      - name: Verify advertised snapshot URLs
        id: verify_snapshot_urls
        run: |
          python3 .github/scripts/verify_published_repository.py \
            --repository-url https://carstenartur.github.io/sandbox/snapshots/latest/ \
            --expected-json target/distribution-verification/verification.json \
            --output target/distribution-verification/snapshot-url-verification.json
          python3 .github/scripts/verify_published_repository.py \
            --repository-url https://carstenartur.github.io/sandbox/snapshots/ \
            --expected-child latest \
            --output target/distribution-verification/snapshot-composite-verification.json

      - name: Roll back a failed snapshot publication
        id: rollback_snapshot
        if: ${{ failure() && steps.deploy_snapshot.outcome == 'success' && (steps.await_pages_build.outcome == 'failure' || steps.verify_snapshot_urls.outcome == 'failure') }}
        run: |
          set -euo pipefail
          previous="${{ steps.gh_pages_before.outputs.sha }}"
          deployed="${{ steps.gh_pages_after.outputs.sha }}"
          if [[ -z "$previous" || -z "$deployed" ]]; then
            echo '::error::The previous or deployed gh-pages revision was not captured.'
            exit 1
          fi
          git -C gh-pages-before push \
            --force-with-lease=refs/heads/gh-pages:${deployed} \
            origin "${previous}:refs/heads/gh-pages"
          echo "Rolled gh-pages back from ${deployed} to ${previous}." \
            | tee target/distribution-verification/snapshot-publication-rollback.log

      - name: Await rolled-back GitHub Pages publication
        id: await_rollback_pages_build
        if: ${{ always() && steps.rollback_snapshot.outcome == 'success' }}
        uses: ./.github/actions/wait-for-pages-build
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          expected-commit: ${{ steps.gh_pages_before.outputs.sha }}
          output: target/distribution-verification/pages-rollback-build.json

      - name: Upload immutable snapshot provenance
        if: ${{ always() && steps.generate_manifest.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-provenance-${{ env.VALIDATED_SHA }}
          path: |
            build-manifest.json
            target/distribution-verification/
          retention-days: 90
          if-no-files-found: error

      - name: Report snapshot publication
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy_snapshot.outcome }}
          PAGES_BUILD_OUTCOME: ${{ steps.await_pages_build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_snapshot_urls.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback_snapshot.outcome }}
          ROLLBACK_PAGES_BUILD_OUTCOME: ${{ steps.await_rollback_pages_build.outcome }}
        run: |
          {
            echo '### Snapshot publication'
            echo
            echo "- [Validated commit](https://github.com/${GITHUB_REPOSITORY}/commit/${VALIDATED_SHA})"
            echo "- Validated project version: \`${VALIDATED_VERSION}\`"
            echo "- [Source Java CI run](${SOURCE_JAVA_CI_RUN_URL})"
            if [[ "$DEPLOY_OUTCOME" == 'success' && "$PAGES_BUILD_OUTCOME" == 'success' && "$VERIFY_OUTCOME" == 'success' ]]; then
              echo '- [Project dashboard](https://carstenartur.github.io/sandbox/)'
              echo '- [Latest snapshot update site](https://carstenartur.github.io/sandbox/snapshots/latest/)'
              echo '- [Snapshot build manifest](https://carstenartur.github.io/sandbox/snapshots/latest/build-manifest.json)'
              echo '- [Distribution verification](https://carstenartur.github.io/sandbox/snapshots/latest/distribution-verification.md)'
            else
              echo "- Deployment outcome: \`${DEPLOY_OUTCOME:-not-run}\`"
              echo "- GitHub Pages build outcome: \`${PAGES_BUILD_OUTCOME:-not-run}\`"
              echo "- URL verification outcome: \`${VERIFY_OUTCOME:-not-run}\`"
              echo "- Rollback outcome: \`${ROLLBACK_OUTCOME:-not-run}\`"
              echo "- Rollback Pages build outcome: \`${ROLLBACK_PAGES_BUILD_OUTCOME:-not-run}\`"
              echo '- No successful snapshot publication is reported for this run.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
