name: JDT Core reporting probe
on:
  push:
    branches: [investigate/jdt-core-reporting]
    paths:
      - 'qa/upstream-jdt/compiler-reporting/**'
      - '.github/workflows/jdt-core-reporting-probe.yml'
  pull_request:
    paths:
      - 'qa/upstream-jdt/compiler-reporting/**'
      - '.github/workflows/jdt-core-reporting-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jdt-reporting-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Clean and preserve the exact probe runtime
        run: |
          mvn -B -ntp -f qa/upstream-jdt/compiler-reporting/pom.xml clean org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DincludeScope=test -DoutputDirectory=target/probe-libs
          cp -r qa/upstream-jdt/compiler-reporting/src qa/upstream-jdt/compiler-reporting/target/probe-source
      - name: Run real Surefire reporter regression tests
        run: mvn -B -ntp -f qa/upstream-jdt/compiler-reporting/pom.xml verify
      - name: Preserve all evidence including failing tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jdt-core-reporting-probe
          path: qa/upstream-jdt/compiler-reporting/target/
          if-no-files-found: error
