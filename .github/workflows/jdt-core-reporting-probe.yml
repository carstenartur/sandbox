name: JDT Core reporting probe
on:
  push:
    branches: [investigate/jdt-core-reporting]
    paths: ['qa/upstream-jdt/compiler-reporting/**', '.github/workflows/jdt-core-reporting-probe.yml']
  pull_request:
    paths: ['qa/upstream-jdt/compiler-reporting/**', '.github/workflows/jdt-core-reporting-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jdt-reporting-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Reproduce the baseline with complete XML inventories
        run: |
          mkdir -p "$RUNNER_TEMP/reporting-evidence"
          mvn -B -ntp -f qa/upstream-jdt/compiler-reporting/pom.xml clean verify -Dprobe.expectBaseline=true -Dprobe.output="$RUNNER_TEMP/reporting-evidence/baseline"
          cp -r qa/upstream-jdt/compiler-reporting/target/surefire-reports "$RUNNER_TEMP/reporting-evidence/baseline-test-reports"
      - name: Test the isolated report-owner correction
        run: |
          mvn -B -ntp -f qa/upstream-jdt/compiler-reporting/pom.xml clean verify -Ppatched-reporter -Dprobe.output="$RUNNER_TEMP/reporting-evidence/patched"
          cp -r qa/upstream-jdt/compiler-reporting/target/surefire-reports "$RUNNER_TEMP/reporting-evidence/patched-test-reports"
      - name: Require identical before and after test inventories
        run: |
          set -euo pipefail
          for scenario in direct-32 suite-32 scale-32 scale-64; do
            diff -u "$RUNNER_TEMP/reporting-evidence/baseline/$scenario/inventory.txt" "$RUNNER_TEMP/reporting-evidence/patched/$scenario/inventory.txt"
          done
      - name: Preserve the exact runtime and probe source
        if: always()
        run: |
          mvn -B -ntp -f qa/upstream-jdt/compiler-reporting/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DincludeScope=test -DoutputDirectory=target/probe-libs
          cp -r qa/upstream-jdt/compiler-reporting/src qa/upstream-jdt/compiler-reporting/target/probe-source
          git rev-parse HEAD > "$RUNNER_TEMP/reporting-evidence/sandbox-commit.txt"
          java -version 2> "$RUNNER_TEMP/reporting-evidence/java-version.txt"
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jdt-core-reporting-probe
          path: |
            qa/upstream-jdt/compiler-reporting/target/
            ${{ runner.temp }}/reporting-evidence/
          if-no-files-found: error
