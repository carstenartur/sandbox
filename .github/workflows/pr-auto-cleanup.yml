name: Sandbox Cleanup Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.java'
      - '.github/actions/cleanup-review/**'
      - '.github/cleanup-profiles/review-explicit-encoding.properties'
      - '.github/workflows/pr-auto-cleanup.yml'
      - 'sandbox_common_test/pom-cleanup-review.xml'
      - 'sandbox_cleanup_application/**'
      - 'sandbox_cleanup_docker/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-cleanup-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  action-contract:
    name: Verify cleanup-review action contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate shell entry points
        run: bash -n .github/actions/cleanup-review/run-cleanup-review.sh .github/actions/cleanup-review/test/run-cleanup-review-test.sh

      - name: Run cleanup-review contract tests
        run: .github/actions/cleanup-review/test/run-cleanup-review-test.sh

      - name: Set up contract test JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify cleanup-review contracts through Maven and JUnit
        run: ./mvnw --batch-mode -f sandbox_common_test/pom-cleanup-review.xml test

  suggestions:
    name: Propose conservative encoding cleanup
    needs: action-contract
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.head.ref, 'cleanup/pr-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up review JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Analyze changed Java source and publish suggestions
        uses: ./.github/actions/cleanup-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          config-file: .github/cleanup-profiles/review-explicit-encoding.properties
          image: ghcr.io/carstenartur/sandbox-cleanup:latest
          java-home: ${{ env.JAVA_HOME }}
          scope: both
          source-mode: changed
          tool-name: sandbox-explicit-encoding
          artifact-name: sandbox-cleanup-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
