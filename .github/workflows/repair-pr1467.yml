name: Repair PR 1467 upstream gate

on:
  push:
    branches:
      - feature/oomph-upstream-jdt-migration-qa-final
    paths:
      - .github/workflows/repair-pr1467.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: feature/oomph-upstream-jdt-migration-qa-final
          fetch-depth: 0

      - name: Apply the scoped upstream-gate repair
        run: python3 .github/scripts/repair_pr1467.py

      - name: Validate the repaired contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          bash -n qa/upstream-jdt/run-before-after.sh
          python3 qa/upstream-jdt/verify_contract.py
          git diff --check

      - name: Commit the repair and remove one-shot files
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr1467.yml
          rm .github/scripts/repair_pr1467.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Test only the pinned JDT APT module'
          git push origin HEAD:feature/oomph-upstream-jdt-migration-qa-final
