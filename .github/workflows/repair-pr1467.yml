name: Repair PR 1467 upstream gate

on:
  push:
    branches:
      - feature/oomph-upstream-jdt-migration-qa-final
    paths:
      - .github/workflows/repair-pr1467.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: feature/oomph-upstream-jdt-migration-qa-final

      - name: Apply the scoped upstream-gate repair
        run: python3 .github/scripts/repair_pr1467.py

      - name: Validate the repaired contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          bash -n qa/upstream-jdt/run-before-after.sh
          python3 qa/upstream-jdt/verify_contract.py
          git diff --check

      - name: Package the validated files
        run: |
          set -euo pipefail
          tar -czf pr1467-repaired-files.tar.gz \
            .github/workflows/upstream-jdt-migration-qa.yml \
            qa/upstream-jdt/README.md \
            qa/upstream-jdt/run-before-after.sh \
            qa/upstream-jdt/verify_contract.py

      - name: Upload the validated files
        uses: actions/upload-artifact@v7
        with:
          name: pr1467-repaired-files
          path: pr1467-repaired-files.tar.gz
          retention-days: 1
          if-no-files-found: error
