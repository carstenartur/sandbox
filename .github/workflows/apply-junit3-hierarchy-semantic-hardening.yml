name: Apply JUnit 3 hierarchy semantic hardening

on:
  push:
    branches:
      - feature/junit3-hierarchy-semantic-hardening
    paths:
      - '.github/workflows/apply-junit3-hierarchy-semantic-hardening.yml'
      - 'qa/apply-junit3-hierarchy-core.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply hierarchy core patch
        run: python3 qa/apply-junit3-hierarchy-core.py

      - name: Commit deterministic result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-junit3-hierarchy-semantic-hardening.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete JUnit 3 hierarchy semantic hardening'
          git push origin HEAD:feature/junit3-hierarchy-semantic-hardening
