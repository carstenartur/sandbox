name: Temporary failed-job log diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-job-89808358332.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect-log:
    runs-on: ubuntu-24.04
    steps:
      - name: Extract relevant failure lines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            /repos/carstenartur/sandbox/actions/jobs/89808358332/logs \
            > /tmp/job.log
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path('/tmp/job.log').read_text(encoding='utf-8-sig', errors='replace').splitlines()
          pattern = re.compile(
              r'error|failure|failed|exception|caused by|cannot|could not|non-resolvable|'
              r'no plugin found|exit code|process completed',
              re.IGNORECASE,
          )
          selected = set()
          for index, line in enumerate(lines):
              if pattern.search(line):
                  selected.update(range(max(0, index - 2), min(len(lines), index + 3)))

          print('=== Filtered failure context ===')
          for index in sorted(selected)[-70:]:
              print(lines[index])
          print('=== Final 25 raw log lines ===')
          for line in lines[-25:]:
              print(line)
          PY
