name: Runtime mathematics native gallery qualification
on:
  push:
    branches: [diagnostic/runtime-math-bouncy-20261009]
permissions:
  contents: write
  actions: read
jobs:
  mathematics:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7b792268c65a5e2dfd7f6010297708d32ddf9b3c
          path: verified-source
      - name: Download the successful corpus steps without rerunning their unchanged source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 37952442673
          name: runtime-math-regressions-37952442673
          path: ${{ runner.temp }}/prior-evidence
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
          cache: maven
          cache-dependency-path: verified-source/**/pom.xml
      - name: Verify source identity and original passing JUnit reports, then stage exact outputs
        working-directory: verified-source
        shell: bash
        env:
          PRIOR_EVIDENCE: ${{ runner.temp }}/prior-evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7b792268c65a5e2dfd7f6010297708d32ddf9b3c
          test -z "$(git status --porcelain)"
          git fetch --depth=1 origin e224357e0ecd09f5e799f1bb8d2de825629f3ae4
          python3 - <<'PY'
          from pathlib import Path
          import os, json, hashlib, shutil, subprocess, xml.etree.ElementTree as E
          qualified='e224357e0ecd09f5e799f1bb8d2de825629f3ae4'
          changes=set(subprocess.check_output(['git','diff','--name-only',qualified,'HEAD'],text=True).splitlines())
          assert changes=={'.gitattributes','sandbox_math_cleanup_help/html/examples.html','sandbox_eclipse_help_swtbot_test/fixtures/mathematics/README.md'},changes
          root=Path(os.environ['PRIOR_EVIDENCE'])
          bc=root/'_temp/bc-runtime'
          assert bc.is_dir(), list(root.iterdir())
          def properties(path):
              return dict(line.split('=',1) for line in path.read_text().splitlines() if line and not line.startswith('#'))
          run=properties(bc/'run.properties')
          assert run['sandbox.revision']==qualified,run
          assert run['bouncycastle.revision']=='c314b9cdffa3958a0eff5344f8fdcdb0181ed830'
          assert run['sdk.sha256']==hashlib.sha256(Path('sandbox_math_cleanup/lib/regelsuche-optimization-sdk.jar').read_bytes()).hexdigest()
          def check_reports(paths, expected):
              paths=list(paths); assert paths
              totals={key:0 for key in ('tests','failures','errors','skipped')}
              for path in paths:
                  suite=E.parse(path).getroot()
                  for key in totals: totals[key]+=int(suite.get(key,0))
              assert totals==dict(tests=expected,failures=0,errors=0,skipped=0),totals
              return totals
          default=check_reports((root/'_temp/default-math-reports').glob('TEST-*.xml'),169)
          corpus=check_reports((bc/'production-junit').glob('TEST-*BouncyCastleRuntimeCorpusIT*.xml'),4)
          fixtures=check_reports((bc/'fixture-export-junit').glob('TEST-*RuntimeHelpFixtureExportIT*.xml'),1)
          destination=Path('qa/math-optimization/results/runtime-bouncy-37952442673')
          destination.mkdir(parents=True)
          shutil.copy2(bc/'run.properties',destination/'run.properties')
          for name,count in [('MD4Digest',2),('RIPEMD160Digest',2),('SM3Digest',2),('SHA256Digest',0)]:
              source=bc/'results'/name
              receipt=properties(source/'qualification.properties')
              assert receipt['status']=='PASS' and int(receipt['verified.regions'])==count,receipt
              for key in ('upstream.tests.original','upstream.tests.generated','idempotence','upstream.patch.apply.check'):
                  assert receipt[key]=='PASS',receipt
              assert receipt['undo']=='BYTE_EXACT' and receipt['differential.full.digest.comparisons']=='156'
              patch=source/(name+'.patch')
              assert hashlib.sha256(patch.read_bytes()).hexdigest()==receipt['patch.sha256']
              for role,key in [('before','source.sha256'),('after','generated.sha256')]:
                  assert hashlib.sha256((source/role/receipt['source.path']).read_bytes()).hexdigest()==receipt[key]
              target=destination/name; target.mkdir()
              for file in ('qualification.properties',name+'.patch','independent-proof-and-cost.txt'):
                  shutil.copy2(source/file,target/file)
          (destination/'verification.json').write_text(json.dumps(dict(qualifiedSourceCommit=qualified,
              reusedFromRun=37952442673,sourceArtifactId=11627180929,defaultMathTests=default,
              productionCorpusTests=corpus,fixtureExportTests=fixtures,
              newExecutionClaimed=False),indent=2,sort_keys=True)+'\n')
          fixture_root=Path('sandbox_eclipse_help_swtbot_test/fixtures/mathematics')
          old=['01-bouncy-castle-prime-product','02-jdt-core-shared-value','03-jdt-ui-multiple-lines','04-jdt-ui-nested-arithmetic']
          new=['01-bouncy-castle-md4-choice','02-bouncy-castle-md4-majority','03-bouncy-castle-ripemd-choices','04-bouncy-castle-sm3-functions']
          for name in old:
              subprocess.run(['git','rm','-r',str(fixture_root/name)],check=True)
              subprocess.run(['git','rm','--ignore-unmatch','sandbox_math_cleanup_help/images/'+name+'.png',
                  'sandbox_math_cleanup_help/images/'+name+'.provenance.json'],check=True)
          for name in new:
              shutil.copytree(bc/'results/help-fixtures'/name,fixture_root/name)
          p=Path('sandbox_eclipse_help_swtbot_test/src/org/sandbox/jdt/ui/helper/views/EclipseHelpScreenshotEvidenceTest.java')
          s=p.read_text()
          for a,b in zip(old,new):
              assert a in s;s=s.replace(a,b)
          p.write_text(s)
          p=Path('sandbox_math_cleanup_help/html/cleanup.html');s=p.read_text()
          start=s.index('<p><a href="examples.html"><strong>Four real before/after screenshots')
          end=s.index('<p>An eligible shape',start)
          s=s[:start]+'''<p><a href="examples.html"><strong>Four native runtime Bouncy Castle previews</strong></a>
          show six independently verified production methods, not constant folding.
          Complete upstream files and their original digest tests are qualified separately
          from the readable method excerpts used in the native preview.</p>
          <p>Intentional constant statements, named constant formulas and effectively-final
          constant chains remain unchanged. A mixed statement whose constant subexpression
          cannot yet retain its original spelling is diagnosed as
          <code>CONSTANT_EXPRESSION_PRESERVED</code>. Eligible neighboring runtime statements
          remain analyzable. Runtime cancellation such as <code>x ^ x</code> may still
          legitimately produce a constant.</p>
          '''+s[end:]
          s=s.replace('<tr><td>Effects, loops, mutable arrays, unknown calls, identity observations</td>',
              '<tr><td>Local loop-body calculations</td><td>Supported primitive regions can be analyzed inside loops without changing loop control, array effects or external writes.</td></tr>\n<tr><td>Effects, mutable arrays, unknown calls, identity observations</td>')
          s=s.replace('specific examples. Full corpus, installation and measured Java performance\nqualification remain separate work; these screenshots do not establish them.',
              'specific examples. The pinned runtime corpus command separately checks complete\nproduction files and original upstream digest tests. Whole-library, installation,\nmeasured Java performance and cryptographic side-channel qualification remain separate.')
          p.write_text(s)
          p=Path('docs/ECLIPSE_HELP.md');s=p.read_text()
          start=s.index('The Mathematics Help TOC includes four native before/after previews')
          end=s.index('The standard Help merge gate',start)
          s=s[:start]+'''The Mathematics Help TOC includes four native runtime previews from six
          unchanged Bouncy Castle production methods. These are selection and shared-mask
          reductions with unknown inputs, not constant folding. The method excerpts are
          derived from qualified complete files; the actual generated output is never
          manually edited for a picture. `RuntimeHelpFixtureExportIT` requires identical
          transformations in the complete-file and preview-shell contexts. See
          `sandbox_eclipse_help_swtbot_test/fixtures/mathematics/README.md` for the pinned
          source, original upstream tests, reproducible command and licensing. Operation
          estimates do not establish measured speedups or whole-library optimization.

          '''+s[end:]
          p.write_text(s)
          print('SOURCE_BOUND_REUSE_VERIFIED',default,corpus,fixtures)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/math-optimization/results sandbox_eclipse_help_swtbot_test sandbox_math_cleanup_help docs/ECLIPSE_HELP.md
          git diff --cached --check
          git commit -m 'test: retain qualified runtime patches and native preview fixtures without altering evidence'
          git push origin "HEAD:refs/heads/build/runtime-math-fixtures-${GITHUB_RUN_ID}"
          git rev-parse HEAD
      - name: Capture genuine registered cleanup previews and verify Apply and Undo
        working-directory: verified-source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if ! xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24 -dpi 96' \
            ./mvnw --batch-mode --no-transfer-progress -f sandbox_help_build/pom.xml -Phelp-screenshots \
            -Dhelp.screenshot.testClass=org.sandbox.jdt.ui.helper.views.MathematicsHelpScreenshotsSWTBotTest verify \
            > "$RUNNER_TEMP/native-math.log" 2>&1; then
            tail -140 "$RUNNER_TEMP/native-math.log"; exit 1
          fi
          grep -E 'Tests run:|BUILD SUCCESS' "$RUNNER_TEMP/native-math.log" | tail -35
          cp -a sandbox_math_cleanup_help/images "$RUNNER_TEMP/first-native-images"
          cp -a sandbox_eclipse_help_swtbot_test/target/surefire-reports "$RUNNER_TEMP/first-native-reports"
          git add sandbox_math_cleanup_help/images
          git diff --cached --check
          git commit -m 'docs: capture genuine native runtime Bouncy Castle previews'
          git push origin "HEAD:refs/heads/build/runtime-math-native-${GITHUB_RUN_ID}"
          git rev-parse HEAD
      - name: Reproduce the same four native previews without relaxing image checks
        working-directory: verified-source
        shell: bash
        run: |
          set -euo pipefail
          if ! xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24 -dpi 96' \
            ./mvnw --batch-mode --no-transfer-progress -f sandbox_help_build/pom.xml -Phelp-screenshots \
            -Dhelp.screenshot.testClass=org.sandbox.jdt.ui.helper.views.MathematicsHelpScreenshotsSWTBotTest verify \
            > "$RUNNER_TEMP/native-reproduction.log" 2>&1; then
            tail -130 "$RUNNER_TEMP/native-reproduction.log"; exit 1
          fi
          for id in 01-bouncy-castle-md4-choice 02-bouncy-castle-md4-majority 03-bouncy-castle-ripemd-choices 04-bouncy-castle-sm3-functions; do
            cmp "$RUNNER_TEMP/first-native-images/$id.png" "sandbox_math_cleanup_help/images/$id.png"
            cmp "$RUNNER_TEMP/first-native-images/$id.provenance.json" "sandbox_math_cleanup_help/images/$id.provenance.json"
          done
          test -z "$(git status --porcelain)"
          cp -a sandbox_eclipse_help_swtbot_test/target/surefire-reports "$RUNNER_TEMP/reproduced-native-reports"
          echo NATIVE_RUNTIME_PREVIEWS_REPRODUCIBLE
      - name: Verify installed image references and source-bound evidence
        working-directory: verified-source
        shell: bash
        run: |
          set -euo pipefail
          if ! xvfb-run --auto-servernum ./mvnw --batch-mode --no-transfer-progress \
            -f sandbox_help_build/pom.xml -Phelp-screenshots \
            -Dhelp.screenshot.testClass=org.sandbox.jdt.ui.helper.views.EclipseHelpScreenshotEvidenceTest verify \
            > "$RUNNER_TEMP/help-evidence.log" 2>&1; then
            tail -130 "$RUNNER_TEMP/help-evidence.log"; exit 1
          fi
          grep -E 'Tests run:|BUILD SUCCESS' "$RUNNER_TEMP/help-evidence.log" | tail -25
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-runtime-math-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/native-math.log
            ${{ runner.temp }}/native-reproduction.log
            ${{ runner.temp }}/help-evidence.log
            ${{ runner.temp }}/first-native-reports/**
            ${{ runner.temp }}/reproduced-native-reports/**
            verified-source/sandbox_eclipse_help_swtbot_test/target/surefire-reports/**
            verified-source/sandbox_eclipse_help_swtbot_test/target/work/data/.metadata/.log
            verified-source/sandbox_math_cleanup_help/images/**
            verified-source/sandbox_eclipse_help_swtbot_test/fixtures/mathematics/**
            verified-source/qa/math-optimization/results/runtime-bouncy-37952442673/**
            verified-source/**/hs_err_pid*.log
