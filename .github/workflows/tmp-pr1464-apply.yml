name: Apply coordinated preview screenshot repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/coordinated-cleanup-preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and commit screenshot contract repair
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ ! -f .github/patches/pr1464-screenshot-contract.patch ]]; then
            echo "Screenshot contract repair is already applied."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsSWTBotTest.java")
          replace_once(
              test,
              "import org.junit.jupiter.api.AfterAll;\nimport org.junit.jupiter.api.BeforeAll;",
              "import org.junit.jupiter.api.AfterAll;\nimport org.junit.jupiter.api.AfterEach;\nimport org.junit.jupiter.api.BeforeAll;",
          )
          replace_once(
              test,
              "        bot = new SWTWorkbenchBot();\n        outputRoot = SandboxCheckout.locate(OUTPUT_PROPERTY);\n        closeWelcomeView();",
              "        bot = new SWTWorkbenchBot();\n"
              "        outputRoot = SandboxCheckout.locate(OUTPUT_PROPERTY);\n"
              "        deleteGeneratedScreenshot(\"sandbox_jface_cleanup_help\",\n"
              "                \"jface-cleanup-real-preview-single-file-steps.png\");\n"
              "        deleteGeneratedScreenshot(\"sandbox_jface_cleanup_help\",\n"
              "                \"jface-cleanup-real-preview-diff-step.png\");\n"
              "        deleteGeneratedScreenshot(\"sandbox_jface_cleanup_help\",\n"
              "                \"jface-cleanup-real-preview-multi-file-selection.png\");\n"
              "        deleteGeneratedScreenshot(\"sandbox_int_to_enum_help\",\n"
              "                \"int-to-enum-coordinated-preview.png\");\n"
              "        closeWelcomeView();",
          )
          replace_once(
              test,
              "    @AfterAll\n    public static void tearDown() throws Exception {\n        closeDialogIfOpen();",
              "    @AfterEach\n"
              "    public void closeTransientDialogs() {\n"
              "        closeAllDialogs();\n"
              "    }\n\n"
              "    @AfterAll\n"
              "    public static void tearDown() throws Exception {\n"
              "        closeAllDialogs();",
          )
          replace_once(
              test,
              '        capture(wizard, "sandbox_jface_cleanup_help", "jface-cleanup-real-preview-single-file-steps.png");',
              '        captureCleanUpPreview(wizard, "sandbox_jface_cleanup_help",\n'
              '                "jface-cleanup-real-preview-single-file-steps.png");',
          )
          replace_once(
              test,
              '        capture(wizard, "sandbox_jface_cleanup_help", "jface-cleanup-real-preview-diff-step.png");',
              '        captureCleanUpPreview(wizard, "sandbox_jface_cleanup_help",\n'
              '                "jface-cleanup-real-preview-diff-step.png");',
          )
          replace_once(
              test,
              '        capture(wizard, "sandbox_jface_cleanup_help", "jface-cleanup-real-preview-multi-file-selection.png");',
              '        captureCleanUpPreview(wizard, "sandbox_jface_cleanup_help",\n'
              '                "jface-cleanup-real-preview-multi-file-selection.png");',
          )
          replace_once(
              test,
              '        assertTrue(affectedLabels.contains("StateCaller.java"),\n'
              '                "The coordinated viewer must list StateCaller.java");\n\n'
              '        assertTrue(candidate.isChecked(), "The coordinated candidate must initially be selected");',
              '        assertTrue(affectedLabels.contains("StateCaller.java"),\n'
              '                "The coordinated viewer must list StateCaller.java");\n\n'
              '        captureCleanUpPreview(wizard, "sandbox_int_to_enum_help",\n'
              '                "int-to-enum-coordinated-preview.png");\n\n'
              '        assertTrue(candidate.isChecked(), "The coordinated candidate must initially be selected");',
          )
          replace_once(
              test,
              '                    if (!"Clean Up".equals(shell.getText()) || !shell.isOpen()) {',
              '                    if (!shell.getText().startsWith("Clean Up") || !shell.isOpen()) {',
          )
          replace_once(
              test,
              '                return "The real Clean Up wizard did not open";',
              '                return "The real Clean Up wizard did not open; visible shells: " + visibleShells();',
          )
          capture_anchor = (
              "    private static void capture(SWTBotShell shell, String helpBundle, String fileName)\n"
              "            throws IOException {"
          )
          capture_helpers = (
              "    private static void captureCleanUpPreview(SWTBotShell shell, String helpBundle, String fileName)\n"
              "            throws IOException {\n"
              "        assertTrue(shell.isOpen(), \"The Clean Up preview shell must still be open\");\n"
              "        assertTrue(bot.activeShell().widget == shell.widget,\n"
              "                \"The requested Clean Up preview shell must be active before capture\");\n"
              "        shell.bot().button(\"Finish\");\n"
              "        shell.bot().button(\"Cancel\");\n"
              "        capture(shell, helpBundle, fileName);\n"
              "        System.out.println(\"[help-screenshots] Captured real Clean Up preview: \" + fileName);\n"
              "    }\n\n"
              "    private static void deleteGeneratedScreenshot(String helpBundle, String fileName) throws IOException {\n"
              "        Files.deleteIfExists(outputRoot.resolve(helpBundle).resolve(\"images\").resolve(fileName));\n"
              "    }\n\n"
              "    private static String visibleShells() {\n"
              "        return java.util.Arrays.stream(bot.shells()).filter(SWTBotShell::isOpen)\n"
              "                .map(SWTBotShell::getText).toList().toString();\n"
              "    }\n\n"
              + capture_anchor
          )
          replace_once(test, capture_anchor, capture_helpers)
          replace_once(
              test,
              "    private static void closeDialogIfOpen() {\n"
              "        try {\n"
              "            SWTBotShell active = bot.activeShell();\n"
              "            SWTBotShell workbench = workbenchShell();\n"
              "            if (active.widget != workbench.widget) {\n"
              "                active.close();\n"
              "            }\n"
              "        } catch (WidgetNotFoundException exception) {\n"
              "            // Workbench already closed.\n"
              "        }\n"
              "    }",
              "    private static void closeAllDialogs() {\n"
              "        try {\n"
              "            SWTBotShell workbench = workbenchShell();\n"
              "            for (SWTBotShell shell : bot.shells()) {\n"
              "                if (shell.widget == workbench.widget || shell.widget.isDisposed()) {\n"
              "                    continue;\n"
              "                }\n"
              "                UIThreadRunnable.syncExec(shell.display, new VoidResult() {\n"
              "                    @Override\n"
              "                    public void run() {\n"
              "                        if (!shell.widget.isDisposed()) {\n"
              "                            shell.widget.close();\n"
              "                        }\n"
              "                    }\n"
              "                });\n"
              "            }\n"
              "            workbench.activate();\n"
              "            bot.sleep(200);\n"
              "        } catch (WidgetNotFoundException exception) {\n"
              "            // Workbench already closed.\n"
              "        }\n"
              "    }",
          )

          pom = Path("sandbox_usage_view_test/pom.xml")
          replace_once(
              pom,
              "\t\t\t\t\t\t\t<showEclipseLog>true</showEclipseLog>\n"
              "\t\t\t\t\t\t\t<failIfNoTests>true</failIfNoTests>\n"
              "\t\t\t\t\t\t\t<appArgLine>-nl en</appArgLine>",
              "\t\t\t\t\t\t\t<showEclipseLog>true</showEclipseLog>\n"
              "\t\t\t\t\t\t\t<failIfNoTests>true</failIfNoTests>\n"
              "\t\t\t\t\t\t\t<forkedProcessTimeoutInSeconds>300</forkedProcessTimeoutInSeconds>\n"
              "\t\t\t\t\t\t\t<appArgLine>-nl en</appArgLine>",
          )
          ET.parse(pom)
          PY
          rm .github/patches/pr1464-screenshot-contract.patch
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Generate and verify the real coordinated Cleanup preview"
          git push origin "HEAD:${HEAD_BRANCH}"
