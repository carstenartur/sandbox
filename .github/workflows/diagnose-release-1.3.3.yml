name: Diagnose release 1.3.3 failure

on:
  push:
    branches:
      - diagnose-release-1.3.3
    paths:
      - .github/workflows/diagnose-release-1.3.3.yml

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v6
        with:
          ref: diagnose-release-1.3.3

      - name: Extract failed release log
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: diagnose-release-1.3.3
          RUN_ID: '30211408755'
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$REPOSITORY" --log-failed > /tmp/full.log
          {
            echo '=== MATCHED FAILURE LINES ==='
            grep -n -E '\[ERROR\]|BUILD FAILURE|Failed to execute goal|There are test failures|Tests run:|Failures:|Errors:|Caused by:|OutOfMemoryError|Killed|Process completed with exit code' /tmp/full.log | tail -n 250 || true
            echo
            echo '=== FINAL 250 LINES ==='
            tail -n 250 /tmp/full.log
          } > .github/release-failure-1.3.3.txt

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/release-failure-1.3.3.txt
          git commit -m 'Record release 1.3.3 failure details'
          git push origin "HEAD:refs/heads/${BRANCH}"
