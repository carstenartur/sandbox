name: Runtime mathematics source maintenance
on:
  push:
    branches: [diagnostic/runtime-math-edit-20261009]
permissions:
  contents: read
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cf08533eaa7e1b438ccd3f9b02ec6c410325106c
      - name: Update the existing regression without weakening its no-change assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cf08533eaa7e1b438ccd3f9b02ec6c410325106c
          python3 - <<'PY'
          from pathlib import Path
          root = Path('sandbox_math_cleanup_test/src/org/sandbox/jdt/math/tests')
          path = root/'JavaComputationRoundTripTest.java'
          text = path.read_text()
          old = 'Assertions.assertTrue(var2.diagnostics().stream().anyMatch(var0 -> var0.message().contains("GENERATED_REGION_INVALID")));'
          new = 'Assertions.assertTrue(var2.diagnostics().stream().anyMatch(var0 -> var0.code().equals("CONSTANT_EXPRESSION_PRESERVED")));'
          assert text.count(old) == 1
          text = text.replace(old, new).replace('void generatedWrapperMustPreserveConstantVariableUseOutsideTheRegion()', 'void constantVariableUsedBySwitchIsPreservedBeforeGeneration()')
          path.write_text(text)
          path = root/'BouncyCastleRuntimeCorpusIT.java'
          text = path.read_text().replace('import java.util.ArrayList;\n', '').replace('Path before = write(caseOutput.resolve("before").resolve(relative), original);', 'write(caseOutput.resolve("before").resolve(relative), original);')
          path.write_text(text)
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sandbox_math_cleanup_test/src
          git commit -m 'test: retain constant switch labels before generating any replacement' -m 'Keep the no-change contract and require the explicit constant-preservation diagnostic. AI-assisted.'
          git push origin HEAD:refs/heads/build/runtime-math-integration-20261009
          git rev-parse HEAD
