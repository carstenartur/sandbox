name: Runtime mathematics source qualification
on:
  push:
    branches: [diagnostic/runtime-math-edit-20261009]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9298c4bf474662602297057b4969e315ec552d79
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bcgit/bc-java
          ref: c314b9cdffa3958a0eff5344f8fdcdb0181ed830
          path: bouncy-castle
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
          cache: maven
          cache-dependency-path: source/**/pom.xml
      - name: Commit ordinary test corrections before exact-source verification
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9298c4bf474662602297057b4969e315ec552d79
          python3 - <<'PY'
          from pathlib import Path
          root = Path('sandbox_math_cleanup_test/src/org/sandbox/jdt/math/tests')
          path = root/'JavaComputationRoundTripTest.java'
          text = path.read_text()
          old = 'Assertions.assertTrue(var2.diagnostics().stream().anyMatch(var0 -> var0.message().contains("GENERATED_REGION_INVALID")));'
          new = 'Assertions.assertTrue(var2.diagnostics().stream().anyMatch(var0 -> var0.code().equals("CONSTANT_EXPRESSION_PRESERVED")));'
          assert text.count(old) == 1
          text = text.replace(old, new).replace('void generatedWrapperMustPreserveConstantVariableUseOutsideTheRegion()', 'void constantVariableUsedBySwitchIsPreservedBeforeGeneration()')
          path.write_text(text)
          path = root/'BouncyCastleRuntimeCorpusIT.java'
          text = path.read_text().replace('import java.util.ArrayList;\n', '').replace('Path before = write(caseOutput.resolve("before").resolve(relative), original);', 'write(caseOutput.resolve("before").resolve(relative), original);')
          old = 'Files.createDirectories(path.getParent());'
          assert text.count(old) == 1
          text = text.replace(old, 'Path parent = path.getParent();\n        if (parent != null) Files.createDirectories(parent);')
          path.write_text(text)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sandbox_math_cleanup_test/src
          git commit -m 'test: qualify constant preservation and full production digest rewrites' -m 'Preserve no-change assertions; handle parentless output paths. AI-assisted.'
          git push origin HEAD:refs/heads/build/runtime-math-qualified-${{ github.run_id }}
          git rev-parse HEAD
      - name: Run the complete default mathematics module
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if ! xvfb-run --auto-servernum ./mvnw --batch-mode --no-transfer-progress \
            -pl sandbox_target,sandbox_math_cleanup,sandbox_math_cleanup_test -am verify \
            > "$RUNNER_TEMP/math-regressions.log" 2>&1; then
            tail -100 "$RUNNER_TEMP/math-regressions.log"; exit 1
          fi
          cp -a sandbox_math_cleanup_test/target/surefire-reports "$RUNNER_TEMP/default-math-reports"
          grep -E 'Tests run:|BUILD SUCCESS' "$RUNNER_TEMP/math-regressions.log" | tail -35
      - name: Qualify unchanged complete production files and original upstream tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if ! bash qa/math-optimization/runtime-bouncy.sh "$GITHUB_WORKSPACE/bouncy-castle" "$RUNNER_TEMP/bc-runtime" \
            > "$RUNNER_TEMP/bc-runtime.log" 2>&1; then
            tail -180 "$RUNNER_TEMP/bc-runtime.log"
            find "$RUNNER_TEMP/bc-runtime/results" -name diagnostics.txt -print -exec cat {} \;
            exit 1
          fi
          grep -E 'BC_RUNTIME_PASS|Tests run:|BUILD SUCCESS' "$RUNNER_TEMP/bc-runtime.log"
          find "$RUNNER_TEMP/bc-runtime/results" -name qualification.properties -print -exec cat {} \;
          find "$RUNNER_TEMP/bc-runtime/results" -name '*.patch' -print -exec cat {} \;
      - name: Retain actual successful patches and source-bound verification evidence
        working-directory: source
        shell: bash
        env:
          QUALIFICATION_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, shutil, json, xml.etree.ElementTree as ET
          run = pathlib.Path(os.environ['RUNNER_TEMP'])/'bc-runtime'
          target = pathlib.Path('qa/math-optimization/runtime-evidence')
          target.mkdir(parents=True, exist_ok=True)
          totals = dict.fromkeys(('tests','failures','errors','skipped'), 0)
          for path in (pathlib.Path(os.environ['RUNNER_TEMP'])/'default-math-reports').glob('TEST-*.xml'):
              element = ET.parse(path).getroot()
              for k in totals: totals[k] += int(element.get(k,'0'))
          assert totals['tests'] >= 166 and not any(totals[k] for k in ('failures','errors','skipped')), totals
          for name in ('MD4Digest','RIPEMD160Digest','SM3Digest','SHA256Digest'):
              case = run/'results'/name
              receipt = case/'qualification.properties'
              assert receipt.exists() and receipt.read_text().startswith('status=PASS\n'), name
              dest = target/name
              dest.mkdir(exist_ok=True)
              for filename in ('qualification.properties', name+'.patch', 'diagnostics.txt','independent-proof-and-cost.txt'):
                  shutil.copy2(case/filename, dest/filename)
          shutil.copy2(run/'run.properties', target/'run.properties')
          shutil.copy2(run/'sdk-qualification.json', target/'sdk-qualification.json')
          (target/'verification.json').write_text(json.dumps({'workflow':os.environ['QUALIFICATION_RUN'],
              'defaultMathSuite':totals,'productionClasses':4,'changedMethods':6,
              'upstreamTestsExecuted':'original and generated', 'completeDigestComparisons':624,
              'speedup':'not measured','constantTime':'not certified'},indent=2)+'\n')
          for license in ('LICENSE.html','LICENSE.md','LICENSE'):
              if (run/license).exists(): shutil.copy2(run/license,target/('bouncy-castle-'+license))
          PY
          git add qa/math-optimization/runtime-evidence
          git commit -m 'test: retain verified Bouncy Castle runtime patches and qualification receipts' \
            -m 'Actual registered math pipeline output; original upstream tests and 624 complete digest comparisons. No speedup or constant-time claim. AI-assisted.'
          git push origin HEAD:refs/heads/build/runtime-math-evidence-${{ github.run_id }}
          git rev-parse HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: runtime-math-qualified-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/math-regressions.log
            ${{ runner.temp }}/default-math-reports/**
            ${{ runner.temp }}/bc-runtime.log
            ${{ runner.temp }}/bc-runtime/**
            source/sandbox_math_cleanup_test/target/surefire-reports/**
            source/sandbox_math_cleanup_test/target/work/data/.metadata/.log
