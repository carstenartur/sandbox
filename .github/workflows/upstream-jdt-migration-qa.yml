name: Upstream JDT migration QA

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'qa/upstream-jdt/**'
      - 'sandbox_oomph/jdt-migration-qa.setup'
      - 'sandbox_oomph/jdt-migration-qa.configuration.setup'
      - 'sandbox_cleanup_application/**'
      - 'sandbox_common_core/**'
      - 'sandbox_junit_cleanup/**'
      - 'sandbox_junit_cleanup_test/**'
      - '.github/workflows/upstream-jdt-migration-qa.yml'
  workflow_dispatch:
    inputs:
      run_baseline:
        description: Execute only the pinned upstream baseline tests
        required: true
        default: false
        type: boolean
      run_full_migration:
        description: Build Sandbox and produce complete JDT Core/JUnit 3 before/after migration evidence
        required: true
        default: true
        type: boolean
      run_jdt_ui_migration:
        description: Build Sandbox and produce dedicated real JDT UI/JUnit 4 migration evidence
        required: true
        default: true
        type: boolean
      jdt_ui_mode:
        description: JDT UI migration policy to verify
        required: true
        default: strict
        type: choice
        options:
          - strict
          - best-effort
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-contract:
    name: Validate the pinned Oomph and evidence contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Sandbox
        uses: actions/checkout@v7

      - name: Validate Oomph, JDT Core, JDT UI, corpus and evidence comparators
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 qa/upstream-jdt/verify_contract.py
          python3 qa/upstream-jdt/verify_jdt_ui_contract.py

      - name: Verify repository whitespace
        run: git diff --check

  upstream-baseline:
    name: Verify pinned JDT checkout and baseline tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_baseline == true && inputs.run_full_migration != true
    needs: validate-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Sandbox
        uses: actions/checkout@v7
        with:
          path: sandbox

      - name: Checkout JDT Core R4_40
        uses: actions/checkout@v7
        with:
          repository: eclipse-jdt/eclipse.jdt.core
          ref: R4_40
          fetch-depth: 0
          path: upstream/eclipse.jdt.core

      - name: Checkout JDT UI R4_40
        uses: actions/checkout@v7
        with:
          repository: eclipse-jdt/eclipse.jdt.ui
          ref: R4_40
          fetch-depth: 0
          path: upstream/eclipse.jdt.ui

      - name: Checkout JDT Core test binaries R4_40
        uses: actions/checkout@v7
        with:
          repository: eclipse-jdt/eclipse.jdt.core.binaries
          ref: R4_40
          fetch-depth: 0
          path: upstream/eclipse.jdt.core.binaries

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install headless Eclipse dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1

      - name: Verify exact Oomph-equivalent checkouts
        shell: bash
        run: |
          set -euo pipefail
          source sandbox/qa/upstream-jdt/pins.env
          test "$(git -C upstream/eclipse.jdt.core rev-parse 'HEAD^{commit}')" = "$PIN_JDT_CORE_COMMIT"
          test "$(git -C upstream/eclipse.jdt.ui rev-parse 'HEAD^{commit}')" = "$PIN_JDT_UI_COMMIT"
          test "$(git -C upstream/eclipse.jdt.core.binaries rev-parse 'HEAD^{commit}')" = "$PIN_JDT_CORE_BINARIES_COMMIT"
          git -C upstream/eclipse.jdt.core apply --check \
            "$GITHUB_WORKSPACE/sandbox/qa/upstream-jdt/overlays/jdt-core-r4_40-jupiter.patch"
          cat > upstream-baseline-provenance.json <<EOF
          {
            "evidenceType": "baseline-only-clean-workspace-mirror",
            "eclipseRelease": "$PIN_ECLIPSE_RELEASE",
            "eclipsePlatformVersion": "$PIN_ECLIPSE_PLATFORM_VERSION",
            "jdtCoreRef": "$PIN_JDT_CORE_REF",
            "jdtCoreCommit": "$PIN_JDT_CORE_COMMIT",
            "jdtUiRef": "$PIN_JDT_UI_REF",
            "jdtUiCommit": "$PIN_JDT_UI_COMMIT",
            "jdtCoreBinariesRef": "$PIN_JDT_CORE_BINARIES_REF",
            "jdtCoreBinariesCommit": "$PIN_JDT_CORE_BINARIES_COMMIT"
          }
          EOF

      - name: Apply the identical Jupiter build overlay
        run: >-
          git -C upstream/eclipse.jdt.core apply
          "$GITHUB_WORKSPACE/sandbox/qa/upstream-jdt/overlays/jdt-core-r4_40-jupiter.patch"

      - name: Run the pinned upstream baseline tests
        working-directory: upstream/eclipse.jdt.core
        run: >-
          xvfb-run --auto-servernum mvn
          --batch-mode
          --no-transfer-progress
          -U
          -Djava.io.tmpdir="${{ runner.temp }}/jdt-core-qa"
          -f org.eclipse.jdt.apt.tests/pom.xml
          clean verify

      - name: Require baseline JUnit XML evidence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' reports < <(find upstream/eclipse.jdt.core -type f \
            -path '*/target/surefire-reports/*.xml' -print0)
          if (( ${#reports[@]} == 0 )); then
            echo 'The pinned upstream baseline produced no Surefire XML reports.' >&2
            exit 1
          fi
          printf 'Found %d baseline reports.\n' "${#reports[@]}"

      - name: Upload pinned baseline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-jdt-r4_40-baseline-${{ github.run_number }}
          path: |
            upstream-baseline-provenance.json
            upstream/eclipse.jdt.core/**/target/surefire-reports/*.xml
            upstream/eclipse.jdt.core/**/target/work/data/.metadata/.log
          retention-days: 14
          if-no-files-found: warn

  full-migration:
    name: Build Sandbox and verify the real JDT Core/JUnit 3 migration
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_migration == true
    needs: validate-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MAVEN_OPTS: -Djava.awt.headless=true
    steps:
      - name: Checkout Sandbox
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: sandbox

      - name: Checkout JDT Core R4_40
        uses: actions/checkout@v7
        with:
          repository: eclipse-jdt/eclipse.jdt.core
          ref: R4_40
          fetch-depth: 0
          path: upstream/eclipse.jdt.core

      - name: Checkout JDT UI R4_40
        uses: actions/checkout@v7
        with:
          repository: eclipse-jdt/eclipse.jdt.ui
          ref: R4_40
          fetch-depth: 0
          path: upstream/eclipse.jdt.ui

      - name: Checkout JDT Core test binaries R4_40
        uses: actions/checkout@v7
        with:
          repository: eclipse-jdt/eclipse.jdt.core.binaries
          ref: R4_40
          fetch-depth: 0
          path: upstream/eclipse.jdt.core.binaries

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js for Sandbox CSS tests
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install build and headless Eclipse dependencies
        run: |
          npm install --global prettier stylelint stylelint-config-standard
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1

      - name: Verify exact pinned repositories
        shell: bash
        run: |
          set -euo pipefail
          source sandbox/qa/upstream-jdt/pins.env
          test "$(git -C upstream/eclipse.jdt.core rev-parse 'HEAD^{commit}')" = "$PIN_JDT_CORE_COMMIT"
          test "$(git -C upstream/eclipse.jdt.ui rev-parse 'HEAD^{commit}')" = "$PIN_JDT_UI_COMMIT"
          test "$(git -C upstream/eclipse.jdt.core.binaries rev-parse 'HEAD^{commit}')" = "$PIN_JDT_CORE_BINARIES_COMMIT"

      - name: Build and test the Sandbox product under test
        working-directory: sandbox
        run: >-
          xvfb-run --auto-servernum mvn
          -Pproduct
          --no-transfer-progress
          -e
          -V
          --batch-mode
          -Dtycho.localArtifacts=ignore
          clean verify

      - name: Locate the materialized Linux product
        id: product
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' launchers < <(find sandbox/sandbox_product/target/products -type f \
            -path '*/linux/gtk/x86_64/eclipse' -perm -u+x -print0)
          if (( ${#launchers[@]} != 1 )); then
            printf 'Expected one materialized Linux Eclipse launcher, found %d:\n' "${#launchers[@]}" >&2
            printf '%s\n' "${launchers[@]}" >&2
            exit 1
          fi
          launcher="$(realpath "${launchers[0]}")"
          echo "launcher=$launcher" >> "$GITHUB_OUTPUT"
          printf 'Using Sandbox product: %s\n' "$launcher"

      - name: Execute project-wide check, apply and identical upstream tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream-jdt-workspace" "$GITHUB_WORKSPACE/evidence"
          bash sandbox/qa/upstream-jdt/run-before-after.sh \
            --jdt-core "$GITHUB_WORKSPACE/upstream/eclipse.jdt.core" \
            --jdt-ui "$GITHUB_WORKSPACE/upstream/eclipse.jdt.ui" \
            --jdt-core-binaries "$GITHUB_WORKSPACE/upstream/eclipse.jdt.core.binaries" \
            --workspace "$RUNNER_TEMP/upstream-jdt-workspace" \
            --sandbox-eclipse "${{ steps.product.outputs.launcher }}" \
            --output "$GITHUB_WORKSPACE/evidence" \
            --allow-clean-workspace

      - name: Collect the imported workspace log
        if: always()
        shell: bash
        run: |
          mkdir -p evidence/eclipse-workspace
          if [[ -f "$RUNNER_TEMP/upstream-jdt-workspace/.metadata/.log" ]]; then
            cp "$RUNNER_TEMP/upstream-jdt-workspace/.metadata/.log" evidence/eclipse-workspace/.log
          fi

      - name: Upload complete upstream JDT Core migration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-jdt-migration-evidence-${{ github.run_number }}
          path: |
            evidence/**
            sandbox/**/target/surefire-reports/**
          retention-days: 30
          if-no-files-found: error

  jdt-ui-junit4-migration:
    name: Verify real JDT UI/JUnit 4 strict and best-effort migration
    if: github.event_name == 'workflow_dispatch' && inputs.run_jdt_ui_migration == true
    needs: validate-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MAVEN_OPTS: -Djava.awt.headless=true
    steps:
      - name: Checkout Sandbox
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: sandbox

      - name: Checkout the pinned JDT UI R4_40 corpus
        uses: actions/checkout@v7
        with:
          repository: eclipse-jdt/eclipse.jdt.ui
          ref: R4_40
          fetch-depth: 0
          path: upstream/eclipse.jdt.ui

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js for Sandbox CSS tests
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install build and headless Eclipse dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global prettier stylelint stylelint-config-standard
          shopt -s nullglob
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if grep -q 'packages\.microsoft\.com' "$source"; then
              echo "Disabling unrelated runner APT source: $source"
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1

      - name: Verify the exact pinned JDT UI commit
        shell: bash
        run: |
          set -euo pipefail
          source sandbox/qa/upstream-jdt/pins.env
          test "$(git -C upstream/eclipse.jdt.ui rev-parse 'HEAD^{commit}')" = "$PIN_JDT_UI_COMMIT"
          test "$(git -C upstream/eclipse.jdt.ui rev-parse "${PIN_JDT_UI_REF}^{commit}")" = "$PIN_JDT_UI_COMMIT"

      - name: Build and test the Sandbox product under test
        working-directory: sandbox
        run: >-
          xvfb-run --auto-servernum mvn
          -Pproduct
          --no-transfer-progress
          -e
          -V
          --batch-mode
          -Dtycho.localArtifacts=ignore
          clean verify

      - name: Locate the materialized Linux product
        id: jdt_ui_product
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' launchers < <(find sandbox/sandbox_product/target/products -type f \
            -path '*/linux/gtk/x86_64/eclipse' -perm -u+x -print0)
          if (( ${#launchers[@]} != 1 )); then
            printf 'Expected one materialized Linux Eclipse launcher, found %d:\n' "${#launchers[@]}" >&2
            printf '%s\n' "${launchers[@]}" >&2
            exit 1
          fi
          launcher="$(realpath "${launchers[0]}")"
          echo "launcher=$launcher" >> "$GITHUB_OUTPUT"
          printf 'Using Sandbox product: %s\n' "$launcher"

      - name: Execute the dedicated pinned JDT UI before/after tracks
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          requested='${{ inputs.jdt_ui_mode }}'
          if [[ "$requested" == both ]]; then
            modes=(strict best-effort)
          else
            modes=("$requested")
          fi
          mkdir -p "$GITHUB_WORKSPACE/jdt-ui-evidence"
          for mode in "${modes[@]}"; do
            workspace="$RUNNER_TEMP/jdt-ui-$mode-workspace"
            output="$GITHUB_WORKSPACE/jdt-ui-evidence/$mode"
            mkdir -p "$workspace" "$output"
            bash sandbox/qa/upstream-jdt/run-jdt-ui-before-after.sh \
              --jdt-ui "$GITHUB_WORKSPACE/upstream/eclipse.jdt.ui" \
              --workspace "$workspace" \
              --sandbox-eclipse "${{ steps.jdt_ui_product.outputs.launcher }}" \
              --mode "$mode" \
              --output "$output" \
              --allow-clean-workspace
          done

      - name: Collect imported JDT UI workspace logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jdt-ui-evidence/workspace-logs
          for workspace in "$RUNNER_TEMP"/jdt-ui-*-workspace; do
            [[ -d "$workspace" ]] || continue
            mode=$(basename "$workspace")
            if [[ -f "$workspace/.metadata/.log" ]]; then
              cp "$workspace/.metadata/.log" "jdt-ui-evidence/workspace-logs/$mode.log"
            fi
          done

      - name: Upload complete real JDT UI JUnit 4 migration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-jdt-ui-junit4-evidence-${{ github.run_number }}
          path: |
            jdt-ui-evidence/**
            sandbox/**/target/surefire-reports/**
          retention-days: 30
          if-no-files-found: error
