                  Files.writeString(definition, Files.readString(definition).replace("static final", "static"));
                  var result = analyze(ast, source, roots);
                  assertTrue(!result.changed() || result.replacements().stream().allMatch(r -> r.replacement().contains("getClass()")),
                      "The fresh declaration is mutable even though the caller's old binding was final: " + result.replacements());
              }
          ''' + anchor)
          replace(p, '''    private MathematicalAnalysis.Analysis analyze(String source,List<String> roots) {
                  var parser''', '''    private MathematicalAnalysis.Analysis analyze(String source,List<String> roots) {
                  return analyze(parse(source, roots), source, roots);
              }
              private CompilationUnit parse(String source, List<String> roots) {
                  var parser''')
          replace(p, '        var options = new MathCleanUpOptions(true, EnumSet.of', '''        return ast;
              }
              private MathematicalAnalysis.Analysis analyze(CompilationUnit ast, String source, List<String> roots) {
                  var options = new MathCleanUpOptions(true, EnumSet.of''')
          p = Path('sandbox_math_cleanup_test/src/org/sandbox/jdt/internal/ui/fix/MathematicalSourceContextCacheTest.java')
          replace(p, '''    private MathematicalQuickAssist.CachedAnalysis cached() throws Exception {
                  Path sources''', '''    @Test void aMidAnalysisSourceChangeIsNotCachedAsAnIndependentEmptyResult() throws Exception {
                  createSources();
                  var changed = analyze(new NullProgressMonitor() {
                      @Override public void done() {
                          Path definition = directory.resolve("sample/Constants.java");
                          try {
                              Files.writeString(definition, Files.readString(definition).replace("1fffffff", "1ffffffd"));
                          } catch (java.io.IOException failure) { throw new java.io.UncheckedIOException(failure); }
                      }
                  });
                  assertFalse(changed.changed());
                  assertTrue(changed.diagnostics().stream().anyMatch(d -> "SOURCE_DEPENDENCY_CHANGED".equals(d.code())),
                          changed.diagnostics().toString());
                  var cached = new MathematicalQuickAssist.CachedAnalysis(changed, ENVIRONMENT);
                  assertFalse(cached.matches(ENVIRONMENT, SOURCE, Map.of()), "An invalid dependency checkpoint must survive the empty result");
                  assertEquals(1, changed.sourceDependencies().receipts().size());
                  assertThrows(IllegalArgumentException.class, changed::newEdit);
                  var fresh = analyze(new NullProgressMonitor());
                  assertTrue(fresh.changed(), fresh.diagnostics().toString());
                  assertTrue(new MathematicalQuickAssist.CachedAnalysis(fresh, ENVIRONMENT).matches(ENVIRONMENT, SOURCE, Map.of()));
              }
              private MathematicalQuickAssist.CachedAnalysis cached() throws Exception {
                  createSources();
                  var analysis = analyze(new NullProgressMonitor());
                  assertTrue(analysis.changed(), analysis.diagnostics().toString());
                  assertEquals(1, analysis.sourceDependencies().receipts().size());
                  assertTrue(analysis.matches(SOURCE, Map.of()));
                  return new MathematicalQuickAssist.CachedAnalysis(analysis, ENVIRONMENT);
              }
              private void createSources() throws Exception {
                  Path sources''')
          replace(p, '        var parser = ASTParser.newParser(AST.getJLSLatest());', '''    }
              private MathematicalAnalysis.Analysis analyze(NullProgressMonitor monitor) {
                  var parser = ASTParser.newParser(AST.getJLSLatest());''')
          replace(p, '        var analysis = MathematicalAnalysis.analyze(ast, SOURCE, options, new NullProgressMonitor(), start,',
              '        return MathematicalAnalysis.analyze(ast, SOURCE, options, monitor, start,')
          replace(p, '''        assertTrue(analysis.changed(), analysis.diagnostics().toString());
                  assertEquals(1, analysis.sourceDependencies().receipts().size());
                  assertTrue(analysis.matches(SOURCE, Map.of()));
                  return new MathematicalQuickAssist.CachedAnalysis(analysis, ENVIRONMENT);
              }
          }''', '''    }
          }''')
          expected = {
              str(base / 'JavaRegionSourceRewriter.java'): 'acde9f9ca026bccf292750a52a032f9a55288680',
              str(base / 'JavaSourceContext.java'): '722a16172340fcdc7c9f3fddaa52e89ed656011e',
              str(base / 'MathematicalAnalysis.java'): '6be311a182862065ab7bb25ef304bf512747b8bb',
              str(tests / 'JavaRegionSourceRewriterTest.java'): '0fb38e6d80dbee7614928c6b5e132a426cdf8ff2',
              str(tests / 'SharedSourceReceiptTest.java'): '60ff00e7ca9142a1e4c788d80a8041b0cabdb95f',
              str(tests / 'SourceBackedConstantTest.java'): '570da7dc038c3a846dd74dcca4695e8d2ec10d11',
              str(p): 'e4b7fcdc0e67837c892bbd612e30601de5ff34cb',
          }
          for name, digest in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              if actual != digest:
                  raise ValueError('Does not match the locally compiled and tested blob: ' + name + ': ' + actual)
              print(actual, name)
          subprocess.run(['git', 'add', '--', *expected], check=True)
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != set(expected):
              raise ValueError('Unexpected changed paths')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix source snapshot races and mixed multiline mathematics edits' -m 'Preserve only transparent TextEdit grouping, recheck fresh constant modifiers and type, retain the first compilation-unit receipt, and keep invalid checkpoints on empty results. Seven exact source blobs match the locally compiled and tested files. Six new regression executions cover the four review findings; five fail on the old implementation and all pass after repair. The final local headless Equinox group passes 134 tests, including the pinned complete BLS source. This is a source-overlay qualification, not a full Tycho or distribution build.'
          result=maintenance/source-review-fixes-result-20261014
          test -z "$(git ls-remote --heads origin "refs/heads/$result")"
          git push origin "HEAD:refs/heads/$result"
