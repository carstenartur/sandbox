                  raise ValueError('Unexpected source before replacement: ' + str(path))
              path.write_text(text.replace(before, after))
          p = base / 'JavaRegionSourceRewriter.java'
          replace(p, '         if (edit.hasChildren() || edit.getLength() > 0) combined.addChild(edit);', '         appendEdits(combined, edit);')
          replace(p, '   private static ASTNode exactNode(', '''   /** Only grouping edits are transparent; copy/move/delete edits keep their nested semantics. */
             private static void appendEdits(MultiTextEdit target, TextEdit edit) {
                if (edit instanceof MultiTextEdit) {
                   for (TextEdit child : edit.removeChildren()) appendEdits(target, child);
                } else target.addChild(edit);
             }
          
             private static ASTNode exactNode(''')
          p = base / 'JavaSourceContext.java'
          replace(p, '''        if (depth > MAX_DEPTH || key == null || field.isRecovered() || !field.isField()
                          || !Modifier.isStatic(field.getModifiers()) || !Modifier.isFinal(field.getModifiers())
                          || !BIG_INTEGER.equals(field.getType().getQualifiedName())) return Optional.empty();''',
              '''        if (depth > MAX_DEPTH || key == null || !constantField(field)) return Optional.empty();''')
          replace(p, '            value = declaration instanceof VariableDeclarationFragment fragment && fragment.resolveBinding() != null',
              '            value = declaration instanceof VariableDeclarationFragment fragment && constantField(fragment.resolveBinding())')
          replace(p, '    private Optional<BigInteger> expression(Expression expression, Set<String> active, int depth) {', '''    /** Binding keys survive modifier changes; both the caller and the fresh definition must qualify. */
              private static boolean constantField(IVariableBinding field) {
                  return field != null && !field.isRecovered() && field.isField()
                      && Modifier.isStatic(field.getModifiers()) && Modifier.isFinal(field.getModifiers())
                      && !field.getType().isRecovered() && BIG_INTEGER.equals(field.getType().getQualifiedName());
              }
              private Optional<BigInteger> expression(Expression expression, Set<String> active, int depth) {''')
          replace(p, '            dependencies.put(identity, new Dependency(identity, digest, read));', '''            var previous = dependencies.putIfAbsent(identity, new Dependency(identity, digest, read));
                      if (previous != null && !previous.sha256().equals(digest)) throw new Unavailable();''')
          replace(base / 'MathematicalAnalysis.java', '            return new Analysis(List.of(), diagnostics, result.sourceDigest(), result.compilerOptions());', '''            return new Analysis(List.of(), diagnostics, result.sourceDigest(), result.compilerOptions(),
