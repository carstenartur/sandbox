name: Diagnose pinned JDT parent resolution
on:
  push:
    branches: [maintenance/help-1387-import-20261014]
    paths: [.github/workflows/native-help-import-1387.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b10dddc069de86305950c8ad59b3fb8e0daa82bf
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Record current parent metadata and artifact availability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/jdt-parent-diagnostic
          base=https://repo.eclipse.org/content/repositories/eclipse/org/eclipse/eclipse-platform-parent/4.41.0-SNAPSHOT
          for name in maven-metadata.xml eclipse-platform-parent-4.41.0-20260909.115535-202.pom; do
            code=$(curl --location --silent --show-error --max-time 60 -o "target/jdt-parent-diagnostic/$name" --write-out '%{http_code}' "$base/$name")
            printf '%s %s\n' "$code" "$base/$name" | tee -a target/jdt-parent-diagnostic/http-status.txt
          done
          if grep -q '<metadata' target/jdt-parent-diagnostic/maven-metadata.xml; then
            cat target/jdt-parent-diagnostic/maven-metadata.xml
          fi
      - name: Reproduce the unchanged pinned source build with forced snapshot refresh
        shell: bash
        env:
          MAVEN_ARGS: -ntp -U
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b10dddc069de86305950c8ad59b3fb8e0daa82bf
          set +e
          bash .github/scripts/build_patched_jdt_ui.sh "$RUNNER_TEMP/patched-jdt-ui" 2>&1 | tee target/jdt-parent-diagnostic/build-with-U.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > target/jdt-parent-diagnostic/build-exit.txt
          test -z "$(git status --porcelain --untracked-files=no)"
          exit "$result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pinned-jdt-parent-diagnostic-${{ github.run_id }}
          path: |
            target/jdt-parent-diagnostic
            ${{ runner.temp }}/patched-jdt-ui/provenance.json
          retention-days: 3
