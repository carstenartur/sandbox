name: One-time reviewed source fix publication
on:
  push:
    branches: [maintenance/help-1387-import-20261014]
    paths: [.github/workflows/native-help-import-1387.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish only the exact locally tested source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = carstenartur/sandbox
          test "$GITHUB_REF_NAME" = maintenance/help-1387-import-20261014
          tests='sandbox_math_cleanup_test/src/org/sandbox/jdt/internal/corext/fix/math'
          cp "$tests/JavaRegionSourceRewriterTest.java" "$RUNNER_TEMP/JavaRegionSourceRewriterTest.java"
          cp "$tests/SharedSourceReceiptTest.java" "$RUNNER_TEMP/SharedSourceReceiptTest.java"
          git checkout --detach e8f3f9f7f2d4ca3a0c30ebbfaf701b14ff97880c
          test "$(git rev-parse HEAD^{tree})" = 65d25b99b3de44994ef7370b341bbc6d83d15556
          cp "$RUNNER_TEMP/JavaRegionSourceRewriterTest.java" "$tests/JavaRegionSourceRewriterTest.java"
          cp "$RUNNER_TEMP/SharedSourceReceiptTest.java" "$tests/SharedSourceReceiptTest.java"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = Path('sandbox_math_cleanup/src/org/sandbox/jdt/internal/corext/fix/math')
          tests = Path('sandbox_math_cleanup_test/src/org/sandbox/jdt/internal/corext/fix/math')
          def replace(path, before, after):
              text = path.read_text()
