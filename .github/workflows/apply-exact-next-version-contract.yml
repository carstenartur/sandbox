name: Apply optional exact next-version contract

on:
  push:
    branches: [ fix/derive-release-versions ]
    paths:
      - '.github/workflows/apply-exact-next-version-contract.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/derive-release-versions
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply focused release input migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          release = Path('.github/workflows/deploy-release.yml')
          text = release.read_text(encoding='utf-8')

          old_inputs = """      next_version_increment:
        description: Select how the development version advances after this release
"""
          new_inputs = """      next_development_version:
        description: Optional exact next version (X.Y.Z-SNAPSHOT); leave empty to use the increment choice
        required: false
        type: string
        default: ''
      next_version_increment:
        description: Select the conventional next version when no exact version is supplied
"""
          if text.count(old_inputs) != 1:
              raise SystemExit('Expected exactly one next-version input block')
          text = text.replace(old_inputs, new_inputs)

          old_env = """        env:
          NEXT_VERSION_INCREMENT: ${{ github.event.inputs.next_version_increment }}
"""
          new_env = """        env:
          EXACT_NEXT_VERSION: ${{ github.event.inputs.next_development_version }}
          NEXT_VERSION_INCREMENT: ${{ github.event.inputs.next_version_increment }}
"""
          if text.count(old_env) != 1:
              raise SystemExit('Expected exactly one release-plan environment block')
          text = text.replace(old_env, new_env)

          old_dispatch = """          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            release_version="${current_version%-SNAPSHOT}"
            next_increment="$NEXT_VERSION_INCREMENT"
          else
"""
          new_dispatch = """          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            release_version="${current_version%-SNAPSHOT}"
            exact_next=$(python3 - <<'PY_EXACT'
          import os
          print(os.environ.get('EXACT_NEXT_VERSION', '').strip())
          PY_EXACT
            )
            next_increment="$NEXT_VERSION_INCREMENT"
          else
            exact_next=""
"""
          if text.count(old_dispatch) != 1:
              raise SystemExit('Expected exactly one dispatch resolution block')
          text = text.replace(old_dispatch, new_dispatch)

          old_calculation = """          IFS='.' read -r major minor patch <<< "$release_version"
          case "$next_increment" in
            patch)
              next_snapshot="${major}.${minor}.$((patch + 1))-SNAPSHOT"
              next_release="${major}.${minor}.$((patch + 1))"
              ;;
            minor)
              next_snapshot="${major}.$((minor + 1)).0-SNAPSHOT"
              next_release="${major}.$((minor + 1)).0"
              ;;
            major)
              next_snapshot="$((major + 1)).0.0-SNAPSHOT"
              next_release="$((major + 1)).0.0"
              ;;
            *)
              echo "::error::Unsupported next_version_increment '$next_increment'."
              exit 1
              ;;
          esac
"""
          new_calculation = """          if [[ -n "$exact_next" ]]; then
            if ! [[ "$exact_next" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+-SNAPSHOT$ ]]; then
              echo "::error::next_development_version must use X.Y.Z-SNAPSHOT"
              exit 1
            fi
            next_snapshot="$exact_next"
            next_release="${exact_next%-SNAPSHOT}"
          else
            IFS='.' read -r major minor patch <<< "$release_version"
            case "$next_increment" in
              patch)
                next_snapshot="${major}.${minor}.$((patch + 1))-SNAPSHOT"
                next_release="${major}.${minor}.$((patch + 1))"
                ;;
              minor)
                next_snapshot="${major}.$((minor + 1)).0-SNAPSHOT"
                next_release="${major}.$((minor + 1)).0"
                ;;
              major)
                next_snapshot="$((major + 1)).0.0-SNAPSHOT"
                next_release="$((major + 1)).0.0"
                ;;
              *)
                echo "::error::Unsupported next_version_increment '$next_increment'."
                exit 1
                ;;
            esac
          fi

          RELEASE_VERSION="$release_version" NEXT_SNAPSHOT="$next_snapshot" python3 - <<'PY_COMPARE'
          import os
          release = tuple(map(int, os.environ['RELEASE_VERSION'].split('.')))
          next_version = tuple(
              map(int, os.environ['NEXT_SNAPSHOT'].removesuffix('-SNAPSHOT').split('.'))
          )
          if next_version <= release:
              raise SystemExit(
                  f"::error::Next development version {os.environ['NEXT_SNAPSHOT']} "
                  f"must be newer than release {os.environ['RELEASE_VERSION']}"
              )
          PY_COMPARE
"""
          if text.count(old_calculation) != 1:
              raise SystemExit('Expected exactly one next-version calculation block')
          text = text.replace(old_calculation, new_calculation)
          release.write_text(text, encoding='utf-8')

          validation = Path('.github/workflows/release-workflow-validation.yml')
          checks = validation.read_text(encoding='utf-8')
          checks = checks.replace(
              "              '      next_version_increment:\\n',\n",
              "              '      next_development_version:\\n',\n"
              "              'Optional exact next version (X.Y.Z-SNAPSHOT)',\n"
              "              '      next_version_increment:\\n',\n",
          )
          checks = checks.replace(
              "              'NEXT_VERSION_INCREMENT: ${{ github.event.inputs.next_version_increment }}',\n",
              "              'EXACT_NEXT_VERSION: ${{ github.event.inputs.next_development_version }}',\n"
              "              'NEXT_VERSION_INCREMENT: ${{ github.event.inputs.next_version_increment }}',\n"
              "              'next_development_version must use X.Y.Z-SNAPSHOT',\n"
              "              'must be newer than release',\n",
          )
          checks = checks.replace(
              "              '      next_development_version:\\n',\n",
              "",
              1,
          )
          checks = checks.replace(
              "              '${{ inputs.next_development_version }}',\n",
              "",
          )
          validation.write_text(checks, encoding='utf-8')
          PY

          rm .github/workflows/apply-exact-next-version-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-release.yml \
            .github/workflows/release-workflow-validation.yml \
            .github/workflows/apply-exact-next-version-contract.yml
          git commit -m 'Preserve optional exact next development versions'
          git push origin HEAD:fix/derive-release-versions
