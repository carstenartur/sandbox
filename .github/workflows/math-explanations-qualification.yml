name: Verify mathematics explanations
on:
  push:
    branches: [diagnostic/math-explanations-20261010]
permissions:
  contents: read
concurrency:
  group: math-explanations-qualification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAVEN_OPTS: -Djava.awt.headless=false
      NO_AT_BRIDGE: '1'
      GDK_BACKEND: x11
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 868076b95a050179121050c5fe5b323b4290fea7
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
          cache: maven
      - uses: ./.github/actions/verify-eclipse-desktop-runtime
      - name: Verify exact source and full mathematics module
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 868076b95a050179121050c5fe5b323b4290fea7
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          xvfb-run -a ./mvnw -B -ntp -pl sandbox_target,sandbox_math_cleanup,sandbox_math_cleanup_test -am verify > "$RUNNER_TEMP/math-review.log" 2>&1 || { tail -95 "$RUNNER_TEMP/math-review.log"; exit 1; }
          grep -E 'Tests run:|BUILD SUCCESS' "$RUNNER_TEMP/math-review.log" | tail -35
      - name: Independently exercise the native effective profile regression
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1600x1200x24' ./mvnw -B -ntp -Dsandbox.tycho.linux-only=true -Dtycho.localArtifacts=ignore -f sandbox_help_build/pom.xml -Phelp-screenshots '-Dhelp.screenshot.testClass=org.sandbox.jdt.ui.helper.views.MathematicsHelpScreenshotsSWTBotTest#profileRecordsEveryRegisteredMathematicsOption' verify > "$RUNNER_TEMP/help-profile-review.log" 2>&1 || { tail -85 "$RUNNER_TEMP/help-profile-review.log"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: math-review-regressions-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/math-review.log
            ${{ runner.temp }}/help-profile-review.log
            sandbox_math_cleanup_test/target/surefire-reports/**
            sandbox_eclipse_help_swtbot_test/target/surefire-reports/**
