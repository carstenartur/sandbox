name: Recover Release Handoff

# Recover the next-development PR if a release was published but its handoff
# was interrupted. The published tag already identifies the stable release.
on:
  workflow_run:
    workflows: [ 'Release Workflow' ]
    types: [ completed ]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-handoff-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
  SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}

jobs:
  handoff:
    name: Recover the next-development PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin

      - name: Verify pinned Maven Wrapper
        run: ./mvnw --batch-mode --no-transfer-progress --version

      - name: Discover and verify the published release
        run: |
          set -euo pipefail
          artifact_name=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[].name' \
            | grep -E "^release-verification-[0-9]+\\.[0-9]+\\.[0-9]+-${SOURCE_RUN_ID}$" \
            | head -n 1 || true)
          if [[ -z "$artifact_name" ]]; then
            echo "No verified release artifact belongs to workflow run ${SOURCE_RUN_ID}; no handoff is permitted."
            exit 0
          fi

          release_version=${artifact_name#release-verification-}
          release_version=${release_version%-${SOURCE_RUN_ID}}
          if ! [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version recovered from artifact '$artifact_name'."
            exit 1
          fi

          release_fields=$(gh release view "v${release_version}" \
            --json tagName,isDraft,isPrerelease \
            --jq '[.tagName, .isDraft, .isPrerelease] | @tsv' 2>/dev/null || true)
          if [[ -z "$release_fields" ]]; then
            echo "Release v${release_version} is not published; no handoff is permitted."
            exit 0
          fi
          IFS=$'\t' read -r actual_tag is_draft is_prerelease <<< "$release_fields"
          if [[ "$actual_tag" != "v${release_version}" \
              || "$is_draft" != false || "$is_prerelease" != false ]]; then
            echo "::error::Release identity is not a published stable release: tag='$actual_tag', draft='$is_draft', prerelease='$is_prerelease'."
            exit 1
          fi

          git fetch --force origin "refs/tags/v${release_version}:refs/tags/v${release_version}"
          release_commit=$(git rev-parse "v${release_version}^{commit}")

          requested_next=''
          if [[ "$SOURCE_BRANCH" == release-request/* ]] \
              && git ls-remote --exit-code origin "refs/heads/$SOURCE_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
            if git cat-file -e "refs/remotes/origin/$SOURCE_BRANCH:.github/next-development-version" \
                2>/dev/null; then
              requested_next=$(git show \
                "refs/remotes/origin/$SOURCE_BRANCH:.github/next-development-version" \
                | tr -d '[:space:]')
            fi
          fi

          if [[ -n "$requested_next" ]]; then
            if ! [[ "$requested_next" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
              echo "::error::Invalid requested next development version '$requested_next'."
              exit 1
            fi
            next=$requested_next
          else
            IFS='.' read -r major minor patch <<< "$release_version"
            next="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          fi
          next_release=${next%-SNAPSHOT}
          highest=$(printf '%s\n%s\n' "$release_version" "$next_release" | sort -V | tail -n 1)
          if [[ "$next_release" == "$release_version" || "$highest" != "$next_release" ]]; then
            echo "::error::Next development version '$next' must be newer than release '$release_version'."
            exit 1
          fi

          {
            echo "RELEASE_VERSION=$release_version"
            echo "RELEASE_COMMIT=$release_commit"
            echo "NEXT_SNAPSHOT=$next"
            echo "NEXT_RELEASE=$next_release"
          } >> "$GITHUB_ENV"

      - name: Create missing next-development pull request
        if: env.RELEASE_VERSION != ''
        run: |
          set -euo pipefail
          next_branch="release/prepare-next-${NEXT_SNAPSHOT}"
          existing_next=$(gh pr list --state open --base main --head "$next_branch" \
            --json number --jq '.[0].number // empty')
          if [[ -n "$existing_next" ]]; then
            echo "Next-development PR #${existing_next} already exists."
            exit 0
          fi

          current_version=$(./mvnw -q -DforceStdout help:evaluate \
            -Dexpression=project.version | tail -n 1)
          if [[ "$current_version" == "$NEXT_SNAPSHOT" ]]; then
            echo "main already reports '$NEXT_SNAPSHOT'."
            exit 0
          fi
          if [[ "$current_version" != "${RELEASE_VERSION}-SNAPSHOT" && "$current_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::main reports '$current_version'; it cannot recover the transition from '$RELEASE_VERSION'."
            exit 1
          fi

          main_commit=$(git rev-parse HEAD)
          release_base=$(git rev-parse "${RELEASE_COMMIT}^")
          if ! git merge-base --is-ancestor "$release_base" "$main_commit"; then
            echo "::error::Current main does not contain the source of the published release."
            exit 1
          fi

          # Match the normal handoff if main has not moved. Keep newer main commits otherwise.
          handoff_base="$main_commit"
          if [[ "$main_commit" == "$release_base" ]]; then
            handoff_base="$RELEASE_COMMIT"
          fi
          git checkout -B "$next_branch" "$handoff_base"
          tycho_version=$(./mvnw -q -DforceStdout help:evaluate \
            -Dexpression=tycho-version | tail -n 1)
          ./mvnw org.eclipse.tycho:tycho-versions-plugin:"$tycho_version":set-version \
            -DnewVersion="$NEXT_SNAPSHOT" -Pbenchmark,jacoco
          ./mvnw -f sandbox_cleanup_cli_dist/pom.xml versions:set \
            -DnewVersion="$NEXT_SNAPSHOT" -DgenerateBackupPoms=false
          ./mvnw -f sandbox-maven-plugin/pom.xml versions:set \
            -DnewVersion="$NEXT_SNAPSHOT" -DgenerateBackupPoms=false
          ./mvnw -f sandbox_oomph/pom.xml versions:set \
            -DnewVersion="$NEXT_SNAPSHOT" -DgenerateBackupPoms=false
          sed -i "s/next.release.version=.*/next.release.version=${NEXT_RELEASE}/" \
            release.properties

          actual=$(./mvnw -q -DforceStdout help:evaluate \
            -Dexpression=project.version | tail -n 1)
          if [[ "$actual" != "$NEXT_SNAPSHOT" ]]; then
            echo "::error::Prepared tree reports '$actual', expected '$NEXT_SNAPSHOT'."
            exit 1
          fi
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check

          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_main" != "$main_commit" ]]; then
            echo "::error::main moved while preparing the recovery handoff."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Version transitions only modify tracked metadata; publication scratch files stay untracked.
          git add -u -- ':!.github/workflows/'
          git commit -m "Prepare for next development iteration ${NEXT_SNAPSHOT}"
          remote_next=$(git ls-remote origin "refs/heads/$next_branch" | cut -f1)
          if [[ -z "$remote_next" ]]; then
            git push origin "$next_branch"
          else
            git fetch --no-tags origin "refs/heads/$next_branch"
            if [[ "$(git rev-parse FETCH_HEAD^)" != "$handoff_base" ]] || ! git diff --quiet HEAD FETCH_HEAD; then
              echo "::error::Existing branch '$next_branch' differs from the recovered transition."
              exit 1
            fi
          fi
          printf -v next_body '%s\n' \
            '## Next development iteration' \
            '' \
            "Advance to ${NEXT_SNAPSHOT} after publishing [v${RELEASE_VERSION}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${RELEASE_VERSION})." \
            "The verified release commit is ${RELEASE_COMMIT}." \
            '' \
            'This PR contains only the Tycho/Maven/OSGi/product version transition and the corresponding next.release.version update.'
          gh pr create \
            --title "Prepare for next development iteration ${NEXT_SNAPSHOT}" \
            --body "$next_body" \
            --base main --head "$next_branch"
          gh workflow run maven.yml --ref "$next_branch"
