name: Fix PR 1464 Java newline literals

on:
  push:
    branches:
      - feature/coordinated-cleanup-preview
    paths:
      - '.github/workflows/fix-pr1464-java-newline-literals.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore escaped Java newline literals
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsSWTBotTest.java')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'String affectedLabels = affectedFiles.cell(0, 0) + "\n" + affectedFiles.cell(1, 0);',
                  r'String affectedLabels = affectedFiles.cell(0, 0) + "\n" + affectedFiles.cell(1, 0);',
              ),
              (
                  'return String.join("\n---\n", collectText(shell.widget));',
                  r'return String.join("\n---\n", collectText(shell.widget));',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one malformed Java newline literal, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-pr1464-java-newline-literals.yml
          git diff --check

      - name: Commit the source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Carsten Hammer'
          git config user.email 'carsten.hammer@t-online.de'
          git add -A
          git commit -m 'Fix Java newline literals in coordinated preview test'
          git push origin "HEAD:${GITHUB_REF_NAME}"
