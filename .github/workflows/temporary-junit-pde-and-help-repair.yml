name: Temporary JUnit PDE and Help repair

on:
  push:
    branches:
      - docs/jdt-ui-junit4-qa-status
    paths:
      - .github/workflows/temporary-junit-pde-and-help-repair.yml

permissions:
  actions: read
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: docs/jdt-ui-junit4-qa-status
          fetch-depth: 0

      - name: Add atomic PDE manifest planning and its unit contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ec5ab80c489f6d615878ca25ed213813c97b2f4d"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/ProjectWideCodeCleanupApplication.java")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one occurrence, found {count}: {old[:100]!r}")
              text = text.replace(old, new)

          replace_once(
              "\tprivate static final int EXIT_OK= 0;\n\tprivate static final int EXIT_ERROR= 1;\n\tprivate static final int EXIT_CHANGES= 2;",
              "\tprivate static final int EXIT_OK= 0;\n\tprivate static final int EXIT_ERROR= 1;\n\tprivate static final int EXIT_CHANGES= 2;\n\n"
              "\tprivate static final String PDE_MANIFEST= \"META-INF/MANIFEST.MF\"; //$NON-NLS-1$\n"
              "\tprivate static final String JUNIT_ISOLATED_TYPE=\n"
              "\t\t\t\"org.junit.jupiter.api.parallel.Isolated\"; //$NON-NLS-1$\n"
              "\tprivate static final String JUNIT_PARALLEL_PACKAGE=\n"
              "\t\t\t\"org.junit.jupiter.api.parallel\"; //$NON-NLS-1$"
          )

          records = re.compile(
              r"\tprivate record SourceSnapshot\(ICompilationUnit unit, IFile file, Path path, String relativePath,\n"
              r"\t\t\tbyte\[\] before\) \{\n\t\}\n\n"
              r"\tprivate record ChangedSource\(SourceSnapshot source, byte\[\] after\) \{\n\t\}"
          )
          replacement = (
              "\tprivate record SourceSnapshot(ICompilationUnit unit, IFile file, Path path, String relativePath,\n"
              "\t\t\tbyte[] before) {\n\t}\n\n"
              "\tprivate record ResourceSnapshot(IFile file, Path path, String relativePath, byte[] before) {\n\t}\n\n"
              "\tprivate record ChangedFile(String relativePath, byte[] before, byte[] after) {\n\t}"
          )
          text, count = records.subn(replacement, text)
          if count != 1:
              raise SystemExit(f"Expected one snapshot-record block, found {count}")

          replace_once("\t\tList<ChangedSource> changed= new ArrayList<>();",
              "\t\tList<ChangedFile> changed= new ArrayList<>();")
          replace_once("\t\tList<SourceSnapshot> sources= List.of();\n\t\tMap<String, String> options= Map.of();",
              "\t\tList<SourceSnapshot> sources= List.of();\n"
              "\t\tList<ResourceSnapshot> resources= List.of();\n"
              "\t\tMap<String, String> options= Map.of();")
          replace_once("\t\t\tsources= snapshots(javaProject);",
              "\t\t\tsources= snapshots(javaProject);\n\t\t\tresources= resourceSnapshots(project);")

          old_sequence = (
              "\t\t\t\t\tpreserveOriginalLineDelimiters(sources);\n"
              "\t\t\t\t\trefresh(sources, monitor);\n"
              "\t\t\t\t\tchanged= changedSources(sources);"
          )
          new_sequence = (
              "\t\t\t\t\tpreserveOriginalLineDelimiters(sources);\n"
              "\t\t\t\t\tupdateProjectMetadata(sources, resources);\n"
              "\t\t\t\t\trefresh(sources, resources, monitor);\n"
              "\t\t\t\t\tchanged= changedFiles(sources, resources);"
          )
          if text.count(old_sequence) != 2:
              raise SystemExit(f"Expected two apply/check sequences, found {text.count(old_sequence)}")
          text = text.replace(old_sequence, new_sequence)
          replace_once("\t\t\t\t\trestore(sources, monitor, errors);",
              "\t\t\t\t\trestore(sources, resources, monitor, errors);")

          block = re.compile(
              r"\n\tprivate static void refresh\(List<SourceSnapshot> sources, IProgressMonitor monitor\).*?"
              r"\n\tprivate static void writeReport",
              re.S,
          )
          new_block = r'''
	private static List<ResourceSnapshot> resourceSnapshots(IProject project) throws IOException {
		IFile manifest= project.getFile(PDE_MANIFEST);
		if (!manifest.exists() || manifest.getLocation() == null) {
			return List.of();
		}
		Path path= manifest.getLocation().toFile().toPath().toAbsolutePath().normalize();
		return List.of(new ResourceSnapshot(manifest, path,
				manifest.getProjectRelativePath().toPortableString(), Files.readAllBytes(path)));
	}

	private static void updateProjectMetadata(List<SourceSnapshot> sources,
			List<ResourceSnapshot> resources) throws IOException {
		boolean isolatedIntroduced= false;
		for (SourceSnapshot source : sources) {
			byte[] after= Files.readAllBytes(source.path());
			if (!contains(source.before(), JUNIT_ISOLATED_TYPE) && contains(after, JUNIT_ISOLATED_TYPE)) {
				isolatedIntroduced= true;
				break;
			}
		}
		if (!isolatedIntroduced) {
			return;
		}
		for (ResourceSnapshot resource : resources) {
			if (!PDE_MANIFEST.equals(resource.relativePath())) {
				continue;
			}
			byte[] current= Files.readAllBytes(resource.path());
			byte[] updated= PdeManifestImportUpdater.addImport(current, JUNIT_PARALLEL_PACKAGE);
			if (!Arrays.equals(current, updated)) {
				Files.write(resource.path(), updated);
			}
			return;
		}
	}

	private static boolean contains(byte[] content, String token) {
		return new String(content, StandardCharsets.UTF_8).contains(token);
	}

	private static void refresh(List<SourceSnapshot> sources, List<ResourceSnapshot> resources,
			IProgressMonitor monitor) throws CoreException {
		for (SourceSnapshot source : sources) {
			source.file().refreshLocal(IResource.DEPTH_ZERO, monitor);
		}
		for (ResourceSnapshot resource : resources) {
			resource.file().refreshLocal(IResource.DEPTH_ZERO, monitor);
		}
	}

	private static List<ChangedFile> changedFiles(List<SourceSnapshot> sources,
			List<ResourceSnapshot> resources) throws IOException {
		List<ChangedFile> result= new ArrayList<>();
		for (SourceSnapshot source : sources) {
			byte[] after= Files.readAllBytes(source.path());
			if (!Arrays.equals(source.before(), after)) {
				result.add(new ChangedFile(source.relativePath(), source.before(), after));
			}
		}
		for (ResourceSnapshot resource : resources) {
			byte[] after= Files.readAllBytes(resource.path());
			if (!Arrays.equals(resource.before(), after)) {
				result.add(new ChangedFile(resource.relativePath(), resource.before(), after));
			}
		}
		result.sort(Comparator.comparing(ChangedFile::relativePath));
		return List.copyOf(result);
	}

	private static void restore(List<SourceSnapshot> sources, List<ResourceSnapshot> resources,
			IProgressMonitor monitor, List<String> errors) {
		for (SourceSnapshot source : sources) {
			restore(source.file(), source.path(), source.relativePath(), source.before(), monitor, errors);
		}
		for (ResourceSnapshot resource : resources) {
			restore(resource.file(), resource.path(), resource.relativePath(), resource.before(), monitor, errors);
		}
	}

	private static void restore(IFile file, Path path, String relativePath, byte[] before,
			IProgressMonitor monitor, List<String> errors) {
		try {
			Files.write(path, before);
			file.refreshLocal(IResource.DEPTH_ZERO, monitor);
		} catch (IOException | CoreException e) {
			errors.add("Cannot restore " + relativePath + ": " + e.getMessage()); //$NON-NLS-1$ //$NON-NLS-2$
		}
	}

	private static void writePatch(Path path, List<ChangedFile> changed) throws IOException {
		createParent(path);
		StringBuilder patch= new StringBuilder();
		for (ChangedFile source : changed) {
			String relative= source.relativePath();
			String before= new String(source.before(), StandardCharsets.UTF_8);
			String after= new String(source.after(), StandardCharsets.UTF_8);
			patch.append("--- a/").append(relative).append('\n'); //$NON-NLS-1$
			patch.append("+++ b/").append(relative).append('\n'); //$NON-NLS-1$
			String[] beforeLines= before.split("\\R", -1); //$NON-NLS-1$
			String[] afterLines= after.split("\\R", -1); //$NON-NLS-1$
			patch.append("@@ -1,").append(beforeLines.length).append(" +1,") //$NON-NLS-1$ //$NON-NLS-2$
					.append(afterLines.length).append(" @@\n"); //$NON-NLS-1$
			for (String line : beforeLines) {
				patch.append('-').append(line).append('\n');
			}
			for (String line : afterLines) {
				patch.append('+').append(line).append('\n');
			}
		}
		Files.writeString(path, patch.toString(), StandardCharsets.UTF_8);
	}

	private static void writeReport'''
          text, count = block.subn("\n" + new_block, text)
          if count != 1:
              raise SystemExit(f"Expected one resource helper block, found {count}")

          replace_once("\t\t\tMap<String, String> options, List<SourceSnapshot> sources, List<ChangedSource> changed,",
              "\t\t\tMap<String, String> options, List<SourceSnapshot> sources, List<ChangedFile> changed,")
          replace_once("changed.stream().map(item -> item.source().relativePath()).toList()",
              "changed.stream().map(ChangedFile::relativePath).toList()")

          path.write_text(text, encoding="utf-8")
          PY

          cat > sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/PdeManifestImportUpdater.java <<'JAVA'
          /*******************************************************************************
           * Copyright (c) 2026 Carsten Hammer.
           *
           * This program and the accompanying materials
           * are made available under the terms of the Eclipse Public License 2.0
           * which accompanies this distribution, and is available at
           * https://www.eclipse.org/legal/epl-2.0.
           *
           * SPDX-License-Identifier: EPL-2.0
           *******************************************************************************/
          package org.sandbox.jdt.core.cleanupapp;

          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Objects;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** Adds one package to the main OSGi {@code Import-Package} header without reformatting existing clauses. */
          public final class PdeManifestImportUpdater {

          	private static final String IMPORT_PACKAGE_HEADER= "Import-Package:"; //$NON-NLS-1$
          	private static final Pattern IMPORT_PACKAGE_PATTERN= Pattern.compile(
          			"(?m)^Import-Package:[^\\r\\n]*(?:\\r?\\n [^\\r\\n]*)*"); //$NON-NLS-1$
          	private static final Pattern MAIN_SECTION_SEPARATOR= Pattern.compile("\\r?\\n\\r?\\n"); //$NON-NLS-1$
          	private static final Pattern PACKAGE_NAME= Pattern.compile(
          			"[A-Za-z_][A-Za-z0-9_]*(?:\\.[A-Za-z_][A-Za-z0-9_]*)*"); //$NON-NLS-1$

          	private PdeManifestImportUpdater() {
          	}

          	public static byte[] addImport(byte[] original, String packageName) {
          		Objects.requireNonNull(original);
          		String content= new String(original, StandardCharsets.UTF_8);
          		String updated= addImport(content, packageName);
          		return content.equals(updated) ? original : updated.getBytes(StandardCharsets.UTF_8);
          	}

          	public static String addImport(String manifest, String packageName) {
          		Objects.requireNonNull(manifest);
          		Objects.requireNonNull(packageName);
          		if (!PACKAGE_NAME.matcher(packageName).matches()) {
          			throw new IllegalArgumentException("Invalid Java package name: " + packageName); //$NON-NLS-1$
          		}

          		int mainSectionEnd= mainSectionEnd(manifest);
          		Matcher header= IMPORT_PACKAGE_PATTERN.matcher(manifest.substring(0, mainSectionEnd));
          		String lineDelimiter= lineDelimiter(manifest);
          		if (header.find()) {
          			String physicalHeader= header.group();
          			String unfolded= physicalHeader.substring(IMPORT_PACKAGE_HEADER.length())
          					.replace("\r\n ", "").replace("\n ", ""); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$ //$NON-NLS-4$
          			if (containsPackage(unfolded, packageName)) {
          				return manifest;
          			}
          			String separator= physicalHeader.stripTrailing().endsWith(",") //$NON-NLS-1$
          					? lineDelimiter + " " : "," + lineDelimiter + " "; //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$
          			return manifest.substring(0, header.end()) + separator + packageName
          					+ manifest.substring(header.end());
          		}

          		String prefix= mainSectionEnd == 0 || isLineBreakBefore(manifest, mainSectionEnd)
          				? "" : lineDelimiter; //$NON-NLS-1$
          		return manifest.substring(0, mainSectionEnd) + prefix + IMPORT_PACKAGE_HEADER + " " //$NON-NLS-1$
          				+ packageName + manifest.substring(mainSectionEnd);
          	}

          	private static int mainSectionEnd(String manifest) {
          		Matcher separator= MAIN_SECTION_SEPARATOR.matcher(manifest);
          		return separator.find() ? separator.start() : manifest.length();
          	}

          	private static boolean isLineBreakBefore(String value, int offset) {
          		if (offset <= 0) {
          			return false;
          		}
          		char previous= value.charAt(offset - 1);
          		return previous == '\n' || previous == '\r';
          	}

          	private static String lineDelimiter(String manifest) {
          		return manifest.contains("\r\n") ? "\r\n" : "\n"; //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$
          	}

          	private static boolean containsPackage(String headerValue, String packageName) {
          		for (String clause : splitOutsideQuotes(headerValue, ',')) {
          			for (String segment : splitOutsideQuotes(clause, ';')) {
          				String candidate= segment.trim();
          				if (candidate.contains(":=") || candidate.indexOf('=') >= 0) { //$NON-NLS-1$
          					break;
          				}
          				if (packageName.equals(candidate)) {
          					return true;
          				}
          			}
          		}
          		return false;
          	}

          	private static List<String> splitOutsideQuotes(String value, char delimiter) {
          		List<String> result= new ArrayList<>();
          		int start= 0;
          		boolean quoted= false;
          		boolean escaped= false;
          		for (int index= 0; index < value.length(); index++) {
          			char current= value.charAt(index);
          			if (escaped) {
          				escaped= false;
          				continue;
          			}
          			if (quoted && current == '\\') {
          				escaped= true;
          				continue;
          			}
          			if (current == '"') {
          				quoted= !quoted;
          				continue;
          			}
          			if (!quoted && current == delimiter) {
          				result.add(value.substring(start, index));
          				start= index + 1;
          			}
          		}
          		result.add(value.substring(start));
          		return result;
          	}
          }
          JAVA

          cat > sandbox_cleanup_application_test/src/org/sandbox/jdt/core/cleanupapp/PdeManifestImportUpdaterTest.java <<'JAVA'
          /*******************************************************************************
           * Copyright (c) 2026 Carsten Hammer.
           *
           * This program and the accompanying materials
           * are made available under the terms of the Eclipse Public License 2.0
           * which accompanies this distribution, and is available at
           * https://www.eclipse.org/legal/epl-2.0.
           *
           * SPDX-License-Identifier: EPL-2.0
           *******************************************************************************/
          package org.sandbox.jdt.core.cleanupapp;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertSame;
          import static org.junit.jupiter.api.Assertions.assertThrows;

          import java.nio.charset.StandardCharsets;

          import org.junit.jupiter.api.Test;

          public class PdeManifestImportUpdaterTest {

          	private static final String PARALLEL_PACKAGE= "org.junit.jupiter.api.parallel"; //$NON-NLS-1$

          	@Test
          	public void addsImportToExistingFoldedHeaderWithoutReformatting() {
          		String manifest= """
          				Manifest-Version: 1.0
          				Bundle-SymbolicName: example
          				Import-Package: org.junit.jupiter.api,
          				 org.junit.jupiter.api.extension;version="[5.10,6.0)",
          				 org.junit.jupiter.params
          
          				"""; //$NON-NLS-1$
          		String expected= """
          				Manifest-Version: 1.0
          				Bundle-SymbolicName: example
          				Import-Package: org.junit.jupiter.api,
          				 org.junit.jupiter.api.extension;version="[5.10,6.0)",
          				 org.junit.jupiter.params,
          				 org.junit.jupiter.api.parallel
          
          				"""; //$NON-NLS-1$

          		assertEquals(expected, PdeManifestImportUpdater.addImport(manifest, PARALLEL_PACKAGE));
          	}

          	@Test
          	public void preservesCrLfAndAddsHeaderBeforeNamedSections() {
          		String manifest= "Manifest-Version: 1.0\r\nBundle-SymbolicName: example\r\n\r\n" //$NON-NLS-1$
          				+ "Name: section\r\nValue: retained\r\n"; //$NON-NLS-1$
          		String expected= "Manifest-Version: 1.0\r\nBundle-SymbolicName: example\r\n" //$NON-NLS-1$
          				+ "Import-Package: org.junit.jupiter.api.parallel\r\n\r\n" //$NON-NLS-1$
          				+ "Name: section\r\nValue: retained\r\n"; //$NON-NLS-1$

          		assertEquals(expected, PdeManifestImportUpdater.addImport(manifest, PARALLEL_PACKAGE));
          	}

          	@Test
          	public void existingAttributedImportIsByteIdentical() {
          		byte[] original= ("Manifest-Version: 1.0\n" //$NON-NLS-1$
          				+ "Import-Package: org.junit.jupiter.api.parallel;version=\"[5.10,6.0)\"\n") //$NON-NLS-1$
          						.getBytes(StandardCharsets.UTF_8);

          		assertSame(original, PdeManifestImportUpdater.addImport(original, PARALLEL_PACKAGE));
          	}

          	@Test
          	public void rejectsManifestInjectionThroughThePackageName() {
          		assertThrows(IllegalArgumentException.class,
          				() -> PdeManifestImportUpdater.addImport("Manifest-Version: 1.0\n", //$NON-NLS-1$
          						"org.junit.jupiter.api.parallel,evil")); //$NON-NLS-1$
          	}
          }
          JAVA

      - name: Adopt the reproducible Help screenshots from the failed comparison gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact=/tmp/generated-help-screenshots.zip
          destination=/tmp/generated-help-screenshots
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9712434100/zip" \
            --output "$artifact"
          rm -rf "$destination"
          mkdir -p "$destination"
          unzip -q "$artifact" -d "$destination"
          evidence="$destination/generated-help-screenshot-evidence"
          test -d "$evidence/files"
          (cd "$evidence/files" && sha256sum --check ../sha256.txt)
          cp -a "$evidence/files/." .

      - name: Commit the product fix and regenerated documentation evidence
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-junit-pde-and-help-repair.yml
          git diff --check
          test -z "$(git status --porcelain | grep -E '^\?\? ' | grep -v -E 'PdeManifestImportUpdater(Test)?\.java$' || true)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/ProjectWideCodeCleanupApplication.java \
            sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/PdeManifestImportUpdater.java \
            sandbox_cleanup_application_test/src/org/sandbox/jdt/core/cleanupapp/PdeManifestImportUpdaterTest.java \
            '*_help/images/*.png'
          git commit -m "Plan JUnit PDE imports and refresh Help screenshots"
          git push origin HEAD:docs/jdt-ui-junit4-qa-status
