name: Temporary apply JUnit PDE repair

on:
  push:
    branches:
      - docs/jdt-ui-junit4-qa-status
    paths:
      - .github/workflows/temporary-junit-pde-and-help-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the exact repair branch
        uses: actions/checkout@v7
        with:
          ref: docs/jdt-ui-junit4-qa-status
          fetch-depth: 0

      - name: Materialize the reviewed source repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=5293ec331762bee2c6f1f1bd5d4113fd821b1f94
          source_commit=9e683cae3ef910166131b703518911467873b711
          test "$(git rev-parse HEAD^)" = "$expected_parent"

          legacy=/tmp/temporary-junit-pde-and-help-repair.yml
          git show "$source_commit:.github/workflows/temporary-junit-pde-and-help-repair.yml" > "$legacy"

          awk '
            /python3 <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' "$legacy" > /tmp/apply-junit-pde-repair.py
          test -s /tmp/apply-junit-pde-repair.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/apply-junit-pde-repair.py')
          text = path.read_text(encoding='utf-8')
          old = '''if text.count(old_sequence) != 2:
              raise SystemExit(f"Expected two apply/check sequences, found {text.count(old_sequence)}")
          text = text.replace(old_sequence, new_sequence)'''
          new = '''if text.count(old_sequence) != 1:
              raise SystemExit(f"Expected one apply sequence, found {text.count(old_sequence)}")
          text = text.replace(old_sequence, new_sequence)
          nested_old_sequence = old_sequence.replace("\\t\\t\\t\\t\\t", "\\t\\t\\t\\t\\t\\t")
          nested_new_sequence = new_sequence.replace("\\t\\t\\t\\t\\t", "\\t\\t\\t\\t\\t\\t")
          if text.count(nested_old_sequence) != 1:
              raise SystemExit(f"Expected one check sequence, found {text.count(nested_old_sequence)}")
          text = text.replace(nested_old_sequence, nested_new_sequence)'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one obsolete sequence assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 /tmp/apply-junit-pde-repair.py

          extract_java() {
            local marker="$1"
            local target="$2"
            mkdir -p "$(dirname "$target")"
            awk -v marker="$marker" '
              index($0, marker) { capture=1; next }
              capture && /^          JAVA$/ { exit }
              capture { sub(/^          /, ""); print }
            ' "$legacy" > "$target"
            test -s "$target"
          }

          extract_java \
            "cat > sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/PdeManifestImportUpdater.java <<'JAVA'" \
            sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/PdeManifestImportUpdater.java
          extract_java \
            "cat > sandbox_cleanup_application_test/src/org/sandbox/jdt/core/cleanupapp/PdeManifestImportUpdaterTest.java <<'JAVA'" \
            sandbox_cleanup_application_test/src/org/sandbox/jdt/core/cleanupapp/PdeManifestImportUpdaterTest.java

          workflow=.github/workflows/temporary-junit-pde-and-help-repair.yml
          git add \
            sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/ProjectWideCodeCleanupApplication.java \
            sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/PdeManifestImportUpdater.java \
            sandbox_cleanup_application_test/src/org/sandbox/jdt/core/cleanupapp/PdeManifestImportUpdaterTest.java
          git rm "$workflow"

          printf '%s\n' \
            "$workflow" \
            sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/ProjectWideCodeCleanupApplication.java \
            sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/PdeManifestImportUpdater.java \
            sandbox_cleanup_application_test/src/org/sandbox/jdt/core/cleanupapp/PdeManifestImportUpdaterTest.java \
            | sort > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Plan JUnit PDE imports atomically"
          git push origin HEAD:docs/jdt-ui-junit4-qa-status
