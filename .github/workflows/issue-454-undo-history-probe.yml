name: Issue 454 undo history SWTBot probe

on:
  push:
    branches:
      - issue-454-undo-history-swtbot
    paths:
      - 'sandbox_usage_view_test/**'
      - 'sandbox_usage_view/**'
      - 'sandbox_test_commons/**'
      - 'sandbox_common/**'
      - 'sandbox_common_core/**'
      - 'sandbox_target/**'
      - 'pom.xml'
      - '.github/actions/use-runner-maven/**'
      - '.github/actions/verify-eclipse-desktop-runtime/**'
      - '.github/workflows/issue-454-undo-history-probe.yml'
  workflow_dispatch:

concurrency:
  group: issue-454-undo-history-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAVEN_OPTS: -Djava.awt.headless=false
      NO_AT_BRIDGE: '1'
      GDK_BACKEND: x11
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Use runner Maven
        uses: ./.github/actions/use-runner-maven

      - name: Verify preinstalled Eclipse desktop runtime
        uses: ./.github/actions/verify-eclipse-desktop-runtime

      - name: Run issue 454 SWTBot probe
        run: >-
          timeout
          --signal=TERM
          --kill-after=2m
          70m
          xvfb-run
          --auto-servernum
          --server-args="-screen 0 1600x1200x24"
          mvn
          --no-transfer-progress
          -e
          -V
          --batch-mode
          -Dsandbox.tycho.linux-only=true
          -Dspotbugs.skip=true
          -Dtycho.localArtifacts=ignore
          -DfailIfNoTests=false
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=UndoRedoHistorySWTBotTest
          -Pswtbot
          -pl sandbox_target,sandbox_common_core,sandbox_common,sandbox_test_commons,sandbox_usage_view,sandbox_usage_view_test
          clean
          verify

      - name: Show undo history traces
        if: always()
        shell: bash
        run: |
          find sandbox_usage_view_test/target/issue-454 -type f -name '*.txt' -print -exec cat {} \; 2>/dev/null || true

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-454-undo-history-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            sandbox_usage_view_test/target/issue-454/**
            sandbox_usage_view_test/target/surefire-reports/**
