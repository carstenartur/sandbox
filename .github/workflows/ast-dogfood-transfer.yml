name: Fluent AST dogfood patch transfer

on:
  push:
    branches:
      - refactor/fluent-ast-dogfood
    paths:
      - .github/ast-dogfood/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ast-dogfood/part-* > /tmp/dogfood.patch.b64
          base64 --decode /tmp/dogfood.patch.b64 > /tmp/dogfood.patch
          git apply --check /tmp/dogfood.patch
          git apply /tmp/dogfood.patch
          rm -rf .github/ast-dogfood .github/workflows/ast-dogfood-transfer.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Dogfood typed fluent AST traversal in loop name analysis"
          git push origin "HEAD:${GITHUB_REF_NAME}"
