name: Apply release p2 mirror fix

on:
  push:
    branches:
      - fix/release-p2-mirror-rate-limit
    paths:
      - .github/workflows/apply-release-p2-mirror-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply release p2 mirror fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/release-p2-mirror-rate-limit

      - name: Disable flaky automatic p2 mirror selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sandbox_distribution_verify/src/main/java/org/sandbox/distribution/DistributionVerifier.java')
          text = path.read_text(encoding='utf-8')
          old = '''                        "-p2.arch", platform.osgiArch(),
                          "-roaming"),'''
          new = '''                        "-p2.arch", platform.osgiArch(),
                          "-roaming",
                          "-vmargs",
                          "-Declipse.p2.mirrors=false"),'''
          if old not in text:
              raise SystemExit('Expected fresh-install director argument block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm .github/workflows/apply-release-p2-mirror-fix.yml
          git diff --check
          git diff -- sandbox_distribution_verify/src/main/java/org/sandbox/distribution/DistributionVerifier.java

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sandbox_distribution_verify/src/main/java/org/sandbox/distribution/DistributionVerifier.java \
            .github/workflows/apply-release-p2-mirror-fix.yml
          git commit -m 'Disable p2 mirrors during fresh distribution install'
          git push origin HEAD:refs/heads/fix/release-p2-mirror-rate-limit
