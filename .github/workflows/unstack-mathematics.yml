name: Inspect mathematics merge requirements
on:
  push:
    branches: [diagnostic/unstack-mathematics-20261010]
    paths: [.github/workflows/unstack-mathematics.yml]
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Read effective merge requirements without changing any repository setting
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error
          root = 'https://api.github.com/repos/carstenartur/sandbox/'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'merge-requirements'
          out.mkdir()
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json',
                     'X-GitHub-Api-Version':'2026-03-10', 'User-Agent':'sandbox-merge-diagnostics'}
          def save(name, data):
              (out/(name+'.json')).write_text(json.dumps(data,indent=2)+'\n')
          for name, path in [('effective-rules','rules/branches/main'),('classic-protection','branches/main/protection'),
                             ('pr','pulls/1676')]:
              request=urllib.request.Request(root+path,headers=headers)
              try:
                  with urllib.request.urlopen(request,timeout=30) as response: data=json.load(response)
              except urllib.error.HTTPError as error:
                  data={'http_status':error.code,'message':error.read().decode('utf-8')}
              save(name,data)
              if name=='pr':
                  assert data['head']['sha']=='35b21aaabf474d9c46ca5a82ac7b41da75bbddd2'
                  assert data.get('stack') is None
                  print('PR',json.dumps({k:data.get(k) for k in ('state','draft','mergeable','rebaseable','mergeable_state','stack')}))
              else: print(name,json.dumps(data))
          query='''query { repository(owner:"carstenartur",name:"sandbox") {
            pullRequest(number:1676) { number headRefOid baseRefOid isDraft mergeable mergeStateStatus reviewDecision
              commits(last:1) { nodes { commit { oid statusCheckRollup { state } } } }
              potentialMergeCommit { oid statusCheckRollup { state } }
              baseRef { name branchProtectionRule { pattern requiresApprovingReviews requiredApprovingReviewCount
                requiresStrictStatusChecks requiredStatusCheckContexts } }
            }
          } }'''
          request=urllib.request.Request('https://api.github.com/graphql',data=json.dumps({'query':query}).encode(),
                                        headers={**headers,'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request,timeout=30) as response: data=json.load(response)
          save('graphql-requirements',data)
          print('GRAPHQL',json.dumps(data))
          assert not data.get('errors'),data.get('errors')
          print('READ_ONLY_DIAGNOSTICS_COMPLETE')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: merge-requirements-${{ github.run_id }}
          retention-days: 7
          path: ${{ runner.temp }}/merge-requirements/*.json
