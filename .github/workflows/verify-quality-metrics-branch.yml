name: Verify quality metrics branch

on:
  push:
    branches: [ ci/verified-quality-metric-badges ]
    paths:
      - '.github/workflows/verify-quality-metrics-branch.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Use runner Maven
        uses: ./.github/actions/use-runner-maven

      - name: Register module and README endpoints idempotently
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fq '<module>sandbox_quality_metrics</module>' pom.xml; then
            awk '
              !inserted && /<\/modules>/ {
                print "\t\t<module>sandbox_quality_metrics</module>"
                inserted=1
              }
              { print }
              END { if (!inserted) exit 2 }
            ' pom.xml > pom.xml.new
            mv pom.xml.new pom.xml
          fi

          coverage='[![Coverage](https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Fcarstenartur%2Fsandbox%2Fgh-pages%2Fbadges%2Fcoverage.json)](https://carstenartur.github.io/sandbox/coverage/)'
          tests='[![Tests](https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Fcarstenartur%2Fsandbox%2Fgh-pages%2Fbadges%2Ftests.json)](https://carstenartur.github.io/sandbox/tests/)'
          skipped='[![Skipped tests](https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Fcarstenartur%2Fsandbox%2Fgh-pages%2Fbadges%2Fskipped.json)](https://carstenartur.github.io/sandbox/tests/)'
          sed -i "s|^\[!\[Coverage\](https://github.com/carstenartur/sandbox/actions/workflows/coverage.yml/badge.svg?branch=main)\](https://github.com/carstenartur/sandbox/actions/workflows/coverage.yml)$|$coverage|" README.md
          sed -i "s|^\[!\[Tests\](https://github.com/carstenartur/sandbox/actions/workflows/test-report.yml/badge.svg?branch=main)\](https://github.com/carstenartur/sandbox/actions/workflows/test-report.yml)$|$tests|" README.md
          if ! grep -Fq 'badges%2Fskipped.json' README.md; then
            awk -v skipped="$skipped" '{ print } /^\[!\[Tests\]/ { print skipped }' README.md > README.md.new
            mv README.md.new README.md
          fi
          grep -Fq '<module>sandbox_quality_metrics</module>' pom.xml
          grep -Fq 'badges%2Ftests.json' README.md
          grep -Fq 'badges%2Fskipped.json' README.md
          grep -Fq 'badges%2Fcoverage.json' README.md

      - name: Verify generator through Maven and JUnit
        shell: bash
        run: |
          set -euo pipefail
          mvn --no-transfer-progress --batch-mode -pl sandbox_quality_metrics -am clean verify

      - name: Close accidental placeholder issue if present
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r number; do
            [[ -z "$number" ]] && continue
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment 'This placeholder was created accidentally during connector discovery and contains no project requirement.'
          done < <(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"DO NOT CREATE" in:title' --json number,title \
            --jq '.[] | select(.title == "DO NOT CREATE") | .number')

      - name: Finalize branch and pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/finalize-quality-metrics-branch.yml \
            .github/workflows/repair-issue-state.yml \
            .github/workflows/verify-quality-metrics-branch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml README.md .github/workflows/coverage.yml \
            sandbox_quality_metrics docs/quality-metrics.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Maven-verified quality metric badges'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          ## Summary
          - publish exact executed-test and skipped-test counts from runtime JUnit XML
          - publish aggregate JaCoCo line coverage from the same authoritative Maven run
          - keep metric parsing and regression tests in the normal Maven reactor
          - publish README endpoints only after a successful `main` build

          ## Evidence contract
          - each Surefire/Failsafe `<testcase>` is classified once
          - missing or empty test/coverage evidence fails closed
          - only the root aggregate JaCoCo `LINE` counter is used
          - pull requests validate but cannot overwrite public metrics
          - `quality-summary.json` binds raw counts to the verified commit
          - no new Python or parallel test authority is introduced

          ## Testing
          - `mvn --no-transfer-progress --batch-mode -pl sandbox_quality_metrics -am clean verify`
          - full `Verified test and coverage metrics` workflow
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/pr-body.md"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$GITHUB_REF_NAME" \
              --title 'Publish exact test, skipped-test and coverage badges' \
              --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
              --title 'Publish exact test, skipped-test and coverage badges' \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi
