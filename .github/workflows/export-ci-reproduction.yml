name: Export CI reproduction inputs

on:
  workflow_dispatch:
  push:
    branches: [ 'codex/1657-mathematics-cleanup' ]
    paths: [ '.github/workflows/export-ci-reproduction.yml' ]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the exact diagnostic revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Provide the supported JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Export source history and tool installations
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/sandbox-ci-reproduction
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          git bundle create "$OUTPUT_DIR/checkout.bundle" HEAD refs/remotes/origin/main
          git bundle verify "$OUTPUT_DIR/checkout.bundle"
          git rev-parse HEAD > "$OUTPUT_DIR/head.txt"
          git rev-parse refs/remotes/origin/main > "$OUTPUT_DIR/main.txt"
          java -version 2> "$OUTPUT_DIR/java-version.txt"
          mvn -version > "$OUTPUT_DIR/maven-version.txt"
          tar -czf "$OUTPUT_DIR/jdk.tar.gz" -C "$JAVA_HOME" .
          maven_home=$(dirname "$(dirname "$(readlink -f "$(command -v mvn)")")")
          tar -czf "$OUTPUT_DIR/maven.tar.gz" -C "$maven_home" .
          (cd "$OUTPUT_DIR" && sha256sum checkout.bundle jdk.tar.gz maven.tar.gz > SHA256SUMS)

      - name: Retain exact offline reproduction inputs
        uses: actions/upload-artifact@v7
        with:
          name: ci-reproduction-${{ github.sha }}
          path: ${{ runner.temp }}/sandbox-ci-reproduction
          retention-days: 3
          if-no-files-found: error
