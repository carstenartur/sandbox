name: Apply PR 1513 state-based SWTBot waits v2

on:
  push:
    branches:
      - qa/atomic-int-to-enum-preview-gate
    paths:
      - '.github/workflows/tmp-pr1513-state-based-waits-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr1513-state-based-swtbot-waits-v2
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      PATCH_B64: >-
        
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: qa/atomic-int-to-enum-preview-gate
          fetch-depth: 0

      - name: Replace fixed waits with state conditions
        shell: bash
        run: |
          set -euo pipefail
          target='sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsSWTBotTest.java'
          expected_before='eb54e490b620bdc35f14beeab3d6eced2df7ec85'
          expected_after='7d79115d530996ba100c3bee68be5187751cea3e'
          patch="$RUNNER_TEMP/state-based-waits.patch"

          actual_before="$(git hash-object "$target")"
          if [[ "$actual_before" != "$expected_before" ]]; then
            echo "::error::Refusing to patch unexpected source blob $actual_before"
            exit 1
          fi

          printf '%s' "$PATCH_B64" | base64 --decode > "$patch"
          test "$(sha256sum "$patch" | awk '{print $1}')" = \
            'd32ddf7ee9ef179faf9a7186f07d8ad1675a092e60975b17dfb96d0f05b7e8af'
          git apply --check "$patch"
          git apply "$patch"
          git diff --check

          actual_after="$(git hash-object "$target")"
          if [[ "$actual_after" != "$expected_after" ]]; then
            echo "::error::Patched source blob $actual_after differs from reviewed $expected_after"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          git commit -m 'Replace fixed SWTBot waits with state conditions'
          git push origin HEAD:qa/atomic-int-to-enum-preview-gate
