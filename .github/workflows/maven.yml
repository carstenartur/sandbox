name: Java CI with Maven

on:
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - '.github/actions/cleanup-action/**'
      - '.github/actions/use-runner-maven/**'
      - '.github/workflows/maven.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - '.github/actions/cleanup-action/**'
      - '.github/actions/use-runner-maven/**'
      - '.github/workflows/maven.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    env:
      MAVEN_OPTS: -Djava.awt.headless=true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Use runner Maven
        uses: ./.github/actions/use-runner-maven

      - name: Set up Node.js for CSS tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install test and desktop dependencies
        run: |
          npm install --global prettier stylelint stylelint-config-standard
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1

      - name: Maven clean verify
        run: >-
          xvfb-run --auto-servernum mvn
          --no-transfer-progress
          -e
          -V
          --batch-mode
          -Dtycho.localArtifacts=ignore
          clean verify

      - name: Publish JUnit annotations
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          summary: true
          include_passed: false
          detailed_summary: true

      - name: Upload raw test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: '**/target/surefire-reports/**'
          retention-days: 14
          if-no-files-found: warn
