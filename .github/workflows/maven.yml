name: Java CI with Maven

on:
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - '.github/actions/cleanup-action/**'
      - '.github/actions/use-runner-maven/**'
      - '.github/actions/verify-eclipse-desktop-runtime/**'
      - '.github/workflows/maven.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Maven scope
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Maven-relevant changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_SHA" ]]; then
            echo "Could not determine the pull request base SHA." >&2
            exit 1
          fi

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              pom.xml|.mvn/*|sandbox*/*|features/*|plugins/*|org/*|*.xml|*.properties|\
              .github/actions/cleanup-action/*|.github/actions/use-runner-maven/*|\
              .github/actions/verify-eclipse-desktop-runtime/*|.github/workflows/maven.yml)
                relevant=true
                break
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD)

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [[ "$relevant" == "true" ]]; then
            echo "Maven-relevant changes detected."
          else
            echo "No Maven-relevant changes detected; the build job will be skipped."
          fi

  build:
    name: Maven build
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    env:
      MAVEN_OPTS: -Djava.awt.headless=true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Use runner Maven
        uses: ./.github/actions/use-runner-maven

      - name: Set up Node.js for CSS tests
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install CSS tooling
        run: npm install --global prettier stylelint stylelint-config-standard

      - name: Verify preinstalled Eclipse desktop runtime
        uses: ./.github/actions/verify-eclipse-desktop-runtime

      - name: Maven clean verify
        run: >-
          xvfb-run --auto-servernum mvn
          --no-transfer-progress
          -e
          -V
          --batch-mode
          -Dtycho.localArtifacts=ignore
          clean verify

      - name: Publish JUnit annotations
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          summary: true
          include_passed: false
          detailed_summary: true

      - name: Upload raw test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: '**/target/surefire-reports/**'
          retention-days: 14
          if-no-files-found: warn

  verification:
    name: Maven verification
    needs: [ changes, build ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce Maven result
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MAVEN_RELEVANT: ${{ needs.changes.outputs.relevant }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Maven scope detection failed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$MAVEN_RELEVANT" == "true" && "$BUILD_RESULT" != "success" ]]; then
            echo "Maven build did not succeed: $BUILD_RESULT" >&2
            exit 1
          fi
          if [[ "$MAVEN_RELEVANT" != "true" ]]; then
            echo "Maven verification is not required for these changed paths."
          else
            echo "Maven verification succeeded."
          fi
