name: Java CI with Maven

on:
  push:
    branches: [ main ]
    paths:
      - 'mvnw'
      - 'mvnw.cmd'
      - '.gitattributes'
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - '.github/actions/cleanup-action/**'
      - '.github/actions/verify-eclipse-desktop-runtime/**'
      - '.github/workflows/maven.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Maven scope
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Maven-relevant changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_SHA" ]]; then
            echo "Could not determine the pull request base SHA." >&2
            exit 1
          fi

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              mvnw|mvnw.cmd|.gitattributes|pom.xml|.mvn/*|sandbox*/*|features/*|plugins/*|org/*|*.xml|*.properties|\
              .github/actions/cleanup-action/*|.github/actions/verify-eclipse-desktop-runtime/*|\
              .github/workflows/maven.yml)
                relevant=true
                break
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD)

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [[ "$relevant" == "true" ]]; then
            echo "Maven-relevant changes detected."
          else
            echo "No Maven-relevant changes detected; the build job will be skipped."
          fi

  build:
    name: Maven build
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    env:
      MAVEN_OPTS: -Djava.awt.headless=true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify pinned Maven Wrapper
        run: ./mvnw --batch-mode --no-transfer-progress --version

      - name: Verify preinstalled Eclipse desktop runtime
        uses: ./.github/actions/verify-eclipse-desktop-runtime

      - name: Select repository-policy review context
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            base="refs/remotes/origin/$GITHUB_BASE_REF"
            printf 'REPOSITORY_POLICY_BASE=%s\n' "$base" >> "$GITHUB_ENV"
            printf 'Repository policy base: %s\n' "$base"
          # Only a reviewed change reaching main may use this automatic context.
          # A workflow_dispatch run receives no exception and must satisfy the size gate itself.
          elif [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == 'refs/heads/main' ]]; then
            if [[ ! "$EVENT_BEFORE" =~ ^[0-9a-fA-F]{40}$ ]] \
                || [[ "$EVENT_BEFORE" == '0000000000000000000000000000000000000000' ]]; then
              echo 'A post-merge main push requires a valid github.event.before commit.' >&2
              exit 1
            fi
            printf 'REPOSITORY_POLICY_BASE=%s\n' "$EVENT_BEFORE" >> "$GITHUB_ENV"
            printf 'Repository policy base: %s\n' "$EVENT_BEFORE"
            exception='Post-review main-branch verification has no active pull-request body; review-size approval was already handled before merge, while full tracked-tree and forbidden-automation policy checks remain active.'
            printf 'REPOSITORY_POLICY_EXCEPTION=%s\n' "$exception" >> "$GITHUB_ENV"
            printf '%s\n' "$exception"
          else
            printf 'No automatic repository-policy exception for event %s on %s.\n' \
              "$GITHUB_EVENT_NAME" "$GITHUB_REF"
          fi

      - name: Maven Wrapper clean verify
        run: >-
          xvfb-run --auto-servernum ./mvnw
          --no-transfer-progress
          -e
          -V
          --batch-mode
          -Dtycho.localArtifacts=ignore
          clean verify

      - name: Publish JUnit annotations
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          summary: true
          include_passed: false
          detailed_summary: true

      - name: Upload raw test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: '**/target/surefire-reports/**'
          retention-days: 14
          if-no-files-found: warn

  verification:
    name: Maven verification
    needs: [ changes, build ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce Maven result
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MAVEN_RELEVANT: ${{ needs.changes.outputs.relevant }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Maven scope detection failed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$MAVEN_RELEVANT" == "true" && "$BUILD_RESULT" != "success" ]]; then
            echo "Maven build did not succeed: $BUILD_RESULT" >&2
            exit 1
          fi
          if [[ "$MAVEN_RELEVANT" != "true" ]]; then
            echo "Maven verification is not required for these changed paths."
          else
            echo "Maven verification succeeded."
          fi
