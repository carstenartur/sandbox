name: One-shot Method Reuse screenshot isolation

on:
  push:
    branches:
      - feature/method-reuse-multifile-delegation
    paths:
      - '.github/workflows/one-shot-method-reuse-screenshot-isolation.yml'

permissions:
  contents: write

jobs:
  isolate-method-reuse-profile:
    if: github.event.head_commit.message == 'Bootstrap deterministic Help screenshot order'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: feature/method-reuse-multifile-delegation
          fetch-depth: 0

      - name: Run profile-mutating Method Reuse scenario last
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsMergeGateSWTBotTest.java')
          content = path.read_text(encoding='utf-8')

          import_anchor = '''import org.junit.jupiter.api.BeforeAll;\nimport org.junit.jupiter.api.Test;\n'''
          import_replacement = '''import org.junit.jupiter.api.BeforeAll;\nimport org.junit.jupiter.api.MethodOrderer;\nimport org.junit.jupiter.api.Test;\nimport org.junit.jupiter.api.TestMethodOrder;\n'''
          if content.count(import_anchor) != 1:
              raise SystemExit('Unexpected JUnit import anchor')
          content = content.replace(import_anchor, import_replacement)

          class_anchor = 'public class SandboxHelpScreenshotsMergeGateSWTBotTest {\n'
          class_replacement = '''/**
           * The real Method Reuse scenario deliberately changes the active Cleanup profile.
           * Run it after every screenshot-producing scenario so that its private profile state
           * cannot alter unrelated canonical Help images.
           */
          @TestMethodOrder(MethodOrderer.MethodName.class)
          public class SandboxHelpScreenshotsMergeGateSWTBotTest {
          '''
          if content.count(class_anchor) != 1:
              raise SystemExit('Unexpected merge-gate class anchor')
          content = content.replace(class_anchor, class_replacement)

          path.write_text(content, encoding='utf-8')
          PY

      - name: Commit bounded isolation fix and remove bootstrap workflow
        run: |
          set -euo pipefail
          bootstrap='.github/workflows/one-shot-method-reuse-screenshot-isolation.yml'
          test_class='sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsMergeGateSWTBotTest.java'

          git rm -- "$bootstrap"
          git add -- "$test_class"

          actual="$(git diff --cached --name-status | sort)"
          expected="$(printf 'D\t%s\nM\t%s\n' "$bootstrap" "$test_class" | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          changed_text_lines="$(git diff --numstat origin/main -- \
            ':!**/*.png' | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { total += $1 + $2 } END { print total + 0 }')"
          printf 'Changed text lines against main: %s\n' "$changed_text_lines"
          test "$changed_text_lines" -lt 2000

          grep -Fq '@TestMethodOrder(MethodOrderer.MethodName.class)' "$test_class"
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Isolate Method Reuse Help screenshot state'
          git push origin HEAD:feature/method-reuse-multifile-delegation
