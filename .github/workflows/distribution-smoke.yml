name: Prepare native Java 25 verification runtime

on:
  push:
    branches: [ codex/verify-checked-field-inversion-adapter ]

permissions:
  contents: read

jobs:
  jdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - name: Verify and retain the installed Java toolchain
        shell: bash
        run: |
          java -version
          javac -version
          tar -C "$JAVA_HOME" --exclude=./jmods --exclude=./lib/src.zip -czf "$RUNNER_TEMP/native-jdk25.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: native-jdk25
          path: ${{ runner.temp }}/native-jdk25.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
