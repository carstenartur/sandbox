name: Distribution Smoke Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: distribution-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-and-update-site:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Apply pending complete product model
        if: github.event_name == 'pull_request' && github.head_ref == 'upgrade/eclipse-2026-06' && hashFiles('.github/scripts/apply_complete_product_model.py') != ''
        run: |
          mkdir -p target/distribution-verification
          set +e
          python3 .github/scripts/apply_complete_product_model.py \
            > target/distribution-verification/product-model-migration.log 2>&1
          status=$?
          set -e
          cat target/distribution-verification/product-model-migration.log
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          # Workflow files are finalized through the repository API after this
          # one-time migration. Keep the action token away from workflow writes.
          git checkout -- .github/workflows
          rm .github/scripts/apply_complete_product_model.py
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/'
          git commit -m 'Define complete IDE product and distribution Maven profile'
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1
        with:
          maven-version: 3.9.14
      - name: Install Linux product runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1
      - name: Build, test, provision and start the distribution with Maven
        run: |
          set -o pipefail
          status=0
          xvfb-run --auto-servernum mvn \
            -Pdistribution \
            --batch-mode \
            -Dtycho.localArtifacts=ignore \
            clean verify 2>&1 | tee /tmp/distribution-build.log || status=$?
          mkdir -p target/distribution-verification
          cp /tmp/distribution-build.log target/distribution-verification/build.log
          exit "$status"
      - name: Publish verification summary
        if: always() && hashFiles('target/distribution-verification/verification.md') != ''
        run: cat target/distribution-verification/verification.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distribution-smoke-${{ github.sha }}
          path: target/distribution-verification/
          retention-days: 30
          if-no-files-found: error
