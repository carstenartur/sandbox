name: Verify checked field inversion adapter

on:
  push:
    branches: [ codex/verify-checked-field-inversion-adapter ]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Exercise the adapter, pinned Shamir sources and existing Bouncy Castle corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/field-test" target/field-acceptance
          JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$RUNNER_TEMP/field-test" ./mvnw \
            --batch-mode --no-transfer-progress -f qa/math-optimization/pom.xml \
            -Dtest=JavaFieldInversionTest,MathCleanUpOptionsTest,BouncyCastleThresholdInversionTest,BouncyCastleRuntimeCorpusTest \
            -Djunit.jupiter.tempdir.cleanup.mode.default=NEVER \
            -Dsandbox.math.bc.threshold.upstream=true test
          mapfile -t output < <(find "$RUNNER_TEMP/field-test" -path '*/generated/ShamirSplitSecret.java')
          test "${#output[@]}" = 1
          output_root=$(dirname "$(dirname "${output[0]}")")
          cp -a "$output_root/original" "$output_root/generated" target/field-acceptance/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: final-shamir-adapter-evidence
          path: |
            target/field-acceptance/
            qa/math-optimization/target/surefire-reports/
          if-no-files-found: warn
