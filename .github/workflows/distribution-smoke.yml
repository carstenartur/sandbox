name: Distribution Smoke Test

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - '.github/actions/use-runner-maven/**'
      - '.github/actions/verify-eclipse-desktop-runtime/**'
      - '.github/scripts/smoke_test_distribution.sh'
      - '.github/scripts/validate_distribution_evidence.py'
      - '.github/workflows/distribution-smoke.yml'
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - '.github/actions/use-runner-maven/**'
      - '.github/actions/verify-eclipse-desktop-runtime/**'
      - '.github/scripts/smoke_test_distribution.sh'
      - '.github/scripts/validate_distribution_evidence.py'
      - '.github/workflows/distribution-smoke.yml'
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-and-update-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Use runner Maven
        uses: ./.github/actions/use-runner-maven
      - name: Verify preinstalled Eclipse desktop runtime
        uses: ./.github/actions/verify-eclipse-desktop-runtime
      - name: Select repository-policy review context
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            base="refs/remotes/origin/$GITHUB_BASE_REF"
            printf 'REPOSITORY_POLICY_BASE=%s\n' "$base" >> "$GITHUB_ENV"
            printf 'Repository policy base: %s\n' "$base"
          else
            if [[ "$EVENT_BEFORE" =~ ^[0-9a-fA-F]{40}$ ]] \
                && [[ "$EVENT_BEFORE" != '0000000000000000000000000000000000000000' ]]; then
              printf 'REPOSITORY_POLICY_BASE=%s\n' "$EVENT_BEFORE" >> "$GITHUB_ENV"
              printf 'Repository policy base: %s\n' "$EVENT_BEFORE"
            fi
            exception='Post-review push, scheduled, or manually dispatched verification has no active pull-request body; review-size approval was already handled before merge, while full tracked-tree and forbidden-automation policy checks remain active.'
            printf 'REPOSITORY_POLICY_EXCEPTION=%s\n' "$exception" >> "$GITHUB_ENV"
            printf '%s\n' "$exception"
          fi
      - name: Maven distribution build and verification
        shell: bash
        run: |
          set -o pipefail
          status=0
          xvfb-run --auto-servernum mvn \
            -Pdistribution \
            --batch-mode \
            -Dtycho.localArtifacts=ignore \
            clean verify 2>&1 \
            | tee /tmp/sandbox-distribution-maven.log || status=$?
          mkdir -p target/distribution-verification
          cp /tmp/sandbox-distribution-maven.log \
            target/distribution-verification/maven.log
          exit "$status"
      - name: Validate distribution evidence contract
        run: python3 .github/scripts/validate_distribution_evidence.py
      - name: Publish verification summary
        if: always() && hashFiles('target/distribution-verification/verification.md') != ''
        run: cat target/distribution-verification/verification.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distribution-smoke-${{ github.sha }}
          path: target/distribution-verification/
          retention-days: 30
          if-no-files-found: error
