name: Distribution Smoke Test

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.github/actions/verify-eclipse-desktop-runtime/**'
      - '.github/scripts/smoke_test_distribution.sh'
      - '.github/scripts/validate_distribution_evidence.py'
      - '.github/workflows/distribution-smoke.yml'
      - '.github/actions/cleanup-review/**'
      - 'examples/cleanup-review/**'
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.github/actions/verify-eclipse-desktop-runtime/**'
      - '.github/scripts/smoke_test_distribution.sh'
      - '.github/scripts/validate_distribution_evidence.py'
      - '.github/workflows/distribution-smoke.yml'
      - '.github/actions/cleanup-review/**'
      - 'examples/cleanup-review/**'
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-smoke-${{ github.ref }}
  # Scheduled and manual runs must not cancel an active verification of this ref.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  product-and-update-site:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify pinned Maven Wrapper
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress --version
      - name: Verify preinstalled Eclipse desktop runtime
        if: runner.os == 'Linux'
        uses: ./.github/actions/verify-eclipse-desktop-runtime
      - name: Select repository-policy review context
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            base="refs/remotes/origin/$GITHUB_BASE_REF"
            printf 'REPOSITORY_POLICY_BASE=%s\n' "$base" >> "$GITHUB_ENV"
            printf 'Repository policy base: %s\n' "$base"
          else
            if [[ "$EVENT_BEFORE" =~ ^[0-9a-fA-F]{40}$ ]] \
                && [[ "$EVENT_BEFORE" != '0000000000000000000000000000000000000000' ]]; then
              printf 'REPOSITORY_POLICY_BASE=%s\n' "$EVENT_BEFORE" >> "$GITHUB_ENV"
              printf 'Repository policy base: %s\n' "$EVENT_BEFORE"
            fi
            exception='Post-review push, scheduled, or manually dispatched verification has no active pull-request body; review-size approval was already handled before merge, while full tracked-tree and forbidden-automation policy checks remain active.'
            printf 'REPOSITORY_POLICY_EXCEPTION=%s\n' "$exception" >> "$GITHUB_ENV"
            printf '%s\n' "$exception"
          fi
      - name: Maven distribution build and verification
        shell: bash
        run: |
          set -o pipefail
          status=0
          # Recheck missing releases recorded in the restored Maven cache.
          command=(./mvnw -Pdistribution,cli-dist,swtbot --batch-mode --update-snapshots
            -Dtycho.localArtifacts=ignore -Dsandbox.math.retainHeadlessProbe=true clean verify)
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            command=(xvfb-run --auto-servernum "${command[@]}")
          fi
          log="$RUNNER_TEMP/sandbox-distribution-maven.log"
          # A stalled Maven reactor scan previously left no JVM evidence at the job timeout.
          (sleep 600; bash .github/scripts/capture-maven-reactor-scan.sh "$log" \
            target/distribution-verification/reactor-threads.log) > "$RUNNER_TEMP/maven-scan-watch.log" 2>&1 &
          scan_watch=$!
          trap 'kill "$scan_watch" 2>/dev/null || :' EXIT
          "${command[@]}" 2>&1 | tee "$log" || status=$?
          mkdir -p target/distribution-verification
          cp "$log" target/distribution-verification/maven.log
          exit "$status"
      - name: Reclaim completed aggregate installation scratch space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # The completed aggregate gate retains its receipts under distribution-verification.
          # Its three temporary installations are no longer used; keep fresh-install for mathematics.
          df -h .
          find target -mindepth 1 -maxdepth 1 -type d -name 'aggregate-installation-*' \
            -print -exec rm -rf -- {} +
          df -h .
      - name: Qualify native Eclipse consumers against the candidate image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Reuse this job's verified CLI distribution. Never qualify PR source
          # against the older, independently published :latest runtime.
          archives=(sandbox_cleanup_cli_dist/target/sandbox-cleanup-cli-*-dist.tar.gz)
          [[ ${#archives[@]} -eq 1 && -f "${archives[0]}" ]]
          context="$RUNNER_TEMP/cleanup-consumer-image"
          mkdir -p "$context/dist"
          tar -xzf "${archives[0]}" -C "$context/dist" --strip-components=1
          [[ -d "$context/dist/plugins" && -f "$context/dist/bin/sandbox-cleanup" ]]
          cp sandbox_cleanup_docker/Dockerfile sandbox_cleanup_docker/entrypoint.sh "$context/"
          docker build --tag sandbox-cleanup:consumer-ci "$context"
          ./mvnw --batch-mode -f sandbox_common_test/pom-cleanup-review.xml \
            -Pconsumer-e2e -Dcleanup.review.image=sandbox-cleanup:consumer-ci \
            -Dcleanup.review.skipPull=true \
            test-compile failsafe:integration-test failsafe:verify
      - name: Exercise the Maven plugin from a plain Java project
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f maven-central/pom.xml -pl :sandbox-maven-plugin \
            -Pcentral-release -Dtycho.mode=maven -Dgpg.skip=true install
          archives=(sandbox_cleanup_cli_dist/target/sandbox-cleanup-cli-*-dist.tar.gz)
          versioned="${archives[0]#*/target/sandbox-cleanup-cli-}"
          xvfb-run --auto-servernum ./mvnw -B -ntp -f sandbox_distribution_verify/pom.xml \
            -Dtycho.mode=maven -Dtest=MavenCleanupConsumerIT -Dsandbox.plugin.version="${versioned%-dist.tar.gz}" \
            -Dsandbox.cli.home="$RUNNER_TEMP/cleanup-consumer-image/dist" surefire:test
      - name: Verify installed mathematics without a display
        shell: bash
        run: >-
          ./mvnw -Pdistribution --batch-mode -pl sandbox_distribution_verify
          -Dtycho.localArtifacts=ignore exec:java@verify-installed-mathematics
      - name: Validate distribution evidence contract
        shell: bash
        run: python3 .github/scripts/validate_distribution_evidence.py
      - name: Publish verification summary
        if: always() && hashFiles('target/distribution-verification/verification.md') != ''
        shell: bash
        run: cat target/distribution-verification/verification.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distribution-smoke-${{ matrix.os }}-${{ github.sha }}
          path: |
            target/distribution-verification/
            sandbox_common_test/target/cleanup-review/failsafe-reports/
            sandbox_common_test/target/cleanup-review/consumer-evidence/
            sandbox_distribution_verify/target/surefire-reports/*MavenCleanupConsumerIT*
            sandbox_math_cleanup_test/target/headless-probe/
            sandbox_math_cleanup_test/target/surefire-reports/
            sandbox_math_cleanup_test/target/screenshots/
          retention-days: 30
          if-no-files-found: error
