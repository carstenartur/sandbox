name: Verify checked field inversion adapter

on:
  create:
  push:
    branches: [ codex/verify-checked-field-inversion-adapter ]

permissions:
  contents: read

jobs:
  qualify:
    if: github.ref == 'refs/heads/codex/verify-checked-field-inversion-adapter'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile the native adapter and exercise the pinned upstream Java
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -f qa/math-optimization/pom.xml
          -Dtest=JavaFieldInversionTest,BouncyCastleThresholdInversionTest,MathCleanUpOptionsTest
          -Dsandbox.math.bc.threshold.upstream=true test
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checked-field-inversion-tests
          path: qa/math-optimization/target/surefire-reports/
          if-no-files-found: warn
