name: Distribution Smoke Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: distribution-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-and-update-site:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply pending Eclipse 2026-06 repository alignment
        if: github.event_name == 'pull_request' && github.head_ref == 'upgrade/eclipse-2026-06' && hashFiles('.github/workflows/apply-eclipse-2026-06-alignment.yml') != ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def replace_bytes(path, replacements):
              file = Path(path)
              content = file.read_bytes()
              for old, new in replacements:
                  if old not in content:
                      raise SystemExit(f"Expected {old!r} in {path}")
                  content = content.replace(old, new)
              file.write_bytes(content)

          replace_bytes('pom.xml', (
              (b'2025-12', b'2026-06'),
              (b'<bouncycastle.version>1.85</bouncycastle.version>',
               b'<bouncycastle.version>1.84</bouncycastle.version>'),
              (b'<versionRange>1.81.0</versionRange>',
               b'<versionRange>1.84</versionRange>'),
          ))
          replace_bytes('sandbox_product/sandbox.product', (
              (b'releases/2025-12/', b'releases/2026-06/'),
          ))
          replace_bytes('sandbox_oomph/sandbox.setup', (
              (b'2025-12', b'2026-06'),
          ))
          replace_bytes('docs/distribution-compatibility.md', (
              (b'Eclipse 2025-12 simultaneous release repository',
               b'Eclipse 2026-06 simultaneous release repository'),
          ))

          documentation = Path('docs/distribution-compatibility.md')
          text = documentation.read_text(encoding='utf-8')
          marker = 'The target platform is resolved from `sandbox_target/eclipse.target`. Plugins and the cleanup application may depend on APIs present in that target and are not claimed to support older Eclipse releases.\n'
          addition = '''

          ## Reproducing the distribution gate locally

          On Linux, install the GTK/Xvfb runtime packages listed in `.github/workflows/distribution-smoke.yml`, then run exactly the same Maven entry point as CI:

          ```bash
          xvfb-run --auto-servernum mvn \\
            -Pproduct,repo \\
            --batch-mode \\
            -Dtycho.localArtifacts=ignore \\
            -Ddistribution.smoke=true \\
            clean verify
          ```

          The `distribution.smoke` property activates the verification bound to the `sandbox_updatesite` Maven `verify` phase. Do not add Maven parallelism to this command: the product must be materialized before the final update-site module provisions and starts the completed distribution.
          '''.strip('\n')
          if '## Reproducing the distribution gate locally' not in text:
              if marker not in text:
                  raise SystemExit('Documentation insertion marker not found')
              documentation.write_text(text.replace(marker, marker + addition + '\n', 1), encoding='utf-8')

          for path in ('pom.xml', 'sandbox_target/eclipse.target',
                       'sandbox_product/sandbox.product', 'sandbox_oomph/sandbox.setup'):
              ET.parse(path)
          PY
          python3 .github/scripts/verify_target_repository_alignment.py
          rm .github/workflows/apply-eclipse-2026-06-alignment.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pom.xml sandbox_product/sandbox.product sandbox_oomph/sandbox.setup \
            docs/distribution-compatibility.md \
            .github/workflows/apply-eclipse-2026-06-alignment.yml
          git commit -m 'Align Maven, product and Oomph with Eclipse 2026-06'
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1
        with:
          maven-version: 3.9.14
      - name: Install Linux product runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1
      - name: Build, test, provision and start the distribution with Maven
        run: |
          set -o pipefail
          status=0
          xvfb-run --auto-servernum mvn \
            -Pproduct,repo \
            --batch-mode \
            -Dtycho.localArtifacts=ignore \
            -Ddistribution.smoke=true \
            clean verify 2>&1 | tee /tmp/distribution-build.log || status=$?
          mkdir -p target/distribution-verification
          cp /tmp/distribution-build.log target/distribution-verification/build.log
          exit "$status"
      - name: Publish verification summary
        if: always() && hashFiles('target/distribution-verification/verification.md') != ''
        run: cat target/distribution-verification/verification.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distribution-smoke-${{ github.sha }}
          path: target/distribution-verification/
          retention-days: 30
          if-no-files-found: error
