name: Distribution Smoke Test

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.github/actions/verify-eclipse-desktop-runtime/**'
      - '.github/scripts/smoke_test_distribution.sh'
      - '.github/scripts/validate_distribution_evidence.py'
      - '.github/workflows/distribution-smoke.yml'
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.github/actions/verify-eclipse-desktop-runtime/**'
      - '.github/scripts/smoke_test_distribution.sh'
      - '.github/scripts/validate_distribution_evidence.py'
      - '.github/workflows/distribution-smoke.yml'
  schedule:
    - cron: '30 3 * * 1'
  create:
  workflow_dispatch:
    inputs:
      regelsuche_sdk_revision:
        description: 'Regelsuche SDK revision to qualify and stage; blank runs the normal smoke tests'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: distribution-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-and-update-site:
    if: github.event_name != 'create' && (github.event_name != 'workflow_dispatch' || inputs.regelsuche_sdk_revision == '')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify pinned Maven Wrapper
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress --version
      - name: Verify preinstalled Eclipse desktop runtime
        if: runner.os == 'Linux'
        uses: ./.github/actions/verify-eclipse-desktop-runtime
      - name: Select repository-policy review context
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            base="refs/remotes/origin/$GITHUB_BASE_REF"
            printf 'REPOSITORY_POLICY_BASE=%s\n' "$base" >> "$GITHUB_ENV"
            printf 'Repository policy base: %s\n' "$base"
          else
            if [[ "$EVENT_BEFORE" =~ ^[0-9a-fA-F]{40}$ ]] \
                && [[ "$EVENT_BEFORE" != '0000000000000000000000000000000000000000' ]]; then
              printf 'REPOSITORY_POLICY_BASE=%s\n' "$EVENT_BEFORE" >> "$GITHUB_ENV"
              printf 'Repository policy base: %s\n' "$EVENT_BEFORE"
            fi
            exception='Post-review push, scheduled, or manually dispatched verification has no active pull-request body; review-size approval was already handled before merge, while full tracked-tree and forbidden-automation policy checks remain active.'
            printf 'REPOSITORY_POLICY_EXCEPTION=%s\n' "$exception" >> "$GITHUB_ENV"
            printf '%s\n' "$exception"
          fi
      - name: Maven distribution build and verification
        shell: bash
        run: |
          set -o pipefail
          status=0
          command=(./mvnw -Pdistribution,cli-dist,swtbot --batch-mode -Dtycho.localArtifacts=ignore
            -Dsandbox.math.retainHeadlessProbe=true clean verify)
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            command=(xvfb-run --auto-servernum "${command[@]}")
          fi
          log="$RUNNER_TEMP/sandbox-distribution-maven.log"
          "${command[@]}" 2>&1 | tee "$log" || status=$?
          mkdir -p target/distribution-verification
          cp "$log" target/distribution-verification/maven.log
          exit "$status"
      - name: Verify installed mathematics without a display
        shell: bash
        run: >-
          ./mvnw -Pdistribution --batch-mode -pl sandbox_distribution_verify
          -Dtycho.localArtifacts=ignore exec:java@verify-installed-mathematics
      - name: Validate distribution evidence contract
        shell: bash
        run: python3 .github/scripts/validate_distribution_evidence.py
      - name: Publish verification summary
        if: always() && hashFiles('target/distribution-verification/verification.md') != ''
        shell: bash
        run: cat target/distribution-verification/verification.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distribution-smoke-${{ matrix.os }}-${{ github.sha }}
          path: |
            target/distribution-verification/
            sandbox_math_cleanup_test/target/headless-probe/
            sandbox_math_cleanup_test/target/surefire-reports/
            sandbox_math_cleanup_test/target/screenshots/
          retention-days: 30
          if-no-files-found: error

  sdk-prepare:
    if: (github.event_name == 'workflow_dispatch' && inputs.regelsuche_sdk_revision != '') || (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'sdk-transfer-request/'))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Resolve the explicitly requested SDK commit
        id: sdk
        shell: bash
        env:
          SDK_REQUEST: ${{ inputs.regelsuche_sdk_revision || github.event.ref }}
        run: |
          set -euo pipefail
          revision="${SDK_REQUEST#sdk-transfer-request/}"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'An exact 40-character Regelsuche commit is required.' >&2
            exit 1
          fi
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: carstenartur/Regelsuche
          ref: ${{ steps.sdk.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Qualify the SDK through its existing Maven and JUnit authority
        run: >-
          mvn --batch-mode --no-transfer-progress -Psdk-release -pl maven-build-contract
          -Dtest=MavenOptimizationSdkDistributionTest test
      - name: Collect the verified binary and source-bound receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-transfer"
          reports=maven-build-contract/target/surefire-reports
          find "$reports" -path '*/first/repository/*-all.jar' \
            -exec cp '{}' "$RUNNER_TEMP/sdk-transfer/regelsuche-optimization-sdk.jar" \;
          find "$reports" -path '*/first/*-qualification.json' \
            -exec cp '{}' "$RUNNER_TEMP/sdk-transfer/qualification.json" \;
          find "$reports" -name reproducibility.json \
            -exec cp '{}' "$RUNNER_TEMP/sdk-transfer/reproducibility.json" \;
          find "$reports" -name source-revision.txt \
            -exec cp '{}' "$RUNNER_TEMP/sdk-transfer/source-revision.txt" \;
      - uses: actions/upload-artifact@v7
        with:
          name: verified-sdk-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-transfer/
          if-no-files-found: error
          retention-days: 14
      - name: Retain SDK qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-transfer-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: maven-build-contract/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  sdk-stage:
    needs: sdk-prepare
    if: needs.sdk-prepare.result == 'success' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # SDK code only runs in the preceding read-only job. This job copies its
      # qualified bytes and writes a separate staging branch, never main or the PR.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-sdk-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-transfer
      - name: Stage the qualified SDK without moving the consumer branch
        shell: bash
        run: |
          set -euo pipefail
          transfer="$RUNNER_TEMP/sdk-transfer"
          revision="$(cat "$transfer/source-revision.txt")"
          cp "$transfer/regelsuche-optimization-sdk.jar" sandbox_math_cleanup/lib/regelsuche-optimization-sdk.jar
          cp "$transfer/qualification.json" sandbox_math_cleanup/lib/qualification.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sandbox_math_cleanup/lib/regelsuche-optimization-sdk.jar sandbox_math_cleanup/lib/qualification.json
          git commit -m "Stage verified Regelsuche SDK $revision"
          git push origin "HEAD:refs/heads/sdk-transfer/$revision"
          printf 'SDK transfer branch: sdk-transfer/%s\n' "$revision" >> "$GITHUB_STEP_SUMMARY"
