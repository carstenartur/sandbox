name: Distribution Smoke Test

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - '.github/actions/use-runner-maven/**'
      - '.github/scripts/smoke_test_distribution.sh'
      - '.github/scripts/validate_distribution_evidence.py'
      - '.github/workflows/distribution-smoke.yml'
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - '.github/actions/use-runner-maven/**'
      - '.github/scripts/smoke_test_distribution.sh'
      - '.github/scripts/validate_distribution_evidence.py'
      - '.github/workflows/distribution-smoke.yml'
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-and-update-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Use runner Maven
        uses: ./.github/actions/use-runner-maven
      - name: Verify preinstalled Eclipse desktop runtime
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for executable in xvfb-run Xvfb; do
            if ! command -v "$executable" >/dev/null 2>&1; then
              missing+=("executable:$executable")
            fi
          done

          packages=(
            xvfb xauth libgtk-3-0t64 libxext6 libxrender1 libxtst6 libxi6
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1
          )
          for package in "${packages[@]}"; do
            status="$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)"
            if [[ "$status" != "install ok installed" ]]; then
              missing+=("package:$package")
            fi
          done

          if ((${#missing[@]})); then
            echo "Missing Eclipse desktop runtime requirements:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "Eclipse desktop runtime requirements are installed."
      - name: Maven distribution build and verification
        shell: bash
        run: |
          set -o pipefail
          status=0
          xvfb-run --auto-servernum mvn \
            -Pdistribution \
            --batch-mode \
            -Dtycho.localArtifacts=ignore \
            clean verify 2>&1 \
            | tee /tmp/sandbox-distribution-maven.log || status=$?
          mkdir -p target/distribution-verification
          cp /tmp/sandbox-distribution-maven.log \
            target/distribution-verification/maven.log
          exit "$status"
      - name: Validate distribution evidence contract
        run: python3 .github/scripts/validate_distribution_evidence.py
      - name: Publish verification summary
        if: always() && hashFiles('target/distribution-verification/verification.md') != ''
        run: cat target/distribution-verification/verification.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distribution-smoke-${{ github.sha }}
          path: target/distribution-verification/
          retention-days: 30
          if-no-files-found: error
