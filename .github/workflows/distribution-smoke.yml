name: Distribution Smoke Test

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - '.github/scripts/smoke_test_distribution.sh'
      - '.github/workflows/distribution-smoke.yml'
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - '.github/scripts/smoke_test_distribution.sh'
      - '.github/workflows/distribution-smoke.yml'
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-and-update-site:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1
        with:
          maven-version: 3.9.14
      - name: Install Linux desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1
      - name: Maven distribution build and verification
        shell: bash
        run: |
          set -o pipefail
          status=0
          xvfb-run --auto-servernum mvn \
            -Pdistribution \
            --batch-mode \
            -Dtycho.localArtifacts=ignore \
            clean verify 2>&1 \
            | tee /tmp/sandbox-distribution-maven.log || status=$?
          mkdir -p target/distribution-verification
          cp /tmp/sandbox-distribution-maven.log \
            target/distribution-verification/maven.log
          exit "$status"
      - name: Publish verification summary
        if: always() && hashFiles('target/distribution-verification/verification.md') != ''
        run: cat target/distribution-verification/verification.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distribution-smoke-${{ github.sha }}
          path: target/distribution-verification/
          retention-days: 30
          if-no-files-found: error
