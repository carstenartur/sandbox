name: Qualify Sandbox modular inversion batching

on:
  push:
    branches: [ codex/verify-checked-field-inversion-adapter ]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run the production adapter against pinned BLS and Shamir sources
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -f qa/math-optimization/pom.xml
          -Dtest=JavaFieldBatchInversionTest,JavaFieldInversionTest,MathCleanUpOptionsTest,BouncyCastleRuntimeCorpusTest,BouncyCastleThresholdInversionTest
          -Dsandbox.math.bc.threshold.upstream=true test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: modular-batch-tests
          path: qa/math-optimization/target/surefire-reports/
          if-no-files-found: warn
