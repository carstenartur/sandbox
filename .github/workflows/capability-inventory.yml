name: Capability Inventory

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/capabilities.json'
      - 'docs/capabilities.md'
      - '.github/scripts/validate_capability_inventory.py'
      - '.github/workflows/capability-inventory.yml'
      - 'pom.xml'
      - 'README.md'
      - 'sandbox_*/META-INF/MANIFEST.MF'
      - 'sandbox_*_feature/feature.xml'
      - 'sandbox_product/sandbox.product'
      - 'sandbox_updatesite/category.xml'
  push:
    branches: [ main ]
    paths:
      - 'docs/capabilities.json'
      - 'docs/capabilities.md'
      - '.github/scripts/validate_capability_inventory.py'
      - '.github/workflows/capability-inventory.yml'
      - 'pom.xml'
      - 'README.md'
      - 'sandbox_*/META-INF/MANIFEST.MF'
      - 'sandbox_*_feature/feature.xml'
      - 'sandbox_product/sandbox.product'
      - 'sandbox_updatesite/category.xml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Synchronize README with Eclipse 2026-06
        if: github.event_name == 'pull_request' && github.head_ref == 'upgrade/eclipse-2026-06'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          content = path.read_bytes()
          old = b'2025-12'
          if old in content:
              path.write_bytes(content.replace(old, b'2026-06'))
          PY
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Document Eclipse 2026-06 as the repository baseline'
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate inventory and generated documentation
        shell: bash
        run: |
          set +e
          python3 .github/scripts/validate_capability_inventory.py --check \
            > capability-inventory-validation.log 2>&1
          status=$?
          cat capability-inventory-validation.log
          exit "$status"
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capability-inventory-validation
          path: capability-inventory-validation.log
          retention-days: 2
          if-no-files-found: error
