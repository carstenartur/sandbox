name: Test Source Inventory

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Refresh the static source inventory daily at 00:00 UTC.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-test-inventory:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Apply targeted Cleanup preview-shell repair
      if: >-
        github.event_name == 'pull_request' &&
        github.event.pull_request.number == 1513 &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'qa/atomic-int-to-enum-preview-gate'
      shell: bash
      run: |
        set -euo pipefail
        target='sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsSWTBotTest.java'
        git fetch --no-tags origin "$GITHUB_HEAD_REF"
        git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
        if grep -Fq 'private record CleanUpPreview' "$target"; then
          echo 'Targeted preview-shell repair is already present.'
          exit 0
        fi
        git apply --check .github/pr1513-preview-shell.patch
        git apply .github/pr1513-preview-shell.patch
        git diff --check -- "$target"
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -- "$target"
        git commit -m 'Resolve the actual Cleanup preview shell'
        git push origin "HEAD:$GITHUB_HEAD_REF"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Test lexical Java source scanner
      run: |
        python3 .github/scripts/test_generate_test_report_lexical.py

    - name: Generate static test source inventory
      run: |
        python3 .github/scripts/generate_test_report_lexical.py

    - name: Upload test source inventory as artifact
      uses: actions/upload-artifact@v7
      with:
        name: test-source-inventory
        path: |
          test-report.md
          test-report.json
          sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsSWTBotTest.java
        retention-days: 9

    - name: Display inventory summary
      run: |
        echo "## Static Test Source Inventory" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "> This workflow lexically scans Java code while ignoring comments, strings, character literals and text blocks. It does not compile or execute tests and is not a build-success signal. Use **Java CI with Maven** for authoritative build and test status." >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        cat test-report.md >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "---" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### Deployed historical reports" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "[View generated reports](https://carstenartur.github.io/sandbox/tests/)" >> "$GITHUB_STEP_SUMMARY"

    - name: Comment PR with static inventory
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v9
      with:
        script: |
          try {
            const fs = require('fs');
            const report = fs.readFileSync('test-report.md', 'utf8');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              (comment.body.includes('<!-- sandbox-test-source-inventory -->') ||
               comment.body.includes('# JUnit Test Overview Report'))
            );

            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commentBody = `<!-- sandbox-test-source-inventory -->\n> **Static source inventory only:** this workflow lexically scans Java code while ignoring comments, strings, character literals and text blocks. It does not compile or execute tests. The authoritative build/test signal is **Java CI with Maven**.\n\n${report}\n\n---\n*Generated by the [Test Source Inventory workflow](${workflowUrl})*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
          } catch (e) {
            core.warning('Could not post test source inventory comment: ' + e.message);
          }