name: Refresh canonical atomic preview baselines

on:
  push:
    branches:
      - test/dedicated-eclipse-help-swtbot-module
    paths:
      - '.github/workflows/refresh-atomic-preview-baselines.yml'

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    name: Commit verified canonical preview artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: test/dedicated-eclipse-help-swtbot-module
          fetch-depth: 0

      - name: Download immutable verifier artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9922522282/zip \
            --output atomic-preview-artifact.zip
          mkdir artifact
          unzip -q atomic-preview-artifact.zip -d artifact

      - name: Verify and stage only the two canonical images
        shell: bash
        run: |
          set -euo pipefail
          junit_source="$(find artifact -type f -path '*/sandbox_junit_cleanup_help/images/junit-coordinated-preview.png' -print -quit)"
          enum_source="$(find artifact -type f -path '*/sandbox_int_to_enum_help/images/int-to-enum-coordinated-preview.png' -print -quit)"
          test -n "$junit_source"
          test -n "$enum_source"

          echo "0a489df108855590375087131131646841245d10900a99a9c4775dac1f6034dd  $junit_source" | sha256sum --check --strict
          echo "2d73837c289b1fba9bd8040422d8c6f4f25060215a313f508246aafd12bbbf51  $enum_source" | sha256sum --check --strict

          junit_target='sandbox_junit_cleanup_help/images/junit-coordinated-preview.png'
          enum_target='sandbox_int_to_enum_help/images/int-to-enum-coordinated-preview.png'
          install -m 0644 "$junit_source" "$junit_target"
          install -m 0644 "$enum_source" "$enum_target"

          test "$(git hash-object "$junit_target")" = '85013323e9475cff02f4aac9af20032802a7296b'
          test "$(git hash-object "$enum_target")" = '61fdb4f10b599c0983764dea671e4e4a800a7dcb'

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > changed.txt
          printf '%s\n' "$enum_target" "$junit_target" | sort > expected.txt
          cmp expected.txt changed.txt

      - name: Commit refreshed baselines
        shell: bash
        run: |
          set -euo pipefail
          junit_target='sandbox_junit_cleanup_help/images/junit-coordinated-preview.png'
          enum_target='sandbox_int_to_enum_help/images/int-to-enum-coordinated-preview.png'
          if git diff --quiet -- "$junit_target" "$enum_target"; then
            echo 'The verified canonical baselines are already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$junit_target" "$enum_target"
          git commit -m 'Refresh canonical atomic preview baselines'
          git push origin HEAD:test/dedicated-eclipse-help-swtbot-module
