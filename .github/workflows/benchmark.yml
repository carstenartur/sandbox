name: Benchmark

on:
  push:
    branches:
      - main
    paths:
      - 'sandbox-benchmarks/**'
      - 'qa/math-optimization/**'
      - 'qa/upstream-cleanups/**'
      - 'sandbox_math_cleanup/**'
      - 'sandbox_math_cleanup_test/**'
      - 'sandbox-functional-converter-core/**'
      - 'sandbox-ast-api/**'
      - 'sandbox_common_test/src/org/sandbox/jdt/triggerpattern/test/policy/JUnitXmlInventoryComparator*.java'
      - 'sandbox_common_test/src/org/sandbox/jdt/triggerpattern/test/policy/PinnedGitRepository*.java'
      - '.github/workflows/benchmark.yml'
      - '.github/actions/provision-regelsuche/**'
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches:
      - main
  workflow_dispatch:
    inputs:
      jdt_upstream:
        description: Run complete pinned JDT Core/UI mathematics qualification
        type: boolean
        default: false
      cleanup_upstream:
        description: Run every registered cleanup on pinned Core/UI/SWT source corpora
        type: boolean
        default: false

jobs:
  guarded-root:
    needs: benchmark-scope
    if: needs.benchmark-scope.outputs.run == 'true'
    name: Source-discovered exact quadratic roots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.5+8'
          cache: maven
      - uses: ./.github/actions/provision-regelsuche
      - name: Qualify original upstream source and generated Java
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -f qa/math-optimization/pom.xml
          -Dtest=GuardedQuadraticRootSourceTest,BouncyCastleGuardedRootTest
          -Dsandbox.math.bc.root.upstream=true
          -Dsandbox.math.bc.root.output="${{ runner.temp }}/guarded-root" test
      - name: Check benchmark isolation, exact outputs and artifact freshness
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -f qa/math-optimization/pom.xml
          -Dtest=GuardedRootBenchmarkTest
          -Dsandbox.math.bc.root.benchmarkExport="${{ runner.temp }}/guarded-root" test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: guarded-root-qualification
          path: |
            qa/math-optimization/target/surefire-reports/**
            ${{ runner.temp }}/guarded-root/root-qualification.properties
            ${{ runner.temp }}/guarded-root/original/*.java
            ${{ runner.temp }}/guarded-root/generated/*.java
          retention-days: 14

  benchmark-scope:
    name: Check benchmark paths
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - id: paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            printf 'run=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | (.filename, (.previous_filename // empty))')
          benchmark_paths='^(sandbox-benchmarks|qa/math-optimization|qa/upstream-cleanups|sandbox_math_cleanup|sandbox_math_cleanup_test|sandbox-functional-converter-core|sandbox-ast-api)/'
          policy_paths='^sandbox_common_test/src/org/sandbox/jdt/triggerpattern/test/policy/(JUnitXmlInventoryComparator|PinnedGitRepository)[^/]*\.java$'
          if grep -Eq -e '^\.github/actions/provision-regelsuche/' -e "$benchmark_paths" -e "$policy_paths" -e '^\.github/workflows/benchmark\.yml$' <<< "$files"; then
            printf 'run=true\n' >> "$GITHUB_OUTPUT"
          fi

  swt-before-after:
    needs: benchmark-scope
    if: needs.benchmark-scope.outputs.run == 'true'
    name: Pinned SWT mathematics before and after
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      MAVEN_OPTS: -Declipse.p2.mirrors=false
      SWT_GTK4: '0'
      GDK_BACKEND: x11
    steps:
      - name: Checkout Sandbox
        uses: actions/checkout@v7
        with:
          path: sandbox
      - name: Checkout pinned SWT with its matching native binaries
        uses: actions/checkout@v7
        with:
          repository: eclipse-platform/eclipse.platform.swt
          ref: 221d1de66c33292400c91cbd17e3121f72b04ea3
          fetch-depth: 0
          lfs: true
          path: upstream/swt
      - name: Check out the matching Eclipse platform build inputs
        uses: actions/checkout@v7
        with:
          repository: eclipse-platform/eclipse.platform.releng.aggregator
          ref: dd305292a3ee34b4f592bbb0fa7c36fb8646bb71
          path: upstream/releng
          sparse-checkout: |
            eclipse-platform-parent
            eclipse.platform.releng.prereqs.sdk
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25.0.5+8'
          distribution: temurin
          cache: maven
          cache-dependency-path: sandbox/qa/math-optimization/pom.xml
      - name: Provision the pinned mathematics SDK
        uses: ./sandbox/.github/actions/provision-regelsuche
        with:
          sandbox-directory: sandbox

      - name: Install GTK and headless display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-daemon libgtk-3-0 libwebkit2gtk-4.1-0 ripgrep
      - name: Verify pinned sources and produce ordinary Apply patch
        working-directory: sandbox
        env:
          # This gate reads pinned Java sources and compiles against hashed P2 jars.
          # The separate upstream checkout above retains its real native binaries.
          GIT_LFS_SKIP_SMUDGE: '1'
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -f qa/math-optimization/pom.xml
          -Dtest=SwtCurrentSourceRefinementTest
          -Dsandbox.math.swt.current=true test
      - name: Execute changed JPEG, TIFF and native renderer methods
        working-directory: sandbox
        run: >-
          dbus-run-session -- xvfb-run -a
          ./mvnw --batch-mode --no-transfer-progress
          -f qa/math-optimization/pom.xml
          -Dtest=SwtChangedMethodsTest
          -Dsandbox.math.swt.methods=true
          -Dsandbox.math.swt.methods.binary=${{ github.workspace }}/sandbox/qa/math-optimization/target/org.eclipse.swt.gtk.linux.x86_64_3.136.0.v20261029-1803.jar
          -Dsandbox.math.swt.methods.sources=${{ github.workspace }}/sandbox/qa/math-optimization/target/org.eclipse.swt.gtk.linux.x86_64.source_3.136.0.v20261029-1803.jar
          test
      - name: Run complete upstream Linux GTK tests before and after
        run: >-
          bash sandbox/qa/math-optimization/run-swt-before-after.sh
          upstream/swt swt-evidence "${{ github.workspace }}/sandbox/mvnw"
      - name: Retain source, patch and all test outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swt-math-before-after
          path: |
            swt-evidence/
            sandbox/qa/math-optimization/target/swt-current-patch/
            sandbox/qa/math-optimization/target/surefire-reports/
            upstream/swt/**/target/surefire-reports/

  jdt-product:
    name: Build product for upstream cleanup qualification
    concurrency:
      group: ${{ github.workflow }}-jdt-product-${{ github.ref }}
      cancel-in-progress: true
    if: >-
      (github.event.action != 'labeled' ||
       github.event.label.name == 'math-upstream-qa' ||
       github.event.label.name == 'cleanup-upstream-qa') &&
      (inputs.jdt_upstream == true || inputs.cleanup_upstream == true ||
       (github.event_name == 'pull_request' &&
        (contains(github.event.pull_request.labels.*.name, 'math-upstream-qa') ||
         contains(github.event.pull_request.labels.*.name, 'cleanup-upstream-qa'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      MAVEN_OPTS: -Declipse.p2.mirrors=false
    steps:
      - uses: actions/checkout@v7
        with:
          path: sandbox
      - uses: actions/setup-java@v6
        with:
          java-version: '25.0.5+8'
          distribution: temurin
      - name: Restore shared reactor dependencies
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('sandbox/**/pom.xml', 'sandbox/sandbox_target/*.target') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Provision the pinned mathematics SDK
        uses: ./sandbox/.github/actions/provision-regelsuche
        with:
          sandbox-directory: sandbox

      - name: Record bootstrap dependency availability
        run: |
          curl --silent --show-error --head --max-time 60 \
            https://repo.maven.apache.org/maven2/org/eclipse/tycho/tycho-maven-plugin/5.0.4/tycho-maven-plugin-5.0.4.jar
          curl --silent --show-error --head --max-time 60 \
            https://repo.maven.apache.org/maven2/org/junit/junit-bom/6.1.3/junit-bom-6.1.3.pom
      - name: Materialize the product from this checkout
        working-directory: sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../jdt-product
          git rev-parse HEAD > ../jdt-product/source-commit.txt
          ./mvnw --batch-mode --no-transfer-progress --errors --show-version -Pproduct \
            -Dsandbox.tycho.linux-only=true \
            -DskipTests -Dspotbugs.skip=true -Dtycho.localArtifacts=ignore \
            clean package 2>&1 | tee ../jdt-product/build.log
          git diff --exit-code HEAD
          mapfile -d '' launchers < <(find sandbox_product/target/products -type f \
            -path '*/linux/gtk/x86_64/eclipse' -perm -u+x -print0)
          test "${#launchers[@]}" -eq 1
          product=$(dirname "${launchers[0]}")
          shopt -s nullglob
          adapters=("$product"/plugins/sandbox_math_cleanup_[0-9]*.jar)
          test "${#adapters[@]}" -eq 1
          sha256sum "${adapters[0]}" | cut -d ' ' -f 1 > ../jdt-product/adapter-sha256.txt
          tar -czf ../jdt-product/product.tar.gz -C "$product" .
          cd ../jdt-product
          sha256sum product.tar.gz source-commit.txt adapter-sha256.txt > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jdt-math-product
          path: jdt-product/
          if-no-files-found: error

  jdt-before-after:
    name: Pinned JDT ${{ matrix.family }} mathematics before and after
    needs: jdt-product
    if: >-
      (github.event.action != 'labeled' ||
       github.event.label.name == 'math-upstream-qa') &&
      (inputs.jdt_upstream == true ||
       (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'math-upstream-qa')))
    concurrency:
      group: ${{ github.workflow }}-jdt-${{ matrix.family }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        family: [core, ui]
    permissions:
      contents: read
    env:
      MAVEN_OPTS: -Declipse.p2.mirrors=false
      SWT_GTK4: '0'
      GDK_BACKEND: x11
    steps:
      - uses: actions/checkout@v7
        with:
          path: sandbox
      - name: Provide the official JDT Java toolchains
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25.0.5+8
          mvn-toolchain-id: |
            JavaSE-1.8
            JavaSE-17
            JavaSE-21
            JavaSE-25
          cache: maven
          cache-dependency-path: sandbox/qa/math-optimization/pom.xml
      - name: Provision the pinned mathematics SDK
        uses: ./sandbox/.github/actions/provision-regelsuche
        with:
          sandbox-directory: sandbox

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-daemon libgtk-3-0 libwebkit2gtk-4.1-0 ripgrep
      - uses: actions/download-artifact@v8
        with:
          name: jdt-math-product
          path: jdt-product
      - name: Verify and unpack this run's product
        run: |
          set -euo pipefail
          cd jdt-product
          sha256sum -c SHA256SUMS
          test "$(cat source-commit.txt)" = "$(git -C ../sandbox rev-parse HEAD)"
          mkdir eclipse
          tar -xzf product.tar.gz -C eclipse
      - name: Verify Apply, complete upstream tests and loaded reactor classes
        working-directory: sandbox
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress -f qa/math-optimization/pom.xml \
            -Dtest=JdtMathQualificationTest#pinnedOfficialReactorsPreserveBehavior \
            -Dsandbox.math.jdt.family=${{ matrix.family }} \
            -Dsandbox.math.jdt.product="$GITHUB_WORKSPACE/jdt-product/eclipse" \
            -Dsandbox.math.jdt.productCommit="$(cat ../jdt-product/source-commit.txt)" \
            -Dsandbox.math.jdt.adapterSha256="$(cat ../jdt-product/adapter-sha256.txt)" \
            -Dsandbox.math.jdt.output="$GITHUB_WORKSPACE/jdt-evidence-${{ matrix.family }}" \
            -Dsandbox.math.jdt.maven="$GITHUB_WORKSPACE/sandbox/mvnw" test
      - name: Retain all upstream evidence, including failed phases
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jdt-math-before-after-${{ matrix.family }}
          include-hidden-files: true
          path: |
            jdt-evidence-${{ matrix.family }}/
            sandbox/qa/math-optimization/target/surefire-reports/

  cleanup-corpus:
    name: Pinned ${{ matrix.family }} all-cleanup corpus
    needs: jdt-product
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'cleanup-upstream-qa') &&
      (inputs.cleanup_upstream == true ||
       (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'cleanup-upstream-qa')))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        family: [core, ui, swt]
    permissions:
      contents: read
    env:
      MAVEN_OPTS: -Declipse.p2.mirrors=false
      SWT_GTK4: '0'
      GDK_BACKEND: x11
    steps:
      - uses: actions/checkout@v7
        with:
          path: sandbox
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - name: Restore shared reactor dependencies
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('sandbox/**/pom.xml', 'sandbox/sandbox_target/*.target') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Install native display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-daemon libgtk-3-0 libwebkit2gtk-4.1-0
      - uses: actions/download-artifact@v8
        with:
          name: jdt-math-product
          path: jdt-product
      - name: Verify cleanup application and compiler diagnostic preservation
        working-directory: sandbox
        run: >-
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1024x24 -noreset'
          ./mvnw --batch-mode --no-transfer-progress -f qa/upstream-cleanups/pom.xml
          -Dsandbox.cleanup.family=${{ matrix.family }}
          -Dsandbox.cleanup.productArtifact="$GITHUB_WORKSPACE/jdt-product"
          -Dsandbox.cleanup.output="$GITHUB_WORKSPACE/cleanup-evidence-${{ matrix.family }}"
          test
      - name: Retain corpus inputs, changes and diagnostics on every outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cleanup-corpus-${{ matrix.family }}
          include-hidden-files: true
          path: |
            cleanup-evidence-${{ matrix.family }}/
            sandbox/qa/upstream-cleanups/target/surefire-reports/

  benchmark:
    needs: benchmark-scope
    if: needs.benchmark-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25.0.5+8'
          distribution: 'temurin'
          cache: maven
          
      - name: Provision the pinned mathematics SDK
        uses: ./.github/actions/provision-regelsuche

      - name: Install Parent POM
        run: mvn install -N -DskipTests
          
      - name: Build Core Module
        working-directory: sandbox-functional-converter-core
        run: mvn clean install -DskipTests
        
      - name: Build AST API Module
        working-directory: sandbox-ast-api
        run: mvn clean install -DskipTests
        
      - name: Build Benchmark Module
        working-directory: sandbox-benchmarks
        run: mvn clean package
        
      - name: Run Benchmarks
        run: |
          java -jar sandbox-benchmarks/target/benchmarks.jar -foe true -rf json -rff sandbox-benchmarks/target/jmh-result.json

      - name: Qualify Bouncy Castle mathematics
        run: mvn -f qa/math-optimization/pom.xml clean verify -Pbc-corpus,bc-benchmark
          
      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: |
            sandbox-benchmarks/target/jmh-result.json
            sandbox-benchmarks/target/jmh-result.txt

      - name: Upload Bouncy Castle qualification
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bc-math-qualification
          path: |
            qa/math-optimization/target/bc-hash-to-curve.json
            qa/math-optimization/target/bc-performance-review.json
            qa/math-optimization/target/bc-*/review.json
            qa/math-optimization/target/bc-*/benchmark.properties
            qa/math-optimization/target/bc-*/COMPLETED
            qa/math-optimization/target/bc-*/original/
            qa/math-optimization/target/bc-*/generated/
            qa/math-optimization/target/bc-*/evidence/
            qa/math-optimization/target/surefire-reports/

  store-results:
    needs: benchmark
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release-workflow' || format('benchmark-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write       # Required: auto-push benchmark results to gh-pages
      deployments: write    # Required: create deployment status for benchmark
      pull-requests: write  # Required: post alert comments on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          path: sandbox-benchmarks/target
      - name: Store Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: JMH Benchmarks
          tool: 'jmh'
          output-file-path: sandbox-benchmarks/target/jmh-result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          alert-threshold: '115%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@carstenartur'
          
      - name: Report Deployed URL
        if: always()
        run: |
          echo "### 🔗 Deployed Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 [View Performance Charts](https://carstenartur.github.io/sandbox/dev/bench/)" >> $GITHUB_STEP_SUMMARY
