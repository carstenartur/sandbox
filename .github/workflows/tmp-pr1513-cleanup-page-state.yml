name: Apply PR 1513 Cleanup preview page-state fix

on:
  push:
    branches:
      - qa/atomic-int-to-enum-preview-gate
    paths:
      - sandbox_usage_view_test/pr1513-cleanup-page-state.trigger

permissions:
  contents: write

concurrency:
  group: pr1513-cleanup-preview-page-state
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: qa/atomic-int-to-enum-preview-gate
          fetch-depth: 0

      - name: Apply reviewed wizard-page patch
        shell: bash
        env:
          PATCH_GZIP_BASE64: ''
        run: |
          set -euo pipefail
          target='sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsSWTBotTest.java'
          workflow='.github/workflows/tmp-pr1513-cleanup-page-state.yml'
          trigger='sandbox_usage_view_test/pr1513-cleanup-page-state.trigger'
          patch="$RUNNER_TEMP/pr1513-cleanup-page-state.patch"
          expected_before='7d79115d530996ba100c3bee68be5187751cea3e'
          expected_after='9db821e3092870e6820746224b4034a3eed57468'
          expected_patch_sha256='fdcf3f3b3221f2695704c72ecf42fd70fcc5dd9d81ec22bc2449ad2e4a8a9a43'

          actual_before="$(git hash-object "$target")"
          if [[ "$actual_before" != "$expected_before" ]]; then
            echo "::error::Refusing to patch unexpected source blob $actual_before"
            exit 1
          fi

          python3 - "$patch" <<'PY'
          import base64
          import gzip
          import os
          import pathlib
          import sys

          compressed = base64.b64decode(os.environ['PATCH_GZIP_BASE64'])
          pathlib.Path(sys.argv[1]).write_bytes(gzip.decompress(compressed))
          PY

          test "$(sha256sum "$patch" | awk '{print $1}')" = "$expected_patch_sha256"
          git apply --check "$patch"
          git apply "$patch"
          git diff --check

          actual_after="$(git hash-object "$target")"
          if [[ "$actual_after" != "$expected_after" ]]; then
            echo "::error::Patched source blob $actual_after differs from reviewed $expected_after"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          git rm -- "$workflow" "$trigger"
          git commit -m 'Handle Cleanup status page before atomic preview'
          git push origin HEAD:qa/atomic-int-to-enum-preview-gate
