name: Apply PR 1464 Code Patterns screenshot fix

on:
  push:
    branches:
      - feature/coordinated-cleanup-preview
    paths:
      - '.github/workflows/apply-pr1464-code-patterns-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove all widget access from Code Patterns stabilization
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsSWTBotTest.java')
          text = path.read_text(encoding='utf-8')

          constant = '    private static final String HINT_FILE_CLEANUP_LABEL = "Apply transformation rules from .sandbox-hint files";\n'
          if text.count(constant) != 1:
              raise SystemExit('Expected exactly one obsolete Code Patterns checkbox label constant')
          text = text.replace(constant, '')

          old_prefix = '''    private static void stabilizeHintFileCleanup(SWTBotShell profileDialog) {
        var hintFileCleanup = profileDialog.bot().checkBox(HINT_FILE_CLEANUP_LABEL);
        assertTrue(hintFileCleanup.isChecked(),
                "Code Patterns screenshot profile must enable .sandbox-hint cleanup");

'''
          new_prefix = '''    private static void stabilizeHintFileCleanup(SWTBotShell profileDialog) {
'''
          if text.count(old_prefix) != 1:
              raise SystemExit('Expected exactly one obsolete Code Patterns checkbox interaction')
          text = text.replace(old_prefix, new_prefix)

          old_loop = '''        for (CleanupTab tab : CLEANUP_TABS) {
            profileDialog.bot().tabItem(tab.label()).activate();
            if ("Code Patterns (Sandbox)".equals(tab.label())) {
                stabilizeHintFileCleanup(profileDialog);
            } else {
                bot.sleep(300);
            }
            capture(profileDialog, tab.helpBundle(), tab.fileName());
        }
'''
          new_loop = '''        for (CleanupTab tab : CLEANUP_TABS) {
            System.out.println("[help-screenshots] Activating cleanup tab: " + tab.label());
            profileDialog.bot().tabItem(tab.label()).activate();
            if ("Code Patterns (Sandbox)".equals(tab.label())) {
                stabilizeHintFileCleanup(profileDialog);
            } else {
                bot.sleep(300);
            }
            capture(profileDialog, tab.helpBundle(), tab.fileName());
            System.out.println("[help-screenshots] Captured cleanup tab: " + tab.label());
        }
'''
          if text.count(old_loop) != 1:
              raise SystemExit('Expected exactly one cleanup-tab capture loop')
          text = text.replace(old_loop, new_loop)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit the focused SWTBot correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Carsten Hammer'
          git config user.email 'carsten.hammer@t-online.de'
          git add sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsSWTBotTest.java
          git commit -m 'Avoid Code Patterns widget access during Help capture'
          git push origin "HEAD:${GITHUB_REF_NAME}"
