name: Apply PR 1464 Code Patterns screenshot fix

on:
  push:
    branches:
      - feature/coordinated-cleanup-preview
    paths:
      - '.github/workflows/apply-pr1464-code-patterns-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove all widget access from Code Patterns stabilization
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path('sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsSWTBotTest.java')
          text = path.read_text(encoding='utf-8')

          constant = '    private static final String HINT_FILE_CLEANUP_LABEL = "Apply transformation rules from .sandbox-hint files";\n'
          if text.count(constant) != 1:
              raise SystemExit('Expected exactly one obsolete Code Patterns checkbox label constant')
          text = text.replace(constant, '')

          prefix_pattern = re.compile(r'    private static void stabilizeHintFileCleanup\(SWTBotShell profileDialog\) \{\n        var hintFileCleanup = profileDialog\.bot\(\)\.checkBox\(HINT_FILE_CLEANUP_LABEL\);\n        assertTrue\(hintFileCleanup\.isChecked\(\),\n                "Code Patterns screenshot profile must enable \.sandbox-hint cleanup"\);\n\n')
          text, prefix_count = prefix_pattern.subn('    private static void stabilizeHintFileCleanup(SWTBotShell profileDialog) {\n', text, count=1)
          if prefix_count != 1:
              raise SystemExit('Expected exactly one obsolete Code Patterns checkbox interaction')

          loop_pattern = re.compile(r'        for \(CleanupTab tab : CLEANUP_TABS\) \{\n            profileDialog\.bot\(\)\.tabItem\(tab\.label\(\)\)\.activate\(\);\n            if \("Code Patterns \(Sandbox\)"\.equals\(tab\.label\(\)\)\) \{\n                stabilizeHintFileCleanup\(profileDialog\);\n            \} else \{\n                bot\.sleep\(300\);\n            \}\n            capture\(profileDialog, tab\.helpBundle\(\), tab\.fileName\(\)\);\n        \}\n')
          replacement = '        for (CleanupTab tab : CLEANUP_TABS) {\n            System.out.println("[help-screenshots] Activating cleanup tab: " + tab.label());\n            profileDialog.bot().tabItem(tab.label()).activate();\n            if ("Code Patterns (Sandbox)".equals(tab.label())) {\n                stabilizeHintFileCleanup(profileDialog);\n            } else {\n                bot.sleep(300);\n            }\n            capture(profileDialog, tab.helpBundle(), tab.fileName());\n            System.out.println("[help-screenshots] Captured cleanup tab: " + tab.label());\n        }\n'
          text, loop_count = loop_pattern.subn(replacement, text, count=1)
          if loop_count != 1:
              raise SystemExit('Expected exactly one cleanup-tab capture loop')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit the focused SWTBot correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Carsten Hammer'
          git config user.email 'carsten.hammer@t-online.de'
          git add sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsSWTBotTest.java
          git commit -m 'Avoid Code Patterns widget access during Help capture'
          git push origin "HEAD:${GITHUB_REF_NAME}"
