name: Apply upstream QA contract hardening

on:
  push:
    branches:
      - feature/oomph-upstream-jdt-migration-qa-final
    paths:
      - '.github/workflows/apply-upstream-qa-contract-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Unify the Oomph and runner pin contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          setup_path = Path('sandbox_oomph/jdt-migration-qa.setup')
          text = setup_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''  <setupTask
                    xsi:type="setup:VariableTask"
                    name="sandbox.qa.eclipse.release"
                    value="2026-06"
                    storageURI="scope://Workspace"/>
          ''',
              '''  <setupTask
                    xsi:type="setup:VariableTask"
                    name="sandbox.qa.eclipse.release"
                    value="2026-06"
                    storageURI="scope://Workspace"/>
            <setupTask
                    xsi:type="setup:VariableTask"
                    name="sandbox.qa.eclipse.platform.version"
                    value="4.40"
                    storageURI="scope://Workspace"/>
            <setupTask
                    xsi:type="setup:VariableTask"
                    name="sandbox.qa.jdt.core.repository"
                    value="https://github.com/eclipse-jdt/eclipse.jdt.core.git"
                    storageURI="scope://Workspace"/>
          ''',
              'Eclipse and JDT Core variables')
          replace_once(
              '''  <setupTask
                    xsi:type="setup:VariableTask"
                    name="sandbox.qa.jdt.ui.ref"
          ''',
              '''  <setupTask
                    xsi:type="setup:VariableTask"
                    name="sandbox.qa.jdt.ui.repository"
                    value="https://github.com/eclipse-jdt/eclipse.jdt.ui.git"
                    storageURI="scope://Workspace"/>
            <setupTask
                    xsi:type="setup:VariableTask"
                    name="sandbox.qa.jdt.ui.ref"
          ''',
              'JDT UI repository variable')
          replace_once(
              '''  <setupTask
                    xsi:type="setup:VariableTask"
                    name="sandbox.qa.jdt.core.binaries.ref"
          ''',
              '''  <setupTask
                    xsi:type="setup:VariableTask"
                    name="sandbox.qa.jdt.core.binaries.repository"
                    value="https://github.com/eclipse-jdt/eclipse.jdt.core.binaries.git"
                    storageURI="scope://Workspace"/>
            <setupTask
                    xsi:type="setup:VariableTask"
                    name="sandbox.qa.jdt.core.binaries.ref"
          ''',
              'JDT Core binaries repository variable')
          replace_once(
              '''  <setupTask
                    xsi:type="git:GitCloneTask"
                    id="github.clone.sandbox.qa"
          ''',
              '''  <setupTask
                    xsi:type="setup:VariableTask"
                    name="sandbox.qa.primary.project"
                    value="org.eclipse.jdt.apt.tests"
                    storageURI="scope://Workspace"/>
            <setupTask
                    xsi:type="setup:VariableTask"
                    name="sandbox.qa.primary.source"
                    value="org.eclipse.jdt.apt.tests/src"
                    storageURI="scope://Workspace"/>
            <setupTask
                    xsi:type="setup:VariableTask"
                    name="sandbox.qa.primary.test.pom"
                    value="org.eclipse.jdt.apt.tests/pom.xml"
                    storageURI="scope://Workspace"/>

            <setupTask
                    xsi:type="git:GitCloneTask"
                    id="github.clone.sandbox.qa"
          ''',
              'primary corpus variables')
          text = text.replace(
              'remoteURI="https://github.com/eclipse-jdt/eclipse.jdt.core.git"',
              'remoteURI="${sandbox.qa.jdt.core.repository}"')
          text = text.replace(
              'remoteURI="https://github.com/eclipse-jdt/eclipse.jdt.ui.git"',
              'remoteURI="${sandbox.qa.jdt.ui.repository}"')
          text = text.replace(
              'remoteURI="https://github.com/eclipse-jdt/eclipse.jdt.core.binaries.git"',
              'remoteURI="${sandbox.qa.jdt.core.binaries.repository}"')
          text = text.replace(
              'url="https://download.eclipse.org/releases/2026-06/"',
              'url="https://download.eclipse.org/releases/${sandbox.qa.eclipse.release}/"')
          text = text.replace(
              'url="https://download.eclipse.org/tools/orbit/simrel/orbit-aggregation/2026-06/"',
              'url="https://download.eclipse.org/tools/orbit/simrel/orbit-aggregation/${sandbox.qa.eclipse.release}/"')

          start = text.index('    <content>\n      PIN_ECLIPSE_RELEASE=2026-06')
          end = text.index('    </content>', start) + len('    </content>')
          full_pins = '''    <content>
                PIN_ECLIPSE_RELEASE=${sandbox.qa.eclipse.release}
                PIN_ECLIPSE_PLATFORM_VERSION=${sandbox.qa.eclipse.platform.version}
                PIN_JDT_CORE_REPOSITORY=${sandbox.qa.jdt.core.repository}
                PIN_JDT_CORE_REF=${sandbox.qa.jdt.core.ref}
                PIN_JDT_CORE_COMMIT=${sandbox.qa.jdt.core.commit}
                PIN_JDT_UI_REPOSITORY=${sandbox.qa.jdt.ui.repository}
                PIN_JDT_UI_REF=${sandbox.qa.jdt.ui.ref}
                PIN_JDT_UI_COMMIT=${sandbox.qa.jdt.ui.commit}
                PIN_JDT_CORE_BINARIES_REPOSITORY=${sandbox.qa.jdt.core.binaries.repository}
                PIN_JDT_CORE_BINARIES_REF=${sandbox.qa.jdt.core.binaries.ref}
                PIN_JDT_CORE_BINARIES_COMMIT=${sandbox.qa.jdt.core.binaries.commit}
                PIN_PRIMARY_PROJECT=${sandbox.qa.primary.project}
                PIN_PRIMARY_SOURCE=${sandbox.qa.primary.source}
                PIN_PRIMARY_TEST_POM=${sandbox.qa.primary.test.pom}
              </content>'''
          text = text[:start] + full_pins + text[end:]
          setup_path.write_text(text, encoding='utf-8')

          runner_path = Path('qa/upstream-jdt/run-before-after.sh')
          runner = runner_path.read_text(encoding='utf-8')
          lock_check = '''if [[ -e "$OOMPH_WORKSPACE/.metadata/.lock" ]]; then
            fail "The Eclipse workspace is still locked; close the workbench before QA: $OOMPH_WORKSPACE"
          fi
          '''
          if runner.count(lock_check) != 1:
              raise SystemExit('runner workspace lock check marker not found exactly once')
          runner = runner.replace(lock_check, '', 1)
          runner_path.write_text(runner, encoding='utf-8')

          readme_path = Path('qa/upstream-jdt/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'Compare `.sandbox-jdt-migration-qa-pins.env` in the workspace with `pins.env`.',
              'The runner parses `.sandbox-jdt-migration-qa-pins.env` and requires its complete `PIN_*` map to equal `pins.env` before any source is changed.')
          readme_path.write_text(readme, encoding='utf-8')

          Path('.github/workflows/apply-upstream-qa-contract-hardening.yml').unlink()
          PY

          git diff --check

      - name: Commit contract hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify Oomph pins and harden upstream QA evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
