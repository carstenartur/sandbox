name: Merge current main into preview branch

on:
  push:
    branches:
      - feature/coordinated-cleanup-preview
    paths:
      - '.github/workflows/merge-main-into-preview.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feature/coordinated-cleanup-preview

      - name: Merge current main and resolve the two audited conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if ((merge_status != 0)); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(
              '.github/workflows/eclipse-help-screenshots.yml'
              'sandbox_junit_cleanup_help/images/junit-migration-cleanup.png'
            )
            if [[ "${conflicts[*]}" != "${expected[*]}" ]]; then
              echo 'Unexpected merge conflicts:' >&2
              printf '  %s\n' "${conflicts[@]}" >&2
              git diff --cc >&2 || true
              exit 1
            fi

            python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/eclipse-help-screenshots.yml')
          text = path.read_text(encoding='utf-8')
          start = '<<<<<<< HEAD\n'
          middle = '=======\n'
          end = '>>>>>>> origin/main\n'
          if text.count(start) != 1 or text.count(middle) != 1 or text.count(end) != 1:
              raise SystemExit('Unexpected Help workflow conflict-marker shape')
          before, remainder = text.split(start, 1)
          ours, remainder = remainder.split(middle, 1)
          theirs, after = remainder.split(end, 1)
          if 'Verify the temporary merge-gate test executed' not in ours:
              raise SystemExit('The PR-specific Help merge gate is missing from our conflict side')
          if 'Restore deferred real-preview images' not in ours:
              raise SystemExit('The deferred-preview restoration is missing from our conflict side')
          if 'Commit regenerated JUnit screenshot on the extraction branch' not in theirs:
              raise SystemExit('The superseded extraction-branch helper is missing from the main conflict side')
          path.write_text(before + ours + after, encoding='utf-8')
          PY

            # #1464 does not change the JUnit preset UI. The current main image is
            # therefore authoritative after importing #1472.
            git checkout --theirs -- \
              sandbox_junit_cleanup_help/images/junit-migration-cleanup.png
            git add \
              .github/workflows/eclipse-help-screenshots.yml \
              sandbox_junit_cleanup_help/images/junit-migration-cleanup.png

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo 'Unresolved conflicts remain:' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
          fi

          rm .github/workflows/merge-main-into-preview.yml
          git add -A
          git diff --cached --check
          git commit -m 'Merge current main into coordinated Cleanup preview'
          git push origin HEAD:feature/coordinated-cleanup-preview
