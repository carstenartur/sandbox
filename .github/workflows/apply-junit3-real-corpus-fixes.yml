name: Apply real-corpus JUnit 3 fixes

on:
  push:
    branches:
      - feature/oomph-upstream-jdt-migration-qa-final
    paths:
      - '.github/workflows/apply-junit3-real-corpus-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply fail-closed real-corpus support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          def replace_section(text: str, start: str, end: str, replacement: str, label: str) -> str:
              begin = text.find(start)
              if begin < 0:
                  raise SystemExit(f'{label}: start marker not found')
              finish = text.find(end, begin)
              if finish < 0:
                  raise SystemExit(f'{label}: end marker not found')
              return text[:begin] + replacement + text[finish:]

          test_path = 'sandbox_junit_cleanup/src/org/sandbox/jdt/internal/corext/fix/helper/TestJUnit3Plugin.java'
          text = read(test_path)
          text = replace_once(text,
              'import org.eclipse.jdt.core.IType;\n',
              'import org.eclipse.jdt.core.ICompilationUnit;\nimport org.eclipse.jdt.core.IJavaElement;\nimport org.eclipse.jdt.core.IType;\n',
              'TestJUnit3Plugin Java model imports')
          text = replace_once(text,
              'import org.eclipse.jdt.core.dom.ASTVisitor;\n',
              'import org.eclipse.jdt.core.dom.ASTParser;\nimport org.eclipse.jdt.core.dom.ASTVisitor;\n',
              'TestJUnit3Plugin parser import')
          text = replace_once(text,
              'import org.eclipse.jdt.core.dom.MethodInvocation;\n',
              'import org.eclipse.jdt.core.dom.MethodInvocation;\nimport org.eclipse.jdt.core.dom.NodeFinder;\n',
              'TestJUnit3Plugin node finder import')
          text = replace_once(text,
              'import org.sandbox.jdt.internal.corext.fix.helper.lib.JUnit3MigrationExclusions;\n',
              'import org.sandbox.jdt.internal.corext.fix.helper.lib.JUnit3LegacyShape;\nimport org.sandbox.jdt.internal.corext.fix.helper.lib.JUnit3MigrationExclusions;\nimport org.sandbox.jdt.internal.corext.fix.helper.lib.JUnit3SuiteModel;\n',
              'TestJUnit3Plugin legacy helper imports')

          safe_candidate = '''\tprivate boolean isSafeStandaloneCandidate(TypeDeclaration node) {
          \t\tITypeBinding binding= node.resolveBinding();
          \t\tITypeBinding superclass= binding == null ? null : binding.getSuperclass();
          \t\tif (binding == null || superclass == null || !node.isPackageMemberTypeDeclaration()
          \t\t\t\t|| !(node.getRoot() instanceof CompilationUnit root) || root.types().size() != 1
          \t\t\t\t|| !Modifier.isPublic(node.getModifiers()) || Modifier.isAbstract(node.getModifiers())
          \t\t\t\t|| !JUNIT3_TEST_CASE.equals(superclass.getErasure().getQualifiedName())
          \t\t\t\t|| hasJUnitAnnotation(node) || !(binding.getJavaElement() instanceof IType type)) {
          \t\t\treturn false;
          \t\t}
          \t\tif (JUnit3MigrationExclusions.isExcluded(binding)
          \t\t\t\t|| hasKnownSubtypes(type) || hasUnsafeReferences(type) || hasUnsupportedTestCaseUsage(node)) {
          \t\t\treturn false;
          \t\t}

          \t\tboolean testFound= false;
          \t\tfor (MethodDeclaration method : node.getMethods()) {
          \t\t\tif (method.isConstructor()) {
          \t\t\t\tif (!JUnit3LegacyShape.isRemovableConstructor(method)) {
          \t\t\t\t\treturn false;
          \t\t\t\t}
          \t\t\t\tcontinue;
          \t\t\t}
          \t\t\tif (hasJUnitAnnotation(method)) {
          \t\t\t\treturn false;
          \t\t\t}
          \t\t\tif (JUnit3SuiteModel.isSuiteBuilder(method)) {
          \t\t\t\tif (!JUnit3LegacyShape.isSelfSuite(method, node)) {
          \t\t\t\t\treturn false;
          \t\t\t\t}
          \t\t\t\tcontinue;
          \t\t\t}
          \t\t\tString name= method.getName().getIdentifier();
          \t\t\tif (CUSTOM_EXECUTION_METHODS.contains(name)) {
          \t\t\t\treturn false;
          \t\t\t}
          \t\t\tif (name.startsWith("test")) { //$NON-NLS-1$
          \t\t\t\tif (!isTestMethod(method)) {
          \t\t\t\t\treturn false;
          \t\t\t\t}
          \t\t\t\ttestFound= true;
          \t\t\t} else if (("setUp".equals(name) || "tearDown".equals(name)) //$NON-NLS-1$ //$NON-NLS-2$
          \t\t\t\t\t&& !isLifecycleMethod(method, name)) {
          \t\t\t\treturn false;
          \t\t\t}
          \t\t}
          \t\treturn testFound;
          \t}
          '''
          text = replace_section(text,
              '\tprivate boolean isSafeStandaloneCandidate(TypeDeclaration node) {',
              '\n\tprivate boolean hasKnownSubtypes', safe_candidate,
              'TestJUnit3Plugin safe candidate')

          reference_policy = '''\tprivate boolean hasUnsafeReferences(IType type) {
          \t\tSearchPattern pattern= SearchPattern.createPattern(type, IJavaSearchConstants.REFERENCES);
          \t\tif (pattern == null) {
          \t\t\treturn true;
          \t\t}
          \t\tboolean[] unsafe= { false };
          \t\tICompilationUnit declarationUnit= type.getCompilationUnit();
          \t\ttry {
          \t\t\tnew SearchEngine().search(pattern,
          \t\t\t\t\tnew SearchParticipant[] { SearchEngine.getDefaultSearchParticipant() },
          \t\t\t\t\tSearchEngine.createWorkspaceScope(), new SearchRequestor() {
          \t\t\t\t\t\t@Override
          \t\t\t\t\t\tpublic void acceptSearchMatch(SearchMatch match) {
          \t\t\t\t\t\t\tif (unsafe[0]) {
          \t\t\t\t\t\t\t\treturn;
          \t\t\t\t\t\t\t}
          \t\t\t\t\t\t\tif (match.getAccuracy() != SearchMatch.A_ACCURATE
          \t\t\t\t\t\t\t\t\t|| !(match.getElement() instanceof IJavaElement element)
          \t\t\t\t\t\t\t\t\t|| !(element.getAncestor(IJavaElement.COMPILATION_UNIT) instanceof ICompilationUnit unit)) {
          \t\t\t\t\t\t\t\tunsafe[0]= true;
          \t\t\t\t\t\t\t\treturn;
          \t\t\t\t\t\t\t}
          \t\t\t\t\t\t\tif (declarationUnit != null && declarationUnit.equals(unit)) {
          \t\t\t\t\t\t\t\treturn;
          \t\t\t\t\t\t\t}
          \t\t\t\t\t\t\tunsafe[0]= !isPureSuiteReference(unit, match.getOffset(), match.getLength());
          \t\t\t\t\t\t}
          \t\t\t\t\t}, null);
          \t\t} catch (CoreException e) {
          \t\t\treturn true;
          \t\t}
          \t\treturn unsafe[0];
          \t}

          \tprivate boolean isPureSuiteReference(ICompilationUnit unit, int offset, int length) {
          \t\tASTParser parser= ASTParser.newParser(AST.JLS21);
          \t\tparser.setSource(unit);
          \t\tparser.setResolveBindings(true);
          \t\tparser.setBindingsRecovery(true);
          \t\tCompilationUnit root= (CompilationUnit) parser.createAST(null);
          \t\tASTNode node= NodeFinder.perform(root, offset, Math.max(0, length));
          \t\tMethodDeclaration method= null;
          \t\tTypeDeclaration owner= null;
          \t\tfor (ASTNode current= node; current != null; current= current.getParent()) {
          \t\t\tif (method == null && current instanceof MethodDeclaration declaration) {
          \t\t\t\tmethod= declaration;
          \t\t\t}
          \t\t\tif (current instanceof TypeDeclaration declaration) {
          \t\t\t\towner= declaration;
          \t\t\t\tbreak;
          \t\t\t}
          \t\t}
          \t\treturn method != null && owner != null && JUnit3SuiteModel.isSuiteBuilder(method)
          \t\t\t\t&& JUnit3LegacyShape.isPureSuiteAggregator(owner, method);
          \t}
          '''
          text = replace_section(text,
              '\tprivate boolean hasAnyReferences(IType type) {',
              '\n\tprivate boolean hasUnsupportedTestCaseUsage', reference_policy,
              'TestJUnit3Plugin reference policy')

          text = replace_once(text,
              '''\t\t\t@Override
          \t\t\tpublic boolean visit(SuperMethodInvocation invocation) {
          \t\t\t\tunsupported[0]= true;
          \t\t\t\treturn false;
          \t\t\t}
          ''',
              '''\t\t\t@Override
          \t\t\tpublic boolean visit(SuperMethodInvocation invocation) {
          \t\t\t\tunsupported[0]|= !JUnit3LegacyShape.isRedundantLifecycleSuperCall(invocation);
          \t\t\t\treturn false;
          \t\t\t}
          ''',
              'TestJUnit3Plugin lifecycle super call policy')

          rewrite = '''\t@Override
          \tprotected void process2Rewrite(TextEditGroup group, ASTRewrite rewriter, AST ast, ImportRewrite importRewriter,
          \t\t\tJunitHolder junitHolder) {
          \t\tTypeDeclaration node= junitHolder.getTypeDeclaration();
          \t\tType superclass= node.getSuperclassType();
          \t\tif (superclass != null) {
          \t\t\trewriter.remove(superclass, group);
          \t\t\timportRewriter.removeImport(JUNIT3_TEST_CASE);
          \t\t}

          \t\tboolean removedSelfSuite= false;
          \t\tfor (MethodDeclaration method : node.getMethods()) {
          \t\t\tif (method.isConstructor() && JUnit3LegacyShape.isRemovableConstructor(method)) {
          \t\t\t\trewriter.remove(method, group);
          \t\t\t\tcontinue;
          \t\t\t}
          \t\t\tif (JUnit3SuiteModel.isSuiteBuilder(method) && JUnit3LegacyShape.isSelfSuite(method, node)) {
          \t\t\t\trewriter.remove(method, group);
          \t\t\t\tremovedSelfSuite= true;
          \t\t\t\tcontinue;
          \t\t\t}
          \t\t\tif (isLifecycleMethod(method, "setUp")) { //$NON-NLS-1$
          \t\t\t\tconvertToAnnotation(method, "BeforeEach", importRewriter, rewriter, ast, group); //$NON-NLS-1$
          \t\t\t} else if (isLifecycleMethod(method, "tearDown")) { //$NON-NLS-1$
          \t\t\t\tconvertToAnnotation(method, "AfterEach", importRewriter, rewriter, ast, group); //$NON-NLS-1$
          \t\t\t} else if (isTestMethod(method)) {
          \t\t\t\taddAnnotationToMethod(method, "Test", importRewriter, rewriter, ast, group); //$NON-NLS-1$
          \t\t\t}
          \t\t\tif (method.getBody() != null) {
          \t\t\t\tremoveRedundantLifecycleSuperCalls(method, rewriter, group);
          \t\t\t\trewriteAssertions(method, rewriter, ast, group, importRewriter);
          \t\t\t}
          \t\t}
          \t\tif (removedSelfSuite) {
          \t\t\timportRewriter.removeImport(JUnit3SuiteModel.JUNIT3_TEST);
          \t\t\timportRewriter.removeImport(JUnit3SuiteModel.JUNIT3_TEST_SUITE);
          \t\t}
          \t}

          \tprivate void removeRedundantLifecycleSuperCalls(MethodDeclaration method, ASTRewrite rewriter,
          \t\t\tTextEditGroup group) {
          \t\tmethod.accept(new ASTVisitor() {
          \t\t\t@Override
          \t\t\tpublic boolean visit(SuperMethodInvocation invocation) {
          \t\t\t\tif (JUnit3LegacyShape.isRedundantLifecycleSuperCall(invocation)
          \t\t\t\t\t\t&& invocation.getParent() instanceof org.eclipse.jdt.core.dom.ExpressionStatement statement) {
          \t\t\t\t\trewriter.remove(statement, group);
          \t\t\t\t}
          \t\t\t\treturn false;
          \t\t\t}
          \t\t});
          \t}
          '''
          text = replace_section(text,
              '\t@Override\n\tprotected void process2Rewrite',
              '\n\tprivate void rewriteAssertions', rewrite,
              'TestJUnit3Plugin rewrite')
          write(test_path, text)

          suite_path = 'sandbox_junit_cleanup/src/org/sandbox/jdt/internal/corext/fix/helper/SuiteMethodJUnitPlugin.java'
          text = read(suite_path)
          text = replace_once(text,
              'import org.sandbox.jdt.internal.corext.fix.helper.lib.JUnit3MigrationExclusions;\n',
              'import org.sandbox.jdt.internal.corext.fix.helper.lib.JUnit3LegacyShape;\nimport org.sandbox.jdt.internal.corext.fix.helper.lib.JUnit3MigrationExclusions;\n',
              'SuiteMethod legacy helper import')
          find_suite = '''\tprivate MethodDeclaration findMigratableSuiteMethod(TypeDeclaration node, Set<ASTNode> nodesprocessed) {
          \t\tif (nodesprocessed.contains(node) || !(node.getParent() instanceof CompilationUnit)
          \t\t\t\t|| node.isInterface() || hasJUnitAnnotation(node)
          \t\t\t\t|| node.getSuperclassType() != null && !JUnit3LegacyShape.directlyExtendsTestCase(node)
          \t\t\t\t|| isExcluded(node)) {
          \t\t\treturn null;
          \t\t}
          \t\tMethodDeclaration suite= null;
          \t\tfor (MethodDeclaration method : node.getMethods()) {
          \t\t\tif (JUnit3SuiteModel.isSuiteBuilder(method)) {
          \t\t\t\tsuite= method;
          \t\t\t} else if (!method.isConstructor() || !JUnit3LegacyShape.isRemovableConstructor(method)) {
          \t\t\t\t// Any additional behavior in an aggregator is not represented by @Suite.
          \t\t\t\treturn null;
          \t\t\t}
          \t\t}
          \t\tif (suite == null || nodesprocessed.contains(suite) || node.getFields().length != 0
          \t\t\t\t|| node.getTypes().length != 0 || !JUnit3LegacyShape.isPureSuiteAggregator(node, suite)) {
          \t\t\treturn null;
          \t\t}
          \t\treturn suite;
          \t}

          \t/** Rejects aggregators that derive from an explicitly excluded harness. */
          \tprivate boolean isExcluded(TypeDeclaration node) {
          \t\tITypeBinding binding= node.resolveBinding();
          \t\treturn binding == null ? node.getSuperclassType() != null && !JUnit3LegacyShape.directlyExtendsTestCase(node)
          \t\t\t\t: JUnit3MigrationExclusions.isExcluded(binding);
          \t}
          '''
          text = replace_section(text,
              '\tprivate MethodDeclaration findMigratableSuiteMethod',
              '\n\tprivate boolean hasJUnitAnnotation', find_suite,
              'SuiteMethod candidate policy')
          suite_rewrite = '''\t@Override
          \tprotected void process2Rewrite(TextEditGroup group, ASTRewrite rewriter, AST ast, ImportRewrite importRewriter,
          \t\t\tJunitHolder junitHolder) {
          \t\tif (!(junitHolder.getMinv() instanceof MethodDeclaration suite)
          \t\t\t\t|| !(suite.getParent() instanceof TypeDeclaration type)
          \t\t\t\t|| !(junitHolder.getAdditionalInfo() instanceof List<?> selectedTypes)
          \t\t\t\t|| selectedTypes.isEmpty()) {
          \t\t\treturn;
          \t\t}

          \t\trewriter.remove(suite, group);
          \t\tif (JUnit3LegacyShape.directlyExtendsTestCase(type) && type.getSuperclassType() != null) {
          \t\t\trewriter.remove(type.getSuperclassType(), group);
          \t\t\timportRewriter.removeImport(JUnit3LegacyShape.JUNIT3_TEST_CASE);
          \t\t}
          \t\tfor (MethodDeclaration method : type.getMethods()) {
          \t\t\tif (method != suite && JUnit3LegacyShape.isRemovableConstructor(method)) {
          \t\t\t\trewriter.remove(method, group);
          \t\t\t}
          \t\t}

          \t\tListRewrite modifiers= rewriter.getListRewrite(type, TypeDeclaration.MODIFIERS2_PROPERTY);
          \t\tMarkerAnnotation suiteAnnotation= ast.newMarkerAnnotation();
          \t\tsuiteAnnotation.setTypeName(ast.newSimpleName(ANNOTATION_SUITE));
          \t\tmodifiers.insertFirst(suiteAnnotation, group);

          \t\tSingleMemberAnnotation selectClasses= ast.newSingleMemberAnnotation();
          \t\tselectClasses.setTypeName(ast.newSimpleName(ANNOTATION_SELECT_CLASSES));
          \t\tif (selectedTypes.size() == 1) {
          \t\t\tselectClasses.setValue(newTypeLiteral(ast, String.valueOf(selectedTypes.get(0))));
          \t\t} else {
          \t\t\tArrayInitializer initializer= ast.newArrayInitializer();
          \t\t\tfor (Object selected : selectedTypes) {
          \t\t\t\taddExpression(initializer, newTypeLiteral(ast, String.valueOf(selected)));
          \t\t\t}
          \t\t\tselectClasses.setValue(initializer);
          \t\t}
          \t\tmodifiers.insertAfter(selectClasses, suiteAnnotation, group);

          \t\timportRewriter.addImport(ORG_JUNIT_JUPITER_SUITE);
          \t\timportRewriter.addImport(ORG_JUNIT_PLATFORM_SUITE_API_SELECT_CLASSES);
          \t\timportRewriter.removeImport(JUnit3SuiteModel.JUNIT3_TEST);
          \t\timportRewriter.removeImport(JUnit3SuiteModel.JUNIT3_TEST_SUITE);
          \t}
          '''
          text = replace_section(text,
              '\t@Override\n\tprotected void process2Rewrite',
              '\n\t@SuppressWarnings("unchecked")', suite_rewrite,
              'SuiteMethod rewrite')
          write(suite_path, text)

          plugin_path = 'sandbox_cleanup_application/plugin.xml'
          text = read(plugin_path)
          insertion = '''
          <extension
                id="org.sandbox.jdt.core.ProjectWideJavaCleanup"
                point="org.eclipse.core.runtime.applications">
                  <application>
                    <run class="org.sandbox.jdt.core.cleanupapp.ProjectWideCodeCleanupApplication" />
                  </application>
          </extension>
          '''
          text = replace_once(text, '</plugin>\n', insertion + '</plugin>\n', 'cleanup application registration')
          write(plugin_path, text)

          manifest_path = 'sandbox_cleanup_application/META-INF/MANIFEST.MF'
          text = read(manifest_path)
          text = replace_once(text,
              'Require-Bundle: org.eclipse.core.runtime,\n',
              'Require-Bundle: sandbox_common_core,\n org.eclipse.core.runtime,\n',
              'cleanup application diagnostics dependency')
          write(manifest_path, text)

          profile_path = 'qa/upstream-jdt/junit3-to-jupiter.properties'
          write(profile_path, '''# Real JDT Core JUnit 3 to Jupiter migration profile.
          # Only the JUnit 3 source migration and the explicit suite-aggregator migration
          # are enabled; unrelated JUnit 4 rewrites remain disabled by absent option keys.
          cleanup.junitcleanup=true
          cleanup.junit3cleanup=true
          cleanup.junitcleanup_3_test=true
          cleanup.junitcleanup_4_suite=true
          ''')

          workflow = Path('.github/workflows/apply-junit3-real-corpus-fixes.yml')
          workflow.unlink()
          PY

          git diff --check
          git status --short

      - name: Commit implementation changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support proven real-world JUnit 3 constructors and suites"
          git push origin "HEAD:${GITHUB_REF_NAME}"
