name: Export PR 1513 debug source

on:
  push:
    branches:
      - qa/atomic-int-to-enum-preview-gate
    paths:
      - '.github/workflows/export-pr1513-debug-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Upload SWTBot source
        uses: actions/upload-artifact@v7
        with:
          name: pr1513-debug-source-${{ github.run_number }}
          path: sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsSWTBotTest.java
          if-no-files-found: error
          retention-days: 1
