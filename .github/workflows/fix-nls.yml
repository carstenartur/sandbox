name: Fix NLS Comments

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**.java'
      - '.github/workflows/fix-nls.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize-pr1514:
    if: github.event.pull_request.head.ref == 'qa/junit-coordinated-preview-contract' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v7
        with:
          ref: qa/junit-coordinated-preview-contract
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply state-based waits and restore registered workflows
        shell: bash
        run: |
          set -euo pipefail
          source_file='sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/CoordinatedJUnitPreviewSWTBotScenario.java'
          temporary_workflow='.github/workflows/tmp-pr1514-state-based-swtbot.yml'
          patched_workflow='.github/workflows/patched-jdt-ui-atomic-help-screenshot.yml'
          fix_workflow='.github/workflows/fix-nls.yml'
          expected_source='6d3c6d1773c20a048909b5cc98f9a51bb8e233a1'
          final_patched_commit='2e6749ae60f05f58b2763acd24ad443ef160c64e'
          final_fix_commit='6b1a837315e32c59cd5b30b68da4b7b9d775fdfd'
          expected_patched='99453f2b6637fb29cac91de06caf4276f3bd7af3'
          expected_fix='e5ea54dd2c239ac5cd6609304ef7a5940b827002'

          actual_source="$(git hash-object "$source_file")"
          if [[ "$actual_source" != "$expected_source" ]]; then
            echo "::error::Unexpected source blob $actual_source"
            exit 1
          fi
          test -f "$temporary_workflow"

          python3 - "$source_file" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''                shell.widget.layout(true, true);
            }
        });
        shell.activate();
        bot.sleep(500);
    }

    private static void openPreferences() {''',
                  '''                shell.widget.layout(true, true);
                shell.widget.update();
            }
        });
        shell.activate();
        waitForActiveShell(shell);
    }

    private static void waitForActiveShell(SWTBotShell shell) {
        bot.waitUntil(new DefaultCondition() {
            @Override
            public boolean test() {
                try {
                    return shell.isOpen() && bot.activeShell().widget == shell.widget;
                } catch (WidgetNotFoundException exception) {
                    return false;
                }
            }

            @Override
            public String getFailureMessage() {
                return "The screenshot shell did not become active: " + shell.getText();
            }
        });
    }

    private static void openPreferences() {''',
