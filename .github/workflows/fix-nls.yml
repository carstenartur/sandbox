          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          if 'bot.sleep(' in text:
              raise SystemExit('Fixed SWTBot sleep remains in coordinated JUnit scenario')
          path.write_text(text, encoding='utf-8')
          PY

          git show "$final_patched_commit:$patched_workflow" > "$patched_workflow"
          git show "$final_fix_commit:$fix_workflow" > "$fix_workflow"
          if [[ "$(git hash-object "$patched_workflow")" != "$expected_patched" ]]; then
            echo '::error::Patched-JDT workflow did not restore byte-exactly' >&2
            exit 1
          fi
          if [[ "$(git hash-object "$fix_workflow")" != "$expected_fix" ]]; then
            echo '::error::Fix-NLS workflow did not restore byte-exactly' >&2
            exit 1
          fi

          git rm -- "$temporary_workflow"
          git add -- "$source_file" "$patched_workflow" "$fix_workflow"
          git diff --check
          if grep -Fq 'bot.sleep(' "$source_file"; then
            echo '::error::Fixed SWTBot sleep remains' >&2
            exit 1
          fi

          expected_paths="$(printf '%s\n' "$fix_workflow" "$patched_workflow" "$source_file" "$temporary_workflow" | sort)"
          actual_paths="$(git diff --cached --name-only | sort)"
          if [[ "$actual_paths" != "$expected_paths" ]]; then
            echo '::error::Unexpected staged paths' >&2
            git diff --cached --name-status >&2
            exit 1
          fi

          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'github-actions[bot]'
          git commit -m 'Replace fixed JUnit SWTBot waits with state conditions'
          git push origin HEAD:qa/junit-coordinated-preview-contract
