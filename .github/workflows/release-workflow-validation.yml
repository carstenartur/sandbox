name: Release Workflow Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/scripts/verify_release_identity.py'
      - '.github/scripts/test_verify_release_identity.py'
      - '.github/scripts/wait_for_pages_build.py'
      - '.github/scripts/test_wait_for_pages_build.py'
      - '.github/scripts/verify_published_repository.py'
      - '.github/scripts/test_verify_published_repository.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile release helpers
        run: |
          python3 -m py_compile \
            .github/scripts/verify_release_identity.py \
            .github/scripts/test_verify_release_identity.py \
            .github/scripts/wait_for_pages_build.py \
            .github/scripts/test_wait_for_pages_build.py \
            .github/scripts/verify_published_repository.py \
            .github/scripts/test_verify_published_repository.py
      - name: Test release helpers
        run: |
          python3 .github/scripts/test_verify_release_identity.py
          python3 .github/scripts/test_wait_for_pages_build.py
          python3 .github/scripts/test_verify_published_repository.py
      - name: Validate every gh-pages writer and shared publication lock
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          workflow_dir = Path('.github/workflows')
          validator_name = 'release-workflow-validation.yml'
          publisher_markers = (
              'peaceiris/actions-gh-pages@',
              'git push origin gh-pages',
              'auto-push: true',
          )
          expected_publishers = {
              'benchmark.yml',
              'cleanup-old-snapshots.yml',
              'coverage.yml',
              'deploy-release.yml',
              'deploy-snapshot.yml',
              'mining-core.yml',
              'post-merge-provenance.yml',
              'refactoring-mining.yml',
          }
          workflow_paths = sorted((*workflow_dir.glob('*.yml'), *workflow_dir.glob('*.yaml')))
          discovered_publishers = {
              path.name
              for path in workflow_paths
              if path.name != validator_name
              and any(marker in path.read_text(encoding='utf-8') for marker in publisher_markers)
          }
          if discovered_publishers != expected_publishers:
              missing = sorted(expected_publishers - discovered_publishers)
              unregistered = sorted(discovered_publishers - expected_publishers)
              raise SystemExit(
                  f'gh-pages publisher inventory changed; missing={missing}, unregistered={unregistered}'
              )

          top_level_publishers = [
              workflow_dir / 'deploy-release.yml',
              workflow_dir / 'deploy-snapshot.yml',
              workflow_dir / 'mining-core.yml',
              workflow_dir / 'refactoring-mining.yml',
          ]
          top_level_contract = "concurrency:\n  group: release-workflow\n  cancel-in-progress: false"
          failures = [
              str(path)
              for path in top_level_publishers
              if top_level_contract not in path.read_text(encoding='utf-8')
          ]
          if failures:
              raise SystemExit(f'gh-pages publishers lack the shared workflow lock: {failures}')

          job_publishers = {
              'coverage.yml': ('publish', 'peaceiris/actions-gh-pages@v4'),
              'post-merge-provenance.yml': (
                  'publish-main-provenance-dashboard',
                  'peaceiris/actions-gh-pages@v4',
              ),
              'benchmark.yml': ('publish-benchmark', 'auto-push: true'),
              'cleanup-old-snapshots.yml': ('cleanup', 'git push origin gh-pages'),
          }
          job_lock = "    concurrency:\n      group: release-workflow\n      cancel-in-progress: false"

          def job_block(workflow: str, job_name: str) -> str:
              marker = f'\n  {job_name}:\n'
              try:
                  start = workflow.index(marker) + 1
              except ValueError as failure:
                  raise SystemExit(f'Missing gh-pages publication job {job_name!r}') from failure
              remainder = workflow[start + len(marker) - 1:]
              next_job = re.search(r'\n  [A-Za-z0-9_-]+:\n', remainder)
              if next_job is None:
                  return workflow[start:]
              return workflow[start:start + len(marker) - 1 + next_job.start()]

          for filename, (job_name, publisher_marker) in job_publishers.items():
              workflow = (workflow_dir / filename).read_text(encoding='utf-8')
              block = job_block(workflow, job_name)
              if job_lock not in block:
                  raise SystemExit(f'{filename}:{job_name} lacks the shared release-workflow lock')
              if publisher_marker not in block:
                  raise SystemExit(f'{filename}:{job_name} no longer contains its gh-pages writer')
          PY
      - name: Validate snapshot Pages publication contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/deploy-snapshot.yml').read_text(encoding='utf-8')
          await_marker = '- name: Await exact GitHub Pages publication'
          verify_marker = '- name: Verify advertised snapshot URLs'
          required = [
              'pages: write',
              await_marker,
              verify_marker,
              'id: await_pages_build',
              "steps.await_pages_build.outcome == 'failure'",
              '--expected-commit "$previous"',
              'pages-rollback-build.json',
              'GitHub Pages build outcome',
          ]
          missing = [marker for marker in required if marker not in workflow]
          if missing:
              raise SystemExit(f"Snapshot publication lacks the exact Pages build contract: {missing}")

          if workflow.index(await_marker) > workflow.index(verify_marker):
              raise SystemExit('Snapshot URLs are verified before the exact Pages build is complete')
          PY
      - name: Validate native line-coverage contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/coverage.yml').read_text(encoding='utf-8')
          required = [
              'code-quality: write',
              'pull-requests: read',
              'github.event.pull_request.head.sha || github.sha',
              'danielpalme/ReportGenerator-GitHub-Action@5.5.11',
              'reporttypes: Cobertura;JsonSummary',
              'actions/upload-code-coverage@v1',
              'file: target/native-coverage/Cobertura.xml',
              'label: code-coverage/jacoco',
              'metric: "LINE"',
              'publish:\n    name: Publish verified metrics to GitHub Pages',
              'actions/download-artifact@v8',
          ]
          missing = [marker for marker in required if marker not in workflow]
          if missing:
              raise SystemExit(f"Coverage workflow lacks the native line-coverage contract: {missing}")

          pull_request_block = workflow.split('  pull_request:\n', 1)[1].split('  schedule:\n', 1)[0]
          if 'paths:' in pull_request_block:
              raise SystemExit('Native coverage must run for every pull request, not a path-filtered subset')
          if 'cicirello/jacoco-badge-generator' in workflow:
              raise SystemExit('Instruction coverage must not be advertised as the GitHub line-coverage metric')

          coverage_block, publish_block = workflow.split('\n  publish:\n', 1)
          if 'peaceiris/actions-gh-pages@v4' in coverage_block:
              raise SystemExit('Coverage must not publish to gh-pages outside the shared publication lock')
          if 'peaceiris/actions-gh-pages@v4' not in publish_block:
              raise SystemExit('The locked coverage publication job no longer publishes gh-pages')
          PY
      - name: Validate derived Pages publication isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          provenance = Path('.github/workflows/post-merge-provenance.yml').read_text(encoding='utf-8')
          provenance_build, provenance_publish = provenance.split('\n  publish-main-provenance-dashboard:\n', 1)
          if 'peaceiris/actions-gh-pages@v4' in provenance_build:
              raise SystemExit('Provenance generation must not publish before entering the shared lock')
          if 'peaceiris/actions-gh-pages@v4' not in provenance_publish:
              raise SystemExit('Locked provenance publication is missing')

          benchmark = Path('.github/workflows/benchmark.yml').read_text(encoding='utf-8')
          benchmark_build, benchmark_publish = benchmark.split('\n  publish-benchmark:\n', 1)
          if 'auto-push: true' in benchmark_build:
              raise SystemExit('Benchmark execution must not push before entering the shared lock')
          if 'auto-push: true' not in benchmark_publish:
              raise SystemExit('Locked benchmark publication is missing')
          PY
      - name: Validate protected-main release transition
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/deploy-release.yml').read_text(encoding='utf-8')
          forbidden = [
              'Fast-forward main to verified stable release commit',
              'git push origin "${RELEASE_COMMIT}:refs/heads/main"',
          ]
          present = [marker for marker in forbidden if marker in workflow]
          if present:
              raise SystemExit(f"Release workflow still bypasses protected main: {present}")

          required = [
              'uses: actions/setup-java@v6',
              'branch="release/prepare-next-${NEXT_SNAPSHOT}"',
              'git checkout -b "$branch" "$RELEASE_COMMIT"',
              'main moved before the next-development PR was created',
              '--base main --head "$branch"',
          ]
          missing = [marker for marker in required if marker not in workflow]
          if missing:
              raise SystemExit(f"Release workflow lacks the protected-main PR contract: {missing}")
          PY
