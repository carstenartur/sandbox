name: Release Workflow Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/coverage.yml'
      - '.github/workflows/deploy-release.yml'
      - '.github/workflows/deploy-snapshot.yml'
      - '.github/workflows/mining-core.yml'
      - '.github/workflows/refactoring-mining.yml'
      - '.github/workflows/release-workflow-validation.yml'
      - '.github/scripts/verify_release_identity.py'
      - '.github/scripts/test_verify_release_identity.py'
      - '.github/scripts/wait_for_pages_build.py'
      - '.github/scripts/test_wait_for_pages_build.py'
      - '.github/scripts/verify_published_repository.py'
      - '.github/scripts/test_verify_published_repository.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile release helpers
        run: |
          python3 -m py_compile \
            .github/scripts/verify_release_identity.py \
            .github/scripts/test_verify_release_identity.py \
            .github/scripts/wait_for_pages_build.py \
            .github/scripts/test_wait_for_pages_build.py \
            .github/scripts/verify_published_repository.py \
            .github/scripts/test_verify_published_repository.py
      - name: Test release helpers
        run: |
          python3 .github/scripts/test_verify_release_identity.py
          python3 .github/scripts/test_wait_for_pages_build.py
          python3 .github/scripts/test_verify_published_repository.py
      - name: Validate shared gh-pages publication lock
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflows = [
              Path('.github/workflows/deploy-release.yml'),
              Path('.github/workflows/deploy-snapshot.yml'),
              Path('.github/workflows/mining-core.yml'),
              Path('.github/workflows/refactoring-mining.yml'),
          ]
          contract = "concurrency:\n  group: release-workflow\n  cancel-in-progress: false"
          failures = [str(path) for path in workflows if contract not in path.read_text(encoding='utf-8')]
          if failures:
              raise SystemExit(f"gh-pages publishers must share the release-workflow lock: {failures}")
          PY
      - name: Validate snapshot Pages publication contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/deploy-snapshot.yml').read_text(encoding='utf-8')
          required = [
              'pages: write',
              '- name: Await exact GitHub Pages publication',
              'id: await_pages_build',
              "steps.await_pages_build.outcome == 'failure'",
              '--expected-commit "$previous"',
              'pages-rollback-build.json',
              'GitHub Pages build outcome',
          ]
          missing = [marker for marker in required if marker not in workflow]
          if missing:
              raise SystemExit(f"Snapshot publication lacks the exact Pages build contract: {missing}")

          await_marker = '- name: Await exact GitHub Pages publication'
          verify_marker = '- name: Verify advertised snapshot URLs'
          if workflow.index(await_marker) > workflow.index(verify_marker):
              raise SystemExit('Snapshot URLs are verified before the exact Pages build is complete')
          PY
      - name: Validate native line-coverage contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/coverage.yml').read_text(encoding='utf-8')
          required = [
              'code-quality: write',
              'pull-requests: read',
              'github.event.pull_request.head.sha || github.sha',
              'danielpalme/ReportGenerator-GitHub-Action@5.5.11',
              'reporttypes: Cobertura;JsonSummary',
              'actions/upload-code-coverage@v1',
              'file: target/native-coverage/Cobertura.xml',
              'label: code-coverage/jacoco',
              'metric: "LINE"',
          ]
          missing = [marker for marker in required if marker not in workflow]
          if missing:
              raise SystemExit(f"Coverage workflow lacks the native line-coverage contract: {missing}")

          pull_request_block = workflow.split('  pull_request:\n', 1)[1].split('  schedule:\n', 1)[0]
          if 'paths:' in pull_request_block:
              raise SystemExit('Native coverage must run for every pull request, not a path-filtered subset')
          if 'cicirello/jacoco-badge-generator' in workflow:
              raise SystemExit('Instruction coverage must not be advertised as the GitHub line-coverage metric')
          PY
      - name: Validate protected-main release transition
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/deploy-release.yml').read_text(encoding='utf-8')
          forbidden = [
              'Fast-forward main to verified stable release commit',
              'git push origin "${RELEASE_COMMIT}:refs/heads/main"',
          ]
          present = [marker for marker in forbidden if marker in workflow]
          if present:
              raise SystemExit(f"Release workflow still bypasses protected main: {present}")

          required = [
              'uses: actions/setup-java@v6',
              'branch="release/prepare-next-${NEXT_SNAPSHOT}"',
              'git checkout -b "$branch" "$RELEASE_COMMIT"',
              'main moved before the next-development PR was created',
              '--base main --head "$branch"',
          ]
          missing = [marker for marker in required if marker not in workflow]
          if missing:
              raise SystemExit(f"Release workflow lacks the protected-main PR contract: {missing}")
          PY
