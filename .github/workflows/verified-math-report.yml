name: Verified mathematics report qualification
on:
  push:
    branches: [diagnostic/verified-math-report-20261010]
permissions:
  contents: read
concurrency:
  group: verified-math-report-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      NO_AT_BRIDGE: '1'
      GDK_BACKEND: x11
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f05e403075dfec7a8067da2bbd836090d427bd6e
          fetch-depth: 50
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
          cache: maven
      - uses: ./.github/actions/verify-eclipse-desktop-runtime
      - name: Incorporate qualified integration fixes without reverting concurrent changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f05e403075dfec7a8067da2bbd836090d427bd6e
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=50 origin 35b21aaabf474d9c46ca5a82ac7b41da75bbddd2
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-commit --no-ff 35b21aaabf474d9c46ca5a82ac7b41da75bbddd2
          mkdir "$RUNNER_TEMP/original-images"
          cp sandbox_math_cleanup_help/images/* "$RUNNER_TEMP/original-images/"
          cat > docs/qa/verified-computation-reports.md <<'DOC'
          # Verified computation plans in mathematics reports

          Each newly accepted mathematics edit now carries an `explanation` in its
          analysis evidence. The workspace/CLI JSON report serializes this data using
          the existing report writer; no additional mathematical optimizer is added.

          `inputNames` and `outputNames` map SDK symbols to the actual Java source
          names. `guardedReceivers` records adapter receiver checks separately from
          numeric obligations. `verified` contains the independently reverified proof,
          assumptions, runtime obligations, original and replacement computation DAGs,
          shared intermediate nodes and separately labeled operation counts.

          These are checked before/after computation plans, **not** a fabricated
          step-by-step rewrite history. Counts are not timing measurements. Existing
          source comments, source code, compact preview labels and Undo stay unchanged.
          Optional generated Java comments and a human-readable derivation viewer are
          future work. No constructor/halving recognizer or named example selector is
          involved. Constant-only edits remain excluded.

          Explanation generation replaces the previous standalone re-verification;
          its SDK verification and rendering share one allowance and deadline. An
          unverified, canceled or incomplete explanation cannot accompany an accepted
          new edit. The original numeric/exception checks and emission verifier remain
          authoritative. Historical test/report records may have no explanation; they
          are not backfilled with invented proof data.

          End-to-end tests serialize actual analysis evidence, compare exact typed and
          JSON proof values, preserve checked-arithmetic obligations, exercise helper
          calls, reject constant-only targets, and test cancellation and exact Undo.
          The JSON proof comparison uses identical serialization/parsing on both sides
          so Jackson's in-memory numeric-node width does not produce false failures.
          DOC
          git add docs/qa/verified-computation-reports.md
          git diff --cached --check 35b21aaabf474d9c46ca5a82ac7b41da75bbddd2
      - name: Run all standard mathematics regressions with inherited quality checks
        shell: bash
        run: |
          set -euo pipefail
          if ! xvfb-run -a ./mvnw -B -ntp -pl sandbox_target,sandbox_math_cleanup,sandbox_math_cleanup_test -am verify > "$RUNNER_TEMP/math.log" 2>&1; then
            tail -65 "$RUNNER_TEMP/math.log"; exit 1
          fi
          cp -a sandbox_math_cleanup_test/target/surefire-reports "$RUNNER_TEMP/math-reports"
          grep -E 'Tests run:|BUILD SUCCESS|BugInstance size' "$RUNNER_TEMP/math.log" | tail -32
      - name: Reproduce actual native previews and source-bound provenance
        shell: bash
        run: |
          set -euo pipefail
          capture() {
            xvfb-run -a --server-args='-screen 0 1600x1200x24' ./mvnw -B -ntp \
              -Dsandbox.tycho.linux-only=true -Dspotbugs.skip=true -Dtycho.localArtifacts=ignore \
              -Dhelp.screenshot.testClass="org.sandbox.jdt.ui.helper.views.$1" \
              -DfailIfNoTests=false -f sandbox_help_build/pom.xml -Phelp-screenshots verify > "$RUNNER_TEMP/$2.log" 2>&1 || { tail -65 "$RUNNER_TEMP/$2.log"; return 1; }
            cp -a sandbox_eclipse_help_swtbot_test/target/surefire-reports "$RUNNER_TEMP/$2-reports"
          }
          capture MathematicsHelpScreenshotsSWTBotTest native-help
          mkdir "$RUNNER_TEMP/first-capture"
          cp sandbox_math_cleanup_help/images/* "$RUNNER_TEMP/first-capture/"
          rm -rf sandbox_eclipse_help_swtbot_test/target/work
          capture MathematicsHelpScreenshotsSWTBotTest native-repeat
          diff -qr "$RUNNER_TEMP/first-capture" sandbox_math_cleanup_help/images
          python3 - <<'PY'
          from pathlib import Path
          import os
          original=Path(os.environ['RUNNER_TEMP'])/'original-images'
          current=Path('sandbox_math_cleanup_help/images')
          pngs=list(original.glob('*.png'))
          assert len(pngs)==4, pngs
          for p in pngs: assert p.read_bytes()==(current/p.name).read_bytes(),p.name
          print('ALL_FOUR_PREVIEW_PNGS_UNCHANGED; provenance regenerated by real execution')
          PY
          capture EclipseHelpScreenshotEvidenceTest help-evidence
      - name: Verify complete default Help module without disabling SpotBugs
        shell: bash
        run: |
          set -euo pipefail
          if ! xvfb-run -a ./mvnw -B -ntp -pl sandbox_target,sandbox_common_core,sandbox_common,sandbox_test_commons,sandbox_eclipse_help_swtbot_test -am verify > "$RUNNER_TEMP/help-default.log" 2>&1; then
            tail -65 "$RUNNER_TEMP/help-default.log"; exit 1
          fi
          grep -E 'Tests run:|BUILD SUCCESS|BugInstance size' "$RUNNER_TEMP/help-default.log" | tail -20
      - name: Validate evidence and publish only ordinary tested product files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,xml.etree.ElementTree as E
          root=Path(os.environ['RUNNER_TEMP'])
          for folder,minimum in [('math-reports',201),('native-help-reports',1),('native-repeat-reports',1),('help-evidence-reports',5)]:
              files=list((root/folder).glob('TEST-*.xml')); assert files,folder
              totals=dict.fromkeys(('tests','failures','errors','skipped'),0)
              for file in files:
                  e=E.parse(file).getroot()
                  for k in totals: totals[k]+=int(e.get(k,'0'))
              assert totals['tests']>=minimum and not any(totals[k] for k in ('failures','errors','skipped')),(folder,totals)
              print(folder,totals)
          PY
          git add sandbox_math_cleanup_help/images docs/qa/verified-computation-reports.md
          git diff --exit-code
          git diff --cached --check 35b21aaabf474d9c46ca5a82ac7b41da75bbddd2
          git write-tree > "$RUNNER_TEMP/tested-tree.txt"
          git fetch --no-tags origin refs/heads/feat/verified-math-report-explanations-20261010
          test "$(git rev-parse FETCH_HEAD)" = f05e403075dfec7a8067da2bbd836090d427bd6e
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: qualify verified reports with unchanged native previews and refreshed provenance'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/feat/verified-math-report-explanations-20261010
          git rev-parse HEAD > "$RUNNER_TEMP/product-source.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: verified-math-report-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*reports/**
            ${{ runner.temp }}/product-source.txt
            ${{ runner.temp }}/tested-tree.txt
            sandbox_math_cleanup_help/images/**
            sandbox_eclipse_help_swtbot_test/target/surefire-reports/**
