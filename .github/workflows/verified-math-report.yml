name: Verified mathematics report qualification
on:
  push:
    branches: [diagnostic/verified-math-report-20261010]
permissions:
  contents: read
concurrency:
  group: verified-math-report-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 214e782adb31541e5f4f6babf48dd2b68cbfdb8c
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
          cache: maven
      - uses: ./.github/actions/verify-eclipse-desktop-runtime
      - name: Connect verified plans and compare serialized proof values consistently
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 214e782adb31541e5f4f6babf48dd2b68cbfdb8c
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sandbox_math_cleanup/src/org/sandbox/jdt/internal/corext/fix/math/MathematicalAnalysis.java')
          text=p.read_text()
          replacements=[
            ('if (!(optimizer.reverify(request, candidate, cancellation) instanceof Verified)) {',
             'var explained = de.regelsuche.sdk.optimization.ComputationExplanations.describe(request, candidate, cancellation);\n                  if (!(explained.verification() instanceof Verified) || explained.explanation().isEmpty()) {'),
            ('diagnostics.add(diagnostic("REVERIFICATION_FAILED", "Candidate evidence did not pass independent checking", region));',
             'diagnostics.add(diagnostic("REVERIFICATION_FAILED", explained.verification().toString(), region));'),
            ('                  String description = "Mathematics "',
             '                  ComputationExplanation explanation = ComputationExplanation.from(region, explained.explanation().orElseThrow());\n                  String description = "Mathematics "'),
            ('region.start(), region.length(), candidate.evidence(), cost, source.substring(region.start(), region.start() + region.length()), replacement\n',
             'region.start(), region.length(), candidate.evidence(), cost, source.substring(region.start(), region.start() + region.length()), replacement, explanation\n'),
            ('   public record VerifiedRegion(int offset, int length, VerificationEvidence proof, CostAssessment cost, String original, String replacement) {\n   }',
             '''   public record VerifiedRegion(int offset, int length, VerificationEvidence proof, CostAssessment cost,
                String original, String replacement, ComputationExplanation explanation) {
                public VerifiedRegion {
                   if (explanation != null && !proof.equals(explanation.verified().proof())) {
                      throw new IllegalArgumentException("EXPLANATION_PROOF_BINDING_DIFFERS");
                   }
                }
                /** Compatibility for explicitly constructed historical report records. */
                public VerifiedRegion(int offset, int length, VerificationEvidence proof, CostAssessment cost,
                      String original, String replacement) {
                   this(offset, length, proof, cost, original, replacement, null);
                }
             }''')
          ]
          for old,new in replacements:
              assert text.count(old)==1, old
              text=text.replace(old,new)
          p.write_text(text)
          test=Path('sandbox_math_cleanup_test/src/org/sandbox/jdt/math/tests/VerifiedComputationExplanationTest.java')
          text=test.read_text()
          old='assertEquals(new ObjectMapper().valueToTree(analysis.evidence().getFirst().proof()), verified.path("proof"));'
          new='''// Compare JSON with the same numeric-node construction on both sides;
                  // separately retain exact typed equality of the immutable proof records.
                  var mapper = new ObjectMapper();
                  assertEquals(mapper.readTree(mapper.writeValueAsString(analysis.evidence().getFirst().proof())), verified.path("proof"));
                  assertEquals(analysis.evidence().getFirst().proof(), analysis.evidence().getFirst().explanation().verified().proof());'''
          assert text.count(old)==1
          test.write_text(text.replace(old,new))
          PY
          git add sandbox_math_cleanup/src sandbox_math_cleanup_test/src
          git diff --cached --check
          git diff --cached > "$RUNNER_TEMP/report-integration.patch"
          git write-tree > "$RUNNER_TEMP/tested-tree.txt"
      - name: Run the entire standard mathematics module
        env:
          NO_AT_BRIDGE: '1'
          GDK_BACKEND: x11
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        shell: bash
        run: |
          set -euo pipefail
          if ! xvfb-run -a ./mvnw -B -ntp -pl sandbox_target,sandbox_math_cleanup,sandbox_math_cleanup_test -am verify > "$RUNNER_TEMP/verify.log" 2>&1; then
            grep -E '\[ERROR\]|Failures:|<<< FAILURE|BUILD FAILURE' "$RUNNER_TEMP/verify.log" | tail -25
            tail -35 "$RUNNER_TEMP/verify.log"
            exit 1
          fi
          grep -E 'Tests run:|BUILD SUCCESS|BugInstance size' "$RUNNER_TEMP/verify.log" | tail -35
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          files=list(Path('sandbox_math_cleanup_test/target/surefire-reports').glob('TEST-*.xml'))
          assert files
          totals=dict.fromkeys(('tests','failures','errors','skipped'),0)
          for file in files:
              root=E.parse(file).getroot()
              for k in totals: totals[k]+=int(root.get(k,'0'))
          assert totals['tests']>=201 and not any(totals[k] for k in ('failures','errors','skipped')), totals
          print('MATH_MODULE_TOTALS='+str(totals))
          PY
      - name: Publish only the tested ordinary source change
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/tested-tree.txt")"
          git fetch --no-tags origin refs/heads/feat/verified-math-report-explanations-20261010
          test "$(git rev-parse FETCH_HEAD)" = 214e782adb31541e5f4f6babf48dd2b68cbfdb8c
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: expose independently verified computation plans in analysis reports'
          git push origin HEAD:refs/heads/feat/verified-math-report-explanations-20261010
          git rev-parse HEAD > "$RUNNER_TEMP/product-source.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: verified-math-report-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/verify.log
            ${{ runner.temp }}/product-source.txt
            ${{ runner.temp }}/tested-tree.txt
            ${{ runner.temp }}/report-integration.patch
            sandbox_math_cleanup_test/target/surefire-reports/**
