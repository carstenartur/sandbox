name: One-time PR 1510 screenshot baseline refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: one-time-pr-1510-screenshot-baseline-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event.pull_request.number == 1510 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    name: Refresh deterministic Cleanup configuration screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MAVEN_OPTS: -Djava.awt.headless=false
      NO_AT_BRIDGE: '1'
      GDK_BACKEND: x11
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout refresh branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Use runner Maven
        uses: ./.github/actions/use-runner-maven

      - name: Install Eclipse desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if grep -q 'packages\.microsoft\.com' "$source"; then
              echo "Disabling unrelated runner APT source: $source"
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1

      - name: Reproduce Eclipse Help screenshots
        run: >-
          timeout
          --signal=TERM
          --kill-after=2m
          70m
          xvfb-run
          --auto-servernum
          --server-args="-screen 0 1600x1200x24"
          mvn
          --no-transfer-progress
          -e
          -V
          --batch-mode
          -Dtycho.localArtifacts=ignore
          -Dhelp.screenshot.testClass=org.sandbox.jdt.ui.helper.views.SandboxHelpScreenshotsMergeGateSWTBotTest
          -DfailIfNoTests=false
          -f sandbox_help_build/pom.xml
          -Phelp-screenshots
          clean verify

      - name: Verify the merge-gate test executed
        shell: bash
        run: |
          set -euo pipefail
          report="$(grep -R -l --include='TEST-*.xml' \
            'SandboxHelpScreenshotsMergeGateSWTBotTest' \
            sandbox_usage_view_test/target/surefire-reports | head -n 1 || true)"
          if [[ -z "$report" ]]; then
            echo 'The selected Help screenshot JUnit merge gate did not execute.' >&2
            exit 1
          fi
          printf 'Verified JUnit report: %s\n' "$report"

      - name: Keep real preview screenshots outside this baseline refresh
        run: >-
          git restore --source=HEAD --
          sandbox_jface_cleanup_help/images/jface-cleanup-real-preview-diff-step.png
          sandbox_jface_cleanup_help/images/jface-cleanup-real-preview-multi-file-selection.png
          sandbox_jface_cleanup_help/images/jface-cleanup-real-preview-single-file-steps.png

      - name: Commit exactly the deterministic profile baselines
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            sandbox_encoding_quickfix_help/images/explicit-encoding-cleanup.png
            sandbox_functional_converter_help/images/functional-converter-cleanup.png
            sandbox_int_to_enum_help/images/int-to-enum-cleanup.png
            sandbox_jface_cleanup_help/images/jface-cleanup.png
            sandbox_junit_cleanup_help/images/junit-migration-cleanup.png
            sandbox_method_reuse_help/images/method-reuse-cleanup.png
            sandbox_platform_helper_help/images/platform-status-cleanup.png
            sandbox_triggerpattern_help/images/code-patterns-cleanup.png
            sandbox_use_general_type_help/images/use-general-type-cleanup.png
            sandbox_xml_cleanup_help/images/xml-cleanup.png
          )

          declare -A expected_by_path=()
          declare -A changed_by_path=()
          for path in "${expected[@]}"; do
            expected_by_path["$path"]=1
          done

          mapfile -t changes < <(git status --porcelain=v1 --untracked-files=all -- \
            ':(glob)sandbox*_help/images/*.png')
          unexpected=()
          for change in "${changes[@]}"; do
            path="${change:3}"
            changed_by_path["$path"]=1
            if [[ -z "${expected_by_path[$path]:-}" ]]; then
              unexpected+=("$change")
            fi
          done

          missing=()
          for path in "${expected[@]}"; do
            if [[ -z "${changed_by_path[$path]:-}" ]]; then
              missing+=("$path")
            fi
          done

          if (( ${#unexpected[@]} > 0 )); then
            echo 'Screenshot generation changed files outside the reviewed baseline set:' >&2
            printf '%s\n' "${unexpected[@]}" >&2
            exit 1
          fi
          if (( ${#missing[@]} > 0 )); then
            echo 'Expected deterministic-profile baselines did not change:' >&2
            printf '%s\n' "${missing[@]}" >&2
            exit 1
          fi

          git add -- "${expected[@]}"
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh deterministic Eclipse Help screenshots'
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Upload reproduced screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eclipse-help-screenshots-${{ github.run_number }}
          path: sandbox*_help/images/*.png
          retention-days: 14
          if-no-files-found: error

      - name: Upload SWTBot diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: eclipse-help-swtbot-diagnostics-${{ github.run_number }}
          path: |
            sandbox_usage_view_test/target/work/data/.metadata/.log
            sandbox_usage_view_test/target/surefire-reports/**
          retention-days: 14
          if-no-files-found: warn
