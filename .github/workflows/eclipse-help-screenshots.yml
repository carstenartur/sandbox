name: Eclipse Help screenshots

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - 'docs/ECLIPSE_HELP.md'
      - 'docs/ECLIPSE_HELP_COVERAGE.md'
      - 'qa/upstream-jdt/pins.env'
      - 'sandbox_help_build/**'
      - 'sandbox_target/**'
      - 'sandbox-functional-converter-core/**'
      - 'sandbox_common_core/**'
      - 'sandbox_common/**'
      - 'sandbox_test_commons/**'
      - 'sandbox*_cleanup/**'
      - 'sandbox*_cleanup_help/**'
      - 'sandbox*_quickfix/**'
      - 'sandbox*_quickfix_help/**'
      - 'sandbox_functional_converter/**'
      - 'sandbox_functional_converter_help/**'
      - 'sandbox_int_to_enum/**'
      - 'sandbox_int_to_enum_help/**'
      - 'sandbox_method_reuse/**'
      - 'sandbox_method_reuse_help/**'
      - 'sandbox_platform_helper/**'
      - 'sandbox_platform_helper_help/**'
      - 'sandbox_tools/**'
      - 'sandbox_tools_help/**'
      - 'sandbox_triggerpattern/**'
      - 'sandbox_triggerpattern_help/**'
      - 'sandbox_use_general_type/**'
      - 'sandbox_use_general_type_help/**'
      - 'sandbox_usage_view/**'
      - 'sandbox_usage_view_test/**'
      - '.github/actions/use-runner-maven/**'
      - '.github/actions/verify-eclipse-desktop-runtime/**'
      - '.github/scripts/*.java'
      - '.github/workflows/eclipse-help-screenshots.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: Reproduce screenshots from the checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MAVEN_OPTS: -Djava.awt.headless=false
      NO_AT_BRIDGE: '1'
      GDK_BACKEND: x11
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SANDBOX_HELP_XML_CORPUS_REPOSITORY: https://github.com/eclipse-jdt/eclipse.jdt.ui.git
      SANDBOX_HELP_XML_CORPUS_REF: R4_40
      SANDBOX_HELP_XML_CORPUS_PATH: org.eclipse.jdt.ui/schema/cleanUps.exsd
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Reuse one substantial upstream schema in the existing SWTBot session;
      # sparse checkout avoids cloning or building the complete JDT UI reactor.
      - name: Checkout pinned JDT UI XML screenshot corpus
        uses: actions/checkout@v7
        with:
          repository: eclipse-jdt/eclipse.jdt.ui
          ref: R4_40
          fetch-depth: 1
          path: upstream/eclipse.jdt.ui
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            org.eclipse.jdt.ui/schema/cleanUps.exsd

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Use runner Maven
        uses: ./.github/actions/use-runner-maven

      - name: Verify preinstalled Eclipse desktop runtime
        uses: ./.github/actions/verify-eclipse-desktop-runtime

      - name: Verify exact PDE XML screenshot corpus
        shell: bash
        run: |
          set -euo pipefail
          source qa/upstream-jdt/pins.env
          actual="$(git -C upstream/eclipse.jdt.ui rev-parse 'HEAD^{commit}')"
          test "$actual" = "$PIN_JDT_UI_COMMIT"
          source_file="$GITHUB_WORKSPACE/upstream/eclipse.jdt.ui/$SANDBOX_HELP_XML_CORPUS_PATH"
          test -s "$source_file"
          printf 'SANDBOX_HELP_XML_CORPUS_COMMIT=%s\n' "$PIN_JDT_UI_COMMIT" >> "$GITHUB_ENV"
          printf 'SANDBOX_HELP_XML_CORPUS_FILE=%s\n' "$source_file" >> "$GITHUB_ENV"

      # This is the documented local Maven command with only the Linux virtual
      # display wrapper added. The workflow is a verifier, not the generator API.
      - name: Reproduce Eclipse Help screenshots
        run: >-
          timeout
          --signal=TERM
          --kill-after=2m
          70m
          xvfb-run
          --auto-servernum
          --server-args="-screen 0 1600x1200x24"
          mvn
          --no-transfer-progress
          -e
          -V
          --batch-mode
          -Dsandbox.tycho.linux-only=true
          -Dspotbugs.skip=true
          -Dtycho.localArtifacts=ignore
          -Dhelp.screenshot.testClass=org.sandbox.jdt.ui.helper.views.SandboxHelpScreenshotsMergeGateSWTBotTest
          -DfailIfNoTests=false
          -f sandbox_help_build/pom.xml
          -Phelp-screenshots
          clean verify

      # The POM interpolates help.screenshot.testClass only in the dedicated
      # screenshot module. Dependency test modules may therefore legitimately
      # find no matching class, while this report proves the merge gate ran.
      - name: Verify the merge-gate test executed
        shell: bash
        run: |
          set -euo pipefail
          report="$(grep -R -l --include='TEST-*.xml' \
            'SandboxHelpScreenshotsMergeGateSWTBotTest' \
            sandbox_usage_view_test/target/surefire-reports | head -n 1 || true)"
          if [[ -z "$report" ]]; then
            echo 'The selected Help screenshot JUnit merge gate did not execute.' >&2
            exit 1
          fi
          for scenario in \
            captureCleanupConfigurationTabs \
            captureRealCleanupPreviewAndVerifyIndependentSelection \
            capturePdeXmlMarkerQuickFix \
            verifyRealMethodReuseCleanupPreviewApplyAndUndo
          do
            if ! grep -Fq "name=\"$scenario\"" "$report"; then
              echo "The required Help screenshot scenario did not execute: $scenario" >&2
              exit 1
            fi
          done
          printf 'Verified JUnit report: %s\n' "$report"

      # The Int-to-Enum atomic candidate image is maintained by the separate
      # pinned patched-JDT-UI workflow. JFace previews are generated and checked
      # here and must never be restored from the checkout before verification.
      - name: Restore patched-host atomic preview image
        run: >-
          git restore --source=HEAD --
          sandbox_int_to_enum_help/images/int-to-enum-coordinated-preview.png

      - name: Verify real Cleanup preview evidence
        run: >-
          java
          .github/scripts/VerifyRealCleanupPreviewScreenshots.java
          sandbox_jface_cleanup_help/images/jface-cleanup.png
          sandbox_jface_cleanup_help/images/jface-cleanup-real-preview-single-file-steps.png
          sandbox_jface_cleanup_help/images/jface-cleanup-real-preview-diff-step.png
          sandbox_jface_cleanup_help/images/jface-cleanup-real-preview-multi-file-selection.png

      # Preserve every generated PNG before the intentional baseline mismatch can
      # fail this read-only verifier. The original relative paths, SHA-256
      # manifest and deterministic archive make stale artifact content obvious.
      - name: Stage generated Help screenshot evidence
        id: stage_help_screenshots
        shell: bash
        run: |
          set -euo pipefail
          evidence='target/generated-help-screenshot-evidence'
          archive="target/generated-help-screenshots-${GITHUB_RUN_ID}.tar.gz"
          rm -rf "$evidence"
          mkdir -p "$evidence/files"
          : > "$evidence/sha256.txt"
          while IFS= read -r image; do
            destination="$evidence/files/$image"
            mkdir -p "$(dirname "$destination")"
            cp -- "$image" "$destination"
            digest="$(sha256sum "$image" | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$image" >> "$evidence/sha256.txt"
          done < <(find . -path './sandbox*_help/images/*.png' -type f -printf '%P\n' | sort)
          sort -o "$evidence/sha256.txt" "$evidence/sha256.txt"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$archive" \
            -C "$evidence" .
          sha256sum "$archive" | tee "$evidence/archive-sha256.txt"
          cat "$evidence/sha256.txt"
          find "$evidence/files" -type f -printf '%P %s bytes\n' | sort

      # Intentional baseline changes must be copied from a completed verifier
      # artifact; the pull-request gate itself always remains read-only.
      - name: Verify committed screenshots are reproducible
        shell: bash
        run: |
          set -euo pipefail

          code_patterns='sandbox_triggerpattern_help/images/code-patterns-cleanup.png'
          jface_diff='sandbox_jface_cleanup_help/images/jface-cleanup-real-preview-diff-step.png'
          jface_selection='sandbox_jface_cleanup_help/images/jface-cleanup-real-preview-multi-file-selection.png'
          pde_xml_provenance='sandbox_xml_cleanup_help/images/xml-cleanup-marker-quick-fix.provenance.json'
          mapfile -t changes < <(git status --porcelain=v1 --untracked-files=all -- \
            ':(glob)sandbox*_help/images/*.png' "$pde_xml_provenance")
          unexpected=()
          row_permutations=()
          code_patterns_changed=false
          for change in "${changes[@]}"; do
            path="${change:3}"
            case "$path" in
              "$code_patterns")
                code_patterns_changed=true
                ;;
              "$jface_diff"|"$jface_selection")
                row_permutations+=("$path")
                ;;
              *)
                unexpected+=("$change")
                ;;
            esac
          done

          if (( ${#unexpected[@]} > 0 )); then
            echo 'Regenerated Help screenshot evidence differs from the checkout:' >&2
            printf '%s\n' "${unexpected[@]}" >&2
            exit 1
          fi

          # Stock LTK does not define the presentation order of sibling file
          # changes. Semantic assertions already bind each capture to its file,
          # diff and checkbox state. Accept only an exact swap of the two complete
          # file rows; every other pixel must remain identical to the baseline.
          for image in "${row_permutations[@]}"; do
            baseline="$(mktemp --suffix=.png)"
            git show "HEAD:$image" > "$baseline"
            java .github/scripts/VerifyHelpScreenshotRowPermutation.java "$baseline" "$image"
            rm -f "$baseline"
          done

          if [[ "$code_patterns_changed" == true ]]; then
            baseline="$(mktemp --suffix=.png)"
            git show "HEAD:$code_patterns" > "$baseline"
            java .github/scripts/VerifyHelpScreenshotDiff.java "$baseline" "$code_patterns"
            rm -f "$baseline"
          fi

      - name: Upload generated Help screenshot evidence
        if: always() && steps.stage_help_screenshots.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: generated-help-screenshots-${{ github.run_number }}-${{ github.run_id }}
          path: |
            target/generated-help-screenshot-evidence/
            target/generated-help-screenshots-${{ github.run_id }}.tar.gz
            sandbox_xml_cleanup_help/images/xml-cleanup-marker-quick-fix.provenance.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload reproduced screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eclipse-help-screenshots-${{ github.run_number }}
          path: |
            sandbox*_help/images/*.png
            sandbox_xml_cleanup_help/images/xml-cleanup-marker-quick-fix.provenance.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload SWTBot diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: eclipse-help-swtbot-diagnostics-${{ github.run_number }}
          path: |
            sandbox_usage_view_test/target/work/data/.metadata/.log
            sandbox_usage_view_test/target/surefire-reports/**
          retention-days: 14
          if-no-files-found: warn
