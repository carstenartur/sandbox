name: Cleanup Old Workflow Runs

on:
  schedule:
    # Offset from the top of the hour to avoid GitHub's busiest scheduling window.
    - cron: '17 * * * *'
  push:
    paths:
      - '.github/workflows/cleanup-workflow-runs.yml'
      - '.github/scripts/cleanup-workflow-runs.cjs'
      - '.github/scripts/cleanup-workflow-runs.test.cjs'
  workflow_dispatch:
    inputs:
      retain_days:
        description: 'Delete completed runs older than this many days'
        required: false
        type: number
        default: 30
      keep_minimum_runs:
        description: 'Keep at least this many old runs per workflow even beyond retention'
        required: false
        type: number
        default: 5
      stale_queue_hours:
        description: 'Cancel queued/waiting runs older than this many hours'
        required: false
        type: number
        default: 24
      dry_run:
        description: 'Log selected cancellation/deletion operations without changing runs'
        required: false
        type: boolean
        default: false
      max_deletions:
        description: 'Maximum deletions per execution; the API-rate budget may reduce it'
        required: false
        type: number
        default: 4000
      parallelism:
        description: 'Concurrent cancel/delete requests'
        required: false
        type: number
        default: 4

permissions:
  contents: read
  actions: write

concurrency:
  group: cleanup-workflow-runs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout cleanup implementation
        uses: actions/checkout@v7

      - name: Verify cleanup selection and rate-limit logic
        run: node --test .github/scripts/cleanup-workflow-runs.test.cjs

      - name: Cancel stale queued runs and delete old completed runs
        id: cleanup
        uses: actions/github-script@v9
        env:
          RETAIN_DAYS: ${{ inputs.retain_days || '30' }}
          KEEP_MINIMUM_RUNS: ${{ inputs.keep_minimum_runs || '5' }}
          STALE_QUEUE_HOURS: ${{ inputs.stale_queue_hours || '24' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MAX_DELETIONS: ${{ inputs.max_deletions || '4000' }}
          PARALLELISM: ${{ inputs.parallelism || '4' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const cleanup = require('./.github/scripts/cleanup-workflow-runs.cjs');
            await cleanup.run({ github, context, core, env: process.env });

      - name: Publish cleanup result
        if: always()
        run: |
          echo "Stale queued/waiting runs cancelled: ${{ steps.cleanup.outputs.cancelled || '0' }}"
          echo "Old completed runs deleted: ${{ steps.cleanup.outputs.deleted || '0' }}"
          echo "Remaining eligible backlog: ${{ steps.cleanup.outputs.remaining || 'unknown' }}"
