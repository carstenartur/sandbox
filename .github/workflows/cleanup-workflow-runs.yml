name: Cleanup Old Workflow Runs

on:
  schedule:
    # Offset from the top of the hour to avoid GitHub's busiest scheduling window.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      retain_days:
        description: 'Delete completed runs older than this many days'
        required: false
        type: number
        default: 30
      keep_minimum_runs:
        description: 'Keep at least this many old runs per workflow beyond retention'
        required: false
        type: number
        default: 5
      dry_run:
        description: 'List selected runs without deleting them'
        required: false
        type: boolean
        default: false
      max_deletions:
        description: 'Maximum deletions; the remaining API budget may reduce it'
        required: false
        type: number
        default: 4000
      parallelism:
        description: 'Concurrent deletion requests'
        required: false
        type: number
        default: 4
  pull_request:
    paths:
      - '.github/workflows/cleanup-workflow-runs.yml'
      - '.github/scripts/cleanup-workflow-runs.cjs'
      - '.github/scripts/cleanup-workflow-runs.test.cjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-workflow-runs.yml'
      - '.github/scripts/cleanup-workflow-runs.cjs'
      - '.github/scripts/cleanup-workflow-runs.test.cjs'

permissions:
  contents: read

concurrency:
  group: cleanup-workflow-runs-${{ github.repository }}
  # Never terminate an in-progress deletion batch. The next hourly run waits.
  cancel-in-progress: false

jobs:
  verify:
    name: Verify cleanup implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout cleanup implementation
        uses: actions/checkout@v7

      - name: Test selection, pagination and rate-limit logic
        run: node --test .github/scripts/cleanup-workflow-runs.test.cjs

  cleanup:
    name: Delete old completed workflow runs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout cleanup implementation
        uses: actions/checkout@v7

      - name: Scan and delete old completed runs
        id: cleanup
        uses: actions/github-script@v9
        env:
          RETAIN_DAYS: ${{ inputs.retain_days || '30' }}
          KEEP_MINIMUM_RUNS: ${{ inputs.keep_minimum_runs || '5' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MAX_DELETIONS: ${{ inputs.max_deletions || '4000' }}
          PARALLELISM: ${{ inputs.parallelism || '4' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const cleanup = require('./.github/scripts/cleanup-workflow-runs.cjs');
            await cleanup.run({ github, context, core, env: process.env });

      - name: Publish cleanup result
        if: always()
        run: |
          echo "Selected: ${{ steps.cleanup.outputs.selected || '0' }}"
          echo "Deleted: ${{ steps.cleanup.outputs.deleted || '0' }}"
          echo "Remaining eligible backlog: ${{ steps.cleanup.outputs.remaining || 'unknown' }}"
