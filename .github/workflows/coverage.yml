# Publish measured JUnit and line-coverage metrics and upload native GitHub coverage.
name: Verified test and coverage metrics

on:
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - '.github/actions/use-runner-maven/**'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Build and verify metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      checks: write
      code-quality: write
      pull-requests: read
    outputs:
      ran: ${{ steps.gate.outputs.run }}
    env:
      MAVEN_OPTS: -Djava.awt.headless=true
      QUALITY_SITE: target/quality-site
      COVERAGE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Select repository-policy review context
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            base="refs/remotes/origin/$GITHUB_BASE_REF"
            printf 'REPOSITORY_POLICY_BASE=%s\n' "$base" >> "$GITHUB_ENV"
            printf 'Repository policy base: %s\n' "$base"
          else
            if [[ "$EVENT_BEFORE" =~ ^[0-9a-fA-F]{40}$ ]] \
                && [[ "$EVENT_BEFORE" != '0000000000000000000000000000000000000000' ]]; then
              printf 'REPOSITORY_POLICY_BASE=%s\n' "$EVENT_BEFORE" >> "$GITHUB_ENV"
              printf 'Repository policy base: %s\n' "$EVENT_BEFORE"
            fi
            exception='Post-review push, scheduled, or manually dispatched verification has no active pull-request body; review-size approval was already handled before merge, while full tracked-tree and forbidden-automation policy checks remain active.'
            printf 'REPOSITORY_POLICY_EXCEPTION=%s\n' "$exception" >> "$GITHUB_ENV"
            printf '%s\n' "$exception"
          fi

      - name: Decide whether the scheduled build is needed
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          run=true
          if [[ "$EVENT_NAME" == 'schedule' ]]; then
            recent_commit="$(git log -1 --since='24 hours ago' --format='%H')"
            if [[ -z "$recent_commit" ]]; then
              run=false
              echo 'No commits in the last 24 hours; keeping the last verified publication.'
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Use runner Maven
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/use-runner-maven

      - name: Set up Node.js for CSS tests
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up .NET for coverage conversion
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'
          dotnet-quality: ga

      - name: Install CSS and desktop-test tooling
        if: steps.gate.outputs.run == 'true'
        run: |
          npm install --global prettier stylelint stylelint-config-standard
          sudo apt-get update
          sudo apt-get install -y \
            xvfb xauth libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1

      - name: Build the complete coverage reactor
        if: steps.gate.outputs.run == 'true'
        run: >-
          xvfb-run --auto-servernum mvn
          --no-transfer-progress
          -e
          -V
          -T 1C
          --batch-mode
          -Dtycho.localArtifacts=ignore
          -Pjacoco,reports,product,repo,benchmark,cli-dist,maven-plugin
          clean verify

      - name: Collect JUnit results
        id: junit
        if: always() && steps.gate.outputs.run == 'true'
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          check_name: Verified quality test results
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true
          detailed_summary: true
          include_passed: false

      - name: Stage generated HTML reports
        if: success() && steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$QUALITY_SITE"
          mkdir -p "$QUALITY_SITE/coverage" "$QUALITY_SITE/tests"

          coverage_dir='sandbox_coverage/target/site/jacoco-aggregate'
          test -s "$coverage_dir/jacoco.csv"
          test -s "$coverage_dir/jacoco.xml"
          test -s "$coverage_dir/index.html"
          cp -a "$coverage_dir/." "$QUALITY_SITE/coverage/"

          while IFS= read -r -d '' report; do
            site_dir="$(dirname "$report")"
            target_dir="$(dirname "$site_dir")"
            module_dir="$(dirname "$target_dir")"
            module="${module_dir#./}"
            mkdir -p "$QUALITY_SITE/tests/$module"
            cp -a "$site_dir/." "$QUALITY_SITE/tests/$module/"
          done < <(find . -type f -path '*/target/site/surefire-report.html' -print0)

      - name: Discover Java source roots
        id: coverage_sources
        if: success() && steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          roots="$({
            find . -type d \
              \( -path './.git' -o -path '*/target' -o -path '*/node_modules' \) -prune -o \
              -type d \( -name src -o -path '*/src/main/java' \) -print
          } | LC_ALL=C sort -u | paste -sd';' -)"
          if [[ -z "$roots" ]]; then
            echo '::error::No Java source roots were discovered.'
            exit 1
          fi
          echo "roots=$roots" >> "$GITHUB_OUTPUT"

      - name: Convert aggregate JaCoCo coverage
        if: success() && steps.gate.outputs.run == 'true'
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
        with:
          reports: sandbox_coverage/target/site/jacoco-aggregate/jacoco.xml
          targetdir: target/native-coverage
          reporttypes: Cobertura;JsonSummary
          sourcedirs: ${{ steps.coverage_sources.outputs.roots }}
          tag: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate and publish line-coverage endpoint
        id: line_coverage
        if: success() && steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          summary='target/native-coverage/Summary.json'
          cobertura='target/native-coverage/Cobertura.xml'
          test -s "$summary"
          test -s "$cobertura"

          coverage="$(jq -er '.summary.linecoverage | select(type == "number")' "$summary")"
          covered="$(jq -er '.summary.coveredlines | select(type == "number")' "$summary")"
          uncovered="$(jq -er '.summary.uncoveredlines | select(type == "number")' "$summary")"
          coverable="$(jq -er '.summary.coverablelines | select(type == "number")' "$summary")"
          [[ "$covered" =~ ^[0-9]+$ ]]
          [[ "$uncovered" =~ ^[0-9]+$ ]]
          [[ "$coverable" =~ ^[0-9]+$ ]]
          (( covered + uncovered == coverable ))
          (( coverable > 0 ))
          awk -v value="$coverage" 'BEGIN { exit !(value >= 0 && value <= 100) }'

          message="$(awk -v value="$coverage" 'BEGIN { printf "%.1f%%", value }')"
          color="$(awk -v value="$coverage" 'BEGIN {
            if (value >= 80) print "brightgreen";
            else if (value >= 60) print "green";
            else if (value >= 40) print "yellow";
            else print "red";
          }')"

          mkdir -p "$QUALITY_SITE/badges"
          jq -n \
            --arg message "$message" \
            --arg color "$color" \
            '{schemaVersion: 1, label: "line coverage", message: $message, color: $color}' \
            > "$QUALITY_SITE/badges/coverage.json"

          {
            echo "percent=$coverage"
            echo "covered=$covered"
            echo "coverable=$coverable"
          } >> "$GITHUB_OUTPUT"

      - name: Upload native GitHub code coverage
        if: ${{ success() && steps.gate.outputs.run == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-code-coverage@v1
        with:
          file: target/native-coverage/Cobertura.xml
          language: Java
          label: code-coverage/jacoco
          wait-for-processing-timeout: 300

      - name: Generate test endpoint and report index
        if: success() && steps.gate.outputs.run == 'true'
        shell: bash
        env:
          TOTAL: ${{ steps.junit.outputs.total }}
          PASSED: ${{ steps.junit.outputs.passed }}
          SKIPPED: ${{ steps.junit.outputs.skipped }}
          FAILED: ${{ steps.junit.outputs.failed }}
          COVERAGE: ${{ steps.line_coverage.outputs.percent }}
          COVERED_LINES: ${{ steps.line_coverage.outputs.covered }}
          COVERABLE_LINES: ${{ steps.line_coverage.outputs.coverable }}
        run: |
          set -euo pipefail
          for value in "$TOTAL" "$PASSED" "$SKIPPED" "$FAILED" "$COVERED_LINES" "$COVERABLE_LINES"; do
            [[ "$value" =~ ^[0-9]+$ ]] || {
              echo "Invalid measured integer: $value" >&2
              exit 1
            }
          done
          [[ "$COVERAGE" =~ ^[0-9]+([.][0-9]+)?$ ]] || {
            echo "Invalid line coverage: $COVERAGE" >&2
            exit 1
          }

          color=brightgreen
          if (( FAILED > 0 )); then
            color=red
          fi

          mkdir -p "$QUALITY_SITE/badges" "$QUALITY_SITE/tests"
          jq -n \
            --arg message "$TOTAL tests, $SKIPPED skipped" \
            --arg color "$color" \
            '{schemaVersion: 1, label: "tests", message: $message, color: $color}' \
            > "$QUALITY_SITE/badges/tests.json"

          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg sourceCommit "$COVERAGE_COMMIT" \
            --arg generatedAt "$generated_at" \
            --argjson total "$TOTAL" \
            --argjson passed "$PASSED" \
            --argjson skipped "$SKIPPED" \
            --argjson failed "$FAILED" \
            --argjson coverage "$COVERAGE" \
            --argjson coveredLines "$COVERED_LINES" \
            --argjson coverableLines "$COVERABLE_LINES" \
            '{
              schemaVersion: 2,
              sourceCommit: $sourceCommit,
              generatedAt: $generatedAt,
              tests: {
                total: $total,
                passed: $passed,
                skipped: $skipped,
                failed: $failed
              },
              coverage: {
                metric: "LINE",
                percent: $coverage,
                coveredLines: $coveredLines,
                coverableLines: $coverableLines
              }
            }' > "$QUALITY_SITE/quality-summary.json"

          cat > "$QUALITY_SITE/tests/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Sandbox verified test results</title>
            <style>
              body { font: 16px/1.5 system-ui, sans-serif; max-width: 72rem; margin: 2rem auto; padding: 0 1rem; }
              table { border-collapse: collapse; margin: 1rem 0 1.5rem; }
              th, td { border: 1px solid #bbb; padding: .45rem .7rem; text-align: right; }
              th:first-child, td:first-child { text-align: left; }
              code { overflow-wrap: anywhere; }
            </style>
          </head>
          <body>
            <h1>Sandbox verified test results</h1>
            <p>Source commit: <code>$COVERAGE_COMMIT</code></p>
            <table>
              <thead><tr><th>Metric</th><th>Value</th></tr></thead>
              <tbody>
                <tr><td>Total</td><td>$TOTAL</td></tr>
                <tr><td>Passed</td><td>$PASSED</td></tr>
                <tr><td>Skipped</td><td>$SKIPPED</td></tr>
                <tr><td>Failed</td><td>$FAILED</td></tr>
                <tr><td>Line coverage</td><td>$COVERAGE%</td></tr>
                <tr><td>Covered lines</td><td>$COVERED_LINES of $COVERABLE_LINES</td></tr>
              </tbody>
            </table>
            <p><a href="../coverage/">Aggregate JaCoCo report</a> · <a href="../quality-summary.json">Machine-readable summary</a></p>
            <h2>Module reports</h2>
            <ul>
          EOF

          while IFS= read -r -d '' report; do
            relative="${report#"$QUALITY_SITE/tests/"}"
            module="${relative%/surefire-report.html}"
            printf '      <li><a href="%s">%s</a></li>\n' "$relative" "$module" \
              >> "$QUALITY_SITE/tests/index.html"
          done < <(find "$QUALITY_SITE/tests" -type f -name surefire-report.html -print0 | sort -z)

          cat >> "$QUALITY_SITE/tests/index.html" <<'EOF'
            </ul>
          </body>
          </html>
          EOF

          test -s "$QUALITY_SITE/badges/tests.json"
          test -s "$QUALITY_SITE/badges/coverage.json"
          test -s "$QUALITY_SITE/quality-summary.json"
          test -s "$QUALITY_SITE/tests/index.html"

      - name: Upload available metric evidence
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verified-quality-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            target/quality-site/**
            target/native-coverage/Cobertura.xml
            target/native-coverage/Summary.json
            sandbox_coverage/target/site/jacoco-aggregate/jacoco.csv
            sandbox_coverage/target/site/jacoco-aggregate/jacoco.xml
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Publish verification-only summary
        if: always() && steps.gate.outputs.run == 'true' && github.ref != 'refs/heads/main'
        run: |
          {
            echo '## Verified quality evidence'
            echo
            echo 'This branch run verifies and uploads native line coverage but does not update the public GitHub Pages reports.'
            echo
            echo "[Workflow run and retained evidence](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish verified metrics to GitHub Pages
    needs: coverage
    if: ${{ needs.coverage.result == 'success' && needs.coverage.outputs.ran == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-workflow
      cancel-in-progress: false

    steps:
      - name: Download verified metric evidence
        uses: actions/download-artifact@v8
        with:
          name: verified-quality-${{ github.run_number }}-${{ github.run_attempt }}
          path: .

      - name: Validate staged public report
        run: |
          set -euo pipefail
          test -s target/quality-site/badges/tests.json
          test -s target/quality-site/badges/coverage.json
          test -s target/quality-site/quality-summary.json
          test -s target/quality-site/tests/index.html
          test -s target/quality-site/coverage/index.html

      - name: Publish reports and badges to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/quality-site
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'Publish verified test and coverage metrics for ${{ github.sha }}'

      - name: Publish public report links
        run: |
          {
            echo '## Verified quality evidence'
            echo
            echo '[Test totals and module reports](https://carstenartur.github.io/sandbox/tests/)'
            echo
            echo '[Aggregate JaCoCo coverage](https://carstenartur.github.io/sandbox/coverage/)'
            echo
            echo '[Machine-readable summary](https://carstenartur.github.io/sandbox/quality-summary.json)'
          } >> "$GITHUB_STEP_SUMMARY"
