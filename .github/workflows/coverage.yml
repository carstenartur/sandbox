# Publish authoritative test totals, skipped-test totals and aggregate JaCoCo coverage.
name: Verified test and coverage metrics

on:
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - '.github/actions/use-runner-maven/**'
      - '.github/scripts/generate_quality_badges.py'
      - '.github/scripts/test_generate_quality_badges.py'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
      - '.github/scripts/generate_quality_badges.py'
      - '.github/scripts/test_generate_quality_badges.py'
      - '.github/workflows/coverage.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  badge-generator-tests:
    name: Quality badge generator tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Compile and test the generator
        run: |
          python3 -m py_compile \
            .github/scripts/generate_quality_badges.py \
            .github/scripts/test_generate_quality_badges.py
          python3 .github/scripts/test_generate_quality_badges.py

  coverage:
    name: Build and publish verified metrics
    needs: badge-generator-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      MAVEN_OPTS: -Djava.awt.headless=true
      QUALITY_SITE: /tmp/sandbox-quality-site

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the scheduled build is needed
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          run=true
          if [[ "${{ github.event_name }}" == "schedule" ]] \
              && ! git log --since='24 hours ago' --format='%H' | grep -q .; then
            run=false
            echo 'No commits in the last 24 hours; keeping the last verified publication.'
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Use runner Maven
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/use-runner-maven

      - name: Set up Node.js for CSS tests
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install CSS and desktop-test tooling
        if: steps.gate.outputs.run == 'true'
        run: |
          npm install --global prettier stylelint stylelint-config-standard
          sudo apt-get update
          sudo apt-get install -y \
            xvfb xauth libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1

      - name: Build the complete coverage reactor
        if: steps.gate.outputs.run == 'true'
        run: >-
          xvfb-run --auto-servernum mvn
          --no-transfer-progress
          -e
          -V
          -T 1C
          --batch-mode
          -Dtycho.localArtifacts=ignore
          -Pjacoco,product,repo,benchmark,cli-dist,maven-plugin
          clean verify

      - name: Stage reports and generate badges
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$QUALITY_SITE"
          mkdir -p "$QUALITY_SITE/coverage" "$QUALITY_SITE/tests"

          coverage_dir='sandbox_coverage/target/site/jacoco-aggregate'
          test -s "$coverage_dir/jacoco.xml"
          cp -a "$coverage_dir/." "$QUALITY_SITE/coverage/"

          for module in sandbox_*_test; do
            report="$module/target/site/surefire-report.html"
            if [[ -f "$report" ]]; then
              mkdir -p "$QUALITY_SITE/tests/$module"
              cp -a "$module/target/site/." "$QUALITY_SITE/tests/$module/"
            fi
          done

          python3 .github/scripts/generate_quality_badges.py \
            --root . \
            --output "$QUALITY_SITE" \
            --commit "$GITHUB_SHA"

          test -s "$QUALITY_SITE/badges/tests.json"
          test -s "$QUALITY_SITE/badges/coverage.json"
          test -s "$QUALITY_SITE/quality-summary.json"
          test -s "$QUALITY_SITE/tests/index.html"

      - name: Upload metric evidence
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verified-quality-${{ github.run_number }}
          path: |
            /tmp/sandbox-quality-site/badges/*.json
            /tmp/sandbox-quality-site/quality-summary.json
            sandbox_coverage/target/site/jacoco-aggregate/jacoco.xml
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 30

      - name: Publish reports and badges to GitHub Pages
        if: steps.gate.outputs.run == 'true' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/sandbox-quality-site
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'Publish verified test and coverage metrics for ${{ github.sha }}'

      - name: Publish report links
        if: steps.gate.outputs.run == 'true'
        run: |
          {
            echo '## Verified quality evidence'
            echo
            echo '[Test totals and skipped tests](https://carstenartur.github.io/sandbox/tests/)'
            echo
            echo '[Aggregate JaCoCo coverage](https://carstenartur.github.io/sandbox/coverage/)'
            echo
            echo '[Machine-readable summary](https://carstenartur.github.io/sandbox/quality-summary.json)'
          } >> "$GITHUB_STEP_SUMMARY"
