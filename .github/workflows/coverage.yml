# Publish authoritative test totals, skipped-test totals and aggregate JaCoCo coverage.
name: Verified test and coverage metrics

on:
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'sandbox*/**'
      - 'features/**'
      - 'plugins/**'
      - 'org/**'
      - '*.xml'
      - '*.properties'
      - '.github/actions/use-runner-maven/**'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'COVERAGE_DEPLOYMENT.md'
      - 'docs/quality-metrics.md'
      - 'sandbox_quality_metrics/**'
      - '.github/workflows/coverage.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-tool-tests:
    name: Quality metric generator tests
    runs-on: ubuntu-24.04
    env:
      MAVEN_OPTS: -Djava.awt.headless=true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Use runner Maven
        uses: ./.github/actions/use-runner-maven

      - name: Run the Maven/JUnit metric-generator tests
        run: >-
          mvn
          --no-transfer-progress
          -V
          --batch-mode
          --file sandbox_quality_metrics/pom.xml
          clean verify

  coverage:
    name: Build and verify/publish metrics
    needs: quality-tool-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      MAVEN_OPTS: -Djava.awt.headless=true
      QUALITY_SITE: /tmp/sandbox-quality-site

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select repository-policy review context
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            base="refs/remotes/origin/$GITHUB_BASE_REF"
            printf 'REPOSITORY_POLICY_BASE=%s\n' "$base" >> "$GITHUB_ENV"
            printf 'Repository policy base: %s\n' "$base"
          else
            if [[ "$EVENT_BEFORE" =~ ^[0-9a-fA-F]{40}$ ]] \
                && [[ "$EVENT_BEFORE" != '0000000000000000000000000000000000000000' ]]; then
              printf 'REPOSITORY_POLICY_BASE=%s\n' "$EVENT_BEFORE" >> "$GITHUB_ENV"
              printf 'Repository policy base: %s\n' "$EVENT_BEFORE"
            fi
            exception='Post-review push, scheduled, or manually dispatched verification has no active pull-request body; review-size approval was already handled before merge, while full tracked-tree and forbidden-automation policy checks remain active.'
            printf 'REPOSITORY_POLICY_EXCEPTION=%s\n' "$exception" >> "$GITHUB_ENV"
            printf '%s\n' "$exception"
          fi

      - name: Decide whether the scheduled build is needed
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          run=true
          if [[ "$EVENT_NAME" == 'schedule' ]]; then
            recent_commit="$(git log -1 --since='24 hours ago' --format='%H')"
            if [[ -z "$recent_commit" ]]; then
              run=false
              echo 'No commits in the last 24 hours; keeping the last verified publication.'
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Use runner Maven
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/use-runner-maven

      - name: Set up Node.js for CSS tests
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install CSS and desktop-test tooling
        if: steps.gate.outputs.run == 'true'
        run: |
          npm install --global prettier stylelint stylelint-config-standard
          sudo apt-get update
          sudo apt-get install -y \
            xvfb xauth libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1

      - name: Build the complete coverage reactor
        if: steps.gate.outputs.run == 'true'
        run: >-
          xvfb-run --auto-servernum mvn
          --no-transfer-progress
          -e
          -V
          -T 1C
          --batch-mode
          -Dtycho.localArtifacts=ignore
          -Pjacoco,reports,product,repo,benchmark,cli-dist,maven-plugin
          clean verify

      - name: Package the verified metric generator
        if: steps.gate.outputs.run == 'true'
        run: >-
          mvn
          --no-transfer-progress
          -V
          --batch-mode
          --file sandbox_quality_metrics/pom.xml
          -DskipTests
          package

      - name: Stage reports and generate badges
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$QUALITY_SITE"
          mkdir -p "$QUALITY_SITE/coverage" "$QUALITY_SITE/tests"

          coverage_dir='sandbox_coverage/target/site/jacoco-aggregate'
          test -s "$coverage_dir/jacoco.xml"
          cp -a "$coverage_dir/." "$QUALITY_SITE/coverage/"

          while IFS= read -r -d '' report; do
            site_dir="$(dirname "$report")"
            target_dir="$(dirname "$site_dir")"
            module_dir="$(dirname "$target_dir")"
            module="${module_dir#./}"
            mkdir -p "$QUALITY_SITE/tests/$module"
            cp -a "$site_dir/." "$QUALITY_SITE/tests/$module/"
          done < <(find . -type f -path '*/target/site/surefire-report.html' -print0)

          java \
            -cp sandbox_quality_metrics/target/classes \
            org.sandbox.build.quality.QualityBadgeGenerator \
            --root . \
            --output "$QUALITY_SITE" \
            --commit "$GITHUB_SHA"

          test -s "$QUALITY_SITE/badges/tests.json"
          test -s "$QUALITY_SITE/badges/coverage.json"
          test -s "$QUALITY_SITE/quality-summary.json"
          test -s "$QUALITY_SITE/tests/index.html"

      - name: Upload available metric evidence
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verified-quality-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            /tmp/sandbox-quality-site/badges/*.json
            /tmp/sandbox-quality-site/quality-summary.json
            /tmp/sandbox-quality-site/tests/index.html
            sandbox_coverage/target/site/jacoco-aggregate/jacoco.xml
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Publish reports and badges to GitHub Pages
        if: success() && steps.gate.outputs.run == 'true' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/sandbox-quality-site
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'Publish verified test and coverage metrics for ${{ github.sha }}'

      - name: Publish public report links
        if: success() && steps.gate.outputs.run == 'true' && github.ref == 'refs/heads/main'
        run: |
          {
            echo '## Verified quality evidence'
            echo
            echo '[Test totals and skipped tests](https://carstenartur.github.io/sandbox/tests/)'
            echo
            echo '[Aggregate JaCoCo coverage](https://carstenartur.github.io/sandbox/coverage/)'
            echo
            echo '[Machine-readable summary](https://carstenartur.github.io/sandbox/quality-summary.json)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish verification-only summary
        if: always() && steps.gate.outputs.run == 'true' && github.ref != 'refs/heads/main'
        run: |
          {
            echo '## Verified quality evidence'
            echo
            echo 'This branch run verifies the complete generation path but does not update the public GitHub Pages reports.'
            echo
            echo "[Workflow run and retained evidence](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"
