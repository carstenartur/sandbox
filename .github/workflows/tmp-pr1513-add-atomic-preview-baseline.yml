name: Add PR 1513 atomic Cleanup preview baseline

on:
  push:
    branches:
      - qa/atomic-int-to-enum-preview-gate
    paths:
      - sandbox_int_to_enum_help/pr1513-atomic-preview-baseline.trigger

permissions:
  actions: read
  contents: write

concurrency:
  group: pr1513-add-atomic-preview-baseline
  cancel-in-progress: true

jobs:
  add-baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: qa/atomic-int-to-enum-preview-gate
          fetch-depth: 0

      - name: Add exact image from verified patched-runtime run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='.github/workflows/tmp-pr1513-add-atomic-preview-baseline.yml'
          trigger='sandbox_int_to_enum_help/pr1513-atomic-preview-baseline.trigger'
          target='sandbox_int_to_enum_help/images/int-to-enum-coordinated-preview.png'
          artifact_dir="$RUNNER_TEMP/patched-jdt-ui-atomic-preview-35"
          expected_sha256='57d034be1bfb8f1f357688ca3590e2197b053fb8c8a309dd0aa6881e0a952be6'
          expected_size='90434'

          test ! -e "$target"
          mkdir -p "$artifact_dir"
          gh run download 32488655182 \
            --repo "$GITHUB_REPOSITORY" \
            --name patched-jdt-ui-atomic-preview-35 \
            --dir "$artifact_dir"

          source_image="$(find "$artifact_dir" -type f \
            -path '*/sandbox_int_to_enum_help/images/int-to-enum-coordinated-preview.png' \
            -print -quit)"
          test -n "$source_image"
          test "$(sha256sum "$source_image" | awk '{print $1}')" = "$expected_sha256"
          test "$(stat -c '%s' "$source_image")" = "$expected_size"
          file "$source_image" | grep -Fq 'PNG image data, 1280 x 900'

          install -D -m 0644 "$source_image" "$target"
          test "$(sha256sum "$target" | awk '{print $1}')" = "$expected_sha256"
          test "$(git status --porcelain=v1 --untracked-files=all -- "$target")" = "?? $target"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          git rm -- "$workflow" "$trigger"
          git commit -m 'Add verified atomic Cleanup preview baseline'
          git push origin HEAD:qa/atomic-int-to-enum-preview-gate
