name: Release Workflow

# Fail-closed release publication. The stable source tree, Maven distribution,
# public p2 repository, tag source archives and draft GitHub Release are all
# verified before the release is published and can trigger archival services.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Stable version matching the current SNAPSHOT without -SNAPSHOT
        required: true
        type: string
      next_development_version:
        description: Exact next development version (X.Y.Z-SNAPSHOT); leave empty to use the increment choice
        required: false
        default: ''
        type: string
      next_version_increment:
        description: Fallback when the exact next development version is empty
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      skip_tests:
        description: Skip tests for a dry-run diagnostic build only
        required: false
        default: false
        type: boolean
      dry_run:
        description: Build and verify without publishing
        required: false
        default: false
        type: boolean
  push:
    branches:
      - 'release-request/**'
    paths:
      - '.github/release-request'

concurrency:
  group: release-workflow
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Build, verify and publish stable release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAVEN_OPTS: -Djava.awt.headless=true
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Use runner Maven
        uses: ./.github/actions/use-runner-maven

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', 'sandbox_target/*.target') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Install Linux desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1

      - name: Test release publication helpers
        run: |
          python3 .github/scripts/test-release-version-plan.py
          python3 .github/scripts/test_verify_release_identity.py
          python3 .github/scripts/test_wait_for_pages_build.py
          python3 .github/scripts/test_verify_published_repository.py

      - name: Validate requested version and immutable starting state
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
          NEXT_DEVELOPMENT_VERSION_INPUT: ${{ inputs.next_development_version }}
          NEXT_VERSION_INCREMENT_INPUT: ${{ inputs.next_version_increment }}
        run: |
          set -euo pipefail
          starting_sha=$(git rev-parse HEAD)
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_main" != "$starting_sha" ]]; then
            echo "::error::Checked-out main $starting_sha differs from remote main $remote_main."
            exit 1
          fi

          current_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            release_version_input="$RELEASE_VERSION_INPUT"
            next_development_version_input="$NEXT_DEVELOPMENT_VERSION_INPUT"
            next_version_increment="${NEXT_VERSION_INCREMENT_INPUT:-patch}"
          else
            git fetch --no-tags origin "${{ github.sha }}"
            branch_version="${GITHUB_REF_NAME#release-request/}"
            marker_version=$(git show "${{ github.sha }}:.github/release-request" | tr -d '[:space:]')
            if [[ "$branch_version" != "$marker_version" ]]; then
              echo "::error::Release request branch '$branch_version' differs from marker '$marker_version'."
              exit 1
            fi
            release_version_input="$marker_version"
            if git cat-file -e "${{ github.sha }}:.github/next-development-version" 2>/dev/null; then
              next_development_version_input=$(git show "${{ github.sha }}:.github/next-development-version")
            else
              next_development_version_input=''
            fi
            next_version_increment=patch
          fi

          plan_file="$RUNNER_TEMP/release-version-plan"
          : > "$plan_file"
          python3 .github/scripts/release-version-plan.py \
            --release "$release_version_input" \
            --next-development-version "$next_development_version_input" \
            --increment "$next_version_increment" \
            --github-output "$plan_file"
          # Values are regex-validated semantic versions produced by the planner.
          source "$plan_file"
          release_version="$release"
          next_snapshot="$next"

          if [[ "$current_version" != "${release_version}-SNAPSHOT" ]]; then
            echo "::error::Requested release '$release_version' does not match project version '$current_version'."
            exit 1
          fi

          dry_run='${{ inputs.dry_run }}'
          skip_tests='${{ inputs.skip_tests }}'
          [[ "$dry_run" == 'true' ]] || dry_run=false
          [[ "$skip_tests" == 'true' ]] || skip_tests=false
          if [[ "$skip_tests" == 'true' && "$dry_run" != 'true' ]]; then
            echo '::error::Published releases may not skip tests.'
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${release_version}" >/dev/null 2>&1; then
            echo "::error::Tag v${release_version} already exists."
            exit 1
          fi
          if gh release view "v${release_version}" >/dev/null 2>&1; then
            echo "::error::GitHub Release v${release_version} already exists."
            exit 1
          fi

          {
            echo "STARTING_SHA=$starting_sha"
            echo "CURRENT_VERSION=$current_version"
            echo "RELEASE_VERSION=$release_version"
            echo "NEXT_SNAPSHOT=$next_snapshot"
            echo "NEXT_RELEASE=$next_release"
            echo "DRY_RUN=$dry_run"
            echo "SKIP_TESTS=$skip_tests"
          } >> "$GITHUB_ENV"

      - name: Set and verify stable project version
        run: |
          set -euo pipefail
          tycho_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=tycho-version | tail -n 1)
          mvn org.eclipse.tycho:tycho-versions-plugin:"$tycho_version":set-version \
            -DnewVersion="$RELEASE_VERSION" -Pbenchmark,jacoco
          mvn -f sandbox_cleanup_cli_dist/pom.xml versions:set \
            -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
          mvn -f sandbox-maven-plugin/pom.xml versions:set \
            -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false

          actual=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)
          if [[ "$actual" != "$RELEASE_VERSION" ]]; then
            echo "::error::Stable tree reports project version '$actual', expected '$RELEASE_VERSION'."
            exit 1
          fi
          mkdir -p target/distribution-verification
          python3 .github/scripts/verify_release_identity.py \
            --root . \
            --expected-version "$RELEASE_VERSION" \
            --forbidden-version "$CURRENT_VERSION" \
            --output target/distribution-verification/release-tree-identity.json

      - name: Commit stable release tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/'
          git commit -m "Release version ${RELEASE_VERSION}"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Maven distribution build and verification
        timeout-minutes: 150
        run: |
          set -euo pipefail
          mkdir -p target/distribution-verification
          test_args=()
          if [[ "$SKIP_TESTS" == 'true' ]]; then
            test_args=(-DskipTests)
          fi
          xvfb-run --auto-servernum mvn \
            -Pdistribution,cli-dist,maven-plugin,benchmark \
            --batch-mode \
            -Dtycho.localArtifacts=ignore \
            clean verify "${test_args[@]}" 2>&1 \
            | tee target/distribution-verification/maven-release.log

      - name: Create and inspect immutable source archives
        run: |
          set -euo pipefail
          mkdir -p target/release-assets target/distribution-verification
          prefix="sandbox-${RELEASE_VERSION}/"
          git archive --format=tar --prefix="$prefix" HEAD \
            | gzip -n > "target/release-assets/sandbox-${RELEASE_VERSION}-source.tar.gz"
          git archive --format=zip --prefix="$prefix" \
            --output="target/release-assets/sandbox-${RELEASE_VERSION}-source.zip" HEAD
          python3 .github/scripts/verify_release_identity.py \
            --root . \
            --expected-version "$RELEASE_VERSION" \
            --forbidden-version "$CURRENT_VERSION" \
            --archive "target/release-assets/sandbox-${RELEASE_VERSION}-source.tar.gz" \
            --archive "target/release-assets/sandbox-${RELEASE_VERSION}-source.zip" \
            --output target/distribution-verification/release-source-identity.json

      - name: Record pre-publication evidence
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schemaVersion": 1,
              "status": "VERIFIED_NOT_PUBLISHED",
              "startingSha": os.environ["STARTING_SHA"],
              "releaseCommit": os.environ["RELEASE_COMMIT"],
              "releaseVersion": os.environ["RELEASE_VERSION"],
              "tag": f"v{os.environ['RELEASE_VERSION']}",
              "p2Url": f"https://carstenartur.github.io/sandbox/releases/{os.environ['RELEASE_VERSION']}/",
              "dryRun": os.environ["DRY_RUN"] == "true",
          }
          path = Path("target/distribution-verification/release-evidence.json")
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload verified pre-publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-${{ env.RELEASE_VERSION }}-${{ github.run_id }}
          path: |
            target/distribution-verification/
            target/release-assets/
          retention-days: 90
          if-no-files-found: error

      - name: Verify main remained unchanged
        if: env.DRY_RUN != 'true'
        run: |
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_main" != "$STARTING_SHA" ]]; then
            echo "::error::main moved during release verification: expected $STARTING_SHA, found $remote_main."
            exit 1
          fi

      - name: Checkout current gh-pages revision
        if: env.DRY_RUN != 'true'
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages-release
          fetch-depth: 1

      - name: Capture current gh-pages revision
        if: env.DRY_RUN != 'true'
        id: gh_pages_before
        run: echo "sha=$(git -C gh-pages-release rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy versioned p2 repository
        if: env.DRY_RUN != 'true'
        id: deploy_release_site
        run: |
          set -euo pipefail
          destination="gh-pages-release/releases/${RELEASE_VERSION}"
          mkdir -p "$destination"
          rm -rf "${destination:?}"/*
          cp -a sandbox_updatesite/target/repository/. "$destination/"
          cp target/distribution-verification/verification.json "$destination/distribution-verification.json"
          cp target/distribution-verification/verification.md "$destination/distribution-verification.md"

          cd gh-pages-release/releases
          mapfile -t versions < <(find . -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          timestamp="$(date +%s)000"
          {
            echo "<?xml version='1.0' encoding='UTF-8'?>"
            echo "<?compositeMetadataRepository version='1.0.0'?>"
            echo "<repository name='Sandbox Releases' type='org.eclipse.equinox.internal.p2.metadata.repository.CompositeMetadataRepository' version='1.0.0'>"
            echo "  <properties size='1'><property name='p2.timestamp' value='$timestamp'/></properties>"
            echo "  <children size='${#versions[@]}'>"
            printf "    <child location='%s'/>\n" "${versions[@]}"
            echo '  </children>'
            echo '</repository>'
          } > compositeContent.xml
          {
            echo "<?xml version='1.0' encoding='UTF-8'?>"
            echo "<?compositeArtifactRepository version='1.0.0'?>"
            echo "<repository name='Sandbox Releases' type='org.eclipse.equinox.internal.p2.artifact.repository.CompositeArtifactRepository' version='1.0.0'>"
            echo "  <properties size='1'><property name='p2.timestamp' value='$timestamp'/></properties>"
            echo "  <children size='${#versions[@]}'>"
            printf "    <child location='%s'/>\n" "${versions[@]}"
            echo '  </children>'
            echo '</repository>'
          } > compositeArtifacts.xml

          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Deploy release ${RELEASE_VERSION}"
          git push origin gh-pages

      - name: Capture deployed gh-pages revision
        if: env.DRY_RUN != 'true'
        id: gh_pages_after
        run: |
          git -C gh-pages-release fetch origin gh-pages
          echo "sha=$(git -C gh-pages-release rev-parse origin/gh-pages)" >> "$GITHUB_OUTPUT"

      - name: Await exact GitHub Pages publication
        if: env.DRY_RUN != 'true'
        run: |
          python3 .github/scripts/wait_for_pages_build.py \
            --repository "${{ github.repository }}" \
            --expected-commit "${{ steps.gh_pages_after.outputs.sha }}" \
            --output target/distribution-verification/pages-build.json

      - name: Verify public release repositories
        if: env.DRY_RUN != 'true'
        run: |
          python3 .github/scripts/verify_published_repository.py \
            --repository-url "https://carstenartur.github.io/sandbox/releases/${RELEASE_VERSION}/" \
            --expected-json target/distribution-verification/verification.json \
            --output target/distribution-verification/release-url-verification.json
          python3 .github/scripts/verify_published_repository.py \
            --repository-url https://carstenartur.github.io/sandbox/releases/ \
            --expected-child "$RELEASE_VERSION" \
            --output target/distribution-verification/release-composite-verification.json

      - name: Generate release notes
        if: env.DRY_RUN != 'true'
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "$STARTING_SHA" 2>/dev/null || true)
          if [[ -n "$previous_tag" ]]; then
            git log --no-merges --pretty='- %s' "${previous_tag}..${STARTING_SHA}" > release-notes.md
          else
            echo 'Initial verified release.' > release-notes.md
          fi
          [[ -s release-notes.md ]] || echo 'No user-visible changes recorded.' > release-notes.md

      - name: Create stable tag
        if: env.DRY_RUN != 'true'
        id: create_tag
        run: |
          git tag -a "v${RELEASE_VERSION}" -m "Release version ${RELEASE_VERSION}" "$RELEASE_COMMIT"
          git push origin "refs/tags/v${RELEASE_VERSION}"

      - name: Create draft GitHub Release
        if: env.DRY_RUN != 'true'
        id: create_release
        run: |
          assets=(
            "target/release-assets/sandbox-${RELEASE_VERSION}-source.tar.gz"
            "target/release-assets/sandbox-${RELEASE_VERSION}-source.zip"
          )
          for candidate in sandbox_cleanup_cli_dist/target/*-dist.tar.gz sandbox_cleanup_cli_dist/target/*-dist.zip; do
            [[ -f "$candidate" ]] && assets+=("$candidate")
          done
          gh release create "v${RELEASE_VERSION}" "${assets[@]}" \
            --draft \
            --verify-tag \
            --title "Release ${RELEASE_VERSION}" \
            --notes-file release-notes.md

      - name: Verify tag archives and draft release identity
        if: env.DRY_RUN != 'true'
        id: verify_draft_release
        run: |
          set -euo pipefail
          mkdir -p target/github-source
          gh api "repos/${GITHUB_REPOSITORY}/tarball/v${RELEASE_VERSION}" \
            > "target/github-source/github-v${RELEASE_VERSION}.tar.gz"
          gh api "repos/${GITHUB_REPOSITORY}/zipball/v${RELEASE_VERSION}" \
            > "target/github-source/github-v${RELEASE_VERSION}.zip"
          python3 .github/scripts/verify_release_identity.py \
            --root . \
            --expected-version "$RELEASE_VERSION" \
            --forbidden-version "$CURRENT_VERSION" \
            --archive "target/github-source/github-v${RELEASE_VERSION}.tar.gz" \
            --archive "target/github-source/github-v${RELEASE_VERSION}.zip" \
            --output target/distribution-verification/github-source-identity.json

          release_json=$(gh release view "v${RELEASE_VERSION}" \
            --json tagName,isDraft,isPrerelease,url)
          python3 - "$release_json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          release = json.loads(sys.argv[1])
          expected_tag = f"v{os.environ['RELEASE_VERSION']}"
          if release.get("tagName") != expected_tag:
              raise SystemExit(f"Unexpected release tag: {release}")
          if release.get("isDraft") is not True or release.get("isPrerelease") is not False:
              raise SystemExit(f"Release must remain a stable draft during verification: {release}")
          path = Path("target/distribution-verification/release-evidence.json")
          evidence = json.loads(path.read_text(encoding="utf-8"))
          evidence.update({"githubReleaseUrl": release["url"], "status": "DRAFT_VERIFIED"})
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          gh release upload "v${RELEASE_VERSION}" \
            target/distribution-verification/verification.json \
            target/distribution-verification/verification.md \
            target/distribution-verification/release-evidence.json \
            target/distribution-verification/release-source-identity.json \
            target/distribution-verification/github-source-identity.json \
            --clobber

      - name: Publish verified GitHub Release
        if: env.DRY_RUN != 'true'
        id: publish_release
        run: |
          gh release edit "v${RELEASE_VERSION}" --draft=false --prerelease=false
          release_json=$(gh release view "v${RELEASE_VERSION}" \
            --json tagName,isDraft,isPrerelease,url)
          python3 - "$release_json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          release = json.loads(sys.argv[1])
          if release.get("tagName") != f"v{os.environ['RELEASE_VERSION']}" \
                  or release.get("isDraft") or release.get("isPrerelease"):
              raise SystemExit(f"Published release identity is invalid: {release}")
          path = Path("target/distribution-verification/release-evidence.json")
          evidence = json.loads(path.read_text(encoding="utf-8"))
          evidence.update({"githubReleaseUrl": release["url"], "status": "PUBLISHED_VERIFIED"})
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          gh release upload "v${RELEASE_VERSION}" \
            target/distribution-verification/release-evidence.json --clobber

      - name: Roll back failed pre-publication state
        if: failure() && env.DRY_RUN != 'true' && steps.deploy_release_site.outcome == 'success' && steps.publish_release.outcome != 'success'
        run: |
          set +e
          gh release delete "v${RELEASE_VERSION}" --yes --cleanup-tag
          git push origin ":refs/tags/v${RELEASE_VERSION}"
          previous='${{ steps.gh_pages_before.outputs.sha }}'
          deployed='${{ steps.gh_pages_after.outputs.sha }}'
          if [[ -n "$previous" && -n "$deployed" ]]; then
            git -C gh-pages-release push \
              --force-with-lease="refs/heads/gh-pages:${deployed}" \
              origin "${previous}:refs/heads/gh-pages"
            python3 .github/scripts/wait_for_pages_build.py \
              --repository "${{ github.repository }}" \
              --expected-commit "$previous" \
              --output target/distribution-verification/pages-rollback-build.json
          fi
          exit 0

      - name: Fast-forward main to verified stable release commit
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_main" != "$STARTING_SHA" ]]; then
            echo "::error::main moved before stable promotion: expected $STARTING_SHA, found $remote_main."
            exit 1
          fi
          git push origin "${RELEASE_COMMIT}:refs/heads/main"

      - name: Prepare next development iteration pull request
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          branch="release/prepare-next-${NEXT_SNAPSHOT}"
          git checkout -b "$branch" "$RELEASE_COMMIT"
          tycho_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=tycho-version | tail -n 1)
          mvn org.eclipse.tycho:tycho-versions-plugin:"$tycho_version":set-version \
            -DnewVersion="$NEXT_SNAPSHOT" -Pbenchmark,jacoco
          mvn -f sandbox_cleanup_cli_dist/pom.xml versions:set \
            -DnewVersion="$NEXT_SNAPSHOT" -DgenerateBackupPoms=false
          mvn -f sandbox-maven-plugin/pom.xml versions:set \
            -DnewVersion="$NEXT_SNAPSHOT" -DgenerateBackupPoms=false
          sed -i "s/next.release.version=.*/next.release.version=${NEXT_RELEASE}/" release.properties
          git add -A -- ':!.github/workflows/'
          git commit -m "Prepare for next development iteration ${NEXT_SNAPSHOT}"
          git push origin "$branch"
          gh pr create \
            --title "Prepare for next development iteration ${NEXT_SNAPSHOT}" \
            --body "Automated version transition after verified release v${RELEASE_VERSION}." \
            --base main --head "$branch"

      - name: Create Marketplace and Zenodo verification issue
        if: env.DRY_RUN != 'true'
        run: |
          body=$(cat <<EOF
          ## Verified release ${RELEASE_VERSION}

          - GitHub Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${RELEASE_VERSION}
          - Composite update site: https://carstenartur.github.io/sandbox/releases/
          - Versioned update site: https://carstenartur.github.io/sandbox/releases/${RELEASE_VERSION}/
          - Distribution evidence: https://carstenartur.github.io/sandbox/releases/${RELEASE_VERSION}/distribution-verification.md

          ## External publication checklist

          - [ ] Update Eclipse Marketplace to ${RELEASE_VERSION}
          - [ ] Test Marketplace installation
          - [ ] Verify the Zenodo record names stable version ${RELEASE_VERSION}
          - [ ] Verify the Zenodo title contains no SNAPSHOT marker
          - [ ] Record the resulting version DOI while preserving the concept DOI
          EOF
          )
          gh label create release --color 0075ca --description 'Release-related tasks' 2>/dev/null || true
          gh issue create \
            --title "Release ${RELEASE_VERSION}: verify Marketplace and Zenodo" \
            --body "$body" --label release
