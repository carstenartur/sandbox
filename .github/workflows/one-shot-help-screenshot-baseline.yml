name: One-shot Help screenshot baseline update

on:
  push:
    branches:
      - issue-1437-triggerpattern-help-qa
    paths:
      - '.github/workflows/one-shot-help-screenshot-baseline.yml'

permissions:
  actions: read
  contents: write

jobs:
  update-baseline:
    if: github.event.head_commit.message == 'Bootstrap screenshot baseline update'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: issue-1437-triggerpattern-help-qa
          fetch-depth: 0

      - name: Download inspected reproduced screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/reproduced
          gh run download 31301801333 \
            --repo "${GITHUB_REPOSITORY}" \
            --name eclipse-help-screenshots-161 \
            --dir /tmp/reproduced
          test -f /tmp/reproduced/sandbox_triggerpattern_help/images/refactoring-mining-view.png
          test -f /tmp/reproduced/sandbox_triggerpattern_help/images/new-hint-rule-wizard.png
          cp -a /tmp/reproduced/. .

      - name: Commit exact CI screenshot baseline and remove bootstrap workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-help-screenshot-baseline.yml
          git add ':(glob)sandbox*_help/images/*.png'

          changes="$(git diff --cached --name-status)"
          printf '%s\n' "$changes"
          test -n "$changes"
          if printf '%s\n' "$changes" | awk '{ print $2 }' | grep -Ev '^(.github/workflows/one-shot-help-screenshot-baseline.yml|sandbox[^/]*/images/[^/]+\.png)$'; then
            echo 'Unexpected file outside the screenshot baseline update.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Eclipse Help screenshot baselines'
          git push origin HEAD:issue-1437-triggerpattern-help-qa
