name: Mathematics variable regions (scoped repair)

on:
  push:
    branches: [fix/math-variable-regions-20261009]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: math-variable-regions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  region-regressions:
    if: github.ref == 'refs/heads/fix/math-variable-regions-20261009'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: sandbox
      - name: Check and apply the source repair before any expensive build
        if: hashFiles('sandbox/.github/math-region-fix.patch') != ''
        working-directory: sandbox
        run: |
          set -euo pipefail
          git apply --recount --unidiff-zero --check .github/math-region-fix.patch
          git apply --recount --unidiff-zero .github/math-region-fix.patch
          git diff --check
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - name: Reuse the two-build qualified SDK rather than rebuild it for each adapter change
        if: hashFiles('sandbox/.github/math-region-fix.patch') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: sandbox
        run: |
          set -euo pipefail
          gh run download 37927294868 --repo "$GITHUB_REPOSITORY" \
            --name math-variable-regions-37927294868 --dir "$RUNNER_TEMP/qualified-sdk"
          mapfile -t receipts < <(find "$RUNNER_TEMP/qualified-sdk" -name reproducibility.json)
          test "${#receipts[@]}" -eq 1
          receipt="${receipts[0]}"
          jq -e '.status == "PASS" and .sourceRevision == "655809a500a18eda8dca6ad4e89b82751de0e521" and .cleanBuilds == 2 and .freshConsumers == 2 and .sdkTestsPerBuild > 0' "$receipt"
          distribution="$(dirname "$receipt")/first"
          mapfile -t qualifications < <(find "$distribution" -maxdepth 1 -name '*-qualification.json')
          test "${#qualifications[@]}" -eq 1
          qualification="${qualifications[0]}"
          version="$(jq -er '.version' "$qualification")"
          jar="$distribution/repository/de/regelsuche/regelsuche-optimization-sdk/$version/regelsuche-optimization-sdk-$version-all.jar"
          expected="$(jq -er '.standaloneJarSha256' "$qualification")"
          echo "$expected  $jar" | sha256sum --check -
          cp "$jar" sandbox_math_cleanup/lib/regelsuche-optimization-sdk.jar
          cp "$qualification" sandbox_math_cleanup/lib/qualification.json
          cp "$receipt" sandbox_math_cleanup/lib/reproducibility.json
          printf '# Pinned Regelsuche optimization SDK\n\nSource revision: `655809a500a18eda8dca6ad4e89b82751de0e521`.\nVersion: `%s`.\nStandalone JAR SHA-256: `%s`.\n\nMavenOptimizationSdkDistributionTest qualified two clean builds and two fresh consumers in run 37927294868 before this copy. See qualification.json and reproducibility.json for the source-bound receipts.\nGenerated Java has no Regelsuche runtime dependency. This is a private SDK distribution, not a public Maven release. Regelsuche-LICENSE and archive notices remain applicable.\n' "$version" "$expected" > sandbox_math_cleanup/lib/README.md
          rm .github/math-region-fix.patch
          git diff --check
          git diff --stat
      - name: Provision native workbench prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0
      - name: Run variable-region regressions through Maven and Tycho
        working-directory: sandbox
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum ./mvnw --batch-mode --no-transfer-progress \
            -pl sandbox_target,sandbox_math_cleanup,sandbox_math_cleanup_test -am \
            -Dtest=MathVariableRegionsTest -DfailIfNoTests=true verify 2>&1 | tee "$RUNNER_TEMP/math-variable-tests.log"
          test -n "$(find sandbox_math_cleanup_test/target/surefire-reports -name '*MathVariableRegionsTest*.xml' -print -quit)"
          mkdir -p "$RUNNER_TEMP/math-variable-reports"
          cp sandbox_math_cleanup_test/target/surefire-reports/*MathVariableRegionsTest* "$RUNNER_TEMP/math-variable-reports/"
      - name: Run the complete mathematics test module
        working-directory: sandbox
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum ./mvnw --batch-mode --no-transfer-progress \
            -pl sandbox_target,sandbox_math_cleanup,sandbox_math_cleanup_test -am verify \
            2>&1 | tee "$RUNNER_TEMP/math-module-tests.log"
      - name: Commit only the tested SDK and source changes on this repair branch
        working-directory: sandbox
        run: |
          set -euo pipefail
          git diff --check
          git add -A -- sandbox_math_cleanup .github
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'fix: optimize live variable results and direct returns with compact verified Java'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Retain exact repair sources and diagnostics
        if: always()
        working-directory: sandbox
        run: |
          git diff --binary > "$RUNNER_TEMP/math-repair-working.diff"
          git rev-parse HEAD > "$RUNNER_TEMP/math-repair-head.txt"
          git status --short >> "$RUNNER_TEMP/math-repair-head.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: math-variable-regions-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/math-variable-tests.log
            ${{ runner.temp }}/math-module-tests.log
            ${{ runner.temp }}/math-variable-reports/**
            ${{ runner.temp }}/math-repair-working.diff
            ${{ runner.temp }}/math-repair-head.txt
            sandbox/sandbox_math_cleanup_test/target/surefire-reports/**
