name: Mathematics variable regions (scoped repair)

on:
  push:
    branches: [fix/math-variable-regions-20261009]

permissions:
  contents: read

concurrency:
  group: math-variable-regions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-toolchain:
    if: github.event.before == '622bdc7896d99d5399cdb126b803c87184c6f5e9'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - name: Archive the exact test toolchain for the network-isolated repair workspace
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/math-toolchain"
          java -version 2> "$RUNNER_TEMP/math-toolchain/java-version.txt"
          tar -czf "$RUNNER_TEMP/math-toolchain/jdk-25.tar.gz" -C "$JAVA_HOME" .
          cd "$RUNNER_TEMP/math-toolchain"
          sha256sum jdk-25.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: math-java25-offline-${{ github.sha }}
          retention-days: 3
          compression-level: 0
          path: ${{ runner.temp }}/math-toolchain/**
  region-regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - name: Provision native workbench prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0
      - name: Run the actual Maven/Tycho/JUnit regression class
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          xvfb-run --auto-servernum ./mvnw --batch-mode --no-transfer-progress \
            -pl sandbox_target,sandbox_math_cleanup,sandbox_math_cleanup_test -am \
            -Dtest=MathVariableRegionsTest -DfailIfNoTests=true verify 2>&1 | tee math-variable-tests.log
          test -n "$(find sandbox_math_cleanup_test/target/surefire-reports -name '*MathVariableRegionsTest*.xml' -print -quit)"
      - name: Retain portable dependency cache and exact sources for offline repair
        if: github.event.before == 'a0183b53023b2385a055310702acd30ac8216501'
        run: |
          set -euo pipefail
          mkdir -p offline
          git archive --format=tar.gz HEAD > offline/sandbox-source.tar.gz
          git rev-parse HEAD > offline/sandbox-commit.txt
          tar -czf offline/maven-repository.tar.gz -C "$HOME/.m2" repository
          if [ -d "$HOME/.m2/wrapper" ]; then tar -czf offline/maven-wrapper.tar.gz -C "$HOME/.m2" wrapper; fi
          if [ -d "$HOME/.p2" ]; then tar -czf offline/p2.tar.gz -C "$HOME" .p2; fi
          sha256sum offline/*.tar.gz > offline/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: math-variable-regions-${{ github.sha }}
          retention-days: 7
          compression-level: 0
          path: |
            math-variable-tests.log
            sandbox_math_cleanup_test/target/surefire-reports/**
            sandbox_math_cleanup_test/target/work/data/.metadata/.log
            offline/**
      - name: Preserve the real test outcome
        if: always() && steps.tests.outcome != 'success'
        run: exit 1
