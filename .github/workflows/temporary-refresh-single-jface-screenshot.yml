name: Temporary refresh single JFace screenshot

on:
  push:
    branches:
      - dependabot/maven/com.github.spotbugs-spotbugs-maven-plugin-4.10.4.0
    paths:
      - .github/workflows/temporary-refresh-single-jface-screenshot.yml

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the exact PR branch
        uses: actions/checkout@v7
        with:
          ref: dependabot/maven/com.github.spotbugs-spotbugs-maven-plugin-4.10.4.0
          fetch-depth: 0

      - name: Replace only the reproducibly stale screenshot and remove this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2880857b10ac706e6c8555f148b24bc31f8b7b68"

          rm -rf /tmp/help-screenshots
          mkdir -p /tmp/help-screenshots
          gh run download 33251971223 \
            --repo carstenartur/sandbox \
            --name generated-help-screenshots-778 \
            --dir /tmp/help-screenshots

          source=/tmp/help-screenshots/generated-help-screenshot-evidence/files/sandbox_jface_cleanup_help/images/jface-cleanup-real-preview-single-file-steps.png
          target=sandbox_jface_cleanup_help/images/jface-cleanup-real-preview-single-file-steps.png
          workflow=.github/workflows/temporary-refresh-single-jface-screenshot.yml

          test -f "$source"
          test "$(git hash-object "$source")" = "4ce66cf2b1d6c7e7a8ffe760befe130b59f35117"
          test "$(git hash-object "$target")" = "03b7e198e0c27843d53573008391af176905fb2a"
          install -D -m 0644 "$source" "$target"
          test "$(git hash-object "$target")" = "4ce66cf2b1d6c7e7a8ffe760befe130b59f35117"

          git rm "$workflow"
          printf '%s\n' "$target" "$workflow" | sort > /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Refresh reproducible JFace preview screenshot"
          git push origin HEAD:dependabot/maven/com.github.spotbugs-spotbugs-maven-plugin-4.10.4.0
