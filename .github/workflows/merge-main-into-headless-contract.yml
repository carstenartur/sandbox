name: Merge current main into headless cleanup branch

on:
  push:
    branches:
      - issue-1437-headless-exit-contract
    paths:
      - '.github/workflows/merge-main-into-headless-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 590673e688867c0a811fdf6c11cd416cf0d09e83
      WORKFLOW_FILE: .github/workflows/merge-main-into-headless-contract.yml
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create verified merge commit without helper files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual_main="$(git rev-parse origin/main)"
          if [[ "$actual_main" != "$EXPECTED_MAIN" ]]; then
            echo "main moved: expected $EXPECTED_MAIN, found $actual_main" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-commit "$EXPECTED_MAIN"
          git rm "$WORKFLOW_FILE"
          git diff --cached --check
          git commit -m "Merge current main into the headless cleanup contract branch"
          git push origin "HEAD:${GITHUB_REF_NAME}"
