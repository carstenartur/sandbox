name: One-shot fix GTK screenshot verifier

on:
  push:
    branches:
      - dependabot/maven/tycho-version-5.0.4
    paths:
      - '.github/workflows/one-shot-fix-gtk-screenshot-verifier.yml'

permissions:
  contents: write

jobs:
  patch-verifier:
    if: github.event.head_commit.message == 'Bootstrap bounded GTK screenshot verifier fix'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: dependabot/maven/tycho-version-5.0.4
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Patch the verifier and add regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path('.github/scripts/VerifyHelpScreenshotRowPermutation.java')
          text = verifier.read_text(encoding='utf-8')

          constants = '''    private static final int FIRST_ROW_Y = 109;
              private static final int ROW_HEIGHT = 23;
              private static final int ROW_COUNT = 2;
          '''
          replacement = '''    private static final int FIRST_ROW_Y = 109;
              private static final int ROW_HEIGHT = 23;
              private static final int ROW_COUNT = 2;
              private static final int GTK_SCROLLBAR_MIN_X = 925;
              private static final int GTK_SCROLLBAR_MAX_X_EXCLUSIVE = 933;
              private static final int GTK_SCROLLBAR_MIN_Y = 847;
              private static final int GTK_SCROLLBAR_MAX_Y_EXCLUSIVE = 883;
              private static final int GTK_SCROLLBAR_MAX_CHANGED_PIXELS = 64;
              private static final int GTK_SCROLLBAR_MAX_CHANGED_WIDTH = 6;
              private static final int GTK_SCROLLBAR_MAX_CHANGED_HEIGHT = 32;
          '''
          if text.count(constants) != 1:
              raise SystemExit('Verifier constant anchor no longer matches exactly')
          text = text.replace(constants, replacement)

          decision = '''        if (equalsAfterTwoRowPermutation(baseline, candidate)) {
                      System.out.println("Accepted exact LTK two-file row permutation: " + candidatePath);
                      return;
                  }

                  throw new IllegalStateException(describeDifference(baselinePath, baseline,
          '''
          replacement = '''        if (equalsAfterTwoRowPermutation(baseline, candidate)) {
                      System.out.println("Accepted exact LTK two-file row permutation: " + candidatePath);
                      return;
                  }
                  if (equalsWithKnownGtkScrollbarRasterization(baseline, candidate, false)
                          || equalsWithKnownGtkScrollbarRasterization(baseline, candidate, true)) {
                      System.out.println("Accepted bounded neutral GTK scrollbar rasterization: "
                              + candidatePath);
                      return;
                  }

                  throw new IllegalStateException(describeDifference(baselinePath, baseline,
          '''
          if text.count(decision) != 1:
              raise SystemExit('Verifier decision anchor no longer matches exactly')
          text = text.replace(decision, replacement)

          anchor = '''    private static String describeDifference(Path baselinePath, BufferedImage baseline,
          '''
          methods = '''    private static boolean equalsWithKnownGtkScrollbarRasterization(
                      BufferedImage baseline, BufferedImage candidate, boolean permuteRows) {
                  int secondRowY = FIRST_ROW_Y + ROW_HEIGHT;
                  int afterRowsY = secondRowY + ROW_HEIGHT;
                  int changed = 0;
                  int minX = baseline.getWidth();
                  int minY = baseline.getHeight();
                  int maxX = -1;
                  int maxY = -1;
                  for (int y = 0; y < baseline.getHeight(); y++) {
                      int candidateY = y;
                      if (permuteRows && y >= FIRST_ROW_Y && y < secondRowY) {
                          candidateY = y + ROW_HEIGHT;
                      } else if (permuteRows && y >= secondRowY && y < afterRowsY) {
                          candidateY = y - ROW_HEIGHT;
                      }
                      for (int x = 0; x < baseline.getWidth(); x++) {
                          int expected = baseline.getRGB(x, y);
                          int actual = candidate.getRGB(x, candidateY);
                          if (expected == actual) {
                              continue;
                          }
                          changed++;
                          minX = Math.min(minX, x);
                          minY = Math.min(minY, y);
                          maxX = Math.max(maxX, x);
                          maxY = Math.max(maxY, y);
                          if (changed > GTK_SCROLLBAR_MAX_CHANGED_PIXELS
                                  || x < GTK_SCROLLBAR_MIN_X
                                  || x >= GTK_SCROLLBAR_MAX_X_EXCLUSIVE
                                  || y < GTK_SCROLLBAR_MIN_Y
                                  || y >= GTK_SCROLLBAR_MAX_Y_EXCLUSIVE
                                  || !isOpaqueNeutralGray(expected)
                                  || !isOpaqueNeutralGray(actual)) {
                              return false;
                          }
                      }
                  }
                  return changed > 0
                          && maxX - minX + 1 <= GTK_SCROLLBAR_MAX_CHANGED_WIDTH
                          && maxY - minY + 1 <= GTK_SCROLLBAR_MAX_CHANGED_HEIGHT;
              }

              private static boolean isOpaqueNeutralGray(int argb) {
                  int alpha = argb >>> 24;
                  int red = argb >>> 16 & 0xff;
                  int green = argb >>> 8 & 0xff;
                  int blue = argb & 0xff;
                  int minimum = Math.min(red, Math.min(green, blue));
                  int maximum = Math.max(red, Math.max(green, blue));
                  return alpha == 0xff && maximum - minimum <= 3;
              }

          '''
          if text.count(anchor) != 1:
              raise SystemExit('Verifier method anchor no longer matches exactly')
          verifier.write_text(text.replace(anchor, methods + anchor), encoding='utf-8')

          Path('.github/scripts/VerifyHelpScreenshotRowPermutationTest.java').write_text('''import java.awt.image.BufferedImage;
          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;

          import javax.imageio.ImageIO;

          /** Regression tests for the deliberately narrow Help screenshot equivalence rules. */
          public final class VerifyHelpScreenshotRowPermutationTest {
              private static final int WIDTH = 1280;
              private static final int HEIGHT = 900;
              private static final int WHITE = 0xffffffff;
              private static final int LIGHT_GRAY = 0xffd0d0d0;
              private static final int DARK_GRAY = 0xffc0c0c0;

              private VerifyHelpScreenshotRowPermutationTest() {
              }

              public static void main(String[] args) throws Exception {
                  Path directory = Files.createTempDirectory("help-screenshot-verifier-");
                  try {
                      acceptsIdenticalImages(directory);
                      acceptsExactTwoRowPermutation(directory);
                      acceptsOnlyTheObservedNeutralGtkScrollbarRasterization(directory);
                      rejectsChangeOutsideGtkScrollbarRegion(directory);
                      rejectsColoredChangeInsideGtkScrollbarRegion(directory);
                      rejectsTooManyGtkScrollbarChanges(directory);
                  } finally {
                      deleteRecursively(directory);
                  }
                  System.out.println("VerifyHelpScreenshotRowPermutation regression tests passed");
              }

              private static void acceptsIdenticalImages(Path directory) throws Exception {
                  BufferedImage baseline = image();
                  invoke(directory, "identical", baseline, copy(baseline));
              }

              private static void acceptsExactTwoRowPermutation(Path directory) throws Exception {
                  BufferedImage baseline = image();
                  fillRow(baseline, 109, 23, 0xff303030);
                  fillRow(baseline, 132, 23, 0xff909090);
                  BufferedImage candidate = copy(baseline);
                  swapRows(candidate, 109, 132, 23);
                  invoke(directory, "row-permutation", baseline, candidate);
              }

              private static void acceptsOnlyTheObservedNeutralGtkScrollbarRasterization(
                      Path directory) throws Exception {
                  BufferedImage baseline = image();
                  BufferedImage candidate = copy(baseline);
                  for (int y = 851; y < 872; y++) {
                      candidate.setRGB(927, y, LIGHT_GRAY);
                      candidate.setRGB(928, y, DARK_GRAY);
                  }
                  invoke(directory, "gtk-neutral", baseline, candidate);
              }

              private static void rejectsChangeOutsideGtkScrollbarRegion(Path directory)
                      throws Exception {
                  BufferedImage baseline = image();
                  BufferedImage candidate = copy(baseline);
                  candidate.setRGB(900, 851, LIGHT_GRAY);
                  expectReject(directory, "outside-region", baseline, candidate);
              }

              private static void rejectsColoredChangeInsideGtkScrollbarRegion(Path directory)
                      throws Exception {
                  BufferedImage baseline = image();
                  BufferedImage candidate = copy(baseline);
                  candidate.setRGB(927, 851, 0xffff0000);
                  expectReject(directory, "colored", baseline, candidate);
              }

              private static void rejectsTooManyGtkScrollbarChanges(Path directory)
                      throws Exception {
                  BufferedImage baseline = image();
                  BufferedImage candidate = copy(baseline);
                  int changed = 0;
                  for (int y = 847; y < 883 && changed <= 64; y++) {
                      for (int x = 925; x < 933 && changed <= 64; x++) {
                          candidate.setRGB(x, y, LIGHT_GRAY);
                          changed++;
                      }
                  }
                  expectReject(directory, "too-many", baseline, candidate);
              }

              private static BufferedImage image() {
                  BufferedImage image = new BufferedImage(WIDTH, HEIGHT,
                          BufferedImage.TYPE_INT_ARGB);
                  for (int y = 0; y < HEIGHT; y++) {
                      for (int x = 0; x < WIDTH; x++) {
                          image.setRGB(x, y, WHITE);
                      }
                  }
                  return image;
              }

              private static BufferedImage copy(BufferedImage source) {
                  BufferedImage result = new BufferedImage(source.getWidth(), source.getHeight(),
                          BufferedImage.TYPE_INT_ARGB);
                  result.setData(source.getData());
                  return result;
              }

              private static void fillRow(BufferedImage image, int firstY, int height, int color) {
                  for (int y = firstY; y < firstY + height; y++) {
                      for (int x = 0; x < image.getWidth(); x++) {
                          image.setRGB(x, y, color);
                      }
                  }
              }

              private static void swapRows(BufferedImage image, int firstY, int secondY,
                      int height) {
                  for (int offset = 0; offset < height; offset++) {
                      for (int x = 0; x < image.getWidth(); x++) {
                          int first = image.getRGB(x, firstY + offset);
                          image.setRGB(x, firstY + offset, image.getRGB(x, secondY + offset));
                          image.setRGB(x, secondY + offset, first);
                      }
                  }
              }

              private static void invoke(Path directory, String name, BufferedImage baseline,
                      BufferedImage candidate) throws Exception {
                  Path baselinePath = write(directory, name + "-baseline.png", baseline);
                  Path candidatePath = write(directory, name + "-candidate.png", candidate);
                  VerifyHelpScreenshotRowPermutation.main(new String[] {
                          baselinePath.toString(), candidatePath.toString() });
              }

              private static void expectReject(Path directory, String name,
                      BufferedImage baseline, BufferedImage candidate) throws Exception {
                  try {
                      invoke(directory, name, baseline, candidate);
                  } catch (IllegalStateException expected) {
                      return;
                  }
                  throw new AssertionError("Expected screenshot difference to be rejected: " + name);
              }

              private static Path write(Path directory, String name, BufferedImage image)
                      throws IOException {
                  Path path = directory.resolve(name);
                  if (!ImageIO.write(image, "png", path.toFile())) {
                      throw new IOException("PNG writer unavailable");
                  }
                  return path;
              }

              private static void deleteRecursively(Path path) throws IOException {
                  if (!Files.exists(path)) {
                      return;
                  }
                  try (var paths = Files.walk(path)) {
                      paths.sorted((left, right) -> right.compareTo(left))
                              .forEach(current -> {
                                  try {
                                      Files.deleteIfExists(current);
                                  } catch (IOException exception) {
                                      throw new IllegalStateException(exception);
                                  }
                              });
                  }
              }
          }
          ''', encoding='utf-8')

          workflow = Path('.github/workflows/eclipse-help-screenshots.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          workflow_anchor = '''      # The Int-to-Enum atomic candidate image is maintained by the separate
          '''
          test_step = '''      - name: Verify Help screenshot equivalence rules
                  shell: bash
                  run: |
                    set -euo pipefail
                    classes="$(mktemp -d)"
                    trap 'rm -rf "$classes"' EXIT
                    javac -d "$classes" \\
                      .github/scripts/VerifyHelpScreenshotRowPermutation.java \\
                      .github/scripts/VerifyHelpScreenshotRowPermutationTest.java
                    java -cp "$classes" VerifyHelpScreenshotRowPermutationTest

          '''
          if workflow_text.count(workflow_anchor) != 1:
              raise SystemExit('Screenshot workflow anchor no longer matches exactly')
          workflow.write_text(workflow_text.replace(workflow_anchor,
                  test_step + workflow_anchor), encoding='utf-8')
          PY

      - name: Execute comparator regression tests
        shell: bash
        run: |
          set -euo pipefail
          classes="$(mktemp -d)"
          trap 'rm -rf "$classes"' EXIT
          javac -d "$classes" \
            .github/scripts/VerifyHelpScreenshotRowPermutation.java \
            .github/scripts/VerifyHelpScreenshotRowPermutationTest.java
          java -cp "$classes" VerifyHelpScreenshotRowPermutationTest

      - name: Commit bounded fix and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          bootstrap='.github/workflows/one-shot-fix-gtk-screenshot-verifier.yml'
          verifier='.github/scripts/VerifyHelpScreenshotRowPermutation.java'
          regression='.github/scripts/VerifyHelpScreenshotRowPermutationTest.java'
          screenshots='.github/workflows/eclipse-help-screenshots.yml'

          git rm -- "$bootstrap"
          git add -- "$verifier" "$regression" "$screenshots"

          actual="$(git diff --cached --name-status | sort)"
          expected="$(printf 'D\t%s\nA\t%s\nM\t%s\nM\t%s\n' \
            "$bootstrap" "$regression" "$verifier" "$screenshots" | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix bounded GTK screenshot rasterization'
          git push origin HEAD:dependabot/maven/tycho-version-5.0.4
