name: One-shot isolate Method Reuse screenshot state

on:
  push:
    branches:
      - feature/method-reuse-multifile-delegation
    paths:
      - '.github/workflows/one-shot-isolate-method-reuse-screenshot-state.yml'

permissions:
  contents: write

jobs:
  isolate-screenshot-state:
    if: github.event.head_commit.message == 'Bootstrap Method Reuse screenshot state isolation'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: feature/method-reuse-multifile-delegation
          fetch-depth: 0

      - name: Make shared-workbench screenshot ordering explicit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsMergeGateSWTBotTest.java')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'import org.junit.jupiter.api.BeforeAll;\n'
          imports = (
              'import org.junit.jupiter.api.MethodOrderer;\n'
              'import org.junit.jupiter.api.TestMethodOrder;\n'
          )
          if imports not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit(f'Expected one JUnit import anchor, found {text.count(import_anchor)}')
              text = text.replace(import_anchor, import_anchor + imports, 1)

          class_anchor = 'public class SandboxHelpScreenshotsMergeGateSWTBotTest {\n'
          annotation = (
              '/*\n'
              ' * Cleanup execution scenarios persist temporary profiles in the shared\n'
              ' * workbench. Capture all deterministic Help images first and run the\n'
              ' * profile-mutating verify... scenarios afterwards.\n'
              ' */\n'
              '@TestMethodOrder(MethodOrderer.MethodName.class)\n'
          )
          if annotation not in text:
              if text.count(class_anchor) != 1:
                  raise SystemExit(f'Expected one merge-gate class anchor, found {text.count(class_anchor)}')
              text = text.replace(class_anchor, annotation + class_anchor, 1)

          required = [
              'public void captureCleanupConfigurationTabs()',
              'public void captureRealCleanupPreviewAndVerifyIndependentSelection()',
              'public void verifyRealMethodReuseCleanupPreviewApplyAndUndo()',
          ]
          missing = [needle for needle in required if needle not in text]
          if missing:
              raise SystemExit(f'Missing required screenshot scenarios: {missing}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit bounded state-isolation fix and remove bootstrap workflow
        run: |
          set -euo pipefail
          bootstrap='.github/workflows/one-shot-isolate-method-reuse-screenshot-state.yml'
          gate='sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/SandboxHelpScreenshotsMergeGateSWTBotTest.java'

          git rm -- "$bootstrap"
          git add -- "$gate"

          actual="$(git diff --cached --name-status | sort)"
          expected="$(printf 'D\t%s\nM\t%s\n' "$bootstrap" "$gate" | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          changed_text_lines="$(git diff --numstat origin/main -- \
            ':!**/*.png' | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { total += $1 + $2 } END { print total + 0 }')"
          printf 'Changed text lines against main: %s\n' "$changed_text_lines"
          test "$changed_text_lines" -lt 2000

          grep -Fq '@TestMethodOrder(MethodOrderer.MethodName.class)' "$gate"
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Isolate Method Reuse screenshot profile state'
          git push origin HEAD:feature/method-reuse-multifile-delegation
