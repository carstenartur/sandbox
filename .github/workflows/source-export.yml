name: Temporary connector patch

on:
  push:
    branches:
      - feature/cleanup-screenshot-scenario-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR 1499
        uses: actions/checkout@v7
        with:
          ref: d3c07f0865904f54731044f5bf5c34b01b2c9aba
          fetch-depth: 0
          path: pr1499

      - name: Patch PR 1499
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pr1499 rev-parse HEAD)" = d3c07f0865904f54731044f5bf5c34b01b2c9aba
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pr1499/sandbox_common_test/src/org/sandbox/jdt/triggerpattern/test/BundledLibrariesTest.java")
          source = path.read_text(encoding="utf-8")
          old = """\t\tassertTrue(hintFile.getRules().size() >= 5,\n\t\t\t\t\"platform-logging library should have at least 5 rules, found: \" + hintFile.getRules().size()); //$NON-NLS-1$\n"""
          new = """\t\tassertEquals(1, hintFile.getRules().size(),\n\t\t\t\t\"platform-logging must expose only the identity-safe ILog modernization rule\"); //$NON-NLS-1$\n"""
          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one stale Platform Logging assertion, found {source.count(old)}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git -C pr1499 diff --check
          git -C pr1499 config user.name "Sandbox CI Repair"
          git -C pr1499 config user.email "actions@users.noreply.github.com"
          git -C pr1499 add sandbox_common_test/src/org/sandbox/jdt/triggerpattern/test/BundledLibrariesTest.java
          git -C pr1499 commit -m "Align bundled logging inventory with safe rules"
          git -C pr1499 push origin HEAD:fix/platform-status-semantic-preservation
