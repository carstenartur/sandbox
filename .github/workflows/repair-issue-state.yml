name: Repair issue state

on:
  push:
    branches: [ ci/verified-quality-metric-badges ]
    paths:
      - '.github/workflows/repair-issue-state.yml'

permissions:
  contents: write
  issues: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Close accidental placeholder and record the implementation boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r number; do
            [[ -z "$number" ]] && continue
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment 'This placeholder was created accidentally while discovering the connected GitHub actions. It contains no project requirement.'
          done < <(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"DO NOT CREATE" in:title' --json number,title \
            --jq '.[] | select(.title == "DO NOT CREATE") | .number')

          cat > "$RUNNER_TEMP/method-reuse-plan.md" <<'EOF'
          ## Confirmed implementation direction

          The visible general Method Reuse option will be implemented rather than removed. Its product purpose is to reduce measured source duplication by replacing proven duplicate implementations with calls to one existing method.

          The implementation must use the shared planned multi-file lifecycle rather than another transaction engine:

          1. discover an existing reusable method and duplicate call sites over a closed editable Java scope;
          2. retain an immutable plan based on Java element handles, binding keys, expected signatures and source identities, never AST nodes;
          3. expand the explicit Cleanup scope to every required compilation unit through the existing scope-provider contract;
          4. emit only the validated local edit when each compilation unit receives its own `CleanUpContext`;
          5. reject the whole candidate when one required method, binding, file, import, visibility or source shape is stale or unresolved;
          6. show every affected file in one LTK preview and prove atomic Apply and byte-exact Undo;
          7. remain disabled for save actions.

          ### First executable slice

          The first automatic slice is intentionally conservative:

          - reuse an already existing source method; do not synthesize a new method yet;
          - require binding-resolved Java source and a closed editable scope;
          - support exact AST-equivalent expression/statement sequences after one-to-one parameter substitution;
          - require an unambiguous accessible target method and type-compatible arguments/return use;
          - reject state capture, unresolved/binary consumers, control-flow transfer, overlapping replacements, ambiguous overloads and side-effect-changing argument mappings;
          - replace duplicates in several compilation units with calls to the one retained implementation.

          ### Measurable acceptance evidence

          A checked-in corpus must record duplicate blocks/lines before and after the cleanup, compile and run the same tests after transformation, show the complete multi-file preview, and restore every source byte through Undo. The feature is not complete merely because a similarity result or marker is displayed.

          The existing inline-sequence rewrite remains available as its own supported local mode while the general multi-file mode is developed.
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/method-reuse-plan.md"
          gh issue comment 1527 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/method-reuse-plan.md"

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/repair-issue-state.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time issue repair workflow'
          git push origin "HEAD:${GITHUB_REF_NAME}"
