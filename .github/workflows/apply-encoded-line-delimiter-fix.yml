name: Apply encoding-aware line delimiter fix

on:
  push:
    branches:
      - integration/junit-migration-hardening
    paths:
      - '.github/workflows/apply-encoded-line-delimiter-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: integration/junit-migration-hardening

      - name: Wire the tested common-core implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/ProjectWideCodeCleanupApplication.java')
          text = path.read_text(encoding='utf-8')
          if text.count('import java.io.ByteArrayOutputStream;\n') != 1:
              raise SystemExit('Unexpected ByteArrayOutputStream import count')
          text = text.replace('import java.io.ByteArrayOutputStream;\n', '')

          provider = 'import org.sandbox.jdt.cleanup.multifile.api.IMultiFileCleanUpDiagnosticsProvider;\n'
          if text.count(provider) != 1:
              raise SystemExit('Unexpected diagnostics-provider import count')
          text = text.replace(
              provider,
              'import org.sandbox.jdt.cleanup.io.EncodedLineDelimiterPreserver;\n' + provider,
          )

          start_marker = '\n\n\tprivate enum OriginalLineDelimiter {'
          end_marker = '\n\tprivate static void createParent'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Cannot locate byte-oriented delimiter implementation')
          replacement = (
              '\n\n\tprivate static void preserveOriginalLineDelimiters(List<SourceSnapshot> sources)\n'
              '\t\t\tthrows IOException, CoreException {\n'
              '\t\tfor (SourceSnapshot source : sources) {\n'
              '\t\t\tbyte[] current= Files.readAllBytes(source.path());\n'
              '\t\t\tbyte[] normalized= EncodedLineDelimiterPreserver.preserve(\n'
              '\t\t\t\t\tsource.before(), current, source.file().getCharset());\n'
              '\t\t\tif (!Arrays.equals(current, normalized)) {\n'
              '\t\t\t\tFiles.write(source.path(), normalized);\n'
              '\t\t\t}\n'
              '\t\t}\n'
              '\t}\n'
          )
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-encoded-line-delimiter-fix.yml').unlink()
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use declared encodings when preserving line delimiters'
          git push origin HEAD:integration/junit-migration-hardening
