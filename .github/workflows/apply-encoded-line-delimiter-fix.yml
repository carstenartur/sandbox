package org.sandbox.jdt.cleanup.io;

import static org.junit.jupiter.api.Assertions.assertArrayEquals;
import static org.junit.jupiter.api.Assertions.assertSame;
import static org.junit.jupiter.api.Assertions.assertThrows;

import java.io.IOException;
import java.nio.charset.StandardCharsets;

import org.junit.jupiter.api.Test;

class EncodedLineDelimiterPreserverTest {

\tprivate static final byte[] UTF_8_BOM= { (byte) 0xef, (byte) 0xbb, (byte) 0xbf };
\tprivate static final byte[] UTF_16_LE_BOM= { (byte) 0xff, (byte) 0xfe };

\t@Test
\tvoid restoresCrlfWithoutChangingUtf8Text() throws IOException {
\t\tbyte[] original= "Größe\\r\\nvorher\\r\\n".getBytes(StandardCharsets.UTF_8); //$NON-NLS-1$
\t\tbyte[] rewritten= "Größe\\nnachher\\n".getBytes(StandardCharsets.UTF_8); //$NON-NLS-1$
\t\tbyte[] expected= "Größe\\r\\nnachher\\r\\n".getBytes(StandardCharsets.UTF_8); //$NON-NLS-1$

\t\tassertArrayEquals(expected,
\t\t\t\tEncodedLineDelimiterPreserver.preserve(original, rewritten, "UTF-8")); //$NON-NLS-1$
\t}

\t@Test
\tvoid preservesUtf8ByteOrderMark() throws IOException {
\t\tbyte[] original= withPrefix(UTF_8_BOM, "first\\r\\nsecond\\r\\n".getBytes(StandardCharsets.UTF_8)); //$NON-NLS-1$
\t\tbyte[] rewritten= "first\\nchanged\\n".getBytes(StandardCharsets.UTF_8); //$NON-NLS-1$
\t\tbyte[] expected= withPrefix(UTF_8_BOM, "first\\r\\nchanged\\r\\n".getBytes(StandardCharsets.UTF_8)); //$NON-NLS-1$

\t\tassertArrayEquals(expected,
\t\t\t\tEncodedLineDelimiterPreserver.preserve(original, rewritten, "UTF-8")); //$NON-NLS-1$
\t}

\t@Test
\tvoid preservesUtf16EncodingBomAndCharactersContainingNewlineBytes() throws IOException {
\t\tString originalText= "\\u0a00\\r\\nbefore\\r\\n"; //$NON-NLS-1$
\t\tString rewrittenText= "\\u0a00\\nafter\\n"; //$NON-NLS-1$
\t\tString expectedText= "\\u0a00\\r\\nafter\\r\\n"; //$NON-NLS-1$
\t\tbyte[] original= withPrefix(UTF_16_LE_BOM, originalText.getBytes(StandardCharsets.UTF_16LE));
\t\tbyte[] rewritten= withPrefix(UTF_16_LE_BOM, rewrittenText.getBytes(StandardCharsets.UTF_16LE));
\t\tbyte[] expected= withPrefix(UTF_16_LE_BOM, expectedText.getBytes(StandardCharsets.UTF_16LE));

\t\tassertArrayEquals(expected,
\t\t\t\tEncodedLineDelimiterPreserver.preserve(original, rewritten, "UTF-16")); //$NON-NLS-1$
\t}

\t@Test
\tvoid keepsRewrittenBytesWhenOriginalUsesMixedDelimiters() throws IOException {
\t\tbyte[] original= "first\\r\\nsecond\\n".getBytes(StandardCharsets.UTF_8); //$NON-NLS-1$
\t\tbyte[] rewritten= "first\\nchanged\\n".getBytes(StandardCharsets.UTF_8); //$NON-NLS-1$

\t\tassertSame(rewritten,
\t\t\t\tEncodedLineDelimiterPreserver.preserve(original, rewritten, "UTF-8")); //$NON-NLS-1$
\t}

\t@Test
\tvoid rejectsBomThatConflictsWithDeclaredEncoding() {
\t\tbyte[] original= withPrefix(UTF_16_LE_BOM, "first\\r\\n".getBytes(StandardCharsets.UTF_16LE)); //$NON-NLS-1$

\t\tassertThrows(IOException.class,
\t\t\t\t() -> EncodedLineDelimiterPreserver.preserve(original, original, "UTF-8")); //$NON-NLS-1$
\t}

\tprivate static byte[] withPrefix(byte[] prefix, byte[] content) {
\t\tbyte[] result= new byte[prefix.length + content.length];
\t\tSystem.arraycopy(prefix, 0, result, 0, prefix.length);
\t\tSystem.arraycopy(content, 0, result, prefix.length, content.length);
\t\treturn result;
\t}
}
''', encoding='utf-8')

          Path('.github/workflows/apply-encoded-line-delimiter-fix.yml').unlink()
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve source line delimiters with the declared encoding'
          git push origin HEAD:integration/junit-migration-hardening
