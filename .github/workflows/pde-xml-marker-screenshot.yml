name: PDE XML marker Quick Fix screenshot

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'qa/upstream-jdt/pins.env'
      - 'sandbox_help_build/**'
      - 'sandbox_usage_view_test/**'
      - 'sandbox_xml_cleanup/**'
      - 'sandbox_xml_cleanup_help/**'
      - '.github/actions/verify-eclipse-desktop-runtime/**'
      - '.github/workflows/pde-xml-marker-screenshot.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshot:
    name: Reproduce Problems-view marker and Quick Fix
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAVEN_OPTS: -Djava.awt.headless=false
      NO_AT_BRIDGE: '1'
      GDK_BACKEND: x11
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SANDBOX_HELP_XML_CORPUS_REPOSITORY: https://github.com/eclipse-jdt/eclipse.jdt.ui.git
      SANDBOX_HELP_XML_CORPUS_REF: R4_40
      SANDBOX_HELP_XML_CORPUS_PATH: org.eclipse.jdt.ui/schema/cleanUps.exsd
    steps:
      - name: Checkout Sandbox
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout pinned JDT UI screenshot corpus
        uses: actions/checkout@v7
        with:
          repository: eclipse-jdt/eclipse.jdt.ui
          ref: R4_40
          fetch-depth: 1
          path: upstream/eclipse.jdt.ui
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            org.eclipse.jdt.ui/schema/cleanUps.exsd

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify preinstalled Eclipse desktop runtime
        uses: ./.github/actions/verify-eclipse-desktop-runtime

      - name: Verify exact screenshot corpus
        shell: bash
        run: |
          set -euo pipefail
          source qa/upstream-jdt/pins.env
          actual="$(git -C upstream/eclipse.jdt.ui rev-parse 'HEAD^{commit}')"
          test "$actual" = "$PIN_JDT_UI_COMMIT"
          source_file="$GITHUB_WORKSPACE/upstream/eclipse.jdt.ui/$SANDBOX_HELP_XML_CORPUS_PATH"
          test -s "$source_file"
          printf 'SANDBOX_HELP_XML_CORPUS_COMMIT=%s\n' "$PIN_JDT_UI_COMMIT" >> "$GITHUB_ENV"
          printf 'SANDBOX_HELP_XML_CORPUS_FILE=%s\n' "$source_file" >> "$GITHUB_ENV"

      - name: Reproduce the real Eclipse Problems-view scenario
        shell: bash
        run: >-
          timeout
          --signal=TERM
          --kill-after=2m
          70m
          xvfb-run
          --auto-servernum
          --server-args="-screen 0 1600x1200x24"
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -Dsandbox.tycho.linux-only=true
          -Dspotbugs.skip=true
          -Dtycho.localArtifacts=ignore
          -Dhelp.screenshot.testClass=org.sandbox.jdt.ui.helper.views.PdeXmlQuickFixScreenshotSWTBotTest
          -DfailIfNoTests=false
          -f sandbox_help_build/pom.xml
          -Phelp-screenshots
          clean verify

      - name: Require the screenshot JUnit scenario
        shell: bash
        run: |
          set -euo pipefail
          report="$(find sandbox_usage_view_test/target/surefire-reports -type f \
            -name '*PdeXmlQuickFixScreenshotSWTBotTest*.xml' -print -quit)"
          test -n "$report"
          grep -F 'name="captureProblemsViewQuickFix"' "$report"
          if grep -Fq '<skipped' "$report"; then
            echo "The PDE XML screenshot scenario was skipped: $report" >&2
            exit 1
          fi
          printf 'Verified PDE XML screenshot report: %s\n' "$report"

      - name: Upload generated screenshot and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pde-xml-marker-quick-fix-${{ github.run_number }}
          path: |
            sandbox_xml_cleanup_help/images/xml-cleanup-marker-quick-fix.png
            sandbox_xml_cleanup_help/images/xml-cleanup-marker-quick-fix.provenance.json
            sandbox_usage_view_test/target/surefire-reports/**
            sandbox_usage_view_test/target/work/data/.metadata/.log
          retention-days: 14
          if-no-files-found: warn

      - name: Verify the committed screenshot is reproducible
        shell: bash
        run: |
          set -euo pipefail
          image='sandbox_xml_cleanup_help/images/xml-cleanup-marker-quick-fix.png'
          provenance='sandbox_xml_cleanup_help/images/xml-cleanup-marker-quick-fix.provenance.json'
          test -s "$image"
          test -s "$provenance"
          grep -F '"commit": "'"$SANDBOX_HELP_XML_CORPUS_COMMIT"'"' "$provenance"
          grep -F '"sourcePath": "'"$SANDBOX_HELP_XML_CORPUS_PATH"'"' "$provenance"
          changes="$(git status --porcelain=v1 --untracked-files=all -- "$image" "$provenance")"
          if [[ -n "$changes" ]]; then
            echo 'Regenerated PDE XML screenshot evidence differs from the checkout:' >&2
            printf '%s\n' "$changes" >&2
            exit 1
          fi
