name: One-shot import Method Reuse tab baselines v3

on:
  push:
    branches:
      - feature/method-reuse-multifile-delegation
    paths:
      - '.github/workflows/one-shot-import-method-reuse-tab-baselines-v3.yml'

permissions:
  actions: read
  contents: write

jobs:
  import-reviewed-tab-baselines:
    if: github.event.head_commit.message == 'Bootstrap self-bound Method Reuse tab baseline import'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable bootstrap commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Wait for the read-only Help verifier on this exact commit
        id: verifier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          api="repos/${GITHUB_REPOSITORY}/actions/workflows/eclipse-help-screenshots.yml/runs"
          run_json=''
          for attempt in $(seq 1 150); do
            response="$(gh api --method GET "$api" \
              -f head_sha="$source_sha" \
              -f event='pull_request' \
              -f per_page='20')"
            run_json="$(jq -c --arg sha "$source_sha" \
              '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed")][0] // empty' \
              <<<"$response")"
            if [[ -n "$run_json" ]]; then
              break
            fi
            echo "Waiting for the Help verifier for immutable commit $source_sha ($attempt/150)"
            sleep 30
          done
          if [[ -z "$run_json" ]]; then
            echo "No completed Help verifier found for exact commit $source_sha" >&2
            exit 1
          fi
          run_id="$(jq -r '.id' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          run_number="$(jq -r '.run_number' <<<"$run_json")"
          printf 'source_sha=%s\nrun_id=%s\nrun_number=%s\nconclusion=%s\n' \
            "$source_sha" "$run_id" "$run_number" "$conclusion"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
          printf 'run_number=%s\n' "$run_number" >> "$GITHUB_OUTPUT"
          printf 'conclusion=%s\n' "$conclusion" >> "$GITHUB_OUTPUT"

      - name: Verify execution succeeded up to the strict baseline comparison
        if: steps.verifier.outputs.conclusion != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.verifier.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            -f per_page='100')"

          require_step() {
            local name="$1"
            local expected="$2"
            local actual
            actual="$(jq -r --arg name "$name" \
              '.jobs[] | select(.name == "Reproduce screenshots from the checkout")
               | .steps[] | select(.name == $name) | .conclusion' <<<"$jobs")"
            printf '%s: %s\n' "$name" "$actual"
            test "$actual" = "$expected"
          }

          require_step 'Reproduce Eclipse Help screenshots' success
          require_step 'Verify the merge-gate test executed' success
          require_step 'Verify real Cleanup preview evidence' success
          require_step 'Stage generated Help screenshot evidence' success
          require_step 'Verify committed screenshots are reproducible' failure

      - name: Download screenshots generated by the exact verifier
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.verifier.outputs.run_id }}
          RUN_NUMBER: ${{ steps.verifier.outputs.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/generated
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "eclipse-help-screenshots-${RUN_NUMBER}" \
            --dir /tmp/generated
          test -f /tmp/generated/sandbox_method_reuse_help/images/method-reuse-cleanup.png

      - name: Require exactly five dialog-only differences
        id: drift
        shell: bash
        run: |
          set -euo pipefail
          expected=/tmp/expected-dialog-drift.txt
          actual=/tmp/actual-dialog-drift.txt
          printf '%s\n' \
            'sandbox_encoding_quickfix_help/images/explicit-encoding-cleanup.png' \
            'sandbox_functional_converter_help/images/functional-converter-cleanup.png' \
            'sandbox_int_to_enum_help/images/int-to-enum-cleanup.png' \
            'sandbox_jface_cleanup_help/images/jface-cleanup.png' \
            'sandbox_junit_cleanup_help/images/junit-migration-cleanup.png' \
            | sort > "$expected"
          : > "$actual"

          while IFS= read -r generated; do
            relative="${generated#/tmp/generated/}"
            test -f "$relative"
            cmp -s -- "$generated" "$relative" || printf '%s\n' "$relative" >> "$actual"
          done < <(find /tmp/generated -path '/tmp/generated/sandbox*_help/images/*.png' -type f | sort)
          sort -o "$actual" "$actual"

          echo 'Expected dialog drift:'
          cat "$expected"
          echo 'Actual drift:'
          cat "$actual"

          if [[ "${{ steps.verifier.outputs.conclusion }}" == success ]]; then
            test ! -s "$actual"
            echo 'needs_import=false' >> "$GITHUB_OUTPUT"
          else
            diff -u "$expected" "$actual"
            echo 'needs_import=true' >> "$GITHUB_OUTPUT"
          fi

          # The reviewed Method Reuse image must stay exact.
          printf '%s  %s\n' \
            '91ff404d810bd2dcc920365bd2581b8e1fe992a2e94bf5d539ae5b89d3103bbc' \
            '/tmp/generated/sandbox_method_reuse_help/images/method-reuse-cleanup.png' \
            | sha256sum --check --strict

          # The execution preview exposed the temporary-profile leak. It must be
          # restored byte-for-byte and is never eligible for baseline import.
          cmp -s -- \
            /tmp/generated/sandbox_jface_cleanup_help/images/jface-cleanup-real-preview-single-file-steps.png \
            sandbox_jface_cleanup_help/images/jface-cleanup-real-preview-single-file-steps.png

      - name: Verify each accepted PNG change is bounded
        if: steps.drift.outputs.needs_import == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/InspectPngDiff.java <<'JAVA'
          import java.awt.image.BufferedImage;
          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.security.MessageDigest;
          import java.util.HexFormat;
          import javax.imageio.ImageIO;

          public final class InspectPngDiff {
              public static void main(String[] args) throws Exception {
                  Path baselinePath = Path.of(args[0]);
                  Path generatedPath = Path.of(args[1]);
                  BufferedImage baseline = read(baselinePath);
                  BufferedImage generated = read(generatedPath);
                  if (baseline.getWidth() != generated.getWidth()
                          || baseline.getHeight() != generated.getHeight()) {
                      throw new IllegalStateException("Dimensions changed: " + baselinePath);
                  }
                  long changed = 0;
                  int minX = baseline.getWidth(), minY = baseline.getHeight(), maxX = -1, maxY = -1;
                  for (int y = 0; y < baseline.getHeight(); y++) {
                      for (int x = 0; x < baseline.getWidth(); x++) {
                          if (baseline.getRGB(x, y) != generated.getRGB(x, y)) {
                              changed++;
                              minX = Math.min(minX, x); minY = Math.min(minY, y);
                              maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
                          }
                      }
                  }
                  long pixels = (long) baseline.getWidth() * baseline.getHeight();
                  double ratio = pixels == 0 ? 0.0 : (double) changed / pixels;
                  if (changed == 0 || ratio >= 0.25) {
                      throw new IllegalStateException("Unbounded drift: " + baselinePath
                              + ", changed=" + changed + ", ratio=" + ratio);
                  }
                  System.out.printf("%s: changed=%d (%.4f%%), bounds=[%d,%d]-[%d,%d], sha256=%s%n",
                          baselinePath, changed, ratio * 100.0, minX, minY, maxX, maxY,
                          sha256(generatedPath));
              }
              private static BufferedImage read(Path path) throws IOException {
                  BufferedImage image = ImageIO.read(path.toFile());
                  if (image == null) throw new IOException("Cannot decode " + path);
                  return image;
              }
              private static String sha256(Path path) throws Exception {
                  return HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256")
                          .digest(Files.readAllBytes(path)));
              }
          }
          JAVA
          while IFS= read -r image; do
            java /tmp/InspectPngDiff.java "$image" "/tmp/generated/$image"
          done < /tmp/expected-dialog-drift.txt

      - name: Import exact dialog images and remove all bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            '.github/workflows/one-shot-import-method-reuse-tab-baselines.yml'
            '.github/workflows/one-shot-import-method-reuse-tab-baselines-v2.yml'
            '.github/workflows/one-shot-import-method-reuse-tab-baselines-v3.yml'
          )
          git rm -- "${workflows[@]}"

          if [[ "${{ steps.drift.outputs.needs_import }}" == true ]]; then
            while IFS= read -r image; do
              cp -- "/tmp/generated/$image" "$image"
              git add -- "$image"
            done < /tmp/expected-dialog-drift.txt
          fi

          actual="$(git diff --cached --name-status | sort)"
          expected="$({
            for workflow in "${workflows[@]}"; do
              printf 'D\t%s\n' "$workflow"
            done
            if [[ "${{ steps.drift.outputs.needs_import }}" == true ]]; then
              while IFS= read -r image; do printf 'M\t%s\n' "$image"; done \
                < /tmp/expected-dialog-drift.txt
            fi
          } | sort)"
          printf 'Staged:\n%s\nExpected:\n%s\n' "$actual" "$expected"
          test "$actual" = "$expected"

          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          changed_text_lines="$(git diff --numstat origin/main -- ':!**/*.png' \
            | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { total += $1 + $2 } END { print total + 0 }')"
          printf 'Changed text lines against main: %s\n' "$changed_text_lines"
          test "$changed_text_lines" -lt 2000
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "${{ steps.drift.outputs.needs_import }}" == true ]]; then
            git commit -m 'Update Cleanup dialog baselines for Method Reuse tab'
          else
            git commit -m 'Remove Method Reuse baseline bootstraps'
          fi
          git push origin HEAD:feature/method-reuse-multifile-delegation
