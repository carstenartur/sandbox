name: Apply PR 1474 review cleanup

on:
  push:
    branches:
      - integration/junit-migration-hardening
    paths:
      - '.github/workflows/apply-pr1474-review-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: integration/junit-migration-hardening

      - name: Apply outstanding review corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          messages = Path('sandbox_junit_cleanup/src/org/sandbox/jdt/internal/ui/preferences/cleanup/CleanUpMessages.properties')
          text = messages.read_text(encoding='utf-8')
          old_url = 'http://www.eclipse.org/legal/epl-2.0.'
          if text.count(old_url) != 1:
              raise SystemExit('Unexpected EPL URL count in CleanUpMessages.properties')
          if text.count('\n# \n') != 2:
              raise SystemExit('Unexpected trailing-space comment count in CleanUpMessages.properties')
          text = text.replace(old_url, 'https://www.eclipse.org/legal/epl-2.0/')
          text = text.replace('\n# \n', '\n#\n')
          messages.write_text(text, encoding='utf-8')

          for filename in (
              'sandbox_junit_cleanup/src/org/sandbox/jdt/internal/ui/fix/JUnitCleanUp.java',
              'sandbox_junit_cleanup/src/org/sandbox/jdt/internal/corext/fix/helper/RuleImportCleanupSupport.java',
          ):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if text.count(old_url) != 1:
                  raise SystemExit(f'Unexpected EPL URL count in {filename}')
              path.write_text(
                  text.replace(old_url, 'https://www.eclipse.org/legal/epl-2.0/'),
                  encoding='utf-8',
              )

          presets = Path('sandbox_junit_cleanup/src/org/sandbox/jdt/internal/corext/fix/JUnit4MigrationPresets.java')
          text = presets.read_text(encoding='utf-8')
          import_anchor = 'import java.util.Map;\nimport java.util.Set;'
          if text.count(import_anchor) != 1:
              raise SystemExit('Unexpected JUnit4MigrationPresets import anchor count')
          text = text.replace(
              import_anchor,
              'import java.util.Map;\nimport java.util.Objects;\nimport java.util.Set;',
          )
          old_return = '\t\treturn SELECTIONS.get(preset);'
          if text.count(old_return) != 1:
              raise SystemExit('Unexpected selectionFor implementation count')
          text = text.replace(
              old_return,
              '\t\treturn SELECTIONS.get(Objects.requireNonNull(preset));',
          )
          presets.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-pr1474-review-cleanup.yml').unlink()
          PY

          if grep -R --line-number --fixed-strings 'http://www.eclipse.org/legal/epl-2.0.' \
              sandbox_junit_cleanup/src; then
            echo 'Invalid EPL URL remains in JUnit cleanup sources.' >&2
            exit 1
          fi
          if grep -n '^# $' \
              sandbox_junit_cleanup/src/org/sandbox/jdt/internal/ui/preferences/cleanup/CleanUpMessages.properties; then
            echo 'Trailing-space comment remains.' >&2
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Address final PR 1474 review comments'
          git push origin HEAD:integration/junit-migration-hardening
