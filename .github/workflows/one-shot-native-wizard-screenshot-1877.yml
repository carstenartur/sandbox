# Temporary one-time evidence handoff; this workflow deletes itself in its only commit.
name: Recover native Help wizard screenshot for 1877
on:
  push:
    branches:
      - feat/structured-action-authoring
permissions:
  actions: read
  contents: write
jobs:
  recover-native-wizard-image:
    if: github.repository == 'carstenartur/sandbox' && github.ref == 'refs/heads/feat/structured-action-authoring'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Commit exact native SWTBot image and remove temporary workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/sandbox-native-help-screenshots-1877.zip"
          original='generated-help-screenshot-evidence/files/sandbox_triggerpattern_help/images/new-hint-rule-wizard.png'
          target='sandbox_triggerpattern_help/images/new-hint-rule-wizard.png'
          curl --fail --silent --show-error --location --retry 3 \\
            --header "Authorization: Bearer ${GH_TOKEN}" \\
            --header 'Accept: application/vnd.github+json' \\
            'https://api.github.com/repos/carstenartur/sandbox/actions/artifacts/14078148940/zip' \\
            --output "${archive}"
          unzip -p "${archive}" "${original}" > "${RUNNER_TEMP}/wizard.png"
          echo 'b6af789b9fa52ca79ae151fc60d087c2e2441e3e37869fc9c9c3d4b1e206d5e4  '${RUNNER_TEMP}'/wizard.png' | sha256sum --check --status
          cp "${RUNNER_TEMP}/wizard.png" "${target}"
          git rm -- '.github/workflows/one-shot-native-wizard-screenshot-1877.yml'
          git add -- "${target}"
          git -c user.name='github-actions[bot]' \\
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \\
              commit -m 'Refresh rule wizard screenshot from native SWTBot evidence'
          git push origin HEAD:refs/heads/feat/structured-action-authoring
