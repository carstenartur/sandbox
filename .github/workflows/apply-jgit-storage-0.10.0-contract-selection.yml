name: Apply jgit-storage-hibernate 0.10.0 contract selection

on:
  push:
    branches:
      - dependabot/maven/io.github.carstenartur-jgit-storage-hibernate-core-0.9.0
    paths:
      - '.github/workflows/apply-jgit-storage-0.10.0-contract-selection.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dependency branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record the verified 0.10.0 consumer contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path('sandbox-jgit-server-webapp/docs/jgit-storage-migration-matrix.json')
          matrix = json.loads(path.read_text(encoding='utf-8'))
          policy = matrix['releasePolicy']
          if policy['selectedVersion'] != '0.1.18':
              raise SystemExit(f"Unexpected selected version: {policy['selectedVersion']}")

          matrix['lastVerifiedCommit'] = '5f9e286566da8affcaccd69cc38062014c369bc5'
          policy['selectedVersion'] = '0.10.0'
          policy['selectionState'] = (
              'selected; Core 0.10.0 candidate verified by the consumer-owned Sandbox '
              'contract at immutable commit 5f9e286566da8affcaccd69cc38062014c369bc5 '
              'in jgit-storage-hibernate Real Consumer Compatibility run 31357180764; '
              'adapter lifecycle, restart and deletion policy verified on H2'
          )

          def replace_version(value):
              if isinstance(value, dict):
                  return {key: replace_version(item) for key, item in value.items()}
              if isinstance(value, list):
                  return [replace_version(item) for item in value]
              if isinstance(value, str):
                  return value.replace('Core 0.1.18', 'Core 0.10.0')
              return value

          matrix = replace_version(matrix)
          evidence = (
              'jgit-storage-hibernate 0.10.0 Real Consumer Compatibility run '
              '31357180764: Candidate — sandbox passed against immutable Sandbox '
              'commit 5f9e286566da8affcaccd69cc38062014c369bc5 and resolved the exact candidate'
          )
          for capability in matrix['capabilities']:
              if capability['id'] in {'repository-open-create', 'repository-delete'}:
                  verified = capability.setdefault('verifiedEvidence', [])
                  if evidence not in verified:
                      verified.append(evidence)

          path.write_text(json.dumps(matrix, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Commit ledger and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-jgit-storage-0.10.0-contract-selection.yml
          git add sandbox-jgit-server-webapp/docs/jgit-storage-migration-matrix.json
          git diff --cached --check
          git commit -m "Select verified jgit-storage-hibernate Core 0.10.0 contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"
