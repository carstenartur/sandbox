name: Apply final full JDT workflow corrections

on:
  push:
    branches:
      - feature/oomph-upstream-jdt-migration-qa-final
    paths:
      - '.github/workflows/apply-full-jdt-workflow-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Correct product build and launcher discovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/upstream-jdt-migration-qa.yml')
          lines = workflow_path.read_text(encoding='utf-8').splitlines()
          step_index = next(
              (index for index, line in enumerate(lines)
               if line.strip() == '- name: Build and test the Sandbox product under test'),
              None,
          )
          if step_index is None:
              raise SystemExit('Full Sandbox product build step was not found')
          command_index = next(
              (index for index in range(step_index + 1, min(len(lines), step_index + 20))
               if lines[index].strip() == 'xvfb-run --auto-servernum mvn'),
              None,
          )
          if command_index is None:
              raise SystemExit('Full Sandbox Maven command was not found')
          if command_index + 1 >= len(lines) or lines[command_index + 1].strip() != '-Pproduct':
              indentation = lines[command_index][:len(lines[command_index]) - len(lines[command_index].lstrip())]
              lines.insert(command_index + 1, indentation + '-Pproduct')

          old_locator = "-path '*/linux/gtk/x86_64/*/eclipse'"
          new_locator = "-path '*/linux/gtk/x86_64/eclipse'"
          locator_matches = [index for index, line in enumerate(lines) if old_locator in line]
          if len(locator_matches) != 1:
              if not any(new_locator in line for line in lines):
                  raise SystemExit(f'Expected one old Linux launcher locator, found {len(locator_matches)}')
          else:
              index = locator_matches[0]
              lines[index] = lines[index].replace(old_locator, new_locator)
          workflow_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          readme_path = Path('qa/upstream-jdt/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old = (
              'For `TestAll`, the result must remove the JUnit 3 superclass,\n'
              'delegating constructor and suite method and replace them with the JUnit\n'
              'Platform suite annotations.\n'
          )
          new = (
              'For `TestAll`, the result must remove the JUnit 3 superclass,\n'
              'delegating constructor and suite method, replace them with the JUnit\n'
              'Platform suite annotations, and move its single static initialization\n'
              'block into an explicit `@BeforeSuite` method. Multiple or instance\n'
              'initializers remain fail-closed.\n'
          )
          if old in readme:
              readme = readme.replace(old, new, 1)
          elif new not in readme:
              raise SystemExit('README TestAll acceptance paragraph was not found')
          readme_path.write_text(readme, encoding='utf-8')

          Path('.github/workflows/apply-full-jdt-workflow-fixes.yml').unlink()
          PY

          git diff --check
          grep -A8 -F 'Build and test the Sandbox product under test' .github/workflows/upstream-jdt-migration-qa.yml
          grep -F "-path '*/linux/gtk/x86_64/eclipse'" .github/workflows/upstream-jdt-migration-qa.yml

      - name: Commit corrected full-run contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct full JDT product build and launcher discovery"
          git push origin "HEAD:${GITHUB_REF_NAME}"
