name: Temporary protected hotfix verification

on:
  push:
    branches:
      - fix/main-repository-policy-push-context
    paths:
      - '.github/workflows/maven.yml'
      - '.github/workflows/temporary-protected-hotfix-verification.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/temporary-protected-hotfix-verification.yml'

concurrency:
  group: temporary-protected-hotfix-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification:
    name: Maven verification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MAVEN_OPTS: -Djava.awt.headless=true
      REPOSITORY_POLICY_BASE: refs/remotes/origin/main
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Use runner Maven
        uses: ./.github/actions/use-runner-maven

      - name: Set up Node.js for CSS tests
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install CSS tooling
        run: npm install --global prettier stylelint stylelint-config-standard

      - name: Verify preinstalled Eclipse desktop runtime
        uses: ./.github/actions/verify-eclipse-desktop-runtime

      - name: Maven clean verify
        run: >-
          xvfb-run --auto-servernum mvn
          --no-transfer-progress
          -e
          -V
          --batch-mode
          -Dtycho.localArtifacts=ignore
          clean verify
