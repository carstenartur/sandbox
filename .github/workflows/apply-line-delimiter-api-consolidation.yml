name: Apply line delimiter API consolidation

on:
  push:
    branches:
      - integration/junit-migration-hardening
    paths:
      - '.github/workflows/apply-line-delimiter-api-consolidation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: integration/junit-migration-hardening

      - name: Consolidate the exported line delimiter API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('sandbox_cleanup_application/src/org/sandbox/jdt/core/cleanupapp/ProjectWideCodeCleanupApplication.java')
          app_text = app.read_text(encoding='utf-8')
          old_import = 'import org.sandbox.jdt.cleanup.io.EncodedLineDelimiterPreserver;\n'
          new_import = 'import org.sandbox.jdt.cleanup.multifile.api.LineDelimiterPreserver;\n'
          if app_text.count(old_import) != 1:
              raise SystemExit('Unexpected EncodedLineDelimiterPreserver import count')
          if app_text.count('EncodedLineDelimiterPreserver.preserve(') != 1:
              raise SystemExit('Unexpected EncodedLineDelimiterPreserver call count')
          app_text = app_text.replace(old_import, new_import)
          app_text = app_text.replace(
              'EncodedLineDelimiterPreserver.preserve(',
              'LineDelimiterPreserver.preserve(',
          )
          app.write_text(app_text, encoding='utf-8')

          old_main = Path('sandbox_common_core/src/main/java/org/sandbox/jdt/cleanup/io/EncodedLineDelimiterPreserver.java')
          api_main = Path('sandbox_common_core/src/main/java/org/sandbox/jdt/cleanup/multifile/api/LineDelimiterPreserver.java')
          implementation = old_main.read_text(encoding='utf-8')
          if implementation.count('package org.sandbox.jdt.cleanup.io;') != 1:
              raise SystemExit('Unexpected implementation package declaration')
          if implementation.count('EncodedLineDelimiterPreserver') < 2:
              raise SystemExit('Unexpected implementation class occurrences')
          implementation = implementation.replace(
              'package org.sandbox.jdt.cleanup.io;',
              'package org.sandbox.jdt.cleanup.multifile.api;',
          ).replace('EncodedLineDelimiterPreserver', 'LineDelimiterPreserver')
          api_main.write_text(implementation, encoding='utf-8')
          old_main.unlink()

          api_test = Path('sandbox_common_core/src/test/java/org/sandbox/jdt/cleanup/multifile/api/LineDelimiterPreserverTest.java')
          api_test_text = api_test.read_text(encoding='utf-8')
          if api_test_text.count('import java.nio.charset.CharacterCodingException;') != 1:
              raise SystemExit('Unexpected CharacterCodingException import count')
          if api_test_text.count('assertThrows(CharacterCodingException.class,') != 1:
              raise SystemExit('Unexpected malformed-input assertion count')
          api_test_text = api_test_text.replace(
              'import java.nio.charset.CharacterCodingException;',
              'import java.io.IOException;',
          ).replace(
              'assertThrows(CharacterCodingException.class,',
              'assertThrows(IOException.class,',
          )
          api_test.write_text(api_test_text, encoding='utf-8')

          old_test = Path('sandbox_common_core/src/test/java/org/sandbox/jdt/cleanup/io/EncodedLineDelimiterPreserverTest.java')
          compatibility_test = Path('sandbox_common_core/src/test/java/org/sandbox/jdt/cleanup/multifile/api/LineDelimiterPreserverCompatibilityTest.java')
          compatibility_text = old_test.read_text(encoding='utf-8')
          compatibility_text = compatibility_text.replace(
              'package org.sandbox.jdt.cleanup.io;',
              'package org.sandbox.jdt.cleanup.multifile.api;',
          ).replace(
              'class EncodedLineDelimiterPreserverTest',
              'class LineDelimiterPreserverCompatibilityTest',
          ).replace('EncodedLineDelimiterPreserver', 'LineDelimiterPreserver')
          compatibility_test.write_text(compatibility_text, encoding='utf-8')
          old_test.unlink()

          workflow = Path('.github/workflows/apply-line-delimiter-api-consolidation.yml')
          workflow.unlink()
          PY

          if grep -R --line-number --fixed-strings 'EncodedLineDelimiterPreserver' \
              sandbox_cleanup_application sandbox_common_core; then
            echo 'Obsolete EncodedLineDelimiterPreserver references remain.' >&2
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate line delimiter preservation API'
          git push origin HEAD:integration/junit-migration-hardening
