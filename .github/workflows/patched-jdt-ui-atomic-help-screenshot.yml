name: Patched JDT UI atomic Help screenshot

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/patched-jdt-ui.env'
      - '.github/actions/use-runner-maven/**'
      - '.github/actions/verify-eclipse-desktop-runtime/**'
      - '.github/scripts/add_p2_sha256_checksums.py'
      - '.github/scripts/build_patched_jdt_ui.sh'
      - '.github/scripts/compare_patched_jdt_ui_with_target.sh'
      - '.github/scripts/publish_patched_jdt_ui_repository.sh'
      - '.github/scripts/verify_minimal_patched_jdt_ui_units.py'
      - '.github/scripts/verify_patched_jdt_ui_repository.py'
      - '.github/workflows/patched-jdt-ui-atomic-help-screenshot.yml'
      - 'pom.xml'
      - 'sandbox_help_build/**'
      - 'sandbox_target/**'
      - 'sandbox_common/**'
      - 'sandbox_common_core/**'
      - 'sandbox_test_commons/**'
      - 'sandbox_int_to_enum/**'
      - 'sandbox_int_to_enum_help/**'
      - 'sandbox_junit_cleanup/**'
      - 'sandbox_junit_cleanup_help/**'
      - 'sandbox_usage_view/**'
      - 'sandbox_usage_view_test/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-state-based-waits:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'qa/junit-coordinated-preview-contract' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v7
        with:
          ref: qa/junit-coordinated-preview-contract
          fetch-depth: 0

      - name: Replace fixed waits and restore the final read-only workflow
        shell: bash
        run: |
          set -euo pipefail
          target='sandbox_usage_view_test/src/org/sandbox/jdt/ui/helper/views/CoordinatedJUnitPreviewSWTBotScenario.java'
          temporary_workflow='.github/workflows/tmp-pr1514-state-based-swtbot.yml'
          registered_workflow='.github/workflows/patched-jdt-ui-atomic-help-screenshot.yml'
          expected_source='6d3c6d1773c20a048909b5cc98f9a51bb8e233a1'
          final_workflow_commit='2e6749ae60f05f58b2763acd24ad443ef160c64e'
          expected_final_workflow='99453f2b6637fb29cac91de06caf4276f3bd7af3'

          actual_source="$(git hash-object "$target")"
          if [[ "$actual_source" != "$expected_source" ]]; then
            echo "::error::Unexpected source blob $actual_source"
            exit 1
          fi
          test -f "$temporary_workflow"

          python3 - "$target" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''                shell.widget.layout(true, true);
            }
        });
        shell.activate();
        bot.sleep(500);
    }

    private static void openPreferences() {''',
                  '''                shell.widget.layout(true, true);
                shell.widget.update();
            }
        });
        shell.activate();
        waitForActiveShell(shell);
    }

    private static void waitForActiveShell(SWTBotShell shell) {
        bot.waitUntil(new DefaultCondition() {
            @Override
            public boolean test() {
                try {
                    return shell.isOpen() && bot.activeShell().widget == shell.widget;
                } catch (WidgetNotFoundException exception) {
                    return false;
                }
            }

            @Override
            public String getFailureMessage() {
                return "The screenshot shell did not become active: " + shell.getText();
            }
        });
    }

    private static void openPreferences() {''',
              ),
              (
                  '''        item.select();
        bot.sleep(300);
    }

    private static void clickButton(SWTBotShell shell, String... labels) {''',
                  '''        item.select();
        waitForSelected(item);
    }

    private static void waitForSelected(SWTBotTreeItem item) {
        bot.waitUntil(new DefaultCondition() {
            @Override
            public boolean test() {
                return item.isSelected();
            }

            @Override
            public String getFailureMessage() {
                return "The requested preference node was not selected: " + item.getText();
            }
        });
    }

    private static void clickButton(SWTBotShell shell, String... labels) {''',
              ),
              (
                  '''        });
        bot.sleep(300);
    }

    private static String visibleShells() {''',
                  '''        });
    }

    private static String visibleShells() {''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          if 'bot.sleep(' in text:
              raise SystemExit('Fixed SWTBot sleep remains in coordinated JUnit scenario')
          path.write_text(text, encoding='utf-8')
          PY

          git show "$final_workflow_commit:$registered_workflow" > "$registered_workflow"
          actual_final_workflow="$(git hash-object "$registered_workflow")"
          if [[ "$actual_final_workflow" != "$expected_final_workflow" ]]; then
            echo "::error::Unexpected restored workflow blob $actual_final_workflow"
            exit 1
          fi

          git rm -- "$temporary_workflow"
          git add -- "$target" "$registered_workflow"
          git diff --check
          if grep -Fq 'bot.sleep(' "$target"; then
            echo '::error::Fixed SWTBot sleep remains' >&2
            exit 1
          fi

          expected_paths="$(printf '%s\n' "$registered_workflow" "$temporary_workflow" "$target" | sort)"
          actual_paths="$(git diff --cached --name-only | sort)"
          if [[ "$actual_paths" != "$expected_paths" ]]; then
            echo '::error::Unexpected staged paths' >&2
            git diff --cached --name-status >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace fixed JUnit SWTBot waits with state conditions'
          git push origin HEAD:qa/junit-coordinated-preview-contract

  atomic-preview:
    needs: finalize-state-based-waits
    if: always() && needs.finalize-state-based-waits.result == 'skipped'
    name: Reproduce atomic Cleanup previews with patched JDT UI
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MAVEN_OPTS: -Djava.awt.headless=false
      NO_AT_BRIDGE: '1'
      GDK_BACKEND: x11
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Use runner Maven
        uses: ./.github/actions/use-runner-maven

      - name: Verify preinstalled Eclipse desktop runtime
        uses: ./.github/actions/verify-eclipse-desktop-runtime

      - name: Build the pinned JDT UI replacement bundle
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/build_patched_jdt_ui.sh \
            "$RUNNER_TEMP/patched-jdt-ui"

      - name: Verify replacement compatibility with the stock target
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/compare_patched_jdt_ui_with_target.sh \
            "$RUNNER_TEMP/patched-jdt-ui" \
            "$RUNNER_TEMP/patched-jdt-ui-compatibility"

      - name: Publish the exact local patch repository
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/publish_patched_jdt_ui_repository.sh \
            "$RUNNER_TEMP/patched-jdt-ui" \
            "$RUNNER_TEMP/patched-jdt-ui-compatibility" \
            "$RUNNER_TEMP/patched-jdt-ui-p2"

      - name: Add the exact patch feature to the test target
        shell: bash
        run: |
          set -euo pipefail
          target='sandbox_target/eclipse.target'
          repository="file:$RUNNER_TEMP/patched-jdt-ui-p2/repository"
          temporary="$(mktemp)"
          awk -v repository="$repository" '
            /<\/locations>/ {
              print "        <!-- Exact optional JDT UI replacement for atomic Cleanup preview QA. -->"
              print "        <location includeAllPlatforms=\"false\" includeConfigurePhase=\"true\" includeMode=\"planner\" includeSource=\"true\" type=\"InstallableUnit\">"
              print "            <repository location=\"" repository "\"/>"
              print "            <unit id=\"sandbox_patched_jdt_ui_feature.feature.group\" version=\"0.0.0\"/>"
              print "        </location>"
              print ""
            }
            { print }
          ' "$target" > "$temporary"
          mv "$temporary" "$target"
          grep -Fq 'sandbox_patched_jdt_ui_feature.feature.group' "$target"
          grep -Fq "$repository" "$target"

      - name: Reproduce the atomic Cleanup previews
        run: >-
          timeout
          --signal=TERM
          --kill-after=2m
          100m
          xvfb-run
          --auto-servernum
          --server-args="-screen 0 1600x1200x24"
          mvn
          --no-transfer-progress
          -e
          -V
          --batch-mode
          -Dtycho.localArtifacts=ignore
          -Dhelp.screenshot.testClass=org.sandbox.jdt.ui.helper.views.SandboxAtomicPreviewPatchedJdtSWTBotTest
          -DfailIfNoTests=false
          -f sandbox_help_build/pom.xml
          -Phelp-screenshots
          clean verify

      - name: Verify both patched-runtime SWTBot scenarios executed
        shell: bash
        run: |
          set -euo pipefail
          report="$(grep -R -l --include='TEST-*.xml' \
            'SandboxAtomicPreviewPatchedJdtSWTBotTest' \
            sandbox_usage_view_test/target/surefire-reports | head -n 1 || true)"
          if [[ -z "$report" ]]; then
            echo 'The patched-runtime atomic preview test class did not execute.' >&2
            exit 1
          fi
          for scenario in \
            coordinatedIntToEnumPreviewIsAtomic \
            coordinatedJUnitCandidatesAreAtomicAndIndependentlySelectable
          do
            if ! grep -Fq "name=\"$scenario\"" "$report"; then
              echo "The patched-runtime scenario did not execute: $scenario" >&2
              exit 1
            fi
          done
          printf 'Verified JUnit report: %s\n' "$report"

      - name: Verify the canonical atomic preview images
        shell: bash
        run: |
          set -euo pipefail
          images=(
            'sandbox_int_to_enum_help/images/int-to-enum-coordinated-preview.png'
            'sandbox_junit_cleanup_help/images/junit-coordinated-preview.png'
          )
          unexpected=()
          for image in "${images[@]}"; do
            test -s "$image"
            change="$(git status --porcelain=v1 --untracked-files=all -- "$image")"
            if [[ -n "$change" ]]; then
              unexpected+=("$change")
            fi
          done
          if (( ${#unexpected[@]} > 0 )); then
            echo 'Generated atomic previews differ from the committed baselines:' >&2
            printf '%s\n' "${unexpected[@]}" >&2
            echo 'Use the uploaded images from this exact patched-runtime run as reviewed baselines.' >&2
            exit 1
          fi

      - name: Upload atomic previews and patch provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patched-jdt-ui-atomic-preview-${{ github.run_number }}
          path: |
            sandbox_int_to_enum_help/images/int-to-enum-coordinated-preview.png
            sandbox_junit_cleanup_help/images/junit-coordinated-preview.png
            ${{ runner.temp }}/patched-jdt-ui/provenance.json
            ${{ runner.temp }}/patched-jdt-ui-compatibility/compatibility.json
            ${{ runner.temp }}/patched-jdt-ui-p2/evidence/repository-provenance.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload SWTBot diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: patched-jdt-ui-atomic-preview-diagnostics-${{ github.run_number }}
          path: |
            sandbox_usage_view_test/target/work/data/.metadata/.log
            sandbox_usage_view_test/target/surefire-reports/**
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
