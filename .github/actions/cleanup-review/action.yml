name: Sandbox Cleanup Review Suggestions
description: Publish the complete Sandbox cleanup result, grouping all required edits before offering applicable GitHub suggestions.
author: Sandbox Project

branding:
  icon: code
  color: blue

inputs:
  github-token:
    description: Token used to publish the pull-request review.
    required: true
  base-sha:
    description: Pull-request base commit SHA.
    required: true
  head-sha:
    description: Exact checked-out pull-request head commit SHA.
    required: true
  config-file:
    description: Repository-relative Sandbox cleanup properties file.
    required: false
    default: .github/cleanup-profiles/review-explicit-encoding.properties
  image:
    description: Sandbox cleanup container image.
    required: false
    default: ghcr.io/carstenartur/sandbox-cleanup:latest
  java-home:
    description: Optional host JDK mounted read-only for analysis; overrides the image runtime without changing project settings.
    required: false
    default: ''
  scope:
    description: Cleanup source scope (main, test, or both).
    required: false
    default: both
  source-mode:
    description: Analyze only changed Java files or each complete affected Eclipse project (changed or project).
    required: false
    default: changed
  suggestion-scope:
    description: Acceptance unit (run or file). Use file only for a cleanup whose changes in different files are independent.
    required: false
    default: run
  tool-name:
    description: Name shown on generated review suggestions.
    required: false
    default: sandbox-cleanup
  artifact-name:
    description: Name of the complete patch/report artifact.
    required: false
    default: sandbox-cleanup-review
  upload-artifact:
    description: Upload the complete patch and JSON reports.
    required: false
    default: 'true'

outputs:
  has-changes:
    description: Whether the cleanup modified Java source files.
    value: ${{ steps.cleanup.outputs.has_changes }}
  changed-file-count:
    description: Number of Java files modified by the cleanup.
    value: ${{ steps.cleanup.outputs.changed_file_count }}
  project-count:
    description: Number of imported Eclipse projects.
    value: ${{ steps.cleanup.outputs.project_count }}
  skipped-file-count:
    description: Number of changed Java files without an ancestor .project file.
    value: ${{ steps.cleanup.outputs.skipped_file_count }}
  patch-file:
    description: Path to the complete Git patch.
    value: ${{ steps.cleanup.outputs.patch_file }}
  artifact-url:
    description: Download page for the complete patch, grouped review, and execution reports.
    value: ${{ steps.evidence.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Run configured Sandbox cleanup
      id: cleanup
      shell: bash
      env:
        REVIEW_JAVA_HOME: ${{ inputs.java-home }}
        OUTPUT_DIR: ${{ runner.temp }}/sandbox-cleanup-review-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        set -euo pipefail
        status=0
        # The runner resets OUTPUT_DIR, so keep the live log beside it.
        "$GITHUB_ACTION_PATH/run-cleanup-review.sh" \
          --base-sha "${{ inputs.base-sha }}" \
          --head-sha "${{ inputs.head-sha }}" \
          --config-file "${{ inputs.config-file }}" \
          --image "${{ inputs.image }}" \
          --java-home "${REVIEW_JAVA_HOME:-}" \
          --scope "${{ inputs.scope }}" \
          --source-mode "${{ inputs.source-mode }}" \
          --output-dir "$OUTPUT_DIR" 2>&1 | tee "$OUTPUT_DIR.log" || status=$?
        mkdir -p "$OUTPUT_DIR"
        mv -- "$OUTPUT_DIR.log" "$OUTPUT_DIR/cleanup.log"
        exit "$status"

    - name: Prepare complete grouped review
      id: prepare
      if: steps.cleanup.outputs.has_changes == 'true'
      shell: bash
      env:
        REVIEW_HEAD_SHA: ${{ inputs.head-sha }}
        REVIEW_PATCH_FILE: ${{ steps.cleanup.outputs.patch_file }}
        REVIEW_OUTPUT_DIR: ${{ steps.cleanup.outputs.output_dir }}
        REVIEW_TOOL_NAME: ${{ inputs.tool-name }}
        REVIEW_SUGGESTION_SCOPE: ${{ inputs.suggestion-scope }}
      run: node "$GITHUB_ACTION_PATH/cleanup-review.cjs" --prepare

    - name: Upload complete cleanup evidence
      id: evidence
      if: always() && inputs.upload-artifact == 'true' && (steps.cleanup.outputs.has_changes == 'true' || steps.cleanup.outcome == 'failure')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/sandbox-cleanup-review-${{ github.run_id }}-${{ github.run_attempt }}
        if-no-files-found: error

    - name: Publish complete cleanup review
      id: publish
      if: always() && !cancelled() && steps.prepare.outcome == 'success'
      uses: actions/github-script@v9
      env:
        REVIEW_ACTION_PATH: ${{ github.action_path }}
        REVIEW_HEAD_SHA: ${{ inputs.head-sha }}
        REVIEW_OUTPUT_DIR: ${{ steps.cleanup.outputs.output_dir }}
        REVIEW_TOOL_NAME: ${{ inputs.tool-name }}
        REVIEW_SUGGESTION_SCOPE: ${{ inputs.suggestion-scope }}
        REVIEW_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { publish } = require(`${process.env.REVIEW_ACTION_PATH}/cleanup-review.cjs`);
          await publish({ github, context, core });

    - name: Add cleanup summary
      if: always()
      shell: bash
      env:
        SUMMARY_FILE: ${{ steps.cleanup.outputs.summary_file }}
      run: |
        if [[ -n "$SUMMARY_FILE" && -f "$SUMMARY_FILE" ]]; then
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
        fi
