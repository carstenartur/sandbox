# feature.properties for sandbox_platform_helper_feature

description=Platform Helper Feature\n\
\n\
Modernizes Eclipse Platform Status construction without changing observable status data.\n\
Uses Status.info, Status.warning, or Status.error when bundle identity, factory overload, and source target are proven equivalent; otherwise removes only a redundant OK code and retains the explicit identity.\n\
\n\
Features:\n\
- Recognizes matching compile-time bundle identifiers and the exact enclosing class identity\n\
- Resolves factory overloads and checks their return-type compatibility\n\
- Preserves delegated, dynamic, mismatching, and method-call identities\n\
- Leaves nonzero, unresolved, and runtime-computed application codes unchanged\n\
- Normalizes MultiStatus only when its code is provably zero

