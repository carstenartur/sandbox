# feature.properties for sandbox_platform_helper_feature

description=Platform Helper Feature\n\
\n\
Simplifies Eclipse Platform Status construction while preserving observable status data.\n\
Removes only status codes that are provably equivalent to IStatus.OK and retains the original severity, plug-in identity, message, and throwable.\n\
\n\
Features:\n\
- Simplifies supported five-argument Status constructors without discarding plug-in identity\n\
- Recognizes IStatus.OK, numeric zero, and compile-time zero constants by value\n\
- Leaves nonzero, unresolved, and runtime-computed application codes unchanged\n\
- Normalizes MultiStatus only when its code is provably zero

