# feature_de.properties für sandbox_platform_helper_feature

description=Platform-Helper-Feature\n\
\n\
Vereinfacht die Konstruktion von Eclipse-Platform-Statusobjekten, ohne beobachtbare Statusdaten zu verändern.\n\
Entfernt nur Statuscodes, die nachweislich IStatus.OK entsprechen, und erhält Schweregrad, Plug-in-Identität, Nachricht und Ausnahme.\n\
\n\
Funktionen:\n\
- Vereinfacht unterstützte fünfparametrige Status-Konstruktoren ohne Verlust der Plug-in-Identität\n\
- Erkennt IStatus.OK, die Zahl Null und Compile-Time-Nullkonstanten anhand ihres Werts\n\
- Lässt von Null verschiedene, unaufgelöste und zur Laufzeit berechnete Fachcodes unverändert\n\
- Normalisiert MultiStatus nur bei nachweislich auf Null gesetztem Code

