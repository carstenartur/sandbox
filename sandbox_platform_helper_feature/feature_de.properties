# feature_de.properties für sandbox_platform_helper_feature

description=Platform-Helper-Feature\n\
\n\
Modernisiert die Konstruktion von Eclipse-Platform-Statusobjekten, ohne beobachtbare Statusdaten zu verändern.\n\
Verwendet Status.info, Status.warning oder Status.error, wenn Bundle-Identität, Factory-Überladung und Quelltyp nachweislich äquivalent sind; andernfalls wird nur ein redundanter OK-Code entfernt und die explizite Identität erhalten.\n\
\n\
Funktionen:\n\
- Erkennt passende Compile-Time-Bundle-Kennungen und die exakte umschließende Klassenidentität\n\
- Löst Factory-Überladungen auf und prüft die Kompatibilität ihres Rückgabetyps\n\
- Erhält delegierte, dynamische, abweichende und durch Methodenaufruf gelieferte Identitäten\n\
- Lässt von Null verschiedene, unaufgelöste und zur Laufzeit berechnete Fachcodes unverändert\n\
- Normalisiert MultiStatus nur bei nachweislich auf Null gesetztem Code

