featureName=Sandbox-Referenz für Iterator-Cleanup

description=Sandbox-Referenz für Iterator-Cleanup\n\
\n\
Installiert das historische Sandbox-Bundle, das Cheatsheet und die Offline-Hilfe für einen Iterator-Schleifen-Cleanup, der jetzt von Eclipse JDT UI gepflegt wird.\n\
Das Sandbox-Bundle trägt org.eclipse.jdt.ui.cleanup.toolscleanup absichtlich nicht mehr bei. Installation oder Aktualisierung dieses Features kann daher keine zweite Implementierung registrieren.\n\
Verwenden Sie den Standard-Cleanup von Eclipse JDT über Source > Clean Up... Der erhaltene Sandbox-Quellcode und die Tests dienen als Referenz und sind kein eigenständig gepflegter produktiver Cleanup.

