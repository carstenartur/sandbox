featureName=Sandbox Iterator Cleanup Reference

description=Sandbox Iterator Cleanup Reference\n\
\n\
Installs the historical Sandbox bundle, cheat sheet, and offline Help for an iterator-loop cleanup that is now maintained by Eclipse JDT UI.\n\
The Sandbox bundle deliberately no longer contributes org.eclipse.jdt.ui.cleanup.toolscleanup, so installing or updating this feature cannot register a second implementation.\n\
Use the standard Eclipse JDT cleanup through Source > Clean Up... The retained Sandbox source and tests are reference material, not an independently maintained production cleanup.

